<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120c2b">
<title>星核大合成：引力远征</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪐</text></svg>">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --void:#120c2b; --deep:#1d1447; --nebula:#e0569b; --star:#ffd27a; --ice:#8fe3f0;
  --paper:#f3eeff; --dim:rgba(243,238,255,.64); --line:rgba(243,238,255,.18);
  --display:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --void:#120c2b; } }
:root[data-theme="dark"]{ --void:#120c2b; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; background:var(--void); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; height:100%; overflow:hidden; background:var(--void); color:var(--paper); font-family:var(--body);
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:none; }
#stage{ position:relative; width:100%; height:100%; overflow:hidden; }
#game{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
button{ font-family:inherit; }

/* ---------- HUD ---------- */
.hud{ position:absolute; opacity:0; pointer-events:none; transition:opacity .3s; }
body[data-state=play] .hud, body[data-state=over] .hud, body[data-state=paused] .hud, body[data-state=cards] .hud{ opacity:1; }
#hudL{ left:14px; top:10px; width:min(46vw,220px); }
#hudL b{ font-family:var(--display); font-weight:800; font-size:20px; letter-spacing:.04em; color:var(--star); }
.bar{ height:8px; border-radius:6px; background:rgba(243,238,255,.12); margin:7px 0 4px; overflow:hidden; }
.bar i{ display:block; height:100%; width:0; border-radius:6px; background:linear-gradient(90deg,#8fe3f0,#ffd27a); transition:width .25s; }
.bar.done i{ background:#ffd27a; box-shadow:0 0 12px #ffd27a; }
#hudL small{ font-size:12px; color:var(--dim); display:block; font-variant-numeric:tabular-nums; }
#hudL small em{ font-style:normal; color:var(--paper); font-weight:700; font-size:14px; }
#hz{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.chip{ font-size:11px; padding:2px 8px; border-radius:10px; background:rgba(224,86,155,.2); color:#ffb3d5; box-shadow:inset 0 0 0 1px rgba(224,86,155,.4); }
.chip.calm{ background:rgba(143,227,240,.12); color:var(--ice); box-shadow:inset 0 0 0 1px rgba(143,227,240,.3); }

#hudR{ right:12px; top:10px; display:flex; gap:8px; align-items:flex-start; pointer-events:auto; }
.next{ display:flex; flex-direction:column; align-items:center; font-size:11px; color:var(--dim); gap:1px; }
.next .pv{ display:flex; gap:2px; align-items:center; }
#nextc{ width:44px; height:44px; } #nextc2{ width:30px; height:30px; opacity:.75; display:none; }
.icon{ width:38px; height:38px; border-radius:50%; border:0; background:rgba(243,238,255,.08); color:var(--paper);
  display:grid; place-items:center; cursor:pointer; padding:0; margin-top:3px; }
.icon:hover{ background:rgba(243,238,255,.16); }
.icon svg{ width:19px; height:19px; }
.icon:focus-visible,.btn:focus-visible,#pulse:focus-visible,.card:focus-visible,#holdBtn:focus-visible{ outline:3px solid var(--ice); outline-offset:3px; }

#ammoBox{ left:16px; bottom:16px; text-align:left; }
#ammoBox b{ font-family:var(--display); font-weight:800; font-size:40px; line-height:1; display:block; font-variant-numeric:tabular-nums; transition:color .2s, transform .15s; }
#ammoBox b.low{ color:#ff7b8a; }
#ammoBox b.bump{ transform:scale(1.18); }
#ammoBox small{ font-size:12px; color:var(--dim); }

#pulse{ left:50%; bottom:12px; transform:translateX(-50%); border:0; background:none; color:var(--paper);
  display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; padding:0; }
body[data-state=play] #pulse{ pointer-events:auto; }
#pulse .orb{ position:relative; width:58px; height:58px; }
#pulse svg{ position:absolute; inset:0; transform:rotate(-90deg); }
#pulse .core{ position:absolute; inset:12px; border-radius:50%; background:radial-gradient(circle at 40% 35%,#fff,#8fe3f0 40%,#3a5bd8 100%); opacity:.25; transition:opacity .3s, box-shadow .3s; }
#pulse span{ font-size:12px; color:var(--dim); }
#pulse.ready .core{ opacity:1; box-shadow:0 0 22px rgba(143,227,240,.8); animation:bob 1.4s ease-in-out infinite; }
#pulse.ready span{ color:var(--ice); }
@keyframes bob{ 50%{ transform:scale(1.08); } }

#holdBtn{ right:14px; bottom:14px; width:70px; border:0; border-radius:18px; padding:6px 0 5px; background:rgba(243,238,255,.07);
  box-shadow:inset 0 0 0 1.5px var(--line); color:var(--dim); display:none; flex-direction:column; align-items:center; gap:1px; font-size:11px; cursor:pointer; }
body[data-state=play] #holdBtn{ pointer-events:auto; }
#holdBtn.on{ display:flex; }
#holdBtn.used{ opacity:.45; }
#holdc{ width:44px; height:44px; }

#hint{ position:absolute; left:0; right:0; bottom:96px; text-align:center; font-size:14px; color:var(--dim); pointer-events:none; opacity:0; transition:opacity .6s; }
#hint.show{ opacity:1; }

#banner{ position:absolute; left:50%; top:26%; transform:translate(-50%,-50%) scale(.94); text-align:center; pointer-events:none; opacity:0; transition:opacity .4s, transform .4s; width:min(92vw,460px); }
#banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
#banner .n{ font-family:var(--display); font-weight:800; font-size:clamp(40px,11vw,62px); color:var(--star); letter-spacing:.08em; text-shadow:0 0 26px rgba(255,210,122,.5); line-height:1.1; }
#banner .g{ font-size:16px; margin:6px 0 10px; }
#banner .g em{ font-style:normal; color:var(--star); font-weight:700; }
#banner .hzd{ font-size:13px; color:#ffc4dc; line-height:1.6; background:rgba(29,20,71,.8); border-radius:14px; padding:8px 14px; box-shadow:inset 0 0 0 1px rgba(224,86,155,.35); }
#banner .hzd b{ color:#ff9ac4; }

#toast{ position:absolute; left:50%; top:96px; transform:translate(-50%,-12px); display:flex; align-items:center; gap:12px; padding:10px 18px 10px 12px;
  border-radius:40px; background:rgba(29,20,71,.9); box-shadow:inset 0 0 0 1px var(--line), 0 10px 40px rgba(0,0,0,.35);
  opacity:0; pointer-events:none; transition:opacity .35s, transform .35s; width:max-content; max-width:92vw; text-align:left; }
#toast.show{ opacity:1; transform:translate(-50%,0); }
#toast img{ width:42px; height:42px; flex:none; }
#toast b{ font-family:var(--display); font-weight:800; font-size:17px; color:var(--star); display:block; }
#toast span{ font-size:13px; color:var(--dim); }

/* ---------- Overlays ---------- */
.overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 18px; text-align:center;
  background:radial-gradient(ellipse at 50% 48%, rgba(18,12,43,.8) 0, rgba(18,12,43,.88) 58%, rgba(9,6,28,.96) 100%);
  opacity:0; pointer-events:none; transition:opacity .35s; overflow-y:auto; }
.overlay.show{ opacity:1; pointer-events:auto; }
h1{ font-family:var(--display); font-weight:900; font-size:clamp(50px,13vw,96px); line-height:1; margin:0; color:var(--star);
  letter-spacing:.08em; text-shadow:0 0 30px rgba(255,210,122,.45), 0 0 2px rgba(255,255,255,.5); }
.sub{ font-family:var(--display); font-weight:700; font-size:clamp(16px,4.2vw,22px); letter-spacing:.5em; color:var(--ice); margin:10px 0 16px; padding-left:.5em; }
h2{ font-family:var(--display); font-weight:900; font-size:clamp(36px,9vw,56px); line-height:1.1; margin:0 0 8px; color:var(--star); letter-spacing:.06em; }
.lead{ max-width:23em; font-size:15px; line-height:1.75; color:var(--dim); margin:0 0 16px; }
.lead b{ color:var(--paper); font-weight:700; }
.chain{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px 0; max-width:600px; margin:0 0 20px; }
.chain .it{ width:52px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--dim); }
.chain img{ width:40px; height:40px; }
.chain .it.lock img{ filter:brightness(0) invert(.22); opacity:.55; }
.chain .it.lock{ color:rgba(243,238,255,.35); }
.btn{ font-family:var(--display); font-weight:800; font-size:21px; letter-spacing:.1em; border:0; border-radius:999px; padding:12px 40px; background:var(--star); color:#2b1742;
  cursor:pointer; box-shadow:inset 0 0 0 1px rgba(255,255,255,.35), 0 10px 34px rgba(255,190,90,.28); transition:transform .12s; }
.btn:hover{ transform:translateY(-1px); } .btn:active{ transform:scale(.97); }
.btn.ghost{ background:transparent; color:var(--paper); box-shadow:inset 0 0 0 1.5px var(--line); font-size:18px; padding:10px 26px; }
.btn small{ display:block; font-family:var(--body); font-size:11px; letter-spacing:0; font-weight:400; opacity:.72; }
.btns{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.small{ font-size:13px; color:var(--dim); margin-top:16px; line-height:1.7; }
.bestline{ font-size:13px; color:var(--ice); margin:0 0 18px; min-height:18px; }
.stats{ display:grid; grid-template-columns:repeat(3,auto); gap:6px 26px; margin:8px 0 22px; align-items:end; }
.stats div{ display:flex; flex-direction:column; align-items:center; gap:4px; }
.stats b{ font-family:var(--display); font-weight:800; font-size:30px; line-height:1; }
.stats small{ font-size:12px; color:var(--dim); }
.stats img{ width:44px; height:44px; }
.record{ color:var(--nebula); font-weight:700; font-size:14px; min-height:20px; margin:0 0 4px; }
.reason{ color:var(--dim); font-size:14px; margin:0 0 8px; }

/* 强化三选一 */
.cardrow{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:6px 0 14px; }
.card{ width:min(29vw,176px); min-width:150px; min-height:212px; border:0; border-radius:20px 20px 20px 4px; padding:16px 12px 14px; cursor:pointer; color:var(--paper);
  background:linear-gradient(170deg,rgba(47,33,110,.96),rgba(23,15,58,.96)); box-shadow:inset 0 0 0 1.5px var(--acc), 0 12px 40px rgba(0,0,0,.4);
  display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; transition:transform .15s, box-shadow .15s; position:relative; }
.card:hover{ transform:translateY(-4px); box-shadow:inset 0 0 0 2px var(--acc), 0 18px 50px rgba(0,0,0,.5), 0 0 30px color-mix(in srgb,var(--acc) 40%,transparent); }
.card img{ width:58px; height:58px; }
.card b{ font-family:var(--display); font-weight:800; font-size:18px; color:var(--acc); }
.card p{ margin:0; font-size:13px; line-height:1.6; color:var(--dim); }
.card .rar{ position:absolute; top:8px; right:12px; font-size:10px; color:var(--acc); opacity:.85; }
.card .lv{ font-size:11px; color:var(--dim); margin-top:auto; }
@media (max-width:520px){ .cardrow{ flex-direction:column; align-items:center; gap:8px; } .card{ width:min(88vw,340px); min-height:0; flex-direction:row; text-align:left; padding:12px 14px; border-radius:18px 18px 18px 4px; }
  .card img{ width:48px; height:48px; flex:none; } .card .tx{ display:flex; flex-direction:column; gap:3px; } .card .lv{ margin:0; } }
@media (min-width:521px){ .card .tx{ display:flex; flex-direction:column; gap:8px; align-items:center; flex:1; } }
@media (prefers-reduced-motion: reduce){ #pulse.ready .core{ animation:none; } .overlay,#toast,#banner{ transition:none; } }
</style>
</head>
<body data-state="menu">
<div id="stage">
  <canvas id="game" aria-label="游戏画面"></canvas>

  <div class="hud" id="hudL">
    <b>第 <span id="secN">1</span> 星系</b>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <small><em id="secS">0</em> / <span id="secT">0</span> 分　总分 <span id="total">0</span></small>
    <div id="hz"></div>
  </div>
  <div class="hud" id="hudR">
    <div class="next"><div class="pv"><canvas id="nextc" width="88" height="88"></canvas><canvas id="nextc2" width="60" height="60"></canvas></div>下一颗</div>
    <button class="icon" id="muteBtn" aria-label="声音开关"></button>
    <button class="icon" id="pauseBtn" aria-label="暂停"><svg viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="4" width="3.5" height="12" rx="1"/><rect x="11.5" y="4" width="3.5" height="12" rx="1"/></svg></button>
  </div>
  <div class="hud" id="ammoBox"><b id="ammo">0</b><small>剩余发射</small></div>
  <button class="hud" id="pulse" aria-label="引力脉冲">
    <div class="orb"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="25" fill="none" stroke="rgba(243,238,255,.14)" stroke-width="4"/>
      <circle id="meterArc" cx="29" cy="29" r="25" fill="none" stroke="#8fe3f0" stroke-width="4" stroke-linecap="round" stroke-dasharray="157.1" stroke-dashoffset="157.1"/></svg><div class="core"></div></div>
    <span>引力脉冲</span>
  </button>
  <button class="hud" id="holdBtn" aria-label="储物舱"><canvas id="holdc" width="88" height="88"></canvas>储物舱</button>
  <div id="hint">拖动瞄准，松开发射</div>
  <div id="banner"></div>
  <div id="toast"><img id="toastImg" alt=""><div><b id="toastName"></b><span id="toastText"></span></div></div>

  <section class="overlay show" id="menu">
    <h1>星核大合成</h1>
    <div class="sub">引力远征</div>
    <p class="lead">两颗相同的天体相撞会合成更大的一颗。每个星系要在<b>有限的发射次数</b>内拿到<b>目标分数</b>，通关后从三张强化里挑一张。星系越远，事件越凶：陨石带、潮汐、自转……你能走多远？</p>
    <p class="bestline" id="bestline"></p>
    <div class="chain" id="chain"></div>
    <button class="btn" id="startBtn">开始远征</button>
    <p class="small">拖动瞄准，松开发射。天体越出金色轨道太久，或者发射次数用完还没达标，远征结束。<br>键盘：方向键瞄准，空格发射，Q 引力脉冲，E 储物舱。</p>
  </section>

  <section class="overlay" id="cards">
    <h2>星系稳定</h2>
    <p class="reason" id="cardsInfo"></p>
    <div class="cardrow" id="cardrow"></div>
  </section>

  <section class="overlay" id="over">
    <h2 id="overTitle">远征结束</h2>
    <p class="reason" id="overReason"></p>
    <p class="record" id="record"></p>
    <div class="stats">
      <div><b id="oSec">1</b><small>到达星系</small></div>
      <div><b id="oScore">0</b><small>总分</small></div>
      <div><img id="oImg" alt=""><small id="oTier">最大天体</small></div>
    </div>
    <div class="btns">
      <button class="btn" id="revive"></button>
      <button class="btn" id="againBtn">再来一次</button>
      <button class="btn ghost" id="shareBtn">复制战绩</button>
    </div>
    <p class="small"><a href="#" id="homeLink" style="color:inherit">回到首页</a></p>
  </section>

  <section class="overlay" id="paused">
    <h2>已暂停</h2>
    <p class="reason" id="pausedInfo"></p>
    <div class="btns" style="margin-top:12px">
      <button class="btn" id="resumeBtn">继续游戏</button>
      <button class="btn ghost" id="quitBtn">放弃并回到首页</button>
    </div>
  </section>
</div>

<script>
(()=>{
'use strict';
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const cvs = $('game'), ctx = cvs.getContext('2d');
const stage = $('stage');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONTF = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif';

const TIERS = [
  { name:'星尘',   p:['255,170,235','255,255,255'], say:'宇宙里最小的开始。' },
  { name:'陨石',   p:['205,175,145','255,220,180'], say:'带着伤疤飞行的石头。' },
  { name:'冰彗',   p:['170,235,255','255,255,255'], say:'冻住的尾巴，等着被点亮。' },
  { name:'月球',   p:['230,228,222','185,195,255'], say:'安静地环绕，从不说话。' },
  { name:'赤岩星', p:['255,140,80','255,210,150'],  say:'铁锈色的荒原，风很大。' },
  { name:'海洋星', p:['110,200,255','130,230,160'], say:'有海的地方，就有故事。' },
  { name:'环带星', p:['255,225,160','255,245,210'], say:'戴着冰晶做的光环。' },
  { name:'气态巨星', p:['255,170,100','255,225,180'], say:'一场刮了三百年的风暴。' },
  { name:'红矮星', p:['255,110,60','255,200,120'],  say:'小而长寿，能烧一万亿年。' },
  { name:'蓝巨星', p:['140,200,255','255,255,255'], say:'燃烧得最亮，也最短。' },
  { name:'黑洞',   p:['255,160,80','200,120,255'],  say:'连光也回不来。碰到它的都会被吞掉。' },
];
const RAD   = [12,16,21,26,32,40,49,59,70,82,92];
const SCORE = [0,5,12,24,40,64,100,150,220,320,600];
const PAD   = [1.6,0.05,0.6,0.05,0.05,0.25,0.85,0.05,0.95,1.25,0];
const SPAWN_W = [32,28,20,13,7];
const SPECIAL_R = { junk:17, wild:16, comet:11, bomb:17 };
const STEP = 1/120, COOL = 0.36;

const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const easeOut = p => 1 - Math.pow(1-p, 3);
const easeBack = p => { const c1=1.9, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };
const fmt = n => n.toLocaleString('zh-CN');

/* ================= 程序化天体绘制 ================= */
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h||w; return c; }
function RG(g,x0,y0,r0,x1,y1,r1,stops){ const gr=g.createRadialGradient(x0,y0,r0,x1,y1,r1); for(const [s,c] of stops) gr.addColorStop(s,c); return gr; }
function circ(g,r,x=0,y=0){ g.beginPath(); g.arc(x,y,r,0,TAU); }
function base(g,r,c0,c1){ g.fillStyle = RG(g,-r*.3,-r*.35,r*.05,0,0,r,[[0,c0],[1,c1]]); circ(g,r); g.fill(); }
function shade(g,r,k=1){
  g.fillStyle = RG(g,-r*.45,-r*.5,0,-r*.3,-r*.35,r*.95,[[0,`rgba(255,255,255,${.4*k})`],[.6,'rgba(255,255,255,0)']]); circ(g,r); g.fill();
  g.fillStyle = RG(g,-r*.35,-r*.38,r*.2,0,0,r*1.01,[[0,'rgba(12,6,40,0)'],[.68,`rgba(12,6,40,${.22*k})`],[1,`rgba(12,6,40,${.72*k})`]]); circ(g,r); g.fill();
}
function limb(g,r,rgb,a){ g.fillStyle = RG(g,0,0,r*.5,0,0,r,[[0,`rgba(${rgb},0)`],[1,`rgba(${rgb},${a})`]]); circ(g,r); g.fill(); }
function glow(g,r,R,rgb,a){ g.fillStyle = RG(g,0,0,r*.4,0,0,R,[[0,`rgba(${rgb},${a})`],[.45,`rgba(${rgb},${a*.35})`],[1,`rgba(${rgb},0)`]]); circ(g,R); g.fill(); }
function crater(g,x,y,cr){
  g.fillStyle='rgba(40,30,28,.3)'; circ(g,cr,x,y); g.fill();
  g.strokeStyle='rgba(255,255,255,.26)'; g.lineWidth=cr*.22; g.beginPath(); g.arc(x,y,cr*.88,Math.PI*.1,Math.PI*.9); g.stroke();
  g.strokeStyle='rgba(20,10,10,.25)'; g.beginPath(); g.arc(x,y,cr*.88,Math.PI*1.1,Math.PI*1.9); g.stroke();
}
function blotches(g,r,R,n,cols,min,max){ for(let i=0;i<n;i++){ g.fillStyle=cols[i%cols.length]; circ(g,r*(min+R()*(max-min)),(R()*2-1)*r,(R()*2-1)*r); g.fill(); } }

function makeLayers(t,r,dpr){
  const pad=PAD[t]*r, half=r+pad, size=Math.max(4,Math.ceil(half*2*dpr)), f=size/(half*2);
  const L={ r, half, under:mkCanvas(size), surf:mkCanvas(size), over:mkCanvas(size) };
  const gs=[L.under,L.surf,L.over].map(c=>{ const g=c.getContext('2d'); g.setTransform(f,0,0,f,half*f,half*f); return g; });
  PAINT[t](gs[0],gs[1],gs[2],r,rng(t*977+13));
  return L;
}
function drawLayered(g,L,x,y,r,spin,alpha,pulse){
  const k=r/L.r, h=L.half*k;
  g.globalAlpha=alpha*pulse; g.drawImage(L.under,x-h,y-h,h*2,h*2);
  g.globalAlpha=alpha;
  g.save(); g.translate(x,y); g.rotate(spin); g.drawImage(L.surf,-h,-h,h*2,h*2); g.restore();
  g.drawImage(L.over,x-h,y-h,h*2,h*2);
  g.globalAlpha=1;
}

function drawBH(g,x,y,r,t,alpha=1){
  g.save(); g.globalAlpha=alpha; g.translate(x,y);
  g.fillStyle = RG(g,0,0,r*.4,0,0,r*2.3,[[0,'rgba(255,150,70,.38)'],[.5,'rgba(200,60,130,.13)'],[1,'rgba(120,40,160,0)']]); circ(g,r*2.3); g.fill();
  g.rotate(-.22);
  const disk = front => {
    const a0 = front ? 0 : Math.PI, a1 = front ? Math.PI : TAU;
    for(const [k,lw,c,a] of [[1.05,.17,'255,115,55',.6],[1.3,.15,'255,170,90',.62],[1.55,.1,'255,220,160',.45],[1.76,.05,'255,240,215',.3]]){
      g.strokeStyle=`rgba(${c},${front?a:a*.7})`; g.lineWidth=r*lw; g.beginPath(); g.ellipse(0,0,r*k,r*k*.28,0,a0,a1); g.stroke(); }
    g.save(); g.setLineDash([r*.12,r*.36]); g.lineDashOffset=-t*r*1.8; g.strokeStyle='rgba(255,255,255,.6)'; g.lineWidth=r*.035;
    g.beginPath(); g.ellipse(0,0,r*1.3,r*1.3*.28,0,a0,a1); g.stroke(); g.restore();
  };
  disk(false);
  g.strokeStyle='rgba(255,190,110,.55)'; g.lineWidth=r*.1; g.beginPath(); g.ellipse(0,-r*.04,r*.8,r*.74,0,Math.PI*1.06,Math.PI*1.94); g.stroke();
  g.fillStyle='#000'; circ(g,r*.62); g.fill();
  g.strokeStyle='rgba(255,232,195,.95)'; g.lineWidth=r*.035; circ(g,r*.655); g.stroke();
  disk(true);
  g.restore();
}

  g.fillStyle=RG(g,0,0,0,0,0,r*2.2,[[0,'rgba(200,250,255,.6)'],[1,'rgba(120,200,255,0)']]); circ(g,r*2.2); g.fill();

function drawBomb(g,x,y,r,t,alpha=1){

const JUNK_SHAPE = (()=>{ const R=rng(99); return Array.from({length:9},()=>.78+R()*.28); })();
function drawJunk(g,x,y,r,spin,hp,flash,alpha=1){
  g.save(); g.globalAlpha=alpha; g.translate(x,y); g.rotate(spin);

  g.fillStyle=RG(g,-r*.3,-r*.35,0,0,0,r*1.1,[[0,'#8a8492'],[.55,'#4d4756'],[1,'#26222d']]); g.fill();

  if(hp<=1){ g.shadowColor='rgba(255,120,40,.9)'; g.shadowBlur=r*.6; g.stroke(); g.shadowBlur=0; }

function layout(){
  const w=stage.clientWidth, h=stage.clientHeight; if(!w||!h) return;
  const oldS=S, oCX=CX, oCY=CY;
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=w; H=h; cvs.width=Math.round(w*DPR); cvs.height=Math.round(h*DPR);
  const top=100, bottom=96;
  const avail=Math.max(130, Math.min(w/2-6, (h-top-bottom)/2));
  CX=w/2; CY=top+Math.max(avail,(h-top-bottom)/2);
  RL=avail*.8; LR=RL+(avail-RL)*.62; S=RL/250; RC=15*S;
  if(laidOut){ const k=S/oldS; for(const b of bodies){ b.x=CX+(b.x-oCX)*k; b.y=CY+(b.y-oCY)*k; b.vx*=k; b.vy*=k; b.r*=k; } }
  laidOut=true;
  layers = TIERS.map((_,t)=> t<10 ? makeLayers(t,rOf(t),DPR) : null);
  buildBg();

const AC = window.AudioContext||window.webkitAudioContext; let ac=null, master=null, muted=store.get('xh_mute',false), noiseBuf=null;
function ensureAudio(){
  if(!ac && AC){ try{ ac=new AC(); master=ac.createGain(); master.gain.value=muted?0:.55; master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }catch(e){ ac=null; } }
  if(ac && ac.state==='suspended') ac.resume();
}
function tone(f,dur,type='sine',vol=.3,when=0,slide=0){
  if(!ac||muted) return; const t=ac.currentTime+when, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+.05);
}
function noise(dur,vol,freq,when=0){
  if(!ac||muted) return; const t=ac.currentTime+when, s=ac.createBufferSource(), bp=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf; bp.type='bandpass'; bp.frequency.setValueAtTime(freq,t); bp.frequency.exponentialRampToValueAtTime(freq*.4,t+dur); bp.Q.value=1.2;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bp).connect(g).connect(master); s.start(t); s.stop(t+dur+.05);
}

const sfx = {
  fire(){ noise(.16,.1,2200); tone(620,.12,'sine',.05,0,.55); },
  hit(v){ if(time-lastHit<.07) return; lastHit=time; tone(120+Math.random()*40,.09,'sine',Math.min(.12,v)); },
  merge(t,c){ const f=261.63*Math.pow(2,(PENTA[t]+Math.min(c-1,6)*2)/12);
    tone(f,.38,'triangle',.2); tone(f*1.5,.5,'sine',.1,.035); if(t>=6) tone(f/2,.9,'sine',.18); if(c>=3) tone(f*2,.25,'sine',.06,.08); },
  absorb(){ tone(420,.3,'sine',.07,0,.25); },
  crack(){ noise(.12,.14,3000); tone(900,.06,'square',.03); },
  shatter(){ noise(.35,.22,1600); tone(180,.3,'triangle',.1,0,.5); },
  warn(){ tone(196,.14,'square',.035); },

function newBody(k,tier,x,y){
  const b={ id:uid++, k, tier:tier||0, x, y, vx:0, vy:0, r:0, grow:1, spin:Math.random()*TAU, spinV:(Math.random()<.5?-1:1)*(.2+Math.random()*.6),
    flying:false, age:0, warn:false, merged:false, hp:2, flash:0, pierce:0 };
  b.r=rBody(b); return b;
}
function rollTier(){ let s=0; const tot=SPAWN_W.reduce((a,b)=>a+b,0), r=Math.random()*tot; for(let i=0;i<SPAWN_W.length;i++){ s+=SPAWN_W[i]; if(r<s) return i; } return 0; }

function physics(h){
  const G=1300*S;
  for(const b of bodies){
    if(b.k==='n'){ if(b.grow<1) b.grow=Math.min(1,b.grow+h*5); b.r=rOf(b.tier)*(b.grow<1?.55+.45*easeBack(b.grow):1); }
    if(b.flash>0) b.flash-=h;
    let dx=CX-b.x, dy=CY-b.y, d=Math.hypot(dx,dy)||1e-3;
    const g = b.k==='comet' ? G*.3 : G;
    b.vx+=dx/d*g*h; b.vy+=dy/d*g*h;
    if(hz.has('spin') && !b.flying && b.k!=='comet'){ const a=175*S*Math.min(1,d/RL)*spinDir; b.vx+=-dy/d*a*h; b.vy+=dx/d*a*h; }
    const damp = b.k==='comet' ? 1 : b.flying ? .9993 : .991;
    b.vx*=damp; b.vy*=damp; b.x+=b.vx*h; b.y+=b.vy*h;
    dx=b.x-CX; dy=b.y-CY; d=Math.hypot(dx,dy)||1e-3;
    const min=RC+b.r;
    if(d<min){
      if(b.k==='comet'){ b.merged=true; burst(b.x,b.y,'comet',.6); continue; }
      if(b.k==='bomb'){ explode(b); continue; }
      if(b.k==='wild'){ b.k='n'; b.tier=0; b.grow=0; }
      const nx=dx/d, ny=dy/d; b.x=CX+nx*min; b.y=CY+ny*min; const vn=b.vx*nx+b.vy*ny; if(vn<0){ b.vx-=1.15*vn*nx; b.vy-=1.15*vn*ny; } land(b,-vn);
    }
    if(b.flying && b.k!=='comet' && d<RL-b.r-2) land(b,0);
    if(b.k==='comet' && (d>LR*1.4 || b.age>4)) b.merged=true;
    b.spin+=b.spinV*h; b.age+=h;
  }
  const pending=[];
  const n=bodies.length;
  for(let it=0; it<2; it++){
    for(let i=0;i<n;i++){ const a=bodies[i]; if(a.merged) continue;
      for(let j=i+1;j<n;j++){ const b=bodies[j]; if(b.merged) continue;
        const dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r, d2=dx*dx+dy*dy;
        if(d2>=rr*rr) continue;
        collide(a,b,pending,dx,dy,d2);
        if(a.merged) break;

    }
  }
  if(pending.length || bodies.some(b=>b.merged)){ bodies=bodies.filter(b=>!b.merged); for(const p of pending) bodies.push(p); }
}
function land(b,v){ if(!b.flying) return; b.flying=false; b.age=0; if(state==='play' && v>60*S) sfx.hit(v/(2500*S)); }

function collide(a,b,pending,dx,dy,d2){
  const ka=a.k, kb=b.k;
  if(ka==='comet'||kb==='comet'){ if(ka===kb) return; const c=ka==='comet'?a:b; cometHit(c, c===a?b:a); return; }
  if(ka==='bomb'||kb==='bomb'){ explode(ka==='bomb'?a:b); return; }
  if(ka==='wild'||kb==='wild'){ const w=ka==='wild'?a:b; wildHit(w, w===a?b:a, pending); return; }
  if(ka==='n' && kb==='n'){
    if(a.tier===b.tier){ if(a.tier<10) doMerge(a,b,pending); else doCollapse(a,b); return; }
    if(a.tier===10){ doAbsorb(b,a); return; }
    if(b.tier===10){ doAbsorb(a,b); return; }
  }
  if(ka==='junk' && kb==='n' && b.tier===10){ doAbsorb(a,b); return; }
  if(kb==='junk' && ka==='n' && a.tier===10){ doAbsorb(b,a); return; }
  const d=Math.sqrt(d2)||.01, nx=dx/d, ny=dy/d, ov=a.r+b.r-d;

    const tx=-ny, ty=nx, vt=rvx*tx+rvy*ty, jt=-vt*.06/sum; a.vx-=jt*ia*tx; a.vy-=jt*ia*ty; b.vx+=jt*ib*tx; b.vy+=jt*ib*ty; }

}
function isSmall(o){ return o.k==='junk' || o.k==='wild' || (o.k==='n' && o.tier<=4); }
function cometHit(c,o){

    o.merged=true; burst(o.x,o.y,o.k==='n'?o.tier:'junk',.7);
    gain(o.k==='junk' ? (lv('junk')?90:30) : 10+o.tier*8, o.x, o.y);
    c.pierce++; sfx.crack(); if(c.pierce>=3){ c.merged=true; burst(c.x,c.y,'comet',.8); }
  } else {

  }

function wildHit(w,o,pending){

  if(o.k==='junk'){ w.merged=true; burst(w.x,w.y,'wild',.6); damageJunk(o,2); return; }
  if(o.k==='wild'){ w.k='n'; w.tier=2; o.k='n'; o.tier=2; doMerge(w,o,pending); }

function explode(b){
  if(b.merged) return; b.merged=true;
  const R=105*S; let n=0;

    const dx=o.x-b.x, dy=o.y-b.y, d=Math.hypot(dx,dy)||1;
    if(d<R+o.r){
      if(o.k==='junk'||o.k==='wild'||(o.k==='n'&&o.tier<=3)){ o.merged=true; burst(o.x,o.y,o.k==='n'?o.tier:'junk',.6); n++;

  shotGen++;
  if(lv('comet') && shotGen % [7,5,4][lv('comet')-1] === 0) return {k:'comet'};
  if(lv('wild')  && shotGen % [9,7,5][lv('wild')-1]  === 0) return {k:'wild'};
  const r=Math.random();
  if(r<.03) return {k:'wild'};
  if(r<.055) return {k:'comet'};
  return {k:'n', t:Math.min(9, rollTier()+(lv('big')?1:0))};
}
function fillQueue(){ const n=lv('preview')?2:1; while(queue.length<n) queue.push(genAmmo()); }
function pickHazards(s){
  if(s<=1) return [];
  const pool = s===2 ? ['junk','spin'] : Object.keys(HAZ);
  const n = s>=10 ? 3 : s>=6 ? 2 : 1;
  const out=[]; const p=[...pool];
  while(out.length<n && p.length){ out.push(p.splice(Math.floor(Math.random()*p.length),1)[0]); }
  return out;
}
function seedDemo(){
  bodies=[]; absorbing=[];
  const R=rng(Date.now()|0);
  for(let i=0;i<18;i++){ const t=Math.floor(R()*7), a=R()*TAU, d=RC+R()*RL*.75; const b=newBody('n',t,CX+Math.cos(a)*d,CY+Math.sin(a)*d); b.age=5; bodies.push(b); }
}
function startRun(){
  ensureAudio();
  bodies=[]; absorbing=[]; parts=[]; waves=[]; texts=[];
  up={}; sector=0; total=0; merges=0; maxTier=0; meter=0; hold=null; holdUsed=false; queue=[]; shotGen=0;
  revivedAmmo=false; revivedRing=false; overShown=false;
  show('menu',false); show('over',false); show('paused',false); show('cards',false);
  cur=genAmmo(); fillQueue(); updateMeter();
  setState('play');
  startSector();
  $('hint').classList.add('show'); setTimeout(()=>$('hint').classList.remove('show'),5200);
}
function startSector(){
  sector++; secScore=0; clearing=false; danger=0; combo=0; lastMerge=-9; cool=.3; junkCount=0;
  target = Math.round(220*Math.pow(1.42,sector-1)/10)*10;
  ammo = 20 + lv('ammo')*4;
  hz = new Set(pickHazards(sector)); spinDir = Math.random()<.5?-1:1; tideT = 0; tideWarn=false;
  E.secN.textContent=sector; updateScore(); updateAmmo(); renderHz(); drawQueue();
  const hzHtml = hz.size ? `<div class="hzd">${[...hz].map(k=>`<b>${HAZ[k].name}</b>：${HAZ[k].desc}`).join('<br>')}</div>` : '';
  showBanner(`<div class="n">第 ${sector} 星系</div><div class="g"><em>${fmt(target)}</em> 分　<em>${ammo}</em> 发</div>${hzHtml}`, hz.size?4200:2400);
  setState('play');
}
function fire(){
  if(state!=='play'||cool>0||clearing||ammo<=0||!cur) return;
  const ca=Math.cos(ang), sa=Math.sin(ang);
  const b=newBody(cur.k,cur.t,CX+ca*LR,CY+sa*LR);
  const sp = cur.k==='comet' ? 900 : 560;
  b.vx=-ca*sp*S; b.vy=-sa*sp*S; b.flying=true; bodies.push(b);
  if(cur.k==='n') discover(cur.t);
  if(cur.k==='comet') sfx.comet(); else sfx.fire();
  ammo--; updateAmmo(); lastShot=time;
  cur=queue.shift(); fillQueue(); holdUsed=false; cool=COOL; drawQueue();
  if(hz.has('junk')){ junkCount++; if(junkCount%4===0) setTimeout(spawnJunk,450); }
}
function spawnJunk(){
  if(state!=='play') return;
  const a=Math.random()*TAU, j=newBody('junk',0,CX+Math.cos(a)*LR*1.15,CY+Math.sin(a)*LR*1.15);
  j.vx=-Math.cos(a)*380*S; j.vy=-Math.sin(a)*380*S; j.flying=true; bodies.push(j);
  floatText(j.x,j.y,'碎石来袭','255,160,110',15);
}
function swapHold(){
  if(state!=='play'||!lv('hold')||holdUsed||clearing||!cur) return;
  if(!hold){ hold=cur; cur=queue.shift(); fillQueue(); } else { const t=hold; hold=cur; cur=t; }
  holdUsed=true; cool=Math.max(cool,.12); drawQueue(); sfx.pick();
}
function pulse(){
  if(state!=='play'||meter<1) return;
  meter=0; updateMeter(); let n=0;
  for(const b of bodies){ if(b.flying) continue;
    if(b.k==='junk' || (b.k==='n'&&b.tier<=2)){ b.merged=true; burst(b.x,b.y,b.k==='n'?b.tier:'junk',.6); n++; }
    else { const dx=CX-b.x, dy=CY-b.y, d=Math.hypot(dx,dy)||1; b.vx+=dx/d*220*S; b.vy+=dy/d*220*S; } }
  bodies=bodies.filter(b=>!b.merged);
  gain(n*8);
  waves.push({x:CX,y:CY,r0:RC,r1:RL*1.15,t:0,max:.75,col:'143,227,240',w:8});
  floatText(CX,CY-RL*.35,`引力脉冲 清除 ${n} 颗`,'143,227,240',22,1.3);
  if(!reduceMotion) shake=7; sfx.pulse();
}
function sectorClear(){
  const bonus = ammo*12*sector;
  total += bonus; updateScore();
  sfx.clear(); setState('cards');
  $('cardsInfo').textContent = bonus ? `剩余 ${ammo} 发，折算 +${fmt(bonus)} 总分。选一项强化带进下一个星系：` : '选一项强化带进下一个星系：';
  const avail = CARDS.filter(c=>lv(c.id)<c.max);
  const weight = c => c.r==='c'?10:c.r==='r'?6:3;
  const pick=[]; const pool=[...avail];
  while(pick.length<3 && pool.length){ const tot=pool.reduce((s,c)=>s+weight(c),0); let r=Math.random()*tot;
    for(let i=0;i<pool.length;i++){ r-=weight(pool[i]); if(r<=0){ pick.push(pool.splice(i,1)[0]); break; } } }
  const row=$('cardrow'); row.innerHTML='';
  pick.forEach(c=>{ const L=lv(c.id), el=document.createElement('button'); el.className='card'; el.style.setProperty('--acc',RAR[c.r].col);
    el.innerHTML=`<span class="rar">${RAR[c.r].n}</span><img alt="" src="${ICON_URL[c.icon]}"><div class="tx"><b>${c.name}</b><p>${c.desc(L)}</p>${c.max>1&&c.max<99?`<span class="lv">等级 ${L} → ${L+1}</span>`:''}</div>`;
    el.onclick=()=>chooseCard(c); row.appendChild(el); });
  show('cards',true);
  setTimeout(()=>{ const f=row.querySelector('.card'); if(f) f.focus({preventScroll:true}); },50);
}
function chooseCard(c){
  if(state!=='cards') return;
  up[c.id]=lv(c.id)+1; sfx.pick();
  if(c.id==='bomb'){ queue.unshift({k:'bomb'}); queue.unshift({k:'bomb'}); if(cur){ queue.splice(2,0,cur); } cur=queue.shift(); }
  if(c.id==='preview') fillQueue();
  show('cards',false);
  startSector();
}
function gameOver(reason){
  setState('over'); overT=0; overShown=false; overReason=reason; sfx.over();
  const isRec = total>best.score || sector>best.sector;
  if(isRec){ best={score:Math.max(best.score,total), sector:Math.max(best.sector,sector)}; store.set('xh2_best',best); }
  $('overTitle').textContent = reason==='ammo' ? '弹药耗尽' : '轨道失控';
  $('overReason').textContent = reason==='ammo' ? `还差 ${fmt(Math.max(0,target-secScore))} 分就能稳定这个星系。` : '天体越出金色轨道太久，星系散了。';
  $('record').textContent = isRec ? '刷新个人纪录' : '';
  $('oSec').textContent=sector; $('oScore').textContent=fmt(total);
  $('oImg').src=ICON_URL['n'+maxTier]; $('oTier').textContent='最大：'+TIERS[maxTier].name;
  const rv=$('revive');
  if(reason==='ammo' && !revivedAmmo){ rv.style.display=''; rv.innerHTML='补给 5 发继续<small>每局一次</small>'; }
  else if(reason==='ring' && !revivedRing){ rv.style.display=''; rv.innerHTML='修复轨道继续<small>每局一次，清掉外圈天体</small>'; }
  else rv.style.display='none';
}
function revive(){
  if(state!=='over') return;
  if(overReason==='ammo'){ if(revivedAmmo) return; revivedAmmo=true; ammo+=5; updateAmmo(true); floatText(CX,CY-RL*.35,'补给 +5 发','143,227,240',24,1.3); }
  else { if(revivedRing) return; revivedRing=true;
    for(const b of bodies){ if(Math.hypot(b.x-CX,b.y-CY)+b.r>RL*.8){ b.merged=true; burst(b.x,b.y,b.k==='n'?b.tier:'junk',.5); } }
    bodies=bodies.filter(b=>!b.merged);
    waves.push({x:CX,y:CY,r0:RL,r1:RL*.3,t:0,max:.6,col:'255,210,122',w:6});
    floatText(CX,CY-RL*.35,'轨道已修复','255,210,122',24,1.3); }
  danger=0; lastShot=time; show('over',false); setState('play'); cool=.4; sfx.pulse();
}
function pause(){ if(state!=='play') return; setState('paused'); $('pausedInfo').textContent=`第 ${sector} 星系，${fmt(secScore)} / ${fmt(target)} 分，剩余 ${ammo} 发`; show('paused',true); }
function resume(){ if(state!=='paused') return; show('paused',false); setState('play'); }
function toMenu(){ show('over',false); show('paused',false); show('cards',false); E.banner.classList.remove('show'); buildChain(); show('menu',true); setState('menu'); seedDemo(); }

function dangerCheck(dt){
  let any=false;
  for(const b of bodies){ b.warn=false; if(b.flying||b.age<.8||b.k==='comet') continue; if(Math.hypot(b.x-CX,b.y-CY)+b.r>RL+1){ b.warn=true; any=true; } }
  if(any){ danger+=dt; warnBeep-=dt; if(warnBeep<=0){ sfx.warn(); warnBeep=.5; } } else { danger=Math.max(0,danger-dt*2); warnBeep=0; }
  if(danger>=dangerLimit()) gameOver('ring');
}
function busy(){ return bodies.some(b=>b.flying || (b.k==='n'&&b.grow<1)) || absorbing.length || time-lastMerge<1.2 || time-lastShot<1.4; }

/* ================= 主循环 ================= */
const keys={};
function update(dt){
  time+=dt;
  if(state==='play'||state==='menu'||state==='over'){
    acc += state==='over' ? dt*.25 : dt;
    let guard=0; while(acc>=STEP && guard++<12){ physics(STEP); acc-=STEP; } if(guard>=12) acc=0;
  }
  if(state==='play'){
    if(keys.ArrowLeft) ang-=2.6*dt; if(keys.ArrowRight) ang+=2.6*dt;
    cool=Math.max(0,cool-dt);
    if(hz.has('tide') && !clearing){
      tideT+=dt;
      if(tideT>6.2 && !tideWarn){ tideWarn=true; floatText(CX,CY+RL*.45,'潮汐来袭','143,227,240',20,1.2); sfx.tide(); }
      if(tideT>7.4){ tideT=0; tideWarn=false;
        for(const b of bodies){ if(b.flying) continue; const dx=b.x-CX, dy=b.y-CY, d=Math.hypot(dx,dy)||1; const f=250*S*(1-.4*d/RL); b.vx+=dx/d*f; b.vy+=dy/d*f; }
        waves.push({x:CX,y:CY,r0:RC,r1:RL,t:0,max:.6,col:'143,227,240',w:4}); }
    }
    if(!clearing){
      dangerCheck(dt);
      if(state==='play' && secScore>=target){ clearing=true; clearT=0; floatText(CX,CY-RL*.2,'星系稳定','255,210,122',34,1.6); if(!reduceMotion) shake=Math.max(shake,5); }
      else if(state==='play' && ammo<=0 && !busy()) gameOver('ammo');
    } else { clearT+=dt; if(clearT>1.3) sectorClear(); }
  }
  if(state==='over'){ overT+=dt; if(overT>.9 && !overShown){ overShown=true; show('over',true); } }
  shake = shake>.2 ? shake*Math.exp(-dt*9) : 0;
  for(const p of parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.95; p.vy*=.95; } parts=parts.filter(p=>p.t<p.max);
  for(const w of waves) w.t+=dt; waves=waves.filter(w=>w.t<w.max);
  for(const t of texts) t.t+=dt; texts=texts.filter(t=>t.t<t.max);
  for(const a of absorbing){ a.t+=dt; if(bodies.includes(a.host)){ a.hx=a.host.x; a.hy=a.host.y; } } absorbing=absorbing.filter(a=>a.t<.5);
}
function drawThing(g,k,tier,x,y,r,spin,alpha,extra){
  if(k==='n'){ if(tier===10) drawBH(g,x,y,r,time+(extra?extra.id:0),alpha); else drawLayered(g,layers[tier],x,y,r,spin,alpha, tier>=8 ? .85+.15*Math.sin(time*3+(extra?extra.id:0)) : 1); }
  else if(k==='junk') drawJunk(g,x,y,r,spin,extra?extra.hp:2,extra?extra.flash:0,alpha);
  else if(k==='wild') drawWild(g,x,y,r,time,alpha);
  else if(k==='comet') drawComet(g,x,y,r,extra?extra.vx:1,extra?extra.vy:-1,time,alpha);
  else if(k==='bomb') drawBomb(g,x,y,r,time,alpha);
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(bg,0,0,W,H);
  for(const s of twinkles){ const a=.35+.35*Math.sin(time*s.sp+s.ph); ctx.fillStyle=`rgba(255,248,230,${a})`; ctx.fillRect(s.x-s.s/2,s.y-s.s/2,s.s,s.s); }
  const sx=shake?(Math.random()*2-1)*shake:0, sy=shake?(Math.random()*2-1)*shake:0;
  ctx.save(); ctx.translate(sx,sy);

  const dz=Math.min(1,danger/Math.max(.5,dangerLimit())), flick=dz>0 ? .5+.5*Math.sin(time*(10+dz*14)) : 0;
  ctx.lineWidth=2+dz*2; ctx.strokeStyle = dz>0 ? `rgba(255,${210-150*dz|0},${122-70*dz|0},${.6+.4*flick})` : 'rgba(255,210,122,.6)';
  ctx.shadowColor = dz>0 ? 'rgba(255,70,70,.9)' : 'rgba(255,200,110,.8)'; ctx.shadowBlur=10+dz*14;
  circ(ctx,RL,CX,CY); ctx.stroke(); ctx.shadowBlur=0;
  if(dz>0){ ctx.fillStyle=`rgba(255,120,120,${.9})`; ctx.font=`800 ${Math.round(15+dz*6)}px ${FONTF}`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(`越界 ${Math.max(0,dangerLimit()-danger).toFixed(1)}s`,CX,CY+RL+16); }
  if(tideWarn){ ctx.strokeStyle=`rgba(143,227,240,${.3+.3*Math.sin(time*20)})`; ctx.lineWidth=3; circ(ctx,RL*.96,CX,CY); ctx.stroke(); }
  if(state==='play' && hz.has('spin')){ ctx.strokeStyle='rgba(143,227,240,.18)'; ctx.lineWidth=2; for(let i=0;i<3;i++){ const a0=time*.6*spinDir+i*TAU/3; ctx.beginPath(); ctx.arc(CX,CY,RL*.9,a0,a0+.5); ctx.stroke(); } }

  const cp=1+.08*Math.sin(time*2.4);
  ctx.fillStyle = RG(ctx,CX,CY,0,CX,CY,RC*3.2*cp,[[0,'rgba(255,255,255,.95)'],[.22,'rgba(225,200,255,.75)'],[1,'rgba(160,110,255,0)']]); circ(ctx,RC*3.2*cp,CX,CY); ctx.fill();

  const ca=Math.cos(ang), sa=Math.sin(ang);
  const aiming = state==='play' && cur && !clearing && ammo>0;
  if(aiming){
    const cr = cur.k==='n' ? rOf(cur.t) : SPECIAL_R[cur.k]*S;
    ctx.setLineDash([3,9]); ctx.lineDashOffset=-time*28; ctx.strokeStyle = cur.k==='n' ? 'rgba(243,238,255,.32)' : 'rgba(255,210,122,.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(CX+ca*(LR-cr-4),CY+sa*(LR-cr-4)); ctx.lineTo(CX+ca*(RC+6),CY+sa*(RC+6)); ctx.stroke(); ctx.setLineDash([]);
    if(cur.k==='bomb'){ ctx.strokeStyle='rgba(255,150,90,.25)'; ctx.setLineDash([4,6]); /* 爆炸范围提示 */
      let hitD=RC+cr; for(const b of bodies){ const px=b.x-CX, py=b.y-CY, along=px*ca+py*sa, perp=Math.abs(-px*sa+py*ca); if(perp<b.r+cr && along>hitD && along<LR) hitD=Math.max(hitD, along+Math.sqrt(Math.max(0,(b.r+cr)**2-perp*perp))); }
      circ(ctx,105*S,CX+ca*hitD,CY+sa*hitD); ctx.stroke(); ctx.setLineDash([]); }
  }

  for(const b of bodies){
    drawThing(ctx,b.k,b.tier,b.x,b.y,b.r,b.spin,1,b);
    if(b.warn){ ctx.strokeStyle=`rgba(255,80,80,${.4+.5*flick})`; ctx.lineWidth=2; circ(ctx,b.r+3,b.x,b.y); ctx.stroke(); }
  }
  for(const a of absorbing){
    const p=a.t/.5, rot=p*TAU*.9, k=1-easeOut(p), c=Math.cos(rot), s=Math.sin(rot);
    const x=a.hx+(a.ox*c-a.oy*s)*k, y=a.hy+(a.ox*s+a.oy*c)*k;
    drawThing(ctx,a.k,a.tier,x,y,Math.max(.5,a.r*k),a.spin+rot,1-p*.5,{hp:a.hp,flash:0,vx:1,vy:1,id:0});
  }

  ctx.globalCompositeOperation='lighter';
  for(const p of parts){ const k=1-p.t/p.max; ctx.fillStyle=`rgba(${p.col},${k})`; circ(ctx,p.size*(.5+.5*k),p.x,p.y); ctx.fill(); }
  for(const w of waves){ const p=w.t/w.max, r=w.r0+(w.r1-w.r0)*easeOut(p); ctx.strokeStyle=`rgba(${w.col},${(1-p)*.8})`; ctx.lineWidth=w.w*(1-p)+.5; circ(ctx,Math.max(0,r),w.x,w.y); ctx.stroke(); }
  ctx.globalCompositeOperation='source-over';

  if(aiming || state==='paused'){
    const x=CX+ca*LR, y=CY+sa*LR, k=1-(cool/COOL)*.7;
    const base = cur.k==='n' ? rOf(cur.t) : SPECIAL_R[cur.k]*S, rr=base*easeOut(clamp(k,0,1));
    if(rr>.5) drawThing(ctx,cur.k,cur.t,x,y,rr,time*.6,1,{vx:-ca,vy:-sa,hp:2,flash:0,id:0});
    const tip=LR+base+7*S+5, px=-sa, py=ca, sz=6*S+3;
    ctx.fillStyle='rgba(255,210,122,.9)'; ctx.beginPath();
    ctx.moveTo(CX+ca*tip,CY+sa*tip); ctx.lineTo(CX+ca*(tip+sz)+px*sz,CY+sa*(tip+sz)+py*sz); ctx.lineTo(CX+ca*(tip+sz)-px*sz,CY+sa*(tip+sz)-py*sz); ctx.fill();
  }

  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const t of texts){ const p=t.t/t.max, a=p<.15?p/.15:1-Math.max(0,(p-.5)/.5);
    ctx.font=`800 ${Math.round(t.size*(p<.15?.8+p/.15*.2:1))}px ${FONTF}`;
    ctx.fillStyle=`rgba(${t.col},${a})`; ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=6;
    ctx.fillText(t.txt,t.x,t.y-p*26); ctx.shadowBlur=0; }
  ctx.restore();
}
let last=performance.now();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; update(dt); render(); requestAnimationFrame(frame); }

/* ================= 输入 ================= */
let down=false;
function aimAt(e){ const r=cvs.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top; if(Math.hypot(x-CX,y-CY)>4) ang=Math.atan2(y-CY,x-CX); }
cvs.addEventListener('pointerdown',e=>{ ensureAudio(); if(state!=='play') return; down=true; aimAt(e); try{ cvs.setPointerCapture(e.pointerId); }catch(_){} });
cvs.addEventListener('pointermove',e=>{ if(state!=='play') return; if(e.pointerType==='mouse'||down) aimAt(e); });
cvs.addEventListener('pointerup',e=>{ if(state!=='play'||!down) return; down=false; aimAt(e); fire(); });
cvs.addEventListener('pointercancel',()=>{ down=false; });
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(state==='play'){
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); fire(); }
    if(e.key==='p'||e.key==='P'||e.key==='Escape') pause();
    if(e.key==='q'||e.key==='Q') pulse();
    if(e.key==='e'||e.key==='E'||e.key==='Shift') swapHold();
  } else if(state==='paused' && (e.key==='p'||e.key==='P'||e.key==='Escape')) resume();
  else if(state==='menu' && (e.key===' '||e.key==='Enter') && document.activeElement===document.body){ e.preventDefault(); startRun(); }
});
addEventListener('keyup',e=>{ keys[e.key]=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });
addEventListener('resize',layout);

$('startBtn').onclick=startRun;
$('againBtn').onclick=startRun;
$('revive').onclick=revive;
$('resumeBtn').onclick=resume;
$('quitBtn').onclick=toMenu;
$('homeLink').onclick=e=>{ e.preventDefault(); toMenu(); };
$('pauseBtn').onclick=()=>{ state==='play'?pause():resume(); };
E.pulse.onclick=pulse;
E.holdBtn.onclick=swapHold;
$('muteBtn').onclick=()=>{ muted=!muted; store.set('xh_mute',muted); ensureAudio(); if(master) master.gain.value=muted?0:.55; renderMute(); };
$('shareBtn').onclick=async()=>{
  const txt=`我在《星核大合成：引力远征》里闯到了第 ${sector} 星系，总分 ${fmt(total)}，最大养出了「${TIERS[maxTier].name}」🪐 你能走多远？`;
  let ok=false; try{ await navigator.clipboard.writeText(txt); ok=true; }catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove(); }catch(_){} }
  $('shareBtn').textContent = ok ? '已复制' : '复制失败，请截图分享';
  setTimeout(()=>$('shareBtn').textContent='复制战绩',1800);
};

/* 测试钩子（只读） */
window.__xh = { get state(){ return {state,sector,secScore,target,ammo,total,n:bodies.length,hz:[...hz],up,kinds:[...new Set(bodies.map(b=>b.k))]}; } };

renderMute(); buildChain(); layout(); seedDemo();
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
})();
</script>
