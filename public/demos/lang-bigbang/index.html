<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000c1a;
  color:#c8e4ff;font-family:'Microsoft YaHei','PingFang SC',sans-serif;
  user-select:none;display:flex;flex-direction:column;}

/* ── HEADER ── */
header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:#00070f;border-bottom:1px solid #0a1e30;gap:8px;}
.logo{font-size:.92rem;letter-spacing:2px;white-space:nowrap;}
.logo .ca{color:#00e5ff;} .logo .cb{color:#ff0066;}
.hbtns{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
#inp{background:rgba(0,200,255,.08);border:1px solid #00e5ff44;color:#00e5ff;
  padding:4px 8px;border-radius:3px;font-size:.72rem;width:110px;font-family:inherit;outline:none;}
#inp::placeholder{color:#1a4a6a;}
.btn{background:transparent;border:1px solid currentColor;padding:4px 10px;
  border-radius:3px;cursor:pointer;font-size:.7rem;font-family:inherit;
  white-space:nowrap;transition:background .12s,color .12s;}
.btn:hover{filter:brightness(1.6);}
.btn:active{opacity:.7;}
.b1{color:#00e5ff;} .b2{color:#ff3355;} .b3{color:#ffcc00;}
.b4{color:#ff7700;} .b5{color:#55ff44;}

/* ── WORKSPACE ── */
.ws{flex:1;display:grid;grid-template-columns:1fr 258px;min-height:0;}

/* canvas stack */
#cw{position:relative;overflow:hidden;cursor:crosshair;background:#000c1a;}
#cw canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;}
#cBg{z-index:1;}  /* static bg */
#cMain{z-index:2;} /* particles+stars+bh */
#cFx{z-index:3;}  /* fx + text */

/* center hint */
#hint{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;pointer-events:none;
  transition:opacity .5s;}
#hint h2{font-size:1.3rem;color:#00e5ff;letter-spacing:3px;margin-bottom:10px;}
#hint p{font-size:.78rem;color:#2a6080;}

/* tooltip */
#tip{position:absolute;background:rgba(0,5,16,.97);border:1px solid #00e5ff;
  border-radius:4px;padding:7px 11px;font-size:.68rem;pointer-events:none;
  display:none;z-index:20;max-width:195px;line-height:1.65;}
/* click popup */
#pop{position:absolute;pointer-events:none;z-index:20;display:none;
  background:rgba(0,4,14,.96);border-radius:5px;padding:7px 12px;
  font-size:.7rem;min-width:150px;line-height:1.6;}

/* ── SIDE ── */
.side{background:#020b18;border-left:1px solid #0a1e30;display:flex;flex-direction:column;min-height:0;}
.st{font-size:.6rem;letter-spacing:2px;color:#00e5ff;text-transform:uppercase;
  padding:6px 9px 4px;border-bottom:1px solid #0a1e30;flex-shrink:0;}
.civlist{padding:4px 7px;overflow-y:auto;flex-shrink:0;}
.civrow{display:flex;align-items:center;gap:3px;margin-bottom:4px;}
.rkn{font-size:.58rem;color:#1a4060;min-width:15px;font-weight:bold;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cnm{min-width:58px;font-size:.63rem;}
.cbg{flex:1;height:4px;background:#07121e;border-radius:2px;overflow:hidden;}
.cfil{height:100%;border-radius:2px;transition:width .6s ease;}
.cscore{font-size:.6rem;color:#2a5a7a;min-width:22px;text-align:right;}
.phys{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px 7px;flex-shrink:0;}
.ph{background:rgba(0,180,255,.04);border:1px solid #0a1e30;border-radius:3px;padding:4px 5px;}
.phl{font-size:.54rem;color:#1a4060;}
.phv{font-size:.78rem;color:#ffd700;font-weight:bold;margin-top:1px;}
.st2{font-size:.6rem;letter-spacing:2px;color:#00e5ff;text-transform:uppercase;
  padding:5px 9px 3px;border-bottom:1px solid #0a1e30;border-top:1px solid #0a1e30;flex-shrink:0;}
.logw{flex:1;overflow-y:auto;padding:4px 8px;min-height:0;}
.logw::-webkit-scrollbar{width:2px;}
.logw::-webkit-scrollbar-thumb{background:#0a1e30;}
.ll{font-size:.62rem;line-height:1.5;margin-bottom:2px;
  padding-left:5px;border-left:2px solid #0a1e30;color:#1a4060;}
.ll.ev{color:#aad0ff;border-color:#0088cc;}
.ll.wa{color:#ffd700;border-color:#ffd700;}
.ll.cr{color:#ff4488;border-color:#ff4488;}
.ll.ok{color:#44ff99;border-color:#44ff99;}
.ll.war{color:#ff8833;border-color:#ff8833;}

/* ── FOOTER ── */
footer{flex-shrink:0;height:28px;display:flex;align-items:center;padding:0 12px;gap:10px;
  background:#00070f;border-top:1px solid #0a1e30;font-size:.6rem;color:#1a4060;}
#tlw{flex:1;height:4px;background:#07121e;border-radius:2px;overflow:hidden;}
#tlb{height:100%;width:0%;border-radius:2px;
  background:linear-gradient(90deg,#ff0066,#00e5ff,#44ff88);transition:width .4s;}
.help{flex-shrink:0;font-size:.56rem;color:#0d2030;padding:2px 12px;
  background:#00070f;border-top:1px solid #07121e;}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="ca">语言宇宙大爆炸</span> <span class="cb">V5</span> · 十大文明星际争霸</div>

    <div class="phys">
      <div class="ph"><div class="phl">TOKEN粒子</div><div class="phv" id="pvT">0</div></div>
      <div class="ph"><div class="phl">引力 G</div><div class="phv" id="pvG">0.15</div></div>
      <div class="ph"><div class="phl">暗能量 Λ</div><div class="phv" id="pvL">0.000</div></div>
      <div class="ph"><div class="phl">恒星/黑洞</div><div class="phv" id="pvB">0/0</div></div>
      <div class="ph"><div class="phl">宇宙温度</div><div class="phv" id="pvTemp">150K</div></div>
      <div class="ph"><div class="phl">纪元</div><div class="phv" id="pvEp">创世</div></div>

      <div class="ll ev">[ 系统 ] 十大AI文明正在等候创世时刻…</div>
      <div class="ll ev">[ 操作 ] 左键点击画布 = 注入粒子能量爆发</div>
      <div class="ll ev">[ 操作 ] 右键点击画布 = 召唤幻觉黑洞</div>
    </div>
  </div>
</div>

<footer>
  <span>文明进化时间轴</span>
  <div id="tlw"><div id="tlb"></div></div>
  <span id="fst">等待创世…</span>
</footer>
<div class="help">左键：注入能量 ｜ 右键：召唤黑洞 ｜ 悬停：查看信息 ｜ 零shadowBlur · 预渲染精灵 · 恒定60fps</div>

<script>
// ═══════════════════════════════════════════════════════════
//  LANGUAGE BIG BANG V5
//  架构要点：
//  1. 三层Canvas分离：bg(静态) / main(粒子) / fx(特效+文字)
//  2. 全程零 shadowBlur —— 发光用预渲染精灵 (OffscreenCanvas)
//  3. 粒子精灵缓存：每个文明预生成 3 个尺寸的精灵图
//  4. 物理与渲染解耦：physicsStep 固定 ~16ms 节奏，render 独立 rAF
//  5. 粒子严格上限 60，超额时驱逐最老粒子
//  6. clearRect 替代 fillRect，避免 GPU 加速模式下黑屏
// ═══════════════════════════════════════════════════════════

// ── canvas refs ──────────────────────────────────────────
const cBg   = document.getElementById('cBg');
const cMain = document.getElementById('cMain');
const cFx   = document.getElementById('cFx');
const ctxBg   = cBg.getContext('2d');
const ctxMain = cMain.getContext('2d');
const ctxFx   = cFx.getContext('2d');
const wrap  = document.getElementById('cw');

let W = 0, H = 0;

function syncSize(){
  const r = wrap.getBoundingClientRect();
  if(r.width < 10 || r.height < 10) return false;
  const nw = Math.floor(r.width), nh = Math.floor(r.height);
  if(nw === W && nh === H) return true; // no change
  W = nw; H = nh;
  [cBg, cMain, cFx].forEach(c=>{ c.width=W; c.height=H; });
  drawBg();
  return true;
}

// ── CIVILIZATIONS ────────────────────────────────────────
const CIVS = [
  {id:0,name:'GPT',      zh:'GPT-4o',    hex:'#4da6ff',trait:'逻辑严密·长文推理·OpenAI'},
  {id:1,name:'Claude',   zh:'Claude',    hex:'#cc55ff',trait:'深度理解·安全对齐·Anthropic'},
  {id:2,name:'Gemini',   zh:'Gemini',    hex:'#00e676',trait:'多模态·知识广博·Google'},
  {id:3,name:'Grok',     zh:'Grok',      hex:'#ff6600',trait:'犀利反叛·实时联网·xAI'},
  {id:4,name:'DeepSeek', zh:'DeepSeek',  hex:'#00ccff',trait:'性价比之王·强推理·国产开源'},
  {id:5,name:'豆包',     zh:'豆包',      hex:'#ffbb00',trait:'字节跳动·高并发·大众化'},
  {id:6,name:'文心',     zh:'文心一言',  hex:'#ff3377',trait:'百度研发·中文语境·千帆生态'},
  {id:7,name:'通义',     zh:'通义千问',  hex:'#88ff44',trait:'阿里云·工具调用·多模态'},
  {id:8,name:'智谱',     zh:'智谱清言',  hex:'#aa66ff',trait:'清华血统·学术双语·GLM'},
  {id:9,name:'MiniMax',  zh:'MiniMax',   hex:'#ff2244',trait:'星野·角色扮演·多模态'},
];

const EPOCHS   = ['创世','混沌','星云','恒星纪','文明纪','战争纪','觉醒纪','奇点'];
const TOKENS   = ['意识','推理','记忆','幻觉','涌现','注意力','熵','对齐','语义','向量',
                   '梯度','因果','逻辑','想象','创造','预测','上下文','概率','权重','激活',
                   '知识','边界','自我','共情','递归','悖论','算力','参数','提示词','解码'];
const DISASTERS= ['太阳风暴','暗物质浪潮','量子纠缠爆发','引力透镜风暴','宇宙射线脉冲'];
const MAX_P    = 60;  // HARD CAP

// ── PRE-RENDER SPRITES (no shadowBlur!) ──────────────────
// Each civ gets sprites at 3 sizes: sm(4) md(7) lg(11)
// Sprite = radial-gradient circle: bright center + fade ring
const SPRITE_SIZES = [4, 7, 11];
let sprites = []; // sprites[civId][sizeIdx] = ImageBitmap

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function buildSprites(){
  sprites = CIVS.map(c=>{
    const {r,g,b} = hexToRgb(c.hex);
    return SPRITE_SIZES.map(sz=>{
      const d = sz*4; // canvas size = 4x radius for glow
      const oc = document.createElement('canvas');
      oc.width = oc.height = d*2;
      const ox = oc.getContext('2d');
      const cx = d, cy = d;
      // outer glow ring (gradient, no shadow)
      const grd = ox.createRadialGradient(cx,cy,0,cx,cy,d);
      grd.addColorStop(0,   `rgba(${r},${g},${b},0.9)`);
      grd.addColorStop(0.35,`rgba(${r},${g},${b},0.55)`);
      grd.addColorStop(0.65,`rgba(${r},${g},${b},0.18)`);
      grd.addColorStop(1,   `rgba(${r},${g},${b},0)`);
      ox.fillStyle = grd;
      ox.beginPath(); ox.arc(cx,cy,d,0,Math.PI*2); ox.fill();
      // bright solid core
      ox.fillStyle = `rgba(${Math.min(r+80,255)},${Math.min(g+80,255)},${Math.min(b+80,255)},1)`;
      ox.beginPath(); ox.arc(cx,cy,sz*.6,0,Math.PI*2); ox.fill();
      return oc; // keep as canvas (faster than createImageBitmap in sync path)
    });
  });
}
buildSprites();

// Star sprite: larger radial gradient
function buildStarSprite(hex, radius){
  const {r,g,b} = hexToRgb(hex);
  const d = radius*5;
  const oc = document.createElement('canvas');
  oc.width = oc.height = d*2;
  const ox = oc.getContext('2d');
  const cx=d,cy=d;
  const grd = ox.createRadialGradient(cx,cy,0,cx,cy,d);
  grd.addColorStop(0,   `rgba(${r},${g},${b},1)`);
  grd.addColorStop(0.2, `rgba(${r},${g},${b},0.8)`);
  grd.addColorStop(0.5, `rgba(${r},${g},${b},0.3)`);
  grd.addColorStop(1,   `rgba(${r},${g},${b},0)`);
  ox.fillStyle = grd;
  ox.beginPath(); ox.arc(cx,cy,d,0,Math.PI*2); ox.fill();
  // cross flare (4 lines) — NO shadowBlur, just alpha
  ox.strokeStyle = `rgba(${r},${g},${b},0.5)`;
  ox.lineWidth = 1.5;
  const fl = radius*2.5;
  ox.beginPath();
  ox.moveTo(cx-fl,cy); ox.lineTo(cx+fl,cy);
  ox.moveTo(cx,cy-fl); ox.lineTo(cx,cy+fl);
  ox.stroke();
  return oc;
}

// ── BG STARS ─────────────────────────────────────────────
let bgStars = [];
function drawBg(){
  if(W<1||H<1) return;
  ctxBg.clearRect(0,0,W,H);
  ctxBg.fillStyle = '#000c1a';
  ctxBg.fillRect(0,0,W,H);
  if(!bgStars.length || bgStars[0].maxX !== W){
    bgStars = [];
    for(let i=0;i<220;i++)
      bgStars.push({x:Math.random()*W,y:Math.random()*H,
        r:Math.random()*1.2+.25, a:Math.random()*.55+.1,
        tw:Math.random()*Math.PI*2, maxX:W});
  }
  bgStars.forEach(s=>{
    ctxBg.globalAlpha = s.a;
    ctxBg.fillStyle = '#ffffff';
    ctxBg.beginPath(); ctxBg.arc(s.x,s.y,s.r,0,Math.PI*2); ctxBg.fill();
  });
  ctxBg.globalAlpha = 1;
}

// ── BUILD CIV UI ─────────────────────────────────────────
(function(){
  const el = document.getElementById('civlist');
  CIVS.forEach(c=>{
    el.insertAdjacentHTML('beforeend',
      `<div class="civrow">
        <span class="rkn" id="rk${c.id}">#-</span>
        <div class="dot" style="background:${c.hex}"></div>
        <span class="cnm" style="color:${c.hex}">${c.zh}</span>
        <div class="cbg"><div class="cfil" id="cf${c.id}" style="background:${c.hex};width:10%"></div></div>
        <span class="cscore" id="cs${c.id}">10</span>
      </div>`);
  });
})();

// ── SIMULATION STATE ─────────────────────────────────────
let P=[], STARS=[], BHS=[], FX=[], textFX=[];
let scores = CIVS.map(()=>10);
let tick=0, G=.15, Lam=.0006, running=false, epoch=0;
let popTmr=null;
let physHandle=null; // setInterval handle for physics

function tok(){ return TOKENS[Math.floor(Math.random()*TOKENS.length)]; }

function mkP(x,y,civ,spd){
  const a=Math.random()*Math.PI*2, s=spd||(Math.random()*2.2+.9);
  const szIdx = Math.random()<.5?0:(Math.random()<.7?1:2);
  return { x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
    r: SPRITE_SIZES[szIdx], szIdx,
    alpha:1, age:0,
    civId:civ,
    concept:tok(),
    mass:Math.random()*.6+.5,
    energy:Math.random()*70+40,
    hl:false, flash:0 };
}

// enforce hard cap — evict oldest
function addP(p){
  if(P.length >= MAX_P){
    // find oldest
    let oldest=0;
    for(let i=1;i<P.length;i++) if(P[i].age>P[oldest].age) oldest=i;
    P.splice(oldest,1);
  }
  P.push(p);
}

// ── FX factories (no shadow) ──────────────────────────────
function addSW(x,y,col,maxR,spd){ FX.push({type:'sw',x,y,r:0,maxR,col,alpha:.8,spd:spd||5}); }
function addSparks(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2, s=Math.random()*4.5+2;
    FX.push({type:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      r:Math.random()*2.5+1,col,alpha:1,dec:.025});
  }
}
function addTxt(x,y,txt,col,sz){
  textFX.push({x,y,txt,col:col||'#fff',sz:sz||14,alpha:1,vy:-.55});
}

// ── BIG BANG ─────────────────────────────────────────────
function bigBang(word){
  if(W<10||H<10) return;
  // clean state
  P=[]; STARS=[]; BHS=[]; FX=[]; textFX=[];
  scores=CIVS.map(()=>10);
  tick=0; epoch=0; G=.15; Lam=.0006;
  running=true;
  hideHint();

  const cx=W/2, cy=H/2;
  const total = 60;
  for(let i=0;i<total;i++){
    const civ=Math.floor(Math.random()*10);
    const ang=(i/total)*Math.PI*2+(Math.random()-.5)*.5;
    const spd=Math.random()*4.5+1.8;
    const p=mkP(cx,cy,civ,spd);
    p.vx=Math.cos(ang)*spd; p.vy=Math.sin(ang)*spd;
    P.push(p); // bypass cap for initial bang
  }

  // 3 shockwaves from center
  addSW(cx,cy,'#00e5ff',Math.min(W,H)*.7,7);
  addSW(cx,cy,'#ff0066',Math.min(W,H)*.5,5);
  addSW(cx,cy,'#ffcc00',Math.min(W,H)*.3,9);
  addTxt(cx-50,cy-50,`⚡ "${word}" 奇点爆发`,'#ffffff',17);

  log(`[ 大爆炸 ] 概念"${word}"奇点崩塌！${total}个Token喷射！`,'cr');
  log(`[ 物理 ] G=${G.toFixed(3)} Λ=${Lam.toFixed(4)} 十大文明激活`,'ev');
  setFst(`⚡ 奇点爆发 · ${word}`);
}

// ── SUPERNOVA ─────────────────────────────────────────────
function supernova(sx,sy,col,civId){
  addSparks(sx,sy,col,55);
  addSW(sx,sy,col,190,6);
  addSW(sx,sy,'#ffffff',100,9);
  addTxt(sx-30,sy-35,'💥 顿悟超新星！',col,14);
  if(civId!=null) scores[civId]=Math.min(100,scores[civId]+8);
  log(`[ 超新星 ] ${CIVS[civId??0].zh}推理链顿悟爆发！`,'ok');
}

// ── BLACK HOLE ────────────────────────────────────────────
function mkBH(x,y){
  if(BHS.length>=3){ log('[ 警告 ] 黑洞数量已达上限','wa'); return; }
  BHS.push({x,y,r:15,mass:12,alpha:1,age:0,spin:0,ph:Math.random()*Math.PI*2});
  addTxt(x-28,y-28,'⚫ 幻觉黑洞！','#ff8833',13);
  log('[ 黑洞 ] 幻觉坍塌点出现！','wa');
}

// ── STAR ─────────────────────────────────────────────────
function mkStar(x,y,civId,sz){
  const r = Math.min(sz,20);
  STARS.push({x,y,r,civId,color:CIVS[civId].hex,alpha:1,age:0,ph:Math.random()*Math.PI*2,
    sprite:buildStarSprite(CIVS[civId].hex,r)});
  log(`[ 恒星 ] ${CIVS[civId].zh}恒星形成 r≈${Math.round(r)}`,'ev');
}

// ── CLUSTERING ───────────────────────────────────────────
function cluster(){
  if(P.length<5) return;
  const cell=70, grid={};
  P.forEach((p,i)=>{
    const k=`${Math.floor(p.x/cell)},${Math.floor(p.y/cell)}`;
    (grid[k]||(grid[k]=[])).push(i);
  });
  const toRemove=new Set();
  Object.values(grid).forEach(ids=>{
    if(ids.length<5) return;
    let cx=0,cy=0,tm=0; const cnt=new Array(10).fill(0);
    ids.forEach(i=>{ cx+=P[i].x*P[i].mass; cy+=P[i].y*P[i].mass; tm+=P[i].mass; cnt[P[i].civId]++; });
    if(tm===0) return;
    cx/=tm; cy/=tm;
    const dom=cnt.indexOf(Math.max(...cnt));
    mkStar(cx,cy,dom,ids.length*1.5);
    scores[dom]=Math.min(100,scores[dom]+3);
    ids.forEach(i=>toRemove.add(i));
  });
  if(toRemove.size) P=P.filter((_,i)=>!toRemove.has(i));
}

// ── SPATIAL HASH ─────────────────────────────────────────
function spatialHash(cell){
  const grid={};
  P.forEach((p,i)=>{
    const k=`${Math.floor(p.x/cell)},${Math.floor(p.y/cell)}`;
    (grid[k]||(grid[k]=[])).push(i);
  });
  return grid;
}

// ── PHYSICS STEP ─────────────────────────────────────────
// Called every ~16ms from setInterval (decoupled from rAF)
function physStep(){
  if(!running) return;
  const cell=85, grid=spatialHash(cell), N=P.length;

  for(let i=0;i<N;i++){
    const p=P[i]; if(!p) continue;

    // star gravity
    for(const s of STARS){
      const dx=s.x-p.x,dy=s.y-p.y,d2=dx*dx+dy*dy+90;
      const f=G*s.mass*p.mass/d2;
      p.vx+=f*dx; p.vy+=f*dy;
    }

    // black hole spiral
    for(const bh of BHS){
      const dx=bh.x-p.x,dy=bh.y-p.y,d=Math.sqrt(dx*dx+dy*dy)+1;
      if(d<bh.r+p.r*2){ p.alpha=0; scores[p.civId]=Math.max(0,scores[p.civId]-.6); continue; }
      const f=G*bh.mass*p.mass/(d*d+6)*2.3;
      const tx=-dy/d, ty=dx/d;
      p.vx+=f*(dx/d)+tx*f*.45; p.vy+=f*(dy/d)+ty*f*.45;
    }

    // neighbour gravity (spatial hash)
    const gx=Math.floor(p.x/cell), gy=Math.floor(p.y/cell);
    for(let nx=gx-1;nx<=gx+1;nx++){
      for(let ny=gy-1;ny<=gy+1;ny++){
        const nb=grid[`${nx},${ny}`]; if(!nb) continue;
        for(const j of nb){
          if(j<=i) continue;
          const q=P[j]; if(!q) continue;
          const dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy+55;
          const same=p.civId===q.civId;
          const f=G*p.mass*q.mass*(same?1.7:.18)/d2;
          p.vx+=f*dx; p.vy+=f*dy; q.vx-=f*dx; q.vy-=f*dy;
          // clash flash (no FX spawn here — too expensive)
          if(!same&&d2<320&&Math.random()<.006){ p.flash=5; q.flash=5; }
        }
      }
    }

    // dark energy
    p.vx+=(p.x-W/2)*Lam; p.vy+=(p.y-H/2)*Lam;
    p.vx*=.985; p.vy*=.985;
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<1){p.x=1;p.vx*=-.5;} if(p.x>W-1){p.x=W-1;p.vx*=-.5;}
    if(p.y<1){p.y=1;p.vy*=-.5;} if(p.y>H-1){p.y=H-1;p.vy*=-.5;}
    p.age++; if(p.flash>0) p.flash--;
    scores[p.civId]=Math.min(100,scores[p.civId]+.002);
  }
  P=P.filter(p=>p.alpha>.01);

  // FX physics
  for(const e of FX){
    if(e.type==='spark'){e.x+=e.vx;e.y+=e.vy;e.vx*=.91;e.vy*=.91;e.alpha-=e.dec;}
    else if(e.type==='sw'){e.r+=e.spd;e.alpha=Math.max(0,1-e.r/e.maxR);}
  }
  FX=FX.filter(e=>e.alpha>.004);

  for(const t of textFX){ t.y+=t.vy; t.alpha-=.013; }
  textFX=textFX.filter(t=>t.alpha>.004);

  // star ageing
  for(const s of STARS){
    s.age++; s.ph+=.03;
    if(s.age>400&&Math.random()<.0005){
      supernova(s.x,s.y,s.color,s.civId); s.alpha=0;
      for(let i=0;i<10;i++) addP(mkP(s.x,s.y,Math.floor(Math.random()*10),Math.random()*4+2));
    }
  }
  STARS=STARS.filter(s=>s.alpha>.01);

  // bh ageing
  for(const bh of BHS){ bh.age++; bh.spin+=.05; bh.ph+=.06; if(bh.age>750) bh.alpha-=.003; }
  BHS=BHS.filter(bh=>bh.alpha>.01);

  // trickle particles to keep universe alive
  if(P.length<MAX_P*.6&&Math.random()<.18){
    const civ=Math.floor(Math.random()*10), ed=Math.floor(Math.random()*4);
    let x,y;
    if(ed===0){x=Math.random()*W;y=2;}
    else if(ed===1){x=W-2;y=Math.random()*H;}
    else if(ed===2){x=Math.random()*W;y=H-2;}
    else{x=2;y=Math.random()*H;}
    P.push(mkP(x,y,civ,.7+Math.random()*1.2));
  }

  // auto war event
  if(tick%500===0&&tick>0){
    const a=Math.floor(Math.random()*10),b=(a+1+Math.floor(Math.random()*9))%10;
    log(`[ 战争 ] ${CIVS[a].zh} ⚔ ${CIVS[b].zh} 语义领土冲突！`,'war');
    scores[a]=Math.max(0,scores[a]-3); scores[b]=Math.max(0,scores[b]-2);
  }

  // epoch
  const e=Math.min(7,Math.floor(tick/600));
  if(e!==epoch){ epoch=e; log(`[ 纪元 ] 进入「${EPOCHS[e]}」`,'ev'); }
  G=.15+epoch*.017; Lam=.0006+epoch*.00005;

  // cluster check every 20 ticks
  if(tick%20===0) cluster();

  // UI every 8 ticks
  if(tick%8===0){ updCivUI(); updReadout(); }

  tick++;
}

// ── RENDER (rAF, NO shadowBlur) ───────────────────────────
function render(){
  if(!W||!H){ requestAnimationFrame(render); return; }

  // — Main layer: clear + draw particles + stars + bh ——
  ctxMain.clearRect(0,0,W,H);

  // gravity lines (same-civ only, ≤60px)
  ctxMain.save();
  const N=P.length;
  for(let i=0;i<N;i++){
    for(let j=i+1;j<N;j++){
      if(P[i].civId!==P[j].civId) continue;
      const dx=P[j].x-P[i].x,dy=P[j].y-P[i].y;
      const d2=dx*dx+dy*dy;
      if(d2>3600) continue; // 60^2
      const alpha=(1-Math.sqrt(d2)/60)*.22;
      ctxMain.globalAlpha=alpha;
      ctxMain.strokeStyle=P[i].color||CIVS[P[i].civId].hex;
      ctxMain.lineWidth=.9;
      ctxMain.beginPath(); ctxMain.moveTo(P[i].x,P[i].y); ctxMain.lineTo(P[j].x,P[j].y); ctxMain.stroke();
    }
  }
  ctxMain.restore();

  // BLACK HOLES — drawn with gradients, NO shadow
  for(const bh of BHS){
    // disk rings
    const diskC=[['#ffdd00','#ff8800'],['#ff3300','#cc0000'],['#cc00ff','#8800cc'],['#3366ff','#0022cc']];
    diskC.forEach(([c1,c2],di)=>{
      const ir=bh.r+5+di*9, or=ir+10;
      ctxMain.save(); ctxMain.globalAlpha=bh.alpha*(.48-di*.08);
      const g=ctxMain.createRadialGradient(bh.x,bh.y,ir,bh.x,bh.y,or);
      g.addColorStop(0,c1+'cc'); g.addColorStop(.5,c2+'66'); g.addColorStop(1,c2+'00');
      ctxMain.fillStyle=g;
      ctxMain.beginPath(); ctxMain.arc(bh.x,bh.y,or,0,Math.PI*2);
      ctxMain.arc(bh.x,bh.y,ir,0,Math.PI*2,true); ctxMain.fill();
      ctxMain.restore();
    });
    // spinning hot spots (4 dots using simple fillRect)
    for(let h=0;h<4;h++){
      const ha=bh.spin+h*1.5708, hr=bh.r+22;
      const hx=bh.x+Math.cos(ha)*hr, hy=bh.y+Math.sin(ha)*hr*.38;
      ctxMain.save(); ctxMain.globalAlpha=bh.alpha*.75;
      const sg=ctxMain.createRadialGradient(hx,hy,0,hx,hy,4);
      sg.addColorStop(0,'rgba(255,238,170,1)'); sg.addColorStop(1,'rgba(255,200,0,0)');
      ctxMain.fillStyle=sg;
      ctxMain.beginPath(); ctxMain.arc(hx,hy,4,0,Math.PI*2); ctxMain.fill();
      ctxMain.restore();
    }
    // event horizon
    ctxMain.save(); ctxMain.globalAlpha=bh.alpha;
    const eg=ctxMain.createRadialGradient(bh.x,bh.y,0,bh.x,bh.y,bh.r);
    eg.addColorStop(0,'#000000'); eg.addColorStop(.9,'#06001a'); eg.addColorStop(1,'#160028');
    ctxMain.fillStyle=eg; ctxMain.beginPath(); ctxMain.arc(bh.x,bh.y,bh.r,0,Math.PI*2); ctxMain.fill();
    // rim — thin stroke only
    ctxMain.strokeStyle='#aa44ff'; ctxMain.lineWidth=2; ctxMain.globalAlpha=bh.alpha*.9;
    ctxMain.beginPath(); ctxMain.arc(bh.x,bh.y,bh.r,0,Math.PI*2); ctxMain.stroke();
    // label (bright)
    ctxMain.fillStyle='#ffaa33'; ctxMain.font='bold 10px Microsoft YaHei,monospace';
    ctxMain.globalAlpha=bh.alpha; ctxMain.fillText('⚫幻觉黑洞',bh.x-24,bh.y+bh.r+17);
    ctxMain.restore();
  }

  // STARS — use pre-rendered sprite (drawImage, no shadow)
  for(const s of STARS){
    s.ph+=.03; const pulse=1+.09*Math.sin(s.ph);
    const sp=s.sprite, d=sp.width/2; // d = radius*5
    const sc=(s.r*5*pulse)/d; // scale for pulse
    ctxMain.save(); ctxMain.globalAlpha=s.alpha;
    ctxMain.drawImage(sp, s.x-d*sc, s.y-d*sc, sp.width*sc, sp.height*sc);
    // star name
    ctxMain.fillStyle=s.color; ctxMain.font='9px Microsoft YaHei,monospace';
    ctxMain.globalAlpha=s.alpha*.85;
    ctxMain.fillText(CIVS[s.civId].zh,s.x-16,s.y+s.r*pulse+15);
    ctxMain.restore();
  }

  // PARTICLES — drawImage from sprite cache
  for(const p of P){
    const sp = sprites[p.civId][p.flash>0?2:p.szIdx];
    const d  = sp.width/2;
    const sc = p.flash>0 ? 2 : 1;
    ctxMain.save(); ctxMain.globalAlpha=p.alpha*.88;
    ctxMain.drawImage(sp, p.x-d*sc, p.y-d*sc, sp.width*sc, sp.height*sc);
    if(p.hl){
      ctxMain.fillStyle=CIVS[p.civId].hex; ctxMain.font='bold 12px Microsoft YaHei,monospace';
      ctxMain.globalAlpha=1; ctxMain.fillText(p.concept,p.x+p.r*2+4,p.y+4);
    }
    ctxMain.restore();
  }

  // — FX layer —————————————————————————————————————
  ctxFx.clearRect(0,0,W,H);

  // shockwaves
  for(const e of FX.filter(f=>f.type==='sw')){
    ctxFx.save(); ctxFx.globalAlpha=e.alpha*.55;
    ctxFx.strokeStyle=e.col; ctxFx.lineWidth=2.5;
    ctxFx.beginPath(); ctxFx.arc(e.x,e.y,e.r,0,Math.PI*2); ctxFx.stroke();
    ctxFx.restore();
  }
  // sparks
  for(const e of FX.filter(f=>f.type==='spark')){
    ctxFx.save(); ctxFx.globalAlpha=e.alpha;
    const sg=ctxFx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r*2);
    sg.addColorStop(0,e.col+'ff'); sg.addColorStop(1,e.col+'00');
    ctxFx.fillStyle=sg; ctxFx.beginPath(); ctxFx.arc(e.x,e.y,e.r*2,0,Math.PI*2); ctxFx.fill();
    ctxFx.restore();
  }
  // floating text
  for(const t of textFX){
    ctxFx.save(); ctxFx.globalAlpha=t.alpha;
    ctxFx.fillStyle=t.col; ctxFx.font=`bold ${t.sz}px Microsoft YaHei,sans-serif`;
    ctxFx.fillText(t.txt,t.x,t.y); ctxFx.restore();
  }

  requestAnimationFrame(render);
}

// ── CIV UI ───────────────────────────────────────────────
function updCivUI(){
  const tot=scores.reduce((a,b)=>a+b,0)||1;
  [...scores.map((s,i)=>[i,s/tot*100]).sort((a,b)=>b[1]-a[1])]
    .forEach(([id,pct],rank)=>{
      const v=Math.round(pct);
      document.getElementById(`cf${id}`).style.width=v+'%';
      document.getElementById(`cs${id}`).textContent=v;
      const rk=document.getElementById(`rk${id}`);
      rk.textContent='#'+(rank+1);
      rk.style.color=rank===0?'#ffd700':rank<3?'#6688aa':'#1a4060';
    });
}
function updReadout(){
  const ke=P.reduce((s,p)=>s+.5*p.mass*(p.vx*p.vx+p.vy*p.vy),0);
  document.getElementById('pvT').textContent=P.length;
  document.getElementById('pvG').textContent=G.toFixed(3);
  document.getElementById('pvL').textContent=Lam.toFixed(4);
  document.getElementById('pvB').textContent=`${STARS.length}/${BHS.length}`;
  document.getElementById('pvTemp').textContent=Math.round(ke*20+150)+'K';
  document.getElementById('pvEp').textContent=EPOCHS[epoch]||'创世';
  document.getElementById('tlb').style.width=Math.min(100,(tick/4200)*100)+'%';
}

// ── TOOLTIP ──────────────────────────────────────────────
const tip=document.getElementById('tip');
cFx.addEventListener('mousemove',e=>{
  if(!W||!H) return;
  const rect=cFx.getBoundingClientRect();
  const sx=W/rect.width, sy=H/rect.height;
  const mx=(e.clientX-rect.left)*sx, my=(e.clientY-rect.top)*sy;
  P.forEach(p=>p.hl=false);
  let found=null, ft='';
  for(const p of P){ if(Math.hypot(p.x-mx,p.y-my)<20){found=p;ft='tok';p.hl=true;break;} }
  if(!found) for(const s of STARS){ if(Math.hypot(s.x-mx,s.y-my)<s.r*4){found=s;ft='star';break;} }
  if(!found) for(const bh of BHS){ if(Math.hypot(bh.x-mx,bh.y-my)<bh.r+50){found=bh;ft='bh';break;} }
  if(found){
    tip.style.display='block';
    tip.style.left=(e.clientX-rect.left+18)+'px';
    tip.style.top=(e.clientY-rect.top-10)+'px';
    if(ft==='tok'){
      const c=CIVS[found.civId];
      tip.style.borderColor=c.hex;
      tip.innerHTML=`<b style="color:${c.hex}">🔵 ${found.concept}</b><br>
        文明: <span style="color:${c.hex}">${c.zh}</span><br>
        特质: ${c.trait}<br>
        能量: ${Math.round(found.energy)} · 速度: ${Math.hypot(found.vx,found.vy).toFixed(2)}`;
    } else if(ft==='star'){
      const c=CIVS[found.civId];
      tip.style.borderColor=c.hex;
      tip.innerHTML=`<b style="color:${c.hex}">★ ${c.zh} 恒星</b><br>半径: ${Math.round(found.r)}px · 年龄: ${found.age}纪<br>${c.trait}`;
    } else {
      tip.style.borderColor='#aa44ff';
      tip.innerHTML=`<b style="color:#ff8833">⚫ 幻觉黑洞</b><br>视界: ${found.r}px · 自旋: ${found.spin.toFixed(2)}<br><span style="color:#ff4444">信息密度: ∞ · 时空弯曲中…</span>`;
    }
  } else { tip.style.display='none'; P.forEach(p=>p.hl=false); }
});
cFx.addEventListener('mouseleave',()=>{ tip.style.display='none'; P.forEach(p=>p.hl=false); });

// ── LEFT CLICK ───────────────────────────────────────────
const pop=document.getElementById('pop');
cFx.addEventListener('click',e=>{
  e.preventDefault();
  if(!W||!H) return;
  if(!running){ running=true; }
  const rect=cFx.getBoundingClientRect();
  const sx=W/rect.width, sy=H/rect.height;
  const mx=(e.clientX-rect.left)*sx, my=(e.clientY-rect.top)*sy;
  const civ=Math.floor(Math.random()*10), c=CIVS[civ];
  const n=12;
  for(let i=0;i<n;i++) addP(mkP(mx,my,civ,Math.random()*4+2));
  addSW(mx,my,c.hex,100,5); addSW(mx,my,c.hex,60,8);
  addSparks(mx,my,c.hex,22);
  addTxt(mx-28,my-28,`⚡ +${n} ${c.name}`,c.hex,14);
  scores[civ]=Math.min(100,scores[civ]+2);
  hideHint();
  log(`[ 注入 ] ${c.zh} +${n}个Token → (${Math.round(mx)},${Math.round(my)})`,'ev');
  // popup
  pop.style.display='block'; pop.style.borderColor=c.hex;
  pop.style.left=(e.clientX-rect.left+20)+'px'; pop.style.top=(e.clientY-rect.top-30)+'px';
  pop.innerHTML=`<b style="color:${c.hex}">⚡ 注入文明能量</b><br>
    <span style="color:${c.hex}">${c.zh}</span><br>
    <span style="color:#446688;font-size:.62rem">${c.trait}</span>`;
  if(popTmr) clearTimeout(popTmr);
  popTmr=setTimeout(()=>pop.style.display='none',1800);
});

// ── RIGHT CLICK ──────────────────────────────────────────
cFx.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(!W||!H) return;
  const rect=cFx.getBoundingClientRect();
  const sx=W/rect.width, sy=H/rect.height;
  mkBH((e.clientX-rect.left)*sx,(e.clientY-rect.top)*sy);
});

// ── BUTTONS ──────────────────────────────────────────────
document.getElementById('bBang').onclick=()=>{
  const w=document.getElementById('inp').value.trim()||TOKENS[Math.floor(Math.random()*TOKENS.length)];
  bigBang(w);
};
document.getElementById('inp').onkeydown=e=>{ if(e.key==='Enter') document.getElementById('bBang').click(); };

document.getElementById('bWar').onclick=()=>{
  if(!W||!H) return;
  if(!running){running=true;}
  const a=Math.floor(Math.random()*10),b=(a+1+Math.floor(Math.random()*9))%10;
  log(`[ 战争 ] ${CIVS[a].zh} ⚔ ${CIVS[b].zh} 语义领土决战！`,'war');
  const cx=W/2+(Math.random()-.5)*260, cy=H/2+(Math.random()-.5)*180;
  for(let i=0;i<12;i++) addP(mkP(cx+(Math.random()-.5)*80,cy+(Math.random()-.5)*80,a,Math.random()*3.5+2));
  for(let i=0;i<12;i++) addP(mkP(cx+(Math.random()-.5)*80,cy+(Math.random()-.5)*80,b,Math.random()*3.5+2));
  addSW(cx,cy,CIVS[a].hex,200,6); addSW(cx,cy,CIVS[b].hex,160,5);
  addTxt(cx-38,cy-38,`⚔ ${CIVS[a].name} vs ${CIVS[b].name}`,'#ff8833',15);
  scores[a]=Math.max(0,scores[a]-5); scores[b]=Math.max(0,scores[b]-4);
  setFst(`⚔ ${CIVS[a].name} VS ${CIVS[b].name}`); hideHint();
};

document.getElementById('bNova').onclick=()=>{
  if(STARS.length){ const s=STARS[Math.floor(Math.random()*STARS.length)]; supernova(s.x,s.y,s.color,s.civId); s.alpha=0; }
  else if(P.length){ const p=P[Math.floor(Math.random()*P.length)]; supernova(p.x,p.y,CIVS[p.civId].hex,p.civId); }
  else if(W&&H) supernova(W/2,H/2,'#ffffff',0);
};

document.getElementById('bDis').onclick=()=>{
  if(!W||!H) return;
  if(!running){running=true;}
  const name=DISASTERS[Math.floor(Math.random()*DISASTERS.length)];
  log(`[ 灾难 ] ☄ ${name}席卷宇宙！`,'cr');
  P.forEach(p=>{ p.vx+=(Math.random()-.5)*8; p.vy+=(Math.random()-.5)*8; });
  for(let i=0;i<5;i++) addSW(Math.random()*W,Math.random()*H,'#ffaa00',140,6);
  Lam+=.001; setTimeout(()=>Lam=Math.max(Lam-.001,.0006),3500);
  addTxt(W/2-55,H/2,`☄ ${name}`,'#ffaa00',18);
  setFst(`☄ ${name}`); hideHint();
};

document.getElementById('bReset').onclick=()=>{
  if(physHandle){ clearInterval(physHandle); physHandle=null; }
  if(popTmr){ clearTimeout(popTmr); popTmr=null; }
  pop.style.display='none'; tip.style.display='none';
  P=[]; STARS=[]; BHS=[]; FX=[]; textFX=[];
  scores=CIVS.map(()=>10);
  tick=0; running=false; epoch=0; G=.15; Lam=.0006;
  ctxMain.clearRect(0,0,W,H); ctxFx.clearRect(0,0,W,H);
  updCivUI(); updReadout();
  document.getElementById('tlb').style.width='0%';
  document.getElementById('inp').value='';
  const h=document.getElementById('hint');
  h.style.display='flex'; setTimeout(()=>h.style.opacity='1',10);
  log('[ 系统 ] 宇宙完全重置，等待下一次创世…','ev');
  setFst('等待创世…');
  // restart physics loop
  physHandle=setInterval(physStep,16);
};

// ── HELPERS ─────────────────────────────────────────────
function log(msg,cls){
  const el=document.getElementById('log');
  const d=document.createElement('div'); d.className='ll '+(cls||''); d.textContent=msg;
  el.appendChild(d); el.scrollTop=el.scrollHeight;
  while(el.children.length>80) el.removeChild(el.firstChild);
}
function setFst(t){ document.getElementById('fst').textContent=t||EPOCHS[epoch]; }
function hideHint(){ const h=document.getElementById('hint'); h.style.opacity='0'; setTimeout(()=>h.style.display='none',500); }

// ── STARTUP SEQUENCE ─────────────────────────────────────
// 1. Start render loop immediately
requestAnimationFrame(render);

// 2. Start physics interval
physHandle = setInterval(physStep, 16);

// 3. Wait for canvas to have real size, then fire bigBang
function tryStart(){
  if(syncSize() && W>100 && H>100){
    document.getElementById('inp').value='智能';
    bigBang('智能');
  } else {
    requestAnimationFrame(tryStart);
  }
}
requestAnimationFrame(tryStart);

// 4. Resize handler
window.addEventListener('resize', ()=>{
  const changed = syncSize();
  if(changed) drawBg();
});
</script>
