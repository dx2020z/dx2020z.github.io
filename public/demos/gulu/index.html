/* ================= 工具 ================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=arr=>arr[(Math.random()*arr.length)|0];
const d2=(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1;return dx*dx+dy*dy;};

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number') r=[r,r,r,r];
    const [tl,tr,br,bl]=r;
    this.moveTo(x+tl,y);
    this.lineTo(x+w-tr,y); this.arcTo(x+w,y,x+w,y+tr,tr);
    this.lineTo(x+w,y+h-br); this.arcTo(x+w,y+h,x+w-br,y+h,br);
    this.lineTo(x+bl,y+h); this.arcTo(x,y+h,x,y+h-bl,bl);
    this.lineTo(x,y+tl); this.arcTo(x,y,x+tl,y,tl);
    this.closePath();
  };
}

/* ================= 光晕贴图 ================= */
function makeGlow(r,g,b){
  const S=128;
  const c=document.createElement('canvas');
  c.width=c.height=S;
  const x=c.getContext('2d');
  const grd=x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  grd.addColorStop(0,`rgba(${r},${g},${b},1)`);
  grd.addColorStop(0.22,`rgba(${r},${g},${b},0.5)`);
  grd.addColorStop(0.5,`rgba(${r},${g},${b},0.14)`);
  grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=grd; x.fillRect(0,0,S,S);
  return c;
}
const GLOW={
  cyan:makeGlow(168,230,224),
  gold:makeGlow(255,214,130),
  fire:makeGlow(255,122,60),
  white:makeGlow(255,255,255),
  steam:makeGlow(242,233,220)
};
function drawGlow(tex,x,y,r,a){
  if(!tex||!tex.width) return;
  if(!isFinite(x)||!isFinite(y)||!isFinite(r)||!isFinite(a)) return;
  if(r<=0||a<=0) return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=Math.min(1,Math.max(0,a));
  try{ ctx.drawImage(tex,x-r,y-r,r*2,r*2); }catch(e){}
  ctx.restore();
}

/* ================= 锅盖缓存 ================= */
let lidCache=null, lidCacheScene=-1;
function buildLidCache(si){
  if(lidCacheScene===si && lidCache) return;
  const s=SCENES[si]||SCENES[0];
  const R=LID.r, pad=28, size=(R+pad)*2;
  const c=document.createElement('canvas');
  c.width=Math.max(2,Math.ceil(size*DPR));
  c.height=Math.max(2,Math.ceil(size*DPR));
  const g=c.getContext('2d');
  g.scale(DPR,DPR);
  g.translate(R+pad,R+pad);

  const sh=g.createRadialGradient(0,0,R*0.85,0,0,R+pad);
  sh.addColorStop(0,'rgba(0,0,0,0.55)');
  sh.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=sh; g.beginPath(); g.arc(0,0,R+pad,0,TAU); g.fill();

  const grd=g.createRadialGradient(-R*0.32,-R*0.38,R*0.08,0,0,R);
  grd.addColorStop(0,s.lidHi); grd.addColorStop(0.5,s.lid); grd.addColorStop(1,'#141110');
  g.fillStyle=grd; g.beginPath(); g.arc(0,0,R,0,TAU); g.fill();

  for(let i=1;i<=3;i++){
    const rr=R*(0.30+i*0.175);
    g.strokeStyle='rgba(255,255,255,0.05)'; g.lineWidth=1.1;
    g.beginPath(); g.arc(0,0,rr,0,TAU); g.stroke();
    g.strokeStyle='rgba(0,0,0,0.30)'; g.lineWidth=1.1;
    g.beginPath(); g.arc(0,0,rr+1.4,0,TAU); g.stroke();
  }

  g.save();
  g.beginPath(); g.arc(0,0,R-2,0,TAU); g.clip();
  const hl=g.createLinearGradient(-R*0.9,-R*0.9,R*0.4,R*0.4);
  hl.addColorStop(0,'rgba(255,255,255,0.14)');
  hl.addColorStop(0.55,'rgba(255,255,255,0)');
  g.fillStyle=hl; g.fillRect(-R,-R,R*2,R*2);
  g.restore();

  const ring=g.createRadialGradient(0,0,R*0.82,0,0,R);
  ring.addColorStop(0,'rgba(0,0,0,0)'); ring.addColorStop(1,'rgba(0,0,0,0.5)');
  g.fillStyle=ring; g.beginPath(); g.arc(0,0,R,0,TAU); g.fill();

  g.save();
  g.shadowColor='rgba(0,0,0,0.7)'; g.shadowBlur=8; g.shadowOffsetY=2;
  g.fillStyle='#1B1715'; g.beginPath(); g.arc(0,0,22,0,TAU); g.fill();
  g.restore();
  const kg=g.createRadialGradient(-7,-9,1,0,0,22);
  kg.addColorStop(0,'#4E453E'); kg.addColorStop(0.6,'#2A2522'); kg.addColorStop(1,'#161311');
  g.fillStyle=kg; g.beginPath(); g.arc(0,0,20,0,TAU); g.fill();
  g.save();
  g.shadowColor='rgba(0,0,0,0.6)'; g.shadowBlur=5; g.shadowOffsetY=1.5;
  const bg=g.createLinearGradient(0,-6,0,6);
  bg.addColorStop(0,'#4A423B'); bg.addColorStop(0.5,'#332C28'); bg.addColorStop(1,'#1C1917');
  g.fillStyle=bg; g.beginPath(); g.roundRect(-30,-5,60,10,5); g.fill();
  g.restore();
  g.fillStyle='rgba(255,255,255,0.10)';
  g.beginPath(); g.roundRect(-28,-4,56,2.2,1.1); g.fill();

  lidCache={cv:c,size:size}; lidCacheScene=si;
}

/* ================= 背景缓存 ================= */
let bgCache=null;
function buildBG(){
  const W=Math.max(2,Math.ceil(VW*DPR)),H=Math.max(2,Math.ceil(VH*DPR));
  if(!bgCache||bgCache.width!==W||bgCache.height!==H){
    bgCache=document.createElement('canvas');
    bgCache.width=W; bgCache.height=H;
  }
  const g=bgCache.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,VW,VH);
  const s=SCENES[sceneIndex(gameTime)]||SCENES[0];
  const grd=g.createLinearGradient(0,0,0,VH);
  grd.addColorStop(0,s.bgA); grd.addColorStop(1,s.bgB);
  g.fillStyle=grd; g.fillRect(0,0,VW,VH);
}

/* ================= 音频 ================= */
const A={
  ctx:null,master:null,music:null,sfx:null,ready:false,nextNote:0,
  scale:[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99,880.00],
  init(){
    if(this.ready) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=save.muted?0:0.55;
      this.master.connect(this.ctx.destination);
      this.music=this.ctx.createGain(); this.music.gain.value=0.16; this.music.connect(this.master);
      this.sfx=this.ctx.createGain(); this.sfx.gain.value=0.5; this.sfx.connect(this.master);
      this.ready=true;
      this.nextNote=this.ctx.currentTime+0.4;
    }catch(e){this.ready=false;}
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended'){this.ctx.resume().catch(()=>{});} },
  setMute(m){
    save.muted=m; persist();
    if(this.master) this.master.gain.value=m?0:0.55;
  },
  tone(freq,dur,type,gain,dest,delay){
    if(!this.ready||save.muted) return;
    const t0=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(gain,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(dest||this.sfx);
    o.start(t0); o.stop(t0+dur+0.06);
  },
  glide(f1,f2,dur,type,gain){
    if(!this.ready||save.muted) return;
    const t0=this.ctx.currentTime;
    const o=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f1,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(f2,20),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(gain,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(this.sfx);
    o.start(t0); o.stop(t0+dur+0.06);
  },
  noise(dur,gain,freq,q){
    if(!this.ready||save.muted) return;
    const t0=this.ctx.currentTime;
    const len=Math.max(1,Math.ceil(this.ctx.sampleRate*dur));
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*(1-i/len); }
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=q||0.9;
    const g=this.ctx.createGain(); g.gain.value=gain||0.14;
    src.connect(f); f.connect(g); g.connect(this.sfx);
    src.start(t0);
  },
  jump(){ this.glide(300,640,0.13,'sine',0.10); },
  eat(combo,perfect,oscType){
    const i=Math.min(combo,9);
    const base=this.scale[i%5]*(1+Math.floor(i/5));
    this.tone(base*2,0.30,oscType||'triangle',0.16);
    this.tone(base*3,0.22,'sine',0.07,this.sfx,0.02);
    if(perfect){
      this.tone(base*4,0.55,'sine',0.09,this.sfx,0.05);
      this.noise(0.22,0.06,2600,2.5);
    }
  },
  burn(){ this.noise(0.26,0.16,520,0.7); this.glide(210,95,0.28,'sawtooth',0.06); },
  die(){ this.glide(420,58,0.95,'sine',0.22); this.noise(1.0,0.10,900,0.5); },
  ui(){ this.tone(660,0.07,'sine',0.10); },
  condense(){ this.glide(180,880,0.5,'sine',0.14); this.tone(880,0.5,'triangle',0.08,this.sfx,0.35); },
  tick(dt,intensity){
    if(!this.ready||save.muted) return;
    const now=this.ctx.currentTime;
    if(this.nextNote<now) this.nextNote=now+0.2;
    while(this.nextNote<now+0.25){
      const i=rndi(0,4);
      const f=this.scale[i];
      this.tone(f,1.7,'sine',0.075,this.music);
      if(intensity>0.45 && Math.random()<intensity*0.6){
        this.tone(this.scale[i+5]||f*2,1.15,'triangle',0.032,this.music,0.06);
      }
      this.nextNote+=0.62;
    }
  }
};

  drops=[];stains=[];heatSpots=[];oilSpots=[];

  gameTime=0;temp=0;shownTemp=0;combo=0;bestCombo=0;jumps=0;
  receiptT=0;deathT=0;timeScale=1;shake=0;flash=0;
  spawnTimer=0;heatTimer=0;oilTimer=0;noteTimer=0;
  lastEatenId=-1;dropIdSeq=1;
  firstJumpsLeft=save.plays<3?3:0;
  guideAlpha=firstJumpsLeft>0?1:0;

  const L=liq();
  player.maxR=26*L.maxMul;
  player.r=player.maxR*0.62;
  player.x=LID.cx; player.y=LID.cy-LID.r*0.35;
  player.state='idle';
  player.squashX=1; player.squashY=1;
  player.burnT=0; player.oily=0;
  player.blink=0; player.blinkT=rnd(1.5,4);
  player._sodaT=8;
  player.trail=[];
  player.palm=0;

  for(let i=0;i<5;i++) spawnDrop(true);
  buildLidCache(sceneIndex(0));
}

/* ================= 生成 ================= */
function spawnDrop(initial){
  if(drops.length>=MAX_DROPS) return;
  const t=gameTime;
  let tries=0;
  while(tries<24){
    tries++;
    const a=Math.random()*TAU;
    const rad=LID.r*(0.25+Math.random()*0.68);
    const x=LID.cx+Math.cos(a)*rad;
    const y=LID.cy+Math.sin(a)*rad;
    let ok=true;
    for(const d of drops){
      if(d2(x,y,d.x,d.y)<(d.r+18)*(d.r+18)){ok=false;break;}
    }
    if(!ok) continue;
    if(d2(x,y,player.x,player.y)<60*60) continue;
    const sizeScale=clamp(1-t*0.0022,0.62,1);
    const r=rnd(7,13)*sizeScale;
    drops.push({
      id:dropIdSeq++,
      x,y,r,
      vx:0,vy:0,
      phase:Math.random()*TAU,
      born:initial?1:0,
      blinkT:rnd(2,6),blink:0,
      life:0,heartT:0,
      eyeX:0,eyeY:0,
      sleepy:0,
      lookAt:null
    });
    return;
  }
}

/* ================= 粒子 / 效果 ================= */
function addParticle(x,y,vx,vy,life,r,color,drag,grav){
  if(particles.length>=MAX_PARTICLES) return;
  particles.push({x,y,vx,vy,life,maxLife:life,r,color,
    drag:drag===undefined?0.94:drag,grav:grav||0});
}
function burst(x,y,count,color,speed,spread){
  const dir=liq().pdir;
  for(let i=0;i<count;i++){
    if(particles.length>=MAX_PARTICLES) break;
    let vx,vy;
    if(dir==='up'){
      const a=-Math.PI/2+rnd(-0.5,0.5);
      const sp=rnd(speed*0.5,speed*1.1);
      vx=Math.cos(a)*sp; vy=Math.sin(a)*sp;
    }else{
      const a=Math.random()*TAU;
      const sp=rnd(speed*0.4,speed);
      vx=Math.cos(a)*sp; vy=Math.sin(a)*sp;
    }
    addParticle(x,y,vx,vy,rnd(0.3,0.65),rnd(1.4,3.2),color,
      dir==='up'?0.985:0.93, dir==='up'?-30:(spread||120));
  }
}
function addRing(x,y,r0,r1,life,color,width){
  if(rings.length>16) rings.shift();
  rings.push({x,y,r0,r1,life,maxLife:life,color,width:width||2});
}
function addPopup(x,y,text,color,size){
  if(popups.length>14) popups.shift();
  popups.push({x,y,text,color,size:size||16,life:0.95,maxLife:0.95,vy:-44,scale:1.35});
}
function addSteam(x,y,r,vy){
  if(steamPuffs.length>40) steamPuffs.shift();
  steamPuffs.push({x,y,r,vy:vy||-18,life:rnd(1.2,2.2),maxLife:2.2,phase:Math.random()*TAU});
}
function waveHand(x,y){
  const pts=[[-9,-17],[-4.5,-23],[0.5,-25.5],[5.5,-23],[9.5,-16],[-11,-9],[-13,-1]];
  for(const [ox,oy] of pts){
    if(particles.length>=MAX_PARTICLES) break;
    addParticle(x+ox,y+oy,ox*0.22,-16-Math.random()*10,0.78,2.1,'steam',0.97,-6);
  }
}

/* ================= 水渍 ================= */
function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}
function addStain(x,y,r){
  const L=liq();
  const isInk=L.trait==='ink';
  const isSticky=L.trait==='sticky';
  const life=isInk?99999:(isSticky?11:7);
  stains.push({
    x,y,r,life,maxLife:life,flash:0,
    color: isSticky?'#F0C36A':(isInk?'#6C7C9E':'#A8E6E0'),
    permanent:isInk
  });
  if(!isInk && stains.length>26) stains.shift();
  if(stains.length>70) stains.shift();
}

/* ================= 跳跃 ================= */
function doJump(tx,ty){
  if(state!==ST.PLAY) return;
  if(player.state==='jump'||player.state==='dead') return;

  const L=liq();
  let dx=tx-player.x, dy=ty-player.y;
  let dist=Math.hypot(dx,dy);
  if(dist<1){ dx=1;dy=0;dist=1; }
  const minD=48;
  if(dist<minD){ dist=minD; }
  let nx=player.x+dx/dist*dist*L.jumpMul;
  let ny=player.y+dy/dist*dist*L.jumpMul;
  if(player.oily>0){
    const a=Math.atan2(ny-player.y,nx-player.x)+rnd(-0.32,0.32);
    const dd=Math.hypot(nx-player.x,ny-player.y);
    nx=player.x+Math.cos(a)*dd;
    ny=player.y+Math.sin(a)*dd;
    player.oily=0;
  }
  const ddx=nx-LID.cx, ddy=ny-LID.cy;
  const dd=Math.hypot(ddx,ddy)||1;
  const maxD=LID.r-player.r-3;
  if(dd>maxD){
    nx=LID.cx+ddx/dd*maxD;
    ny=LID.cy+ddy/dd*maxD;
  }
  player.fx=player.x; player.fy=player.y;
  player.tx=nx; player.ty=ny;
  const realDist=Math.hypot(nx-player.x,ny-player.y);
  player.jdur=0.20+Math.min(realDist,320)/980;
  player.jt=0;
  player.arc=22+Math.min(realDist,260)*0.13;
  player.state='jump';
  jumps++;

  // 跳跃残影（3 个）
  const col=L.color;
  for(let i=0;i<3;i++){
    if(particles.length>=MAX_PARTICLES) break;
    addParticle(
      player.x+rnd(-3,3),
      player.y+rnd(-3,3),
      rnd(-12,12),rnd(-14,4),
      0.42+i*0.08, player.r*0.65-i*1.4,
      col,0.9,4
    );
  }

  player.squashX=0.72; player.squashY=1.3;
  A.jump();
  burst(player.x,player.y,6,col,90,60);

  if(firstJumpsLeft>0){
    firstJumpsLeft--;
    guideAlpha=firstJumpsLeft>0?1:0.55;
  }
}

/* ================= 落地 ================= */
function land(){
  const L=liq();
  const px=player.tx, py=player.ty;
  let best=null,bestD=Infinity;
  for(const d of drops){
    const dd=Math.hypot(d.x-px,d.y-py);
    if(dd<bestD){bestD=dd;best=d;}
  }
  const tol=player.r+22+(firstJumpsLeft>0?18:0);
  if(best && bestD<tol){ eatDrop(best,bestD,tol); }
  else{ burnLid(); }
}

function eatDrop(d,dist,tol){
  const L=liq();
  combo++;
  if(combo>bestCombo) bestCombo=combo;
  lastEatTime=gameTime;

  const perfect=dist<tol*0.34*(L.trait==='steady'?1.6:1);
  const comboMul=1+Math.min(combo,10)*0.035;
  const perfectMul=(perfect?1.6:1)*L.perfectMul;

  const gain=(9+d.r*1.4)*(1+combo*0.08)*(perfect?1.8:1)*L.gainMul*L.perfectMul;
  temp+=gain;

  const heal=d.r*0.32*comboMul*perfectMul*L.gainMul;
  player.r=Math.min(player.r+heal, player.maxR);
  player.x=d.x; player.y=d.y;
  player.state='idle';
  player.squashX=1.32; player.squashY=0.70;

  // 大珠分裂
  let split=false;
  if(d.r>10 && Math.random()<0.15 && drops.length<MAX_DROPS-2){
    split=true;
  }

  const idx=drops.indexOf(d);
  if(idx>=0) drops.splice(idx,1);

  if(split){
    for(let i=0;i<2;i++){
      const a=Math.random()*TAU;
      const nr=d.r*0.55;
      let sx=d.x+Math.cos(a)*20;
      let sy=d.y+Math.sin(a)*20;
      const dx=sx-LID.cx, dy=sy-LID.cy, dd=Math.hypot(dx,dy);
      const lim=LID.r-nr-6;
      if(dd>lim){ sx=LID.cx+dx/dd*lim; sy=LID.cy+dy/dd*lim; }
      drops.push({
        id:dropIdSeq++, x:sx, y:sy, r:nr,
        vx:0,vy:0, phase:Math.random()*TAU, born:0,
        blinkT:rnd(2,6), blink:0, life:0, heartT:0,
        eyeX:0,eyeY:0, sleepy:0, lookAt:null
      });
    }
  }

  const col=L.color;
  burst(d.x,d.y,perfect?18:11,perfect?'gold':col,perfect?190:130,140);
  addRing(d.x,d.y,player.r*0.6,player.r*3.4,perfect?0.5:0.38,
    perfect?'gold':'cyan',perfect?2.6:1.9);
  addPopup(d.x,d.y-player.r-14,
    perfect?'完美':'+'+Math.round(gain),
    perfect?'#FFD98A':'#EAFBF8', perfect?18:15);
  addStain(d.x,d.y,player.r*1.15);

  for(const s of stains){
    if(s!==stains[stains.length-1] && d2(s.x,s.y,d.x,d.y)<(s.r+22)*(s.r+22)){
      s.flash=0.5; s.life=Math.max(s.life,2.4);
    }
  }

  if(!REDUCE) shake=Math.min(shake+(perfect?4.2:2.2),7);
  flash=Math.max(flash,perfect?0.22:0.10);
  A.eat(combo,perfect,L.osc);

  if(combo>0 && combo%5===0) queueNote();
}

function burnLid(){
  const L=liq();
  combo=0;
  player.state='burn';
  player.burnT=0;
  player.squashX=1.25; player.squashY=0.76;
  player.r-=2.4;

  for(const h of heatSpots){
    if(d2(h.x,h.y,player.tx,player.ty)<h.r*h.r){ player.r-=2.2; break; }
  }
  for(const o of oilSpots){
    if(d2(o.x,o.y,player.tx,player.ty)<o.r*o.r){ player.oily=1; break; }
  }

  burst(player.x,player.y,10,'#FF7A3C',120,200);
  addRing(player.x,player.y,player.r*0.7,player.r*2.6,0.34,'fire',2);
  addPopup(player.x,player.y-player.r-12,'嘶——','#FF9A5C',14);
  addStain(player.x,player.y,player.r*0.9);

  if(!REDUCE) shake=Math.min(shake+3.2,6);
  A.burn();
}

/* ================= 便签 ================= */
function queueNote(){
  const locked=[];
  for(let i=0;i<NOTES.length;i++) if(!save.notes.includes(i)) locked.push(i);
  if(locked.length===0) return;
  const idx=pick(locked);
  noteQueue.push({idx,life:5.5,maxLife:5.5,y:DH*0.80});
}

/* ================= 死亡 / 复活 ================= */
function die(){
  if(player.state==='dead') return;
  player.state='dead';
  deathT=0;
  timeScale=0.16;
  A.die();
  waveHand(player.x,player.y);
  burst(player.x,player.y,26,'steam',110,-30);
  addRing(player.x,player.y,player.r,player.r*5,0.9,'steam',2.2);
  if(!REDUCE) shake=8;
  flash=0.5;
}

function condense(){
  if(state!==ST.OVER) return;
  if(condensedUsed) return;
  condensedUsed=true;
  const L=liq();
  player.r=(player.maxR||26)*0.55;
  player.x=LID.cx;
  player.y=LID.cy-LID.r*0.3;
  player.state='idle';
  player.squashX=0.4; player.squashY=1.6;
  timeScale=1; deathT=0;
  combo=0;
  state=ST.PLAY;
  A.condense();
  addRing(player.x,player.y,4,player.r*4.5,0.8,'cyan',2.6);
  burst(player.x,player.y,20,'#A8E6E0',150,80);
  for(let i=0;i<4;i++) spawnDrop(false);
  flash=0.3;
}

function endGame(){
  state=ST.OVER;
  receiptT=0;
  combo=0;
  flash=0;
  shake=0;
  timeScale=1;
  const isNew=temp>save.best;
  if(isNew) save.best=temp;
  endMsg=isNew ? '新纪录。锅盖记住了你。' : pick([
    '锅盖上还留着你的水渍。',
    '蒸汽往上走了，你没跟上。',
    '下一颗水珠在等你。',
    '火还开着。'
  ]);
  const gained=Math.floor(temp*0.85+bestCombo*12+jumps*1.5);
  save.steam+=gained;
  save.plays++;
  persist();
}

function startGame(){
  A.init(); A.resume();
  condensedUsed=false;
  resetWorld();
  temp=0; shownTemp=0;
  state=ST.PLAY;
  if(save.plays<3 && firstJumpsLeft===0) firstJumpsLeft=3;
  guideAlpha=firstJumpsLeft>0?1:0;
}

/* ================= 更新 ================= */
function update(dt){
  const si=sceneIndex(gameTime);
  buildLidCache(si);
  const L=liq();

  if(state===ST.PLAY){
    gameTime+=dt;

    const target=5+Math.min(9,Math.floor(gameTime/16));
    spawnTimer-=dt;
    if(spawnTimer<=0 && drops.length<target){
      spawnDrop(false);
      spawnTimer=rnd(0.7,1.5);
    }

    if(gameTime>30){
      heatTimer-=dt;
      if(heatTimer<=0){
        heatTimer=rnd(3.2,6.0);
        if(heatSpots.length<4){
          const a=Math.random()*TAU, rad=LID.r*rnd(0.25,0.85);
          heatSpots.push({
            x:LID.cx+Math.cos(a)*rad, y:LID.cy+Math.sin(a)*rad,
            r:rnd(20,32), life:9, maxLife:9, phase:Math.random()*TAU
          });
        }
      }
    }
    if(gameTime>80){
      oilTimer-=dt;
      if(oilTimer<=0){
        oilTimer=rnd(5.5,9.0);
        if(oilSpots.length<3){
          const a=Math.random()*TAU, rad=LID.r*rnd(0.3,0.8);
          oilSpots.push({
            x:LID.cx+Math.cos(a)*rad, y:LID.cy+Math.sin(a)*rad,
            r:rnd(18,26), life:11, maxLife:11
          });
        }
      }
    }

    noteTimer-=dt;
    if(noteTimer<=0 && noteQueue.length===0 && gameTime>12){
      noteTimer=rnd(16,30);
      queueNote();
    }

    // 被动蒸发
    const drainRate=(2.6+gameTime*0.018)*L.drainMul;
    player.r-=dt*drainRate;

    // 灼烧
    if(player.state==='burn'){
      player.burnT+=dt;
      const rate=4.5+player.burnT*6.5;
      player.r-=dt*rate*L.drainMul;
      if(Math.random()<dt*20) addSteam(player.x+rnd(-6,6),player.y-4,3,-26);
      if(player.burnT>0.35 && Math.random()<dt*6){
        burst(player.x,player.y,2,'#FF9A5C',60,180);
      }
    }

    // 体积上限
    if(player.r>player.maxR) player.r=player.maxR;

    // 牛乳：低血量恐慌
    if(L.trait==='panic' && player.r/player.maxR<0.30){
      if(!REDUCE) shake=Math.max(shake, 1.4+Math.sin(performance.now()/90)*0.8);
    }

    // 掌印浮现（90 秒后）
    if(gameTime>90) player.palm=Math.min(1,player.palm+dt*0.15);

    // 死亡判定
    if(player.r<4.2) die();

    // 苏打水自动跳
    if(L.trait==='auto'){
      player._sodaT-=dt;
      if(player._sodaT<=0){
        player._sodaT=8;
        if(player.state==='idle'&&drops.length){
          let best=null,bd=Infinity;
          for(const d of drops){
            const dd=d2(d.x,d.y,player.x,player.y);
            if(dd<bd&&dd>50*50){bd=dd;best=d;}
          }
          if(best) doJump(best.x,best.y);
        }
      }
    }

    // 连击冷却
    if(combo>0 && gameTime-lastEatTime>3.2) combo=0;
  }

  // 跳跃动画
  if(player.state==='jump'){
    player.jt+=dt/player.jdur;
    if(player.jt>=1){
      player.jt=1;
      player.x=player.tx; player.y=player.ty;
      land();
    }else{
      const t=player.jt;
      const e=t*t*(3-2*t);
      player.x=lerp(player.fx,player.tx,e);
      player.y=lerp(player.fy,player.ty,e)-Math.sin(t*Math.PI)*player.arc;
    }
  }

  // 挤压回弹
  player.squashX=lerp(player.squashX,1,1-Math.pow(0.0006,dt));
  player.squashY=lerp(player.squashY,1,1-Math.pow(0.0006,dt));

  // 眨眼
  player.blinkT-=dt;
  if(player.blinkT<=0){ player.blink=0.14; player.blinkT=rnd(2.2,5.5); }
  if(player.blink>0) player.blink-=dt;

  // 眼睛追踪
  let near=null,nd=Infinity;
  for(const d of drops){
    const dd=d2(d.x,d.y,player.x,player.y);
    if(dd<nd){nd=dd;near=d;}
  }
  if(near){
    const ang=Math.atan2(near.y-player.y,near.x-player.x);
    player.eyeX=lerp(player.eyeX,Math.cos(ang)*0.9,0.08);
    player.eyeY=lerp(player.eyeY,Math.sin(ang)*0.9,0.08);
  }else{
    player.eyeX=lerp(player.eyeX,0,0.06);
    player.eyeY=lerp(player.eyeY,0,0.06);
  }

  // NPC 水珠
  const driftSpeed = gameTime>10 ? clamp((gameTime-10)*0.22,0,18) : 0;
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.life+=dt;
    d.phase+=dt*0.6;

    if(driftSpeed>0){
      const dir=d.phase*0.7+d.id*1.7;
      d.vx=Math.cos(dir)*driftSpeed;
      d.vy=Math.sin(dir*1.3)*driftSpeed;
      const steps=2;
      for(let s=0;s<steps;s++){
        d.x+=d.vx*dt/steps;
        d.y+=d.vy*dt/steps;
        const dx=d.x-LID.cx, dy=d.y-LID.cy;
        const dd=Math.hypot(dx,dy);
        const lim=LID.r-d.r-6;
        if(dd>lim){
          d.x=LID.cx+dx/dd*lim;
          d.y=LID.cy+dy/dd*lim;
        }
      }
    }

    d.blinkT-=dt;
    if(d.blinkT<=0){ d.blink=0.14; d.blinkT=rnd(2.5,7); }
    if(d.blink>0) d.blink-=dt;

    if(d.life>20 && Math.random()<dt*0.12) d.sleepy=1.2;
    if(d.sleepy>0) d.sleepy-=dt;
    if(d.heartT>0) d.heartT-=dt;

    // 眼睛看玩家
    const ang=Math.atan2(player.y-d.y,player.x-d.x);
    d.eyeX=lerp(d.eyeX,Math.cos(ang)*0.9,0.06);
    d.eyeY=lerp(d.eyeY,Math.sin(ang)*0.9,0.06);

    if(gameTime>50){
      d.r-=dt*0.12;
      if(d.r<3.2){ drops.splice(i,1); continue; }
    }
    for(const h of heatSpots){
      if(d2(h.x,h.y,d.x,d.y)<(h.r+d.r)*(h.r+d.r)){ d.r-=dt*0.55; }
    }
    if(d.r<3.2){ drops.splice(i,1); continue; }
  }

  // 水珠互看（彩蛋）
  for(let i=0;i<drops.length;i++){
    const a=drops[i];
    for(let j=i+1;j<drops.length;j++){
      const b=drops[j];
      if(d2(a.x,a.y,b.x,b.y)<60*60){
        const ang=Math.atan2(b.y-a.y,b.x-a.x);
        a.eyeX=lerp(a.eyeX,Math.cos(ang)*0.9,0.04);
        a.eyeY=lerp(a.eyeY,Math.sin(ang)*0.9,0.04);
        const ang2=ang+Math.PI;
        b.eyeX=lerp(b.eyeX,Math.cos(ang2)*0.9,0.04);
        b.eyeY=lerp(b.eyeY,Math.sin(ang2)*0.9,0.04);
      }
    }
  }

  // 热斑 / 油滴 / 水渍 / 粒子 / 光环 / 飘字 / 蒸汽 / 便签
  for(let i=heatSpots.length-1;i>=0;i--){
    const h=heatSpots[i]; h.life-=dt; h.phase+=dt*2.4;
    if(h.life<=0) heatSpots.splice(i,1);
  }
  for(let i=oilSpots.length-1;i>=0;i--){
    const o=oilSpots[i]; o.life-=dt;
    if(o.life<=0) oilSpots.splice(i,1);
  }
  for(let i=stains.length-1;i>=0;i--){
    const s=stains[i]; s.life-=dt;
    if(s.flash>0) s.flash-=dt;
    if(s.life<=0 && !s.permanent) stains.splice(i,1);
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=p.grav*dt;
    const dr=Math.pow(p.drag,dt*60);
    p.vx*=dr; p.vy*=dr;
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i]; r.life-=dt;
    if(r.life<=0) rings.splice(i,1);
  }
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i];
    p.life-=dt;
    if(p.life<=0){ popups.splice(i,1); continue; }
    p.y+=p.vy*dt;
    p.vy*=Math.pow(0.94,dt*60);
    p.scale=lerp(p.scale,1,1-Math.pow(0.0002,dt));
  }
  for(let i=steamPuffs.length-1;i>=0;i--){
    const s=steamPuffs[i];
    s.life-=dt;
    if(s.life<=0){ steamPuffs.splice(i,1); continue; }
    s.y+=s.vy*dt;
    s.x+=Math.sin(s.phase+s.life*2)*8*dt;
    s.r+=6*dt;
  }
  for(let i=noteQueue.length-1;i>=0;i--){
    const n=noteQueue[i];
    n.life-=dt;
    if(n.life<=0){
      if(!save.notes.includes(n.idx)){ save.notes.push(n.idx); persist(); }
      noteQueue.splice(i,1);
    }
  }

  // 死亡慢动作
  if(player.state==='dead'){
    deathT+=dt;
    timeScale=lerp(timeScale,1,1-Math.pow(0.02,dt));
    if(deathT>1.1 && state===ST.PLAY) endGame();
  }

  shake*=Math.pow(0.0015,dt);
  if(shake<0.05) shake=0;
  flash*=Math.pow(0.0008,dt);
  if(guideAlpha>0 && state===ST.PLAY && firstJumpsLeft<=0){
    guideAlpha=Math.max(0,guideAlpha-dt*0.5);
  }

  if(state===ST.PLAY) A.tick(dt, clamp(combo/14,0,1));
  if(state===ST.OVER) receiptT=Math.min(1,receiptT+dt*0.85);
}

function drawFire(warm){
  const t=performance.now()/1000;
  const cx=DW/2, by=DH+10;
  const R=Math.max(DW,DH)*0.85;
  const flick=1+Math.sin(t*3.1)*0.04+Math.sin(t*7.7)*0.025;
  ctx.save();
  const g=ctx.createRadialGradient(cx,by,0,cx,by,R*flick);
  const a=0.10+warm*0.32;
  g.addColorStop(0,`rgba(255,${120+warm*60|0},60,${a})`);
  g.addColorStop(0.35,`rgba(255,90,40,${a*0.42})`);
  g.addColorStop(1,'rgba(255,60,20,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(cx,by,R*flick,0,TAU); ctx.fill();
  ctx.restore();
  if(warm>0.15){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<7;i++){
      const fx=DW*(0.12+i*0.125);
      const h=(16+warm*40)*(0.7+Math.sin(t*4+i*1.7)*0.3);
      const w=7+warm*7;
      const gg=ctx.createLinearGradient(fx,DH,fx,DH-h);
      gg.addColorStop(0,`rgba(255,140,60,${0.10+warm*0.28})`);
      gg.addColorStop(1,'rgba(255,200,120,0)');
      ctx.fillStyle=gg;
      ctx.beginPath();
      ctx.moveTo(fx-w,DH);
      ctx.quadraticCurveTo(fx-w*0.5,DH-h*0.6,fx,DH-h);
      ctx.quadraticCurveTo(fx+w*0.5,DH-h*0.6,fx+w,DH);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

    ctx.beginPath();
    ctx.moveTo(catx+6,cy-8); ctx.lineTo(catx+7.5,cy-13); ctx.lineTo(catx+10,cy-8);
    ctx.moveTo(catx+10,cy-8); ctx.lineTo(catx+12.5,cy-13); ctx.lineTo(catx+14,cy-8);

    ctx.beginPath();

function drawStains(){
  for(const s of stains){
    const a=s.permanent?0.55:clamp(s.life/s.maxLife,0,1)*0.32;
    const grow=1+(s.permanent?0:(1-clamp(s.life/s.maxLife,0,1))*0.25);
    ctx.save();
    ctx.globalAlpha=a*(s.flash>0?2.2:1);
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*grow);
    const rgb=hexToRgb(s.color||'#A8E6E0');
    g.addColorStop(0,`rgba(${rgb},${s.flash>0?0.9:0.55})`);
    g.addColorStop(0.7,`rgba(${rgb},0.25)`);
    g.addColorStop(1,`rgba(${rgb},0)`);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*grow,0,TAU); ctx.fill();
    ctx.restore();
  }
}

function shade(hex,amt){
  let r=parseInt(hex.slice(1,3),16);
  let g=parseInt(hex.slice(3,5),16);
  let b=parseInt(hex.slice(5,7),16);
  if(amt>0){ r=lerp(r,255,amt); g=lerp(g,255,amt); b=lerp(b,255,amt); }
  else{ r=lerp(r,0,-amt); g=lerp(g,0,-amt); b=lerp(b,0,-amt); }
  return `rgb(${r|0},${g|0},${b|0})`;
}

function drawDrop(d,isPlayer){
  const t=performance.now()/1000;
  const L=liq();
  const col=isPlayer?L.color:'#9FDCD6';
  const r=d.r;

  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.beginPath(); ctx.ellipse(d.x,d.y+r*0.72,r*0.86,r*0.32,0,0,TAU); ctx.fill();
  ctx.restore();

  drawGlow(GLOW.cyan, d.x,d.y,r*(isPlayer?3.4:2.4), isPlayer?0.20:0.10);

  const wob=isPlayer?Math.sin(t*5+d.x*0.1)*0.03:0;
  const sx=(isPlayer?player.squashX:1)*(1+wob);
  const sy=(isPlayer?player.squashY:1)*(1-wob);

  ctx.save();
  ctx.translate(d.x,d.y);
  ctx.scale(sx,sy);

  const g=ctx.createRadialGradient(-r*0.35,-r*0.45,r*0.05,0,0,r*1.05);
  g.addColorStop(0,'rgba(255,255,255,0.95)');
  g.addColorStop(0.28,col);
  g.addColorStop(0.8,shade(col,-0.35));
  g.addColorStop(1,shade(col,-0.62));
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();

  ctx.globalAlpha=0.9;
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.arc(-r*0.34,-r*0.42,r*0.19,0,TAU); ctx.fill();
  ctx.globalAlpha=0.5;
  ctx.beginPath(); ctx.arc(-r*0.10,-r*0.58,r*0.09,0,TAU); ctx.fill();

  ctx.globalAlpha=0.35;
  ctx.strokeStyle='rgba(255,255,255,0.55)';
  ctx.lineWidth=Math.max(1,r*0.11);
  ctx.beginPath(); ctx.arc(0,0,r*0.93,0.55,1.45); ctx.stroke();

  // 金环
  if(isPlayer && L.trait==='noble'){
    ctx.globalAlpha=0.7;
    ctx.strokeStyle='rgba(255,217,138,0.85)';
    ctx.lineWidth=Math.max(1,r*0.14);
    ctx.beginPath(); ctx.arc(0,0,r*1.10,0,TAU); ctx.stroke();
  }

  // 眼睛
  ctx.globalAlpha=1;
  const blink=isPlayer?player.blink:(d.blink||0);
  const eyeOpen=blink>0?0.12:1;
  const ex=isPlayer?player.eyeX:(d.eyeX||0);
  const ey=isPlayer?player.eyeY:(d.eyeY||0);
  const er=Math.max(1.1,r*0.115);
  const off=r*0.30;

  let grow=1;
  if(!isPlayer && d2(d.x,d.y,player.x,player.y)<95*95) grow=1.22;

  const eyeShape=L.eye;
  let ewr=er*grow, ehr=er*grow*eyeOpen;
  if(eyeShape==='wide'){ ewr*=1.30; ehr*=1.30; }
  else if(eyeShape==='squint'){ ehr*=0.42; }
  if(isPlayer && L.trait==='panic' && player.maxR && player.r/player.maxR<0.30){
    ewr*=1.5; ehr*=1.5;
  }
  const eyeColor = eyeShape==='dark' ? 'rgba(5,8,12,0.95)' : 'rgba(20,30,35,0.88)';

  ctx.fillStyle=eyeColor;
  for(const s of [-1,1]){
    const px=s*off+ex*r*0.16;
    const py=-r*0.06+ey*r*0.16;
    ctx.beginPath();
    ctx.ellipse(px,py,ewr,ehr,0,0,TAU);
    ctx.fill();
    if(eyeOpen>0.5){
      ctx.fillStyle='rgba(255,255,255,0.95)';
      ctx.beginPath();
      ctx.arc(px-ewr*0.32,py-ehr*0.32,er*0.34*grow,0,TAU);
      ctx.fill();
      ctx.fillStyle=eyeColor;
    }
  }
  ctx.restore();

  if(!isPlayer && d.sleepy>0){
    ctx.save();
    ctx.globalAlpha=clamp(d.sleepy,0,1)*0.7;
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(d.x+r*0.9,d.y-r*0.9-r*0.2*(1-d.sleepy),r*0.22,0,TAU);
    ctx.fill();
    ctx.restore();
  }
  if(!isPlayer && d.heartT>0){
    const s=clamp(d.heartT/1.0,0,1);
    ctx.save();
    ctx.globalAlpha=s;
    ctx.translate(d.x, d.y-r-8-(1-s)*14);
    ctx.scale(0.6+s*0.4,0.6+s*0.4);
    ctx.fillStyle='#FF7D9C';
    ctx.beginPath();
    ctx.moveTo(0,3);
    ctx.bezierCurveTo(-6,-3,-6,-9,0,-6);
    ctx.bezierCurveTo(6,-9,6,-3,0,3);
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    const a=clamp(p.life/p.maxLife,0,1);
    ctx.save();
    ctx.globalAlpha=a*0.9;
    if(p.color==='steam'){
      drawGlow(GLOW.steam,p.x,p.y,p.r*3.2,a*0.5);
      ctx.fillStyle='rgba(242,233,220,0.85)';
    }else if(p.color==='gold'){
      drawGlow(GLOW.gold,p.x,p.y,p.r*2.6,a*0.6);
      ctx.fillStyle='#FFD98A';
    }else if(p.color==='fire'){
      drawGlow(GLOW.fire,p.x,p.y,p.r*2.6,a*0.6);
      ctx.fillStyle='#FF8A4C';
    }else{
      ctx.fillStyle=p.color;
    }
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*a,0,TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawRings(){
  for(const r of rings){
    const t=1-r.life/r.maxLife;
    const rad=lerp(r.r0,r.r1,t);
    const a=(1-t)*0.85;
    const col=r.color==='gold'?'255,217,138':
             r.color==='fire'?'255,140,70':
             r.color==='steam'?'242,233,220':'168,230,224';
    ctx.save();
    ctx.globalAlpha=a;
    ctx.strokeStyle=`rgba(${col},1)`;
    ctx.lineWidth=r.width*(1-t*0.55);
    ctx.beginPath(); ctx.arc(r.x,r.y,rad,0,TAU); ctx.stroke();
    ctx.restore();
    drawGlow(
      r.color==='gold'?GLOW.gold:
      r.color==='fire'?GLOW.fire:
      r.color==='steam'?GLOW.steam:GLOW.cyan,
      r.x,r.y,rad*1.5,a*0.22);
  }
}

function drawPopups(){
  for(const p of popups){

    ctx.save();
    ctx.globalAlpha=Math.min(1,a*1.6);

}

function drawSteam(){

function drawThermo(){
  const gx=20+SAL/SCALE, gy=52+SAT/SCALE;
  const gw=13, gh=Math.min(200,DH*0.34);
  const maxT=Math.max(320,temp*1.28);
  const pct=clamp(temp/maxT,0,1);
  const t=performance.now()/1000;

  ctx.save();
  ctx.fillStyle='rgba(20,17,15,0.55)';
  ctx.beginPath(); ctx.roundRect(gx-3,gy-3,gw+6,gh+22,6); ctx.fill();

  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.roundRect(gx,gy,gw,gh,gw/2); ctx.fill();

  const fillH=(gh-4)*pct;
  const col=temp>1000?'#FF7A3C':temp>400?'#FFB070':'#FFD98A';
  const mg=ctx.createLinearGradient(gx,gy+gh,gx,gy);
  mg.addColorStop(0,col); mg.addColorStop(1,'#FF5C2E');
  ctx.fillStyle=mg;
  ctx.beginPath();
  ctx.roundRect(gx+2,gy+gh-2-fillH,gw-4,Math.max(2,fillH),gw/2-1);
  ctx.fill();

  ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(gx+gw/2,gy+gh+8,gw*0.85,0,TAU); ctx.fill();
  drawGlow(GLOW.fire,gx+gw/2,gy+gh+8,gw*3.2,0.22);

  ctx.strokeStyle='rgba(242,233,220,0.28)'; ctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const yy=gy+gh-(gh-4)*(i/5);
    ctx.beginPath();
    ctx.moveTo(gx+gw+1,yy);
    ctx.lineTo(gx+gw+(i%2===0?5:3),yy);
    ctx.stroke();
  }
  if(temp>900){
    for(let i=0;i<2;i++){
      const ph=(t*0.9+i*0.5)%1;
      ctx.globalAlpha=(1-ph)*0.3;
      ctx.fillStyle='#F2E9DC';
      ctx.beginPath();
      ctx.arc(gx+gw/2+Math.sin(ph*6+i)*3, gy-6-ph*22, 2.6+ph*3.4,0,TAU);
      ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  ctx.font='500 15px "DM Mono",ui-monospace,monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(242,233,220,0.92)';
  ctx.fillText(Math.round(shownTemp)+'°', gx-1, gy+gh+18);
  ctx.restore();
}

function drawCombo(){
  if(combo<2) return;
  const t=performance.now()/1000;
  const n=Math.min(combo,18);
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+(i-(n-1)/2)*0.19;
    const rad=LID.r+13+Math.sin(t*3+i*0.7)*2;
    const bx=LID.cx+Math.cos(a)*rad;
    const by=LID.cy+Math.sin(a)*rad;
    const s=2.6+Math.sin(t*4+i)*0.7;
    ctx.save();
    ctx.globalAlpha=0.75;
    ctx.fillStyle='#A8E6E0';
    ctx.beginPath(); ctx.arc(bx,by,s,0,TAU); ctx.fill();
    ctx.globalAlpha=0.5;
    ctx.fillStyle='#FFFFFF';
    ctx.beginPath(); ctx.arc(bx-s*0.3,by-s*0.3,s*0.35,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.font='500 14px "DM Mono",ui-monospace,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(168,230,224,0.85)';
  ctx.fillText('×'+combo, LID.cx, LID.cy+LID.r+34);
  ctx.restore();
}

function drawGuide(){

function wrapText(text,x,y,maxW,lh){
  let line='';
  for(let i=0;i<text.length;i++){
    const test=line+text[i];
    if(ctx.measureText(test).width>maxW && line){
      ctx.fillText(line,x,y); y+=lh; line=text[i];
    }else line=test;
  }
  if(line) ctx.fillText(line,x,y);
}

function screenOver(){
  const p=receiptT;
  ctx.save();
  ctx.fillStyle='rgba(10,8,6,0.86)';
  ctx.fillRect(0,0,DW,DH);

  const w=Math.min(300,DW-48);
  const x=DW/2-w/2;
  const y0=DH*0.13;
  const hMax=Math.min(DH*0.62,440);
  const h=hMax*Math.min(1,p*1.15);

  ctx.save();
  ctx.beginPath();
  const teeth=9, tw=w/teeth;
  ctx.moveTo(x,y0);
  ctx.lineTo(x+w,y0);
  ctx.lineTo(x+w,y0+h);
  for(let i=teeth;i>0;i--){
    const xx=x+i*tw;
    ctx.lineTo(xx-tw/2,y0+h+7);
    ctx.lineTo(xx-tw,y0+h);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(242,233,220,0.96)';
  ctx.fill();
  ctx.clip();

  ctx.globalAlpha=0.05;
  ctx.fillStyle='#14110F';
  for(let yy=y0;yy<y0+h;yy+=4) ctx.fillRect(x,yy,w,1.2);
  ctx.globalAlpha=1;

  ctx.translate(x+18,y0+20);
  const cw=w-36;
  const mono='500 13px "DM Mono",ui-monospace,monospace';
  const serif='400 13px "Noto Serif SC","Songti SC",serif';

  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='#14110F';
  ctx.font='600 15px "Noto Serif SC","Songti SC",serif';
  ctx.fillText('咕 噜 · 厨 房 小 票', 6, 0);

  ctx.font=mono;
  ctx.fillStyle='rgba(20,17,15,0.45)';
  let dash='';
  while(ctx.measureText(dash).width<cw-12) dash+='-';
  ctx.fillText(dash,0,26);

  let ly=44;
  const line=(k,v,big)=>{
    ctx.font=big?'500 19px "DM Mono",ui-monospace,monospace':mono;
    ctx.fillStyle='#14110F';
    ctx.fillText(k,0,ly);
    if(v!==undefined){
      ctx.textAlign='right';
      ctx.fillText(v,cw,ly);
      ctx.textAlign='left';
    }
    ly+=big?30:22;
  };

  if(h>70)  line('最高温度', Math.round(temp)+'°C');
  if(h>100) line('存活', gameTime.toFixed(1)+' 秒');
  if(h>122) line('跳跃', jumps+' 次');
  if(h>144) line('最长咕噜', bestCombo+' 连');
  if(h>172){
    ctx.font=mono; ctx.fillStyle='rgba(20,17,15,0.45)';
    ctx.fillText(dash,0,ly); ly+=22;
  }
  if(h>200){
    ctx.fillStyle='#14110F';
    ctx.font='600 15px "Noto Serif SC","Songti SC",serif';
    ctx.fillText('本次共得水汽', 0, ly); ly+=26;
    ctx.font='500 30px "DM Mono",ui-monospace,monospace';
    ctx.fillStyle='#C2521E';
    ctx.fillText('+'+Math.floor(temp*0.85+bestCombo*12+jumps*1.5), 0, ly);
    ly+=40;
  }
  if(h>256){
    ctx.font=serif;
    ctx.fillStyle='rgba(20,17,15,0.72)';
    wrapText(endMsg,0,ly,cw,18);
  }
  ctx.restore();

  if(p<0.95){
    ctx.save();
    ctx.globalAlpha=0.9;
    ctx.fillStyle='rgba(242,233,220,0.12)';
    ctx.fillRect(x,y0+h+8,w,20);
    ctx.restore();
  }

  const by=y0+hMax+42;
  const r=26;
  const canCondense=!condensedUsed;
  const n=canCondense?4:3;
  const gap=Math.min(96,(DW-60)/n);
  const startX=DW/2-(n-1)*gap/2;
  const labels=canCondense?['冷凝','再跳','笔记','首页']:['再跳','笔记','首页'];
  const ids=canCondense?['condense','restart','codex2','home2']:['restart','codex2','home2'];
  for(let i=0;i<n;i++){
    if(by+r+16>SAB/SCALE+DH) break;
    knobButton(startX+i*gap, by, r, labels[i], '',
      ids[i]==='condense'?'rgba(255,217,138,0.7)':null);
    uiButtons.push({id:ids[i],x:startX+i*gap,y:by,r,keep:true});
  }
  ctx.restore();
}

    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font='600 14px "Noto Serif SC","Songti SC",serif';
    ctx.fillStyle=unlocked?'rgba(242,233,220,0.95)':'rgba(242,233,220,0.55)';
    ctx.fillText(L.name, x+46, y+rowH/2-6);
    ctx.font='400 11px "Noto Serif SC","Songti SC",serif';
    ctx.fillStyle='rgba(242,233,220,0.45)';
    ctx.fillText(L.desc, x+46, y+rowH/2+10);

    ctx.textAlign='right';
    if(!unlocked){
      ctx.font='500 13px "DM Mono",ui-monospace,monospace';
      ctx.fillStyle=afford?'rgba(255,217,138,0.95)':'rgba(242,233,220,0.35)';
      ctx.fillText(L.cost+'', x+w-16, y+rowH/2);
    }else if(active){
      ctx.font='400 12px "Noto Serif SC","Songti SC",serif';
      ctx.fillStyle='rgba(168,230,224,0.9)';
      ctx.fillText('正在用', x+w-16, y+rowH/2);
    }else{
      ctx.font='400 12px "Noto Serif SC","Songti SC",serif';
      ctx.fillStyle='rgba(242,233,220,0.5)';
      ctx.fillText('选用', x+w-16, y+rowH/2);
    }
    ctx.restore();

    uiButtons.push({id:'liq:'+key,x:x+w/2,y:y+rowH/2,r:w/2,h:rowH-8,rect:true,keep:true});
  }

  const by=DH-46-SAB/SCALE;
  knobButton(DW/2, by, 24, '回去', '', null);
  uiButtons.push({id:'back2',x:DW/2,y:by,r:24,keep:true});
  ctx.restore();
}

/* ================= 主渲染 ================= */
function render(){
  // 强制重置所有绘图状态
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.filter='none';
  ctx.shadowBlur=0;
  ctx.shadowColor='rgba(0,0,0,0)';
  ctx.shadowOffsetX=0;
  ctx.shadowOffsetY=0;
  ctx.setLineDash([]);
  ctx.lineDashOffset=0;
  ctx.lineWidth=1;
  ctx.lineCap='butt';
  ctx.lineJoin='miter';

  ctx.setTransform(DPR*SCALE,0,0,DPR*SCALE,0,0);

  const si=sceneIndex(gameTime);
  const s=SCENES[si];
  const t=performance.now()/1000;

  drawBG();

  ctx.save();
  if(shake>0 && !REDUCE){
    ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  }

  drawFire(s.warm);
  drawWindow();
  drawSpoon();
  drawLid();

  if(si>=3){
    ctx.save();
    ctx.globalAlpha=0.10+(si===3?0.06:0);
    ctx.translate(LID.cx,LID.cy);
    ctx.rotate(t*(si===3?0.18:0.08));
    ctx.strokeStyle=s.accent;
    ctx.lineWidth=1.2;
    for(let i=1;i<=2;i++){
      ctx.beginPath();
      ctx.arc(0,0,LID.r*(0.42+i*0.20),0,TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawHeatSpots();
  drawOilSpots();
  drawStains();

  for(const d of drops) drawDrop(d,false);

  if(player.state!=='dead' || deathT<0.25){
    drawDrop(player,true);
    if(state===ST.PLAY) drawPlayerGauge();
  }

  drawParticles();
  drawRings();
  drawSteam();
  drawPopups();

  ctx.restore();

  if(flash>0.01){
    ctx.save();
    ctx.globalAlpha=Math.min(flash,0.5);
    ctx.fillStyle='#EAFBF8';
    ctx.fillRect(0,0,DW,DH);
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha=0.06+s.warm*0.10;
  ctx.fillStyle=s.accent;
  ctx.fillRect(0,0,DW,DH);
  ctx.restore();

  drawVignette();

  uiButtons.length=0;

  if(state===ST.PLAY){
    drawTopInfo();
    drawThermo();
    drawCombo();
    drawGuide();
    drawTopButtons();
    drawNotes();
  }else if(state===ST.PAUSE){
    drawThermo();
    drawTopButtons();
    screenPause();
  }else if(state===ST.TITLE){
    screenTitle();
  }else if(state===ST.OVER){
    screenOver();
    drawTopButtons();
    drawNotes();
  }else if(state===ST.CODEX){
    screenCodex();
  }else if(state===ST.SHOP){
    screenShop();
  }

  if(BOT) drawBotHUD();
}

/* ================= Bot ================= */
const BOT=false; // ← 想开自动测试改成 true
let botFps=60, botFrames=0, botAcc=0;
function drawBotHUD(){
  ctx.save();
  ctx.font='500 12px "DM Mono",ui-monospace,monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  const x=DW-34-90, y=DH-SAB/SCALE-70;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.roundRect(x-8,y-6,110,58,5); ctx.fill();
  ctx.fillStyle='rgba(168,230,224,0.95)';
  ctx.fillText('FPS  '+botFps.toFixed(0), x, y);
  ctx.fillText('TIME '+gameTime.toFixed(1)+'s', x, y+16);
  ctx.fillText('TEMP '+Math.round(temp)+'°', x, y+32);
  ctx.restore();
}
function botThink(){
  if(state!==ST.PLAY) return;
  if(player.state!=='idle'&&player.state!=='burn') return;
  if(drops.length===0) return;
  const burnPenalty=player.state==='burn'?1e6:0;
  let best=null,bestScore=-Infinity;
  for(const d of drops){
    const dist=Math.hypot(d.x-player.x,d.y-player.y);
    if(dist<40) continue;
    let score=-dist*0.55+d.r*4.5;
    for(const h of heatSpots){
      if(d2(h.x,h.y,d.x,d.y)<(h.r+30)*(h.r+30)) score-=260;
    }
    for(const o of oilSpots){
      if(d2(o.x,o.y,d.x,d.y)<(o.r+22)*(o.r+22)) score-=120;
    }
    const edge=Math.hypot(d.x-LID.cx,d.y-LID.cy)/LID.r;
    if(edge>0.82) score-=100;
    score-=burnPenalty*0.00001;
    if(score>bestScore){bestScore=score;best=d;}
  }
  if(!best){
    const a=Math.random()*TAU;
    doJump(LID.cx+Math.cos(a)*LID.r*0.4, LID.cy+Math.sin(a)*LID.r*0.4);
    return;
  }
  doJump(best.x+rnd(-6,6), best.y+rnd(-6,6));
}

/* ================= 输入 ================= */
function logicalFromEvent(e){
  const rect=canvas.getBoundingClientRect();
  return {x:(e.clientX-rect.left)/SCALE, y:(e.clientY-rect.top)/SCALE};
}
function hitButton(pt){
  for(let i=uiButtons.length-1;i>=0;i--){
    const b=uiButtons[i];
    if(b.rect){
      if(Math.abs(pt.x-b.x)<=b.r&&Math.abs(pt.y-b.y)<=b.h/2) return b;
    }else{
      if(d2(pt.x,pt.y,b.x,b.y)<=b.r*b.r) return b;
    }
  }
  return null;
}
function onTap(pt){
  const b=hitButton(pt);
  if(b){ handleButton(b.id); return true; }
  if(state===ST.TITLE){ startGame(); return true; }
  if(state===ST.PLAY){
    if(player.state==='idle'||player.state==='burn'){
      doJump(pt.x,pt.y);
    }
    return true;
  }
  return false;
}
function handleButton(id){
  A.init(); A.resume(); A.ui();
  if(id==='pause'){
    if(state===ST.PLAY) state=ST.PAUSE;
    else if(state===ST.PAUSE) state=ST.PLAY;
    else if(state===ST.OVER){ state=ST.TITLE; resetWorld(); }
    return;
  }
  if(id==='mute'){ A.setMute(!save.muted); return; }
  if(id==='resume'){ state=ST.PLAY; return; }
  if(id==='restart'){ startGame(); return; }
  if(id==='home'||id==='home2'){ state=ST.TITLE; resetWorld(); return; }
  if(id==='codex'||id==='codex2'){ prevState=state; state=ST.CODEX; codexScroll=0; return; }
  if(id==='shop'){ prevState=state; state=ST.SHOP; return; }
  if(id==='back'){ state=prevState===ST.SHOP?ST.SHOP:ST.TITLE; return; }
  if(id==='back2'){ state=ST.TITLE; return; }
  if(id==='condense'){ condense(); return; }
  if(id.startsWith('liq:')){
    const key=id.slice(4);
    const L=LIQUIDS[key];
    if(!L) return;
    if(save.unlocked.includes(key)){
      save.liquid=key; persist();
    }else if(save.steam>=L.cost){
      save.steam-=L.cost;
      save.unlocked.push(key);
      save.liquid=key;
      persist();
    }
    return;
  }
}

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  A.init(); A.resume();
  const pt=logicalFromEvent(e);
  onTap(pt);
},{passive:false});

window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    A.init(); A.resume();
    if(state===ST.TITLE){ startGame(); return; }
    if(state===ST.PLAY&&player.state==='idle'){
      let best=null,bd=Infinity;
      for(const d of drops){
        const dd=d2(d.x,d.y,player.x,player.y);
        if(dd<bd&&dd>40*40){bd=dd;best=d;}
      }
      if(best) doJump(best.x,best.y);
      else doJump(LID.cx,LID.cy);
    }
    return;
  }
  if(e.code==='KeyP'||e.code==='Escape'){
    if(state===ST.PLAY) state=ST.PAUSE;
    else if(state===ST.PAUSE) state=ST.PLAY;
    return;
  }
  if(e.code==='KeyM'){ A.setMute(!save.muted); return; }
});

/* 图鉴滚动 */
let dragY=null;
canvas.addEventListener('pointermove',e=>{
  if(state!==ST.CODEX||dragY===null) return;
  const pt=logicalFromEvent(e);
  codexScroll-=(pt.y-dragY);
  dragY=pt.y;
},{passive:true});
canvas.addEventListener('pointerdown',e=>{
  if(state===ST.CODEX){ const pt=logicalFromEvent(e); dragY=pt.y; }
});
canvas.addEventListener('pointerup',()=>{ dragY=null; });
canvas.addEventListener('pointercancel',()=>{ dragY=null; });

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(state===ST.PLAY) state=ST.PAUSE;
    if(A.ctx&&A.ctx.state==='running'){ try{A.ctx.suspend();}catch(e){} }
  }else{
    if(A.ctx&&A.ctx.state==='suspended'){ try{A.ctx.resume();}catch(e){} }
  }
});

/* ================= 启动 ================= */
let lastT=performance.now();
let botTimer=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-lastT)/1000;
  lastT=now;
  if(!isFinite(dt)||dt<0) dt=0;
  dt=Math.min(dt,0.05);

  botFrames++; botAcc+=dt;
  if(botAcc>=0.5){ botFps=botFrames/botAcc; botFrames=0; botAcc=0; }

  catWait-=dt;
  if(catWait<=0){ catT=catDur; catWait=rnd(42,72); }
  if(catT>0) catT-=dt;

  const steps=Math.max(1,Math.ceil(dt/(1/120)));
  const sub=dt/steps;
  for(let i=0;i<steps;i++){
    update(sub*timeScale);
  }

  shownTemp=lerp(shownTemp,temp,1-Math.pow(0.002,dt));
  if(Math.abs(shownTemp-temp)<0.6) shownTemp=temp;

  if(BOT){
    botTimer-=dt;
    if(botTimer<=0){ botTimer=0.14; botThink(); }
  }

  render();
}

resize();
resetWorld();
state=ST.TITLE;
lastT=performance.now();
requestAnimationFrame(loop);

document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{
  if(e.touches.length>1) e.preventDefault();
},{passive:false});

</script>
