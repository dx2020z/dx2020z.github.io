权即命名权即规训权。"},{"b":"心理学与生活","n":"#18","a":"菜谱翻译","d":"第二域·翻译型运算","t":"结论：转译为菜谱，本书给出「可复现行为」的配料表与火候。\\n发现：1)系统脱敏按焦虑等级+放松逐步烹调；2)代币法按行为积分兑换特权；3)认知重塑按歪曲思维换现实配方；4)节食失败因口味多样抵消饱腹信号。\\n证据：沃尔普系统脱敏三步骤含肌肉放松与逐级想象；肥胖研究指特定感觉厌食使多菜抵消饱腹。\\n启示：菜谱翻译显其工程化善意，也显把人当可控食材的风险。"},{"b":"心理学与生活","n":"#19","a":"病理翻译","d":"第二域·翻译型运算","t":"结论：转译为病理学，本书把常态与变态画成连续谱上的染色切片。\\n发现：1)精神分裂症切出紊乱紧张偏执未定残留五型；2)抑郁称心理病理普通感冒；3)人格障碍如慢染不易脱色；4)创伤后应激如急性炎症。\\n证据：第15章列五类精神分裂症；抑郁被喻为感冒因其高发；DID又称多重人格。\\n启示：病理翻译便利分类，却把光谱硬切，边界本身即权力。"},{"b":"心理学与生活","n":"#20","a":"战争翻译","d":"第二域·翻译型运算","t":"结论：转译为战争，本书是「派系休战协定」——各学派划地停火而非一方胜出。\\n发现：1)心理动力与行为主义互不承认却同书共存；2)人本与认知在抑郁治疗分庭抗礼；3)生物与社会各占战壕；4)编者以「当代七观点」宣布停战。\\n证据：第1章列生物、心理动力、认知、进化等七观点并称各贡献；治疗章四派并列。\\n启示：战争翻译说明教科书靠停战维系完整，读者别幻想统一战线。"},{"b":"心理学与生活","n":"#21","a":"极端读者攻击","d":"第三域·应力测试型运算","t":"结论：让最尖锐读者攻击——「这本书能否帮一个战乱贫民理解自己的创伤？」答案部分坍塌。\\n发现：1)其应激模型基于美国生活事件量表；2)治疗费与可及性假定中产医疗；3)文化疗愈仅被提及未给路径；4)权力致创伤被化约为个体归因。\\n证据：社会再适应量表源自美结婚参照；健康心理学生物心理社会模型偏个体。\\n启示：应力测试暴露普适宣言在极端处境下的脆裂，须注明适用海拔。"},{"b":"心理学与生活","n":"#22","a":"基础假设反转","d":"第三域·应力测试型运算","t":"结论：反转「心理可测量」假设——若智力情绪本不可单维量化，全书量表大厦即倾斜。\\n发现：1)比奈本说测的是当前操作非天生智力；2)加德纳八智力已瓦解单一IQ；3)EQ与IQ仅略相关；4)常模随文化漂移。\\n证据：比奈强调训练机会影响智力、反对污名；加德纳列8种智力西方重前两种；EQ与IQ略相关。\\n启示：假设反转后，书更像一本「可量化神话的考古层」而非真理。"},{"b":"心理学与生活","n":"#23","a":"历史穿越测试","d":"第三域·应力测试型运算","t":"结论：把书穿越到1900年，其「进化心理学」「脑成像」章将因技术缺席而蒸发，只剩冯特式内省。\\n发现：1)PET、MRI、双生子设计均为后世装备；2)当时只信内省与反应时；3)性别角色与烙印概念尚未成型；4)本书大半内容依赖20世纪后半仪器。\\n证据：冯特1879用内省；脑成像技术在21世纪栏补充；双生子遗传研究在人格章。\\n启示：历史穿越显示本书是技术时代的产物，非跨时代通则。"},{"b":"心理学与生活","n":"#24","a":"反向工程","d":"第三域·应力测试型运算","t":"结论：反向工程其编写目的——它是一台「把研究压成可考知识点」的压缩器。\\n发现：1)每章要点重述是考点抽取器；2)关键术语表是索引式压缩；3)研究被改写为「我们如何知晓」小栏；4)争议被压成脚注保考试安全。\\n证据：第2章末关键术语、每章要点重述成考试闭环；「我们如何知晓」栏压缩原始论文。\\n启示：反向工程揭示其本质是教学压缩格式，引用须回原始文献。"},{"b":"心理学与生活","n":"#25","a":"边界条件探测","d":"第三域·应力测试型运算","t":"结论：探测边界——当被试非西方、非学生、非神经典型时，多数结论置信区间爆裂。\\n发现：1)锚定效应实验对象为美大学生；2)从众比率随文化变；3)基本归因错误具东西方差异；4)原型实验基于特定面孔样本。\\n证据：锚定乘法题8×7…×1估512与2250对照真值40320；FAE标明西方独立自我更强。\\n启示：边界探测画出适用围栏，书内却常把围栏内当全世界。"},{"b":"心理学与生活","n":"#26","a":"沉默者的声音","d":"第三域·应力测试型运算","t":"结论：沉默者是被试之外未被询的人——非被试文化、动物、被疗愈者家属。\\n发现：1)动物实验用狗猫鼠猿却无动物自述；2)哈洛幼猿被剥夺后成年紊乱无人代言；3)刻苦普汀肥胖基因携带者被命名为缺陷；4)病患家属负担被略。\\n证据：哈洛绒布母猴实验幼猿成年社会性困难；莱普亭基因变异被解释肥胖原因。\\n启示：沉默者声音提醒教材的言说者永远是研究者而非研究对象。"},{"b":"心理学与生活","n":"#27","a":"反事实推演","d":"第三域·应力测试型运算","t":"结论：若弗洛伊德从未出现，本书将失去整层人格地基却仍自洽——证明该层非承重。\\n发现：1)人本、认知、特质理论可不依赖无意识自圆；2)防御机制可改写为应对风格；3)梦与本能章节可删；4)依恋等实证主题独立成立。\\n证据：大五、班杜拉社会学习、罗杰斯人本均不须本我；治疗章行为认知可替精神分析。\\n启示：反事实推演显示弗洛伊德是装饰性承重墙，敲掉楼不塌。"},{"b":"心理学与生活","n":"#28","a":"十年后审判","d":"第三域·应力测试型运算","t":"结论：十年后审判——本书对网络、AI、复制危机的失语将成最大折旧项。\\n发现：1)互联网仅作「21世纪」点缀未入主干；2) replication 风波未载；3)算法推送与注意力经济缺席；4)诊断数字化未预见。\\n证据：第17、18章仅以关系与互联网作章节末专栏；同书称互联网成瘾是否真实存疑。\\n启示：十年审判预示其半衰期受技术章节外挂式写法拖累。"},{"b":"心理学与生活","n":"#29","a":"概念图谱","d":"第四域·网络/关系型运算","t":"结论：绘概念图谱，核心节点是「学习、记忆、自我、归因」，呈星型而非树型。\\n发现：1)学习连出条件作用与观察学习；2)记忆连出编码提取与重构；3)自我连出自尊与可能自我；4)归因连出FAE与自利偏差。\\n证据：第7章学习、第8章记忆、第14章自我、第17章归因各为中心节点。\\n启示：图谱显示知识以中观概念为枢纽，章边界是人为切分。"},{"b":"心理学与生活","n":"#30","a":"影响涟漪","d":"第四域·网络/关系型运算","t":"结论：追踪影响涟漪，巴甫洛夫与斯金纳的波纹扩散进治疗、教育、管理全章。\\n发现：1)经典条件解释药物抗药与免疫抑制；2)操作条件衍生代币法与塑造；3)观察学习进社会学习疗法；4)行为原理贯穿行为治疗。\\n证据：第7章称条件作用可解释抗药力；代币奖励用于可卡因依赖妇女研究。\\n启示：涟漪图显示少数定律级实验支撑了 disproportionately 大篇幅应用。"},{"b":"心理学与生活","n":"#31","a":"思想谱系","d":"第四域·网络/关系型运算","t":"结论：思想谱系上，冯特—铁钦纳—詹姆斯—杜威—华生—斯金纳—班杜拉成一脉行为链。\\n发现：1)结构主义与机能主义是源头对峙；2)行为主义由华生立、斯金纳精；3)班杜拉加认知social learning；4)人本从詹姆斯热血心理学续火。\\n证据：冯特1879、铁钦纳1892、詹姆斯、杜威机能、华生行为、斯金纳操作、班杜拉观察。\\n启示：谱系显示当代观点是祖辈论战的停战地图。"},{"b":"心理学与生活","n":"#32","a":"引用网络","d":"第四域·网络/关系型运算","t":"结论：引用网络呈「美英中心、年代偏旧」的 hubs 结构，少量经典撑起整网。\\n发现：1)津巴多、斯金纳、班杜拉、艾森克为超级节点；2)大量引文停在上世纪；3)非英文研究边缘；4)女性与少数族裔被引偏低。\\n证据：书中女性贡献仅在序中被提；罗夏1921、TAT 1938、MMPI 久远仍核心。\\n启示：引用网络暴露知识生产的地缘与年代偏食。"},{"b":"心理学与生活","n":"#33","a":"术语地图","d":"第四域·网络/关系型运算","t":"结论：术语地图显示本书发明「教学双语」——同一现象配俗名与学术名。\\n发现：1)前意识/无意识/潜意识混用；2)晶态液态智力并列为术语对；3)外向性神经质成对；4)保守开放等词双向标定。\\n证据：第1章术语列前意识无意识；卡特尔晶态液态；艾森克外向神经质维度。\\n启示：术语地图揭示教科书的翻译层——它先把研究语翻成考试语。"},{"b":"心理学与生活","n":"#34","a":"逻辑依赖树","d":"第四域·网络/关系型运算","t":"结论：逻辑依赖树上，方法章是根，生物与认知是干，社会治疗是枝，文化是最晚生的须。\\n发现：1)无研究方法则信效度全失；2)无神经元则药理治疗无依；3)无归因则社会章空转；4)文化常作末级附注。\\n证据：第2章方法为后续奠基；第3章生物基础支撑第16章药理；文化仅在差异小节。\\n启示：依赖树显示若抽掉方法根，整棵树只剩故事。"},{"b":"心理学与生活","n":"#35","a":"权力结构图","d":"第四域·网络/关系型运算","t":"结论：权力结构图上，诊断权（DSM）、测量权（IQ）、实验权（白大褂）居顶端。\\n发现：1)APA式诊断垄断变态命名；2)比奈—韦克斯勒量表定义谁聪明；3)实验室权威定义何为行为；4)被研究者无命名权。\\n证据：DSM-IV-TR列200余障碍；斯坦福比奈、韦氏三量表成常模；米尔格拉姆服从显权威压。\\n启示：权力图说明心理学先是一种命名与测量的支配技术。"},{"b":"心理学与生活","n":"#36","a":"逆向因果重写","d":"第五域·时间型运算","t":"结论：逆向因果重写——把「抑郁致5-羟色胺低」改写为「药降再摄取才改情绪」，方向即翻转。\\n发现：1)书中因果常由药理倒推；2)应激—疾病链用相关当因果；3)归因风格被当抑郁因却可能互为果；4)依恋预测成年靠追踪非实验。\\n证据：抗抑郁药增递质活性治抑郁；塞利格曼归因风格解释抑郁但方向存疑。\\n启示：时间重写显示许多「因」是疗法的倒影，须标因果箭头来源。"},{"b":"心理学与生活","n":"#37","a":"考古碎片重组","d":"第五域·时间型运算","t":"结论：考古碎片重组出「被淘汰理论博物馆」——颅相、体型气质、本能论残片仍在。\\n发现：1)希波克拉底四体液以艾森克现代壳复活；2)谢尔顿体型气质说被点名却留痕；3)詹姆斯本能说被弱化未删；4)高尔顿优生思想作为警示残存。\\n证据：艾森克人格环四象限接希波克拉底四型；谢尔顿1942体型气质说仍被引。\\n启示：重组显示教科书像地层博物馆，淘汰物常以脚注化石态留存。"},{"b":"心理学与生活","n":"#38","a":"预言逆推","d":"第五域·时间型运算","t":"结论：预言逆推——从今日脑科学回推，本书第3章竟是最长寿章节。\\n发现：1)神经元突触递质内容至今未过时；2)内分泌激素框架稳；3)半球一侧化仍有效；4)唯具体定位随成像更新。\\n证据：第3章神经元动作电位、突触传递、神经递质描述与今日教材一致。\\n启示：逆推显示生物基础章是时间胶囊，社会文化章折旧最快。"},{"b":"心理学与生活","n":"#39","a":"半衰期分类","d":"第五域·时间型运算","t":"结论：按半衰期分类，生物学与统计方法最长寿，流行疗法与网络专栏最短命。\\n发现：1)信度效度、正态曲线近百年有效；2)艾宾浩斯遗忘曲线仍用；3)百优解神化已显过时；4)互联网专栏极速折旧。\\n证据：艾宾浩斯1885遗忘曲线、正态曲线、信效度原则沿用；百优解神化遭批评。\\n启示：半衰期表帮读者分配信任——把信任投给长半衰层。"},{"b":"心理学与生活","n":"#40","a":"进化模拟","d":"第五域·时间型运算","t":"结论：进化模拟显示，本书把更新世狩猎采集者当通用硬件，忽略文明期软件重写。\\n发现：1)进化心理学称99%进化在更新世；2)择偶、攻击、照料结盟均以此解释；3)却难解释针电梯等现代恐惧；4)女性性可塑性被归文化限。\\n证据：书中称更新世约2万年结束于1万年前、99%进化在此；可塑性指女性性行为变化大。\\n启示：进化模拟提醒：用旧硬件解释新软件，常犯年代错配。"},{"b":"心理学与生活","n":"#41","a":"前传生成","d":"第五域·时间型运算","t":"结论：生成前传——在冯特之前，本书潜前传是哲学（苏格拉底、柏拉图、亚里士多德）。\\n发现：1)意识自由意志问题源自希腊；2)笛卡尔式心物二分埋线；3)联想主义预演学习；4)达尔文给进化观点供能。\\n证据：书中称西方心理学上溯至苏格拉底柏拉图亚里士多德；达尔文自然选择入进化观点。\\n启示：前传生成显明教科书把哲学削成「史前史」一小节带过。"},{"b":"心理学与生活","n":"#42","a":"续集生成","d":"第五域·时间型运算","t":"结论：生成续集——本书第17版后真实续集是复制危机、开放科学、AI认知。\\n发现：1)原书未载许多经典实验后被复制失败；2)预注册与元分析成新范式；3)大模型重定义「记忆搜索」类比；4)诊断手册已出DSM-5。\\n证据：原书止步DSM-IV-TR；第9章以网络搜索比喻记忆暗示续集方向。\\n启示：续集生成划出本书停更线，读者须自行接棒至当代。"},{"b":"心理学与生活","n":"#43","a":"种子句培育","d":"第六域·生成型运算","t":"结论：提取种子句——「心理学是一门科学，同时关注在学生生活中的应用」是全书种胚。\\n发现：1)序言明言科学加应用双目标；2)每章以生活问题开场落回科学分析；3)「我们如何知晓」栏繁育证据；4)结尾回扣应用。\\n证据：译者序与开篇称心理学是科学并关注应用；各章生活心理学栏引入。\\n启示：种子句揭示其教育基因：先钩住生活再交付实验。"},{"b":"心理学与生活","n":"#44","a":"逆工程工具箱","d":"第六域·生成型运算","t":"结论：其逆工程工具箱=操作定义+双盲+相关控制+代表样本，四件即可拆任何主张。\\n发现：1)操作定义把自尊等概念钉死；2)双盲隔离期望效应；3)相关不因果防误读；4)代表样本保外推。\\n证据：第2章列操作性定义、双盲控制、相关系数、代表性样本为关键术语。\\n启示：工具箱是读者最该带走的装备，用来反测书内软处。"},{"b":"心理学与生活","n":"#45","a":"问题发生器","d":"第六域·生成型运算","t":"结论：本书本身就是问题发生器——每章生活栏抛问，逼出可验假设。\\n发现：1)为何幻觉在某些文化是好兆；2)为何女性抑郁两倍；3)为何锚定难调；4)为何旁观者不助。\\n证据：第13章问为何女性抑郁是男性2倍（Nolen-Hoeksema）；旁观者责任分散实验设谜。\\n启示：问题发生器价值高于其答案，因问题可跨时代复用。"},{"b":"心理学与生活","n":"#46","a":"隐喻引擎","d":"第六域·生成型运算","t":"结论：驱动全书的隐喻引擎是「计算机/信息加工」——人脑被默认为硬件跑心智软件。\\n发现：1)记忆称编码存储提取如文件；2)注意为瓶颈；3)决策为有限理性计算；4)图式如数据包。\\n证据：第8章记忆结构用编码存储提取；西蒙有限理性称找足够好解。\\n启示：隐喻引擎暴露其时代胎记——认知科学借计算机语写就。"},{"b":"心理学与生活","n":"#47","a":"空白章节","d":"第六域·生成型运算","t":"结论：本书应有却无的空白章节——「权力与不平等」「非人类主体伦理」「失败研究档案」。\\n发现：1)阶级仅作变量不立章；2)动物伦理仅小节；3)证伪与空结果被略；4)疗愈产业批判缺席。\\n证据：应激章提非裔高血压归偏见但未立结构章；动物研究道德仅方法章数段。\\n启示：空白章节比现有章更显其意识形态边界。"},{"b":"心理学与生活","n":"#48","a":"实验设计","d":"第六域·生成型运算","t":"结论：抽取其标准实验设计模板——自变量操纵、因变量测、控制组、双盲，可复刻。\\n发现：1)米尔格拉姆变权威距离得服从梯度；2)阿斯奇变同伴数得从众率；3)旁观者变人数得责任分散；4)安慰剂组基线效。\\n证据：米尔格拉姆多情境服从从16至40人变动；Darley Latané 1968旁观者人数实验。\\n启示：实验设计是本书最可移植资产，值得单独抽成手册。"},{"b":"心理学与生活","n":"#49","a":"操作系统提取","d":"第六域·生成型运算","t":"结论：提取其底层操作系统——「实证主义+个体主义」双内核驱动全部应用层。\\n发现：1)一切以可测证据为系统调用；2)以个体为进程单位；3)社会文化作外设；4)治疗即进程修复。\\n证据：科学方法章定实证基调；自我概念、归因均以个体为单位。\\n启示：OS提取说明换内核（如集体本位）会令多数应用层崩溃。"},{"b":"心理学与生活","n":"#50","a":"悖论收割","d":"第六域·生成型运算","t":"结论：收割悖论——本书最肥的悖论是「用西方样本论证普遍人性」。\\n发现：1)进化论称普适却数据来自美军；2)情绪普遍说配文化显示规则；3)智力公平争辩陷遗传环境两难；4)自由意志与决定论同书并存。\\n证据：基本归因错误标西方独立自我更强；智力遗传率与刻板印象威胁同章对峙。\\n启示：悖论收割显示教科书靠「悬置矛盾」维持教学顺畅。"},{"b":"心理学与生活","n":"#51","a":"最强反驳","d":"第七域·对抗型运算","t":"结论：最强反驳指向其「样本普遍化」自称——用西方中产大学生推论全人类，是方法论上的过度外推。\\n发现：1)从众、FAE、锚定多取美被试；2)双生子遗传相关被当作普适人性；3)情绪七分类以西方为默认；4)进化模板忽略文明重写。\\n证据：基本归因错误标西方独立自我更强；阿斯奇1952被试为美大学生；FAE东西方差异明示。\\n启示：任何「人类如何」句式都须先扣减样本偏差，否则结论整体坍缩。"},{"b":"心理学与生活","n":"#52","a":"死敌对话录","d":"第七域·对抗型运算","t":"结论：请一位非西方批判学者与本书对话，冲突聚焦「正常」的定义权。\\n发现：1)书把西方常模当正常基线；2)批判者指异常是社会建构；3)书以DSM命名权压异议；4)批判者要求去病理化日常悲伤。\\n证据：同性恋1973才被投票除名显示诊断权流动；抑郁称心理病理普通感冒显医学化。\\n启示：对话暴露本书的「正常」是特定文化的出口，而非自然事实。"},{"b":"心理学与生活","n":"#53","a":"检察官摘要","d":"第七域·对抗型运算","t":"结论：检察官摘要列四项指控——过度病理化、生物还原、个体归因、抽样偏见。\\n发现：1)把人生困境翻成障碍条目；2)把哀伤抑郁分子化；3)把结构困境推给个人归因；4)以偏样本立法普适。\\n证据：DSM-IV-TR列200余障碍；抗抑郁药分子化抑郁；非裔高血压归偏见致应激而非结构。\\n启示：四项指控并非全成立，但书未设自辩程序，读者须代为质证。"},{"b":"心理学与生活","n":"#54","a":"误用档案","d":"第七域·对抗型运算","t":"结论：建立误用档案——本书概念常被嫁接到自我帮助的伪劣产业链。\\n发现：1)罗夏TAT被伪咨询师当读心术；2)百优解叙事助长药物崇拜；3)马斯洛需求被企业培训庸俗化；4)条件反射被营销滥用。\\n证据：书中自称自尊磁带仅安慰剂效应；百优解案例被克雷默神化；马斯洛需层次入企管话术。\\n启示：误用不在书内而在下游，但书对概念的可搬运性负有免责缺失。"},{"b":"心理学与生活","n":"#55","a":"盲区报告","d":"第七域·对抗型运算","t":"结论：盲区报告——三处系统性失明：复制危机、动物伦理、贫困结构。\\n发现：1)对同期 replicated failings 无记载；2)动物实验痛苦仅方法章数行带过；3)阶级作变量不入因；4)疗愈产业批判缺席。\\n证据：哈洛幼猿剥夺实验致成年社会性困难未议伦理；应激章将阶层化为SES变量。\\n启示：盲区非偶然遗漏，而是实证个体主义范式的内建暗角。"},{"b":"心理学与生活","n":"#56","a":"时代偏见审计","d":"第七域·对抗型运算","t":"结论：时代偏见审计——2003中译承载冷战末个人主义与脑科学乐观。\\n发现：1)个体成就叙事符合新自由主义；2)脑成像崇拜显技术决定论；3)互联网仅点缀显写于前社交媒时代；4)性别仍走生物—文化折中。\\n证据：第3章脑成像作21世纪栏；第17-18章互联网仅作专栏；马斯洛需求层为个人实现。\\n启示：审计显示书是时代 capsules，读时须扣除其出版年代的隐形税。"},{"b":"心理学与生活","n":"#57","a":"拓扑分析","d":"第八域·形式/数学型运算","t":"结论：拓扑分析显示知识网呈「中心—卫星」而非网格——少数实验为枢纽。\\n发现：1)斯金纳箱、米尔格拉姆、阿斯奇为超级节点；2)大量章节辐辏于学习记忆；3)文化节点度极低；4)方法章为底层连通件。\\n证据：操作性条件作用贯穿行为治疗；服从从众归因三章均引实验室范式。\\n启示：拓扑揭示教科书靠少数经典撑场，更新经典即动摇全图连通。"},{"b":"心理学与生活","n":"#58","a":"对称性分析","d":"第八域·形式/数学型运算","t":"结论：对称性分析见「天性—教养」本应对称却被书内不对称加权。\\n发现：1)智力章先列遗传率再补环境似平衡实偏生物；2)人格章本能与社会各半但弗洛伊德占大篇幅；3)情绪普遍与文化的对称被破；4)治疗药理与谈话对称失衡。\\n证据：双生子遗传相关0.52被强调；环境干预仅后续补充；药理治疗篇幅超人本。\\n启示：不对称加权暴露编者 tacit 偏好，对称阅读可纠偏。"},{"b":"心理学与生活","n":"#59","a":"相变标记","d":"第八域·形式/数学型运算","t":"结论：相变标记定位全书最大范式跃迁——行为主义到认知革命。\\n发现：1)第7章斯金纳为行为顶点；2)第8章记忆以信息加工重启心灵；3)黑盒变白盒是相变信号；4)计算机隐喻为新生相。\\n证据：第8章记忆用编码存储提取；西蒙有限理性以计算喻决策。\\n启示：相变处最易藏断裂，读者应在行为—认知接缝处放慢。"},{"b":"心理学与生活","n":"#60","a":"递归自检","d":"第八域·形式/数学型运算","t":"结论：递归自检——书能否审视自身偏见？结论：仅方法论章浅自检，价值层不检。\\n发现：1)科学方法章自检信效度却未检样本构成；2)文化章自陈差异但不自责普遍化；3)批判思维倡质疑却不疑自身框架；4)WEIRD盲点未被命名。\\n证据：第2章列信度效度代表性样本但未提文化代表；跨文化仅作差异展示。\\n启示：递归层级停在技术层，元价值层无自检回路，是结构性缺陷。"},{"b":"心理学与生活","n":"#61","a":"压缩极限","d":"第八域·形式/数学型运算","t":"结论：压缩极限——把论文压成教材，丢失的是「不确定性」与「争议噪声」。\\n发现：1)效应量、置信区间被删；2) replication 失败被裁；3)作者论战被压脚注；4)原始数据不可见。\\n证据：书中只给结论如从众50-80%未给异质分布；罗夏效度争议一笔带过。\\n启示：压缩到可考即止，读者须把确定性语句当有损压缩包解压。"},{"b":"心理学与生活","n":"#62","a":"冗余定位","d":"第八域·形式/数学型运算","t":"结论：冗余定位找出高频复现母题——「自我实现」「防御机制」「生物基础」三处冗余。\\n发现：1)自我实现在动机人格治疗三现；2)防御机制在人格应激两现；3)生物基础每章回扣；4)应激GAS跨章复用。\\n证据：马斯洛需层次、罗杰斯、霍妮共倡自我实现；GAS在应激章详述。\\n启示：冗余是教学锚点也是思想通胀，识别后可删减负读。"},{"b":"心理学与生活","n":"#63","a":"分形检测","d":"第八域·形式/数学型运算","t":"结论：分形检测——「个体可测可改」图案在章、节、例三尺度自相似重复。\\n发现：1)章以个体案例开场；2)节以个体实验支撑；3)例题以个人抉择收尾；4)宏观理论亦回落个体。\\n证据：每章生活心理学栏以个人困境引入；决策章以个人买音响锚定收束。\\n启示：分形一致说明本书是单一尺度放大，缺群体级分形故社会层稀薄。"},{"b":"心理学与生活","n":"#64","a":"博弈重构","d":"第八域·形式/数学型运算","t":"结论：博弈重构——米尔格拉姆服从可写为权威—被试不对称博弈。\\n发现：1)权威发令为行动者；2)被试 payoff 含道德成本；3)同伴反抗改变收益矩阵；4)距离权威降惩罚预期。\\n证据：米尔格拉姆多情境服从随权威距离变16至40；同伴反抗显著降服从。\\n启示：博弈视角揭露服从非人性弱点，而是情境收益结构诱出。"},{"b":"心理学与生活","n":"#65","a":"反领域嫁接","d":"第九域·迁移型运算","t":"结论：反领域嫁接——把书移植到政治学，其服从实验即成威权稳定性教材。\\n发现：1)米尔格拉姆解释组织盲从；2)从众解释议会合唱；3)旁观者效应解释公共冷漠；4)认知失调解释选民自洽。\\n证据：书中服从情境变量可映射科层；旁观者责任分散可解都市冷漠。\\n启示：嫁接显示心理机制跨域普适，但政治使用须防个体归因掩盖结构。"},{"b":"心理学与生活","n":"#66","a":"古今穿刺","d":"第九域·迁移型运算","t":"结论：古今穿刺——把亚里士多德的灵魂三分对应当今知意情三分仍勉强合缝。\\n发现：1)认知对知；2)意志对动机；3)情绪对情；4)差异在方法非对象。\\n证据：第1章上溯希腊哲学；当代心理学仍以描述解释预测控制为目标。\\n启示：穿刺显示问题千年未变，变的只是测量器械与术语。"},{"b":"心理学与生活","n":"#67","a":"微观/宏观跃迁","d":"第九域·迁移型运算","t":"结论：微观宏观跃迁断裂——神经元事实难直接跃至社会行为解释。\\n发现：1)突触递质到依恋需多层假设；2)基因相关到人格需环境桥；3)脑区激活到偏见需中介；4)书常以邻近代因果。\\n证据：双生子遗传0.52至大五仍须经环境；GABA低到焦虑隔药物机制。\\n启示：跃迁处有解释鸿沟，书常用流畅叙事跨接，读者须标出跳跃点。"},{"b":"心理学与生活","n":"#68","a":"物理学映射","d":"第九域·迁移型运算","t":"结论：物理学映射——稳态homeostasis如热力学平衡，应激即失衡扰动。\\n发现：1)坎农体内平衡为系统回稳；2)塞里GAS为偏离平衡三阶段；3)耶克斯道德逊似最优激励曲线；4)习惯化为响应衰减。\\n证据：第12章饥饿提动态平衡；第13章GAS报警抵抗耗尽三阶段。\\n启示：映射显其系统论底色，但把人当闭环控温器会丢意向性。"},{"b":"心理学与生活","n":"#69","a":"生物学映射","d":"第九域·迁移型运算","t":"结论：生物学映射——全书可重绘为「基因—递质—激素—行为」四级映射网。\\n发现：1)基因经双生子入人格智力；2)递质经药理入情绪障碍；3)激素经内分泌入应激；4)脑区经成像入记忆。\\n证据：第3章神经递质、内分泌；第10章双生子遗传；第16章药物调递质。\\n启示：映射亮出最强解释力在生物层，也显生物还原的诱惑与风险。"},{"b":"心理学与生活","n":"#70","a":"失败案例嫁接","d":"第九域·迁移型运算","t":"结论：失败案例嫁接——书内隐失败（空结果、复制败）被剪，须外挂补。\\n发现：1)弗洛伊德预言多未被证；2)罗夏效度长期不稳；3)本能论退场；4)许多疗法等效安慰剂。\\n证据：埃森克称2/3神经症两年自然缓解挑战疗效；罗夏批评持续。\\n启示：嫁接失败档案才能还原学科真实成功率，否则书呈幸存者偏差。"},{"b":"心理学与生活","n":"#71","a":"技术协议翻写","d":"第九域·迁移型运算","t":"结论：技术协议翻写——把实验协议翻成AI提示词，可复现其范式。\\n发现：1)从众协议=多数一致误导；2)服从协议=权威指令压道德；3)锚定协议=首值调偏；4)脱敏协议=暴露加放松。\\n证据：阿斯奇、米尔格拉姆、锚定乘法、沃尔普系统脱敏均可改写为步骤。\\n启示：翻写证明本书实验是可执行算法，也警示算法偏见同源。"},{"b":"心理学与生活","n":"#72","a":"写作动机考古","d":"第十域·考古/法医型运算","t":"结论：写作动机考古——编者动机是「教学覆盖+科学严谨平衡」，非立论。\\n发现：1)序言明言平衡严密与生活相关；2)津巴多社会+格里格认知互补；3)每版加栏为跟上领域；4)教材定位压倒立场。\\n证据：译者序称两人为第三次合作互补专长；新增21世纪栏追新。\\n启示：动机是教书而非说服，故书中立姿态本身即一种温和规训。"},{"b":"心理学与生活","n":"#73","a":"读者考古","d":"第十域·考古/法医型运算","t":"结论：读者考古——预设读者是「美国入门课学生」，中译改为「中国大学生」。\\n发现：1)例题取美校园情境；2)语言以英语语法为例；3)文化以西方为默认他者；4)译本未重本地化案例。\\n证据：语言中举英语词序、INFLATED例子；校园情境贯穿。\\n启示：读者考古显示书是跨语移植，未重植本土经验故隔一层。"},{"b":"心理学与生活","n":"#74","a":"概念尸检","d":"第十域·考古/法医型运算","t":"结论：对「智力quotient」做尸检——它生而含社会排序意图，死因是过度本质化。\\n发现：1)比奈为辨需帮儿童非测天赋；2)高尔顿优生接其尾；3)特曼斯坦福化推IQ；4)加德纳八智碎其单一。\\n证据：比奈反对污名；高尔顿倡优等繁殖；加德纳列8智西方重前2。\\n启示：尸检表明IQ从未中性，书以技术中立叙述掩盖其排序基因。"},{"b":"心理学与生活","n":"#75","a":"出版环境重建","d":"第十域·考古/法医型运算","t":"结论：出版环境重建——2003人民邮电译本处中国心理学西学东渐加速期。\\n发现：1)北大心理学系主导译介；2)自考与高校扩招推教材需求；3)原版第16版为全球畅销；4)中译删减西式习题。\\n证据：译者序落款2003年10月北大燕园；王垒等北大团队译。\\n启示：环境重建说明译本既是科学搬运也是学科建制工程。"},{"b":"心理学与生活","n":"#76","a":"版本差异分析","d":"第十域·考古/法医型运算","t":"结论：版本差异——第16版较旧版增智力章独立与21世纪栏，结构微迭代。\\n发现：1)智力测验单列为新增章；2)每章加21世纪心理学专栏；3)脑成像技术随版更新；4)互联网栏随代补。\\n证据：序言称第16版单独设智力章；第3章补脑功能定位进展。\\n启示：差异分析显示教材以追加而非重写演进，旧层被新层覆盖。"},{"b":"心理学与生活","n":"#77","a":"引用链追踪","d":"第十域·考古/法医型运算","t":"结论：引用链追踪——一条链：冯特→铁钦纳→华生→斯金纳→班杜拉贯穿全书。\\n发现：1)冯特1879为起点；2)铁钦纳携结构入美；3)华生立行为；4)斯金纳精操作；5)班杜拉加认知。\\n证据：第1章与第7章列此谱系；社会学习疗法承班杜拉。\\n启示：链追踪暴露知识血统单一，非西来源在书中几近失声。"},{"b":"心理学与生活","n":"#78","a":"沉默目录","d":"第十一域·负空间型运算","t":"结论：沉默目录——书中不出现的词：阶级、殖民、种族主义、残障正义、动物权。\\n发现：1)阶级仅以SES缩写；2)殖民史零入；3)种族作变量非结构；4)动物权仅方法数行。\\n证据：非裔高血压归偏见应激但未命名种族主义结构；动物研究道德仅小节。\\n启示：沉默目录比目录更真实，标出教科书的政治负空间。"},{"b":"心理学与生活","n":"#79","a":"影子书","d":"第十一域·负空间型运算","t":"结论：影子书——与本书并行的「非西方心理学史」始终在页边投射。\\n发现：1)非洲建构主义疗愈未被收；2)东亚心学传统仅文化注脚；3)本土巫医被称仪式治疗边缘；4)苏联活动理论缺席。\\n证据：治疗章仅称西方结合萨满作文化适应；未立非西体系。\\n启示：影子书提醒所谓普世教材只是众多体系之一，且自认唯一。"},{"b":"心理学与生活","n":"#80","a":"失踪章节","d":"第十一域·负空间型运算","t":"结论：失踪章节——应有「心理学的政治经济学」一章被整体抽掉。\\n发现：1)无经费与学界权力章；2)无诊断产业的利益章；3)无制药与DSM勾连章；4)无大学排名对研究导向章。\\n证据：百优解神化未提制药语境；DSM修订未提学会政治。\\n启示：失踪章揭示教材把知识当中性，省去生产关系的章节。"},{"b":"心理学与生活","n":"#81","a":"边界守卫者","d":"第十一域·负空间型运算","t":"结论：边界守卫者是「科学方法」章——它守门将非实证叙述挡在科学外。\\n发现：1)以信效度划界内；2)以操作定义逐出玄学；3)以双盲逐出安慰剂；4)却对内里WEIRD盲点放行。\\n证据：第2章以信度效度标准化为科学门槛；安慰剂控制隔离伪效。\\n启示：守卫者守的是技术边界非政治边界，故放行了抽样偏见。"},{"b":"心理学与生活","n":"#82","a":"恐怖事物的礼节","d":"第十一域·负空间型运算","t":"结论：对恐怖事物的礼节——书以临床冷静包裹疯狂、自杀、虐待，避免惊骇。\\n发现：1)精神分裂症列五型如展品；2)自杀统计化去血肉；3)DID存疑仍列条目；4)创伤以量表稀释。\\n证据：第15章分列紊乱紧张偏执未定残留型；自杀给比率不叙事。\\n启示：礼节使痛苦可读不可感，是教材伦理也是情感隔离。"},{"b":"心理学与生活","n":"#83","a":"未问的问题","d":"第十一域·负空间型运算","t":"结论：未问之问——「心理学在为何种秩序服务」从未被本书提出。\\n发现：1)不问知识归谁；2)不问常态谁定；3)不问治疗为维稳还是解放；4)不问被试代价。\\n证据：全书以应用为正价值不加审视；诊断权未追权力源。\\n启示：未问之问是教科书最深的负空间，读者须自问以补全。"},{"b":"心理学与生活","n":"#84","a":"对手缺席","d":"第十一域·负空间型运算","t":"结论：对手缺席——书中几乎没有「反心理学」的同等分量对手发言。\\n发现：1)批判仅脚注式；2)无哲学反还原代表；3)无社运者驳病理化；4)无被研究者自辩。\\n证据：弗洛伊德被批仍大篇幅呈现无异见对席；文化批评弱化为差异小节。\\n启示：对手缺席使书呈单方面陈述，批判性须在书外借位生成。"},{"b":"心理学与生活","n":"#85","a":"三体碰撞","d":"第十二域·多体碰撞型运算","t":"结论：三体碰撞——生物、文化、个体三力在「抑郁」处相互摄动无稳定解。\\n发现：1)生物给递质低；2)认知给三合一负 schema；3)文化给表达规则；4)三者非加性。\\n证据：贝克认知三合一；5-羟色胺关联；女性抑郁两倍含文化回应风格。\\n启示：三体无闭式解，书却常给线性因果，须以混沌读之。"},{"b":"心理学与生活","n":"#86","a":"敌意合成","d":"第十二域·多体碰撞型运算","t":"结论：敌意合成——偏见+地位+应激合成健康差异的非预期产物。\\n发现：1)偏见致慢性应激；2)低地位供应激源；3)二者叠成高血压；4)非基因而是合成。\\n证据：非裔美国人高血压归因偏见慢性应激而非基因；社会经济劣势妇女早产。\\n启示：合成效应大于分量之和，单因解释必漏，须做因子混合。"},{"b":"心理学与生活","n":"#87","a":"学术会议模拟","d":"第十二域·多体碰撞型运算","t":"结论：学术会议模拟——若就「IQ是否公平」开分会，书内证据将僵持两派。\\n发现：1)遗传率派引双生子；2)环境派引刻板印象威胁；3)文化派引测验情境；4)政治派揭优生史。\\n证据：遗传率0.52对刻板印象威胁Steele 1995；高尔顿特曼优生链。\\n启示：模拟显示书把未决议题平铺呈现，缺裁决机制，读者须自裁。"},{"b":"心理学与生活","n":"#88","a":"法庭辩论模拟","d":"第十二域·多体碰撞型运算","t":"结论：法庭辩论模拟——以「服从是否免责」为案，书证词双方皆引米尔格拉姆。\\n发现：1)检方引盲从危害；2)辩方引情境压倒个体；3)法官引习惯服从权威；4)陪审陷责任分散。\\n证据：米尔格拉姆护士服从实验21/22就范；辛克利因失控免责类比。\\n启示：同一实验双向取证，说明教材证据需配解释框架才成判决。"},{"b":"心理学与生活","n":"#89","a":"多元宇宙分支","d":"第十二域·多体碰撞型运算","t":"结论：多元宇宙分支——若1973未除名同性恋诊断，本书病理地图将彻底改写。\\n发现：1)诊断随投票动；2)每版重划边界；3)DID真伪仍分支；4)网络成瘾与否分叉。\\n证据：同性恋1973被学会投票除名；DSM各版增删条目；网络成瘾是否障碍存疑。\\n启示：分支显示所谓障碍含约定成分，非自然种类，须以史读之。"},{"b":"心理学与生活","n":"#90","a":"高频词汇解码","d":"第十三域·涌现型运算","t":"结论：高频词解码——「学习、记忆、自我、应力、文化」五词为全书语义吸引子。\\n发现：1)学习出现数百次贯穿；2)记忆独立成章又回嵌；3)自我在人格社会复用；4)文化作最高频修饰。\\n证据：章节标题含学习记忆自我；文化在差异处高复现。\\n启示：解码高频词即抓住教科书心智的默认关注频道。"},{"b":"心理学与生活","n":"#91","a":"断裂点定位","d":"第十三域·涌现型运算","t":"结论：断裂点位于「实验室—生活」接口，此处结论最易漏损。\\n发现：1)从众在实验室强生活弱；2)服从情境特设难泛化；3)记忆研究用无意义音节离境；4)治疗效在控制组外衰减。\\n证据：阿斯奇真实独立率达2/3；艾宾浩斯无意义音节遗忘曲线。\\n启示：定位断裂点可给每条结论标注外推折扣率。"},{"b":"心理学与生活","n":"#92","a":"主题共振","d":"第十三域·涌现型运算","t":"结论：主题共振——「控制与自主」在动机、治疗、社会三域同频振荡。\\n发现：1)动机讲归因控制感；2)治疗讲自我效能；3)社会讲情境力量压自主；4)健康讲知觉控制。\\n证据：塞利格曼归因风格；班杜拉自我效能；知觉控制对艾滋病收益。\\n启示：共振显示一核心焦虑贯穿全书——人何时真自主。"},{"b":"心理学与生活","n":"#93","a":"情感曲线","d":"第十三域·涌现型运算","t":"结论：情感曲线——全书情感基调由「冷静科学」主线配「生活共情」副线。\\n发现：1)方法章冷叙述；2)生活栏暖引入；3)障碍章降温临床；4)治疗章回温希望。\\n证据：每章以生活心理学暖开场、以要点重述冷收束。\\n启示：曲线是教学节奏设计，读者可借以分辨何处被情感调度。"},{"b":"心理学与生活","n":"#94","a":"元叙事追踪","d":"第十三域·涌现型运算","t":"结论：元叙事追踪——底层叙事是「人可被科学理解并改善」，贯穿十八章。\\n发现：1)开篇定心理学为科学；2)每章落回应用改善；3)预防章倡上游干预；4)结尾信科学consumer。\\n证据：序言称心理学是科学关注应用；预防章以救落水童喻上游。\\n启示：元叙事是进步主义，未含对科学自身的怀疑，须读者补反叙事。"},{"b":"心理学与生活","n":"#95","a":"书的墓志铭","d":"第十四域·特殊型运算","t":"结论：墓志铭可刻——「此处长眠一部把西方青年测得最细、把人类写得最像西方的教科书」。\\n发现：1)它以实证为碑文；2)以教学为棺椁；3)以悬置矛盾为墓志；4)以应用为花圈。\\n证据：全书结构、科学方法章、生活应用闭环可证。\\n启示：墓志铭不是贬——它忠实完成了教材使命，只是别误读为普世圣经。"},{"b":"心理学与生活","n":"#96","a":"书的自画像","d":"第十四域·特殊型运算","t":"结论：若书自画像，它画自己为「持手电的向导，照实验之路引你出通俗心理学」。\\n发现：1)自认科学守门人；2)自认应用桥梁；3)自认文化中介；4)未自认西方载体。\\n证据：序言自称提供经验分析对抗通俗心理学；各章引研究为证。\\n启示：自画像少了半边脸——它的西方性与时代性被自我省略。"},{"b":"心理学与生活","n":"#97","a":"解毒剂处方","d":"第十四域·特殊型运算","t":"结论：解毒剂处方——读此书须配三剂：非西心理学史、复制危机文献、权力批判。\\n发现：1)剂一补去西方中心；2)剂二补不确定；3)剂三补结构视角；4)三剂同服方解书毒。\\n证据：书中WEIRD盲点、缺复制记载、结构淡出可作毒源。\\n启示：处方不是弃书，而是把它从教材升格为可辩论的对象。"},{"b":"心理学与生活","n":"#98","a":"遗书撰写","d":"第十四域·特殊型运算","t":"结论：遗书句式——「我把确定给了学生，把怀疑留给了时代，请后来者涂改」。\\n发现：1)它留科学方法为遗产；2)留未决为债；3)留西方框架为限；4)留应用热望为愿。\\n证据：方法章可传；文化结构未竟；互联网栏已显过时。\\n启示：遗书提醒教材天生是未完成时，每版都在替自己写续遗。"},{"b":"心理学与生活","n":"#99","a":"活的尸体测试","d":"第十四域·特殊型运算","t":"结论：活的尸体测试——抽掉弗洛伊德层、互联网栏、药理章，书仍跳动证明某些层已坏死。\\n发现：1)弗洛伊德层可摘；2)互联网栏可删；3)部分疗法等效安慰剂可汰；4)生物基础层不可摘。\\n证据：埃森克自然缓解挑战；生物第3章最长寿。\\n启示：测试显示书由活层与尸体层缝合，读时应分活尸分别对待。"},{"b":"心理学与生活","n":"#100","a":"黑箱审计","d":"第十四域·特殊型运算","t":"结论：黑箱审计终章——本书输入西式被试与实验，输出普世人性叙述，箱壁不透明。\\n发现：1)输入抽样未公开偏差；2)理论筛选无准则；3)争议压脚注不可见；4)文化以注脚入箱。\\n证据：WEIRD样本、脚注化争议、文化差异小节化可证。\\n启示：审计结论是——它是一部诚实的教材、一个不透明的普遍化机器，使用者须自带光源照箱。"},{"b":"想象力统治世界","n":"#01","a":"骨骼提取","d":"第一域·解剖型运算","t":"结论：全书的骨架是一根三段立柱：第一部分解决难题、第二部分重塑自我、第三部分改造教育，每段末端都挂着一个可执行的练习模块。\n发现：1)三段不是逻辑递进而是同心圆放大：个人难题—自我再造—文明改造。2)真正的概念层只有前言与第十四章两处，中间十章直接使用未经论证的「心像」。3)每部分开头必立一位权威：拿破仑、爱因斯坦、钱学森。4)「牛刀小试」与「相关链接」作为固定模块反复出现，把理论强行转成动作。5)直到第十四章「思像的四大法则」才回头给全书一个因果框架。\n证据：原文——第一部分想象力解决大难题；第二部分想象力使人成为自己想做的人；第三部分想象力变革教育与学习。\n启示：这是先搭楼层后补地基的立柱，概念段最短却承载了全部重量。"},{"b":"想象力统治世界","n":"#02","a":"暗物质测绘","d":"第一域·解剖型运算","t":"结论：真正驱动全书的三块暗物质是作者的品牌工程、右脑开发热的余温，与2009年的大众成功学市场。\n发现：1)封面第一行卖点是作者前作：畅销书《心兵法》作者再次揭示心灵的力量，「读心放就放心」被印成口号。2)作者把笔名做成理论资产，专门设一节「心放效应」并以自问自答开场。3)书中反复用个人经历代证据：十几年读数千本书、在多个高层论坛交流并获奖。4)真正的暗物质是市场：271页、定价32元、由北京兴盛乐策划、CIP归入通俗读物。5)暗物质之五是焦虑：教育焦虑、职场焦虑、健康焦虑各供应一批读者。\n证据：原文——首部系统揭开想象力奥秘和想象训练神奇的力作。\n启示：把作者身份当作证据链的一环来读，就能解释为何全书对反例如此不敏感。"},{"b":"想象力统治世界","n":"#03","a":"删节复原","d":"第一域·解剖型运算","t":"结论：被系统性删掉的是三样东西：对照组、失败率、原始出处。复原它们，书的分量立刻改变。\n发现：1)159位癌症患者的想象疗法只给平均数，无对照、无随访、无期刊出处。2)纳斯美瑟少校在战俘营中练球复出打出74杆，全书未给信息来源。3)「心像比语言的力量大1000倍」这类量化断言没有实验出处。4)作者自陈想象力并不直接治愈疾病，但这一限定只出现一处，其余章节仍用治愈叙事。5)第十四章承认「我们所描述的这个过程有些勉强」，等于亲手标注了删节处。\n证据：原文——159位被医生宣布活不到1年的癌症患者，经过每天3次、每次30分钟的想象疗法治疗，结果平均寿命延长了20多个月。\n启示：复原被删的部分后，这是一本删掉了对照组与失败率的书。"},{"b":"想象力统治世界","n":"#04","a":"恐惧扫描","d":"第一域·解剖型运算","t":"结论：这本书的情感引擎是恐惧，且被设计成四级递进：个人心死、事件败相、民族缺失、人类自毁。\n发现：1)开篇即用极端句式：这个世界上没有任何东西能够把你打败，只有它能够使你一败涂地。2)拿破仑被写成心死典型：圣赫勒拿岛那副象牙软玉象棋里藏着逃跑地图，他至死未曾发现。3)瓦伦达1978年在波多黎各从75英尺钢索坠落，被归因为「我一定不能失败」的败相。4)恐惧被放大到民族尺度：中国人缺失了想象力吗、想象缺失症、是什么谋杀了中国人的想象力。5)每一级恐惧都通向同一个出口：思像训练。\n证据：原文——拿破仑最大的失败是什么？不是兵败滑铁卢，而是败在圣赫勒拿岛上。\n启示：恐惧先行、方案在后，是这本书不变的标准说服结构。"},{"b":"想象力统治世界","n":"#05","a":"动词骨架","d":"第一域·解剖型运算","t":"结论：全书的动词可归为四组：成像、转换、管理、重复。它卖的不是理论而是一套动作指令。\n发现：1)最高频的操作动词是「想象」，几乎每段必现，承担全部论证与全部操作。2)第二组是摄影动词：拍照、冲洗成思想照片、放电影、倒放心灵电影、大脑摄像。3)第三组是「变」字系：变思为想、化抽象为具体、无用的变有用、有用的变为大用。4)第四组是重复输入动词：念叨、大声诵读成功语录卡、早晚照镜子、反复听磁带。5)第五章把想象拆成八个位置动词：全位、合位、组位、联位、换位、套位、跳位、归位。\n证据：原文——在头脑里编剧、演剧；用想象力发动头脑里的战争，消灭你的敌人。\n启示：动词骨架说明这本书的真正产品是可执行的动作，不是可检验的命题。"},{"b":"想象力统治世界","n":"#06","a":"矛盾晶体","d":"第一域·解剖型运算","t":"结论：全书绕着一个矛盾结晶：既要处处成像，又要连像也放下。作者没有给出何时用哪个的判据。\n发现：1)作者笔名即心放，「心放效应」一节明言要义是「把一切统统放下，连像也放下」，进入忘我境界。2)其余各章却要求随时随地在大脑中放电影、思想拍照、一天放映三到六次。3)高斯的例子支持前者：不知道这是千年难题才一夜解开；创造性想象四步骤支持后者。4)第二处矛盾：既说毅力打不过想象，又用补强法则要求长期坚持。5)第三处：既说想象不直接治病，又把想象疗法写成白细胞围杀癌细胞。\n证据：原文——本书的要义之一就是要做到心放。也就是把一切统统放下，连「像」也放下。\n启示：晶体是成像与放下的来回摆动，缺的正是那个切换条件的说明。"},{"b":"想象力统治世界","n":"#07","a":"重力分析","d":"第一域·解剖型运算","t":"结论：全书重量压在第二部分（97—197页），那是一百页的自我重塑操作区；理论层最轻。\n发现：1)第一部分95页承担全部奠基，密度最高却最短。2)第二部分六章展开自我意象、命运、成功像、自画像、镜子技巧、成功语录卡、自我养成磁带。3)重力最大的单点是第七章，连排六个「人一定要有……像」的清单。4)重力最小的是概念：思像的定义只在前言数百字与第十四章出现。5)第三部分虽只有三章却占七十余页，重心已从方法移到教育批判。\n证据：原文——人一定要有偶像／人一定要有「成功像」／人一定要有「自画像」。\n启示：这是一本方法书伪装成的理论书，重量全部落在可执行的动作上。"},{"b":"想象力统治世界","n":"#08","a":"免疫档案","d":"第一域·解剖型运算","t":"结论：这本书有一套五层免疫系统，专门用来吸收批评，核心机制是把证伪转移到使用者身上。\n发现：1)预先设防：在宣称想象万能后立刻补一句，强调按客观规律办事以避免产生想象万能的误解。2)诉诸权威：爱因斯坦、钱学森、拿破仑、稻盛和夫、七田真、岳晓东、马尔茨轮番出场。3)科学词汇护甲：脑科学、右脑、α波、遗觉像、IMAGERY、皮格马利翁效应。4)把失败解释为执行不当：练了没效是补强不足、坚持不够。5)把论敌人格化：批评者被写成套着思维紧箍咒的人、自以为是的大人。\n证据：原文——强调一定要按照客观规律办事，道法自然……避免了使人产生想象万能的误解。\n启示：免疫系统的第五层最有效，它让读者无法用失败来反驳这本书。"},{"b":"想象力统治世界","n":"#09","a":"沉积层切割","d":"第一域·解剖型运算","t":"结论：切剖面可见三层沉积：中国古典权谋与工程故事、苏联东欧心理训练与日本右脑热、2000年代中国教育焦虑。\n发现：1)底层：苏东坡以湖泥筑长堤、丁渭修复汴梁皇宫、楚襄王献东地五百里、惠能顿悟、诸葛亮静以修身。2)中层：心理训练1950年从苏联开始，起因是控制航天员的紧张，后推广到东德与东欧；日本一侧是七田真、春山茂雄、田中孝显。3)表层：1994年索尼概念设计大赛、1998年某省高考作文题、2004年北京科幻征文。4)三层之间无过渡，直接并置。5)时代耗材层：磁带、MV、GMAT分数焦虑。\n证据：原文——心理训练是从苏联时代开始的……因为需要控制飞向未知宇宙的航天员们心理的不安和紧张。\n启示：右脑神话是1990年代的输入品，被焊在中国古典谋略叙事上。"},{"b":"想象力统治世界","n":"#10","a":"信噪分离","d":"第一域·解剖型运算","t":"结论：信号在操作层，噪声在机制层。把「为什么有效」的整层解释删掉，这本书反而更可用。\n发现：1)有效信号是四条：否定句改肯定句、熟练动作的心理演练、图像化记忆与间隔复习、考前与赛前预演。2)噪声集中在解释层：波动、共振、宇宙能量、宇宙意识。3)书引用斯泰那「全部的宇宙能量都包含在人类的精神中」来解释梦想成真。4)伪量化也是噪声：心像比语言力量大1000倍、左脑仅存三五十年的信息是右脑的十万分之一、像的速度是语言的100万倍。5)信号与噪声在同一段混排，读者难以分离。\n证据：原文——感情是波，思考是波，肉体是波，物质是波，而将它们一个个连接起来的还是波。\n启示：分离之后可见，四条技法都不依赖那条波动机制而成立。"},{"b":"想象力统治世界","n":"#11","a":"建筑翻译","d":"第二域·翻译型运算","t":"结论：当作建筑看，这是一栋先盖楼层后补地基的楼：门厅是拿破仑的象棋故事，穹顶是第十四章的四大法则。\n发现：1)门厅用故事而非定义引入，读者先被情绪捕获再被要求接受概念。2)承重墙「思像」只在前言与第十四章浇筑，中间层用「想象」顶替。3)楼梯是每章末尾的牛刀小试，层层设置形成节奏。4)穹顶的四大法则——因果法则、真像法则、相印法则、吸引法则——到全书最后一章才安装。5)地下层是丹田呼吸、白光心像、百会进气、α波，与主体结构无承重关系却占了整节。\n证据：原文——思像的四大法则 因果法则 真像法则 相印法则 吸引法则。\n启示：这栋楼住得人不少，但地基是最后才补上的。"},{"b":"想象力统治世界","n":"#12","a":"生态系统翻译","d":"第二域·翻译型运算","t":"结论：把书当生态系统，它是单一命题的 monoculture：基石物种是心像，入侵种是右脑神话，多样性为零。\n发现：1)基石物种「心像」一旦移除，书中所有案例同时失去解释力。2)优势种是名人成功案例：拿破仑、爱因斯坦、高斯、爱迪生、卡鲁索、乔丹、原一平、韦尔奇、稻盛和夫。3)入侵种右脑神话繁殖力最强，遍布各章：10万倍、100万倍、五百万年信息。4)分解者是牛刀小试练习模块，把案例拆成可模仿动作维持循环。5)灭绝风险集中：所有物种只证明同一条命题，没有制衡物种，抗扰动能力近于零。\n证据：原文——右脑是想象脑……「像」的速度是语言的10万倍，最新说法是100万倍。\n启示：单一命题的生态系统长得快，也倒得快。"},{"b":"想象力统治世界","n":"#13","a":"乐谱翻译","d":"第二域·翻译型运算","t":"结论：全书的节奏是四拍一小节——断言、故事、原理、练习——重复约三十次，节与节之间的论证是断开的。\n发现：1)最短的小节在第一章：魔咒—心像是大宝藏—两个实验—角色定位。2)第五章是变奏：全位、合位、组位、联位、换位、套位、跳位、归位，像一组八度音阶。3)第二部分出现长音：1995年3月5日阿拉斯加库克湾的坠机叙事连续占三节。4)反复记号：每当论证将断，就插入一句「想象力统治世界！」独立成段。5)尾声把调性从个人升到人类：思像可以改变历史的轨迹。\n证据：原文——用实验来说话／实验一 精神与肉体的较量／实验二 想象变成实际的力量。\n启示：读这本书要按小节读，不要按论证读——论证在节与节之间并不连通。"},{"b":"想象力统治世界","n":"#14","a":"化学翻译","d":"第二域·翻译型运算","t":"结论：反应式为：语言输入→（成像）心像→（补强）信念→行动；催化剂是放松，抑制剂是否定句。\n发现：1)最重要的反应规则是否定句必须转成肯定句：不要吵换成请安静，不要把球打进水里会先生成入水画面。2)作者给出反应机理：每一次告诫都是对那一画面的又一次描绘，线条更清了，印痕更深了。3)温度条件是呼吸：8秒吸—8秒屏—8秒呼，最终目标是20秒三段的一分钟呼吸以进入α波。4)催化剂中毒的典型是父母的「不准不要」与教师的几不准几不要。5)副产物未被标明：把不成功归因于心像不纯，可能生成自责。\n证据：原文——你每一次对自己要忘记的告诫，都是对屎这一画面的又一次描绘。\n启示：最有化学价值的不是产物，而是那条否定句转换的反应规则。"},{"b":"想象力统治世界","n":"#15","a":"地形翻译","d":"第二域·翻译型运算","t":"结论：地形是广袤平原加一座术语丘陵：第三到五章是方法密集的高原，第十三章是术语沼泽，第十四章是悬崖。\n发现：1)低谷是前言与第一章，情绪最烈而论证最薄。2)高原区密布意象训练：单项感觉意象、多感官综合意象、抽象思维、因果追溯、鹰视、周边视觉、意识渗入物体、视商。3)沼泽是第十三章，术语彼此重叠：摄像、思像、遗觉像、顿悟、感应、共振、再现几乎是同一件事的七个名字。4)最高峰不是理论峰而是清单峰：第七章连排六个「人一定要有……像」。5)地图上无路标：全书无索引、无参考文献、无一张图表。\n证据：原文——摄像——人脑运行的方式／思像——学习的真正方式／遗觉像——思像的重要方式。\n启示：全书真正的险峰在最后一章，那里地形陡变而护栏最少。"},{"b":"想象力统治世界","n":"#16","a":"电路翻译","d":"第二域·翻译型运算","t":"结论：电路图是：感官输入→右脑图像处理→心灵照片库存取→行动输出，开关是暗示，接地端是放松。\n发现：1)输入端被硬性规定优先级：视觉是唯一与大脑直接联系的感觉器官，其他信息需经视觉神经细胞传导。2)大脑被描述为一台特殊的计算机，建筑工程师的例子把它当作图像存取系统使用。3)开关隐喻：需要信息时通向它的开关自动打开，取不出时便逐个打开存入时的开关。4)短路保护被写成操作规则：只往对自己有利的一方面去想，思想不同意就一再与它商量。5)接地端是丹田呼吸、静坐、冥想与α波。\n证据：原文——它们都会向大脑这台特殊的计算机输入，并存储起来。一旦当他需要这些信息时，通向这些信息的开关便会自动打开。\n启示：最脆弱的元件是「右脑即图像处理器」这个被流行读物过度简化的黑箱。"},{"b":"想象力统治世界","n":"#17","a":"法律翻译","d":"第二域·翻译型运算","t":"结论：当作法典读，它的宪法是拿破仑那句口号，实体法是四大法则，责任条款把一切后果归于个人内心。\n发现：1)宪法条文来源可疑：「想象力统治世界」被反复引用，全书未给出处。2)第一实体法因果法则把外部原因全部内化：心灵中储存的心像，是你外在的一切的根源和动力。3)责任条款最重：引稻盛和夫「自己心上没有一把刀的话，我们决不会死于刀下」，把受害解释为内心召唤。4)程序法要求每日执行：以20分钟为单位放电影，一天至少三次，最好五六次。5)无免责条款也无上诉程序：无效者被判为补强不足。\n证据：原文——一切事情，吉凶祸福，得失成败，都不要局限于从外面去探寻原因，而要从内心深处去追根溯源。\n启示：这部法典最该被质疑的一条，是它把结构性问题全部翻译成个人心像问题。"},{"b":"想象力统治世界","n":"#18","a":"菜谱翻译","d":"第二域·翻译型运算","t":"结论：当菜谱读，主料是目标与图像，辅料是放松与莫扎特，火候是重复次数，装盘是行动。\n发现：1)开胃菜是建一个想象图片库：相册、奇幻电影、超现实纪录片《鸟的迁徙》《帝企鹅日记》。2)步骤化最彻底的两道菜给到秒数：丹田呼吸8—8—8秒，最终20—20—20秒。3)「苹果之旅」是一道完整菜：看苹果、闻泥土、听风与雨、尝果汁，最后「现在它在你的身体里面，变成你」。4)重复次数的配方明确：以20分钟为单位放映，一天三次到六次。5)火候提示只有一句：贵在坚持，重在体验，不断补强，水滴石穿。\n证据：原文——最终目标是用20秒呼气、20秒吸气、再屏住呼吸20秒钟这样一个一分钟呼吸过程。\n启示：这本书真正可口的不是结论，而是这些带秒数和次数的配方。"},{"b":"想象力统治世界","n":"#19","a":"病理翻译","d":"第二域·翻译型运算","t":"结论：它的病理学写得比疗法扎实，因为它在这里有可观察的现象，而不只是断言。\n发现：1)切片一：黑板上一个圆圈，一年级答句号、月亮、烧饼、乒乓球、老师生气的眼睛；初中生答零；大学生哄堂大笑拒绝回答；机关干部看领导脸色。2)切片二：雪融化了是什么，答春天被判错，答案是泥水。3)切片三：花儿为什么有多种颜色，孩子说太阳就不喜欢了，主持人用胡萝卜素给出正确答案。4)病原被岳晓东定为思维标准化与知识无活力化等四因素，书只重点引前两项。5)转移灶：内华达州伊迪丝3岁认识字母O，其母起诉幼儿园剥夺想象力。\n证据：原文——当问到大学生时，他们哄堂大笑，拒绝回答这个只有傻瓜才会回答的问题。\n启示：病理部分之所以读来可信，是因为它描述的是真实现象，而不是疗效承诺。"},{"b":"想象力统治世界","n":"#20","a":"战争翻译","d":"第二域·翻译型运算","t":"结论：这是一部心战手册，作者的前作就叫《心兵法》，全书气质由战争词汇而非科学词汇决定。\n发现：1)核心战法：以心克心、意念自杀、消灭其心，最厉害的办法不是消灭肉体而是使其绝望。2)敌我识别：敌人是自己的负面心像、杂念与定式。3)战场在头脑：用想象力发动头脑里的战争，消灭你的敌人。4)战术单位是思想照片：先把所思所想拍下来，再审视是不是发霉了、是不是太阴暗了。5)经典战例被重新解释：淝水之战的苻坚被说成开战前就已失败，拿破仑败于路径依赖而库图佐夫的焦土战略是打破路径依赖。\n证据：原文——用想象力发动「头脑里的战争」，消灭你的「敌人」。\n启示：战争翻译最能解释这本书的气质：它不解释世界，它要在你脑中打一场仗。"},{"b":"想象力统治世界","n":"#21","a":"极端读者攻击","d":"第三域·应力测试型运算","t":"结论：最敌意的读者会说，这是一本把流行心理学、右脑神话、气功呼吸法、成功学清单和教育焦虑拼在一起的商业读物。\n发现：1)全书无一处给出可核查的引用坐标：159位癌症患者、篮球实验、凡戴尔投镖都无文献。2)书中写爱迪生一生获得13项专利，与通行数字相差两个数量级，说明无事实核查环节。3)艾宾浩斯遗忘数据被写成第一个20分钟后遗忘40%、30天后遗忘25%，与遗忘曲线的常识顺序相反。4)布莱克斯利的相关系数写作0.8却仍被当作不相关。5)自称研究成千上万个案例、读数千本书，却没有一份案例清单。\n证据：原文——一生获得13项专利，他就是发明大王爱迪生。\n启示：敌意读者的火力几乎全部落在数据层，而不是理念层。"},{"b":"想象力统治世界","n":"#22","a":"基础假设反转","d":"第三域·应力测试型运算","t":"结论：把「心像是心灵的主宰」反转为「心像是处境的产物」，书中多数案例立刻有了更朴素的解释。\n发现：1)反转后瓦伦达之死可解释为高龄高危表演的风险事故，而书中未提供年龄等背景信息。2)反转后159例患者延长20多个月可解释为安慰剂、期望效应与选择偏差。3)反转后日本人从王进喜照片推断大庆位置，证明的是情报机构的图像推理传统，不是思像。4)反转后拿破仑的失败先由物质条件造成——书自己也列举了路湿泥泞、大炮难行、严冬断补给。5)反转后最需防范的是：把结果归因于心像会遮蔽结构性原因。\n证据：原文——拿破仑为什么兵败？一个不可忽视的原因是路湿泥泞，大炮难行。\n启示：假设一反转，那些历史案例就全部从心理学回到了历史学。"},{"b":"想象力统治世界","n":"#23","a":"历史穿越测试","d":"第三域·应力测试型运算","t":"结论：把书送到1959、1979、2059三个年份，可见它的九成材料是时代耗材，一成是长销洞见。\n发现：1)1959年：右脑分工研究与马尔茨的自我意象理论尚未普及，此书不成立。2)1979年：中国刚派访问团赴美考察初级教育并写三万字报告，此书会带着强烈的改革气息。3)2009年出版：右脑开发热、成功学热、MBA热、创造力焦虑四股潮流同时到顶，商业窗口最宽。4)2059年的读者会读不懂磁带、MV、GMAT三段论据，却仍能认出圆圈测试与雪化了是春天的教育批判。5)穿越中最稳的是前言的两个故事：象棋藏图与瓦伦达的钢索。\n证据：原文——1979年6月，中国曾经派一个访问团去美国考察初级教育。回国后，写了一份三万字的报告。\n启示：时间一拉长，就能分清哪些论据是租来的、哪些是自己的。"},{"b":"想象力统治世界","n":"#24","a":"反向工程","d":"第三域·应力测试型运算","t":"结论：从成品倒推，制作流程是先有案例库存与练习模块，最后才补上概念。\n发现：1)第一步定标题：取拿破仑那句想象力统治世界，够大、够可引、够做书名。2)第二步造概念：发明「思像」并与想象、心像三分，取得术语的拥有权。3)第三步配案例库：按拿破仑、爱因斯坦、爱迪生、高斯、乔丹、稻盛和夫、岳晓东分类囤积。4)第四步切章：用「位」字系列把一章撑成八节。5)第五步加交付物：每章末尾配牛刀小试与相关链接，把理论转成可交付的产品。\n证据：原文——全位——统筹想象活全局／合位——「四不像」想象解危机／归位——原点思维是妙方。\n启示：倒推下来，概念是后加的帽子，案例与练习才是先有的库存。"},{"b":"想象力统治世界","n":"#25","a":"边界条件探测","d":"第三域·应力测试型运算","t":"结论：全书只给出一条边界条件，而用这一条支撑了一整本无边界的书。\n发现：1)唯一的边界：想象运动必须具备一个前提条件，就是操作者本身必须熟悉所想象的动作，必须对想象运动的内容有过体验。2)这条前提只出现一次，此后所有训练推广都不再复述。3)对末期病患，书自己写想象力并不直接治愈疾病，却仍把想象疗法放进治疗叙事且无禁忌提示。4)对抑郁、创伤、精神病性症状全书无任何提示。5)对儿童，一边呼吁保护想象力，一边要求一天三次放映式复习。\n证据：原文——想象运动必须具备一个前提条件，就是操作者本身必须熟悉所想象的动作。\n启示：一条被埋没的前提条件，恰恰是全书唯一经得起检验的严谨之处。"},{"b":"想象力统治世界","n":"#26","a":"沉默者的声音","d":"第三域·应力测试型运算","t":"结论：沉默者名单里人数最多的一类是方法无效者，而他们的缺席正是这本书得以成立的前提。\n发现：1)练了没用的人：全书只给一个解释，补强不足、坚持不够。2)接受想象疗法仍去世的患者：159例只报平均数，不给分布与中位数。3)被引用者的原意：爱因斯坦说想象力比知识更重要是在谈科学研究中的直觉，不是谈意念致效。4)被当反面教材的孩子：说出雪化了是春天的学生只作为判错的证据出现，没有他的后续。5)大庆油田案例中的日本情报团队：书中把它写成个人思像的胜利，隐去了机构作业。\n证据：原文——老师说：「错。答案是泥水。」\n启示：给沉默者一个位置，这本书的论证强度会立刻下降一半。"},{"b":"想象力统治世界","n":"#27","a":"反事实推演","d":"第三域·应力测试型运算","t":"结论：抽掉作者身份与名人案例后，书变薄但不断裂——留下的四条技法仍可独立使用。\n发现：1)若无《心兵法》的畅销背书，封面第一行卖点消失，开局论证资源大幅缩水。2)若无「心放效应」这一自命名概念，作者的笔名就无法变成理论资产。3)若没有十几年读数千本书与自考经历的自述，书中大量跨学科引用将失去可信来源。4)若不是2009年出版，磁带、GMAT、MBA文凭等于翻倍年薪三段论据会同时失效。5)若删掉全部名人案例，剩下可用内容约为四类技法：否定句转换、图像记忆、预演放松、位置变换。\n证据：原文——我研究哲学、心理学、脑科学成功学等，十几年来读了数千本书，边读书边摸索总结。\n启示：反事实推演显示，名人案例与作者身份实际承担了论证功能。"},{"b":"想象力统治世界","n":"#28","a":"十年后审判","d":"第三域·应力测试型运算","t":"结论：十年后这本书的主体塌陷在脑科学那一层，存留下来的是故事层与动作层。\n发现：1)通俗版的左右脑分工已被广泛批评为左脑右脑神话，书的科学支柱随之失效。2)对MBA与GMAT的批判在十年后已成常识，而芝加哥大学商学院巴贝丝提出的想象力指数并未成为任何商学院的评估标准。3)中国学生的国际设计竞赛成绩此后大幅改善，1994年索尼大赛的论据已不能再用。4)留存下来的四条技法——否定句转换、心理预演、图像化记忆、间隔复习——都在后续研究中得到支持。5)最没有时效损失的是前言的两个故事，因为它们本来就不靠数据。\n证据：原文——21世纪是右脑开发的世纪。\n启示：凡以年代命名的断言，都会在该年代过去后变成证据。"},{"b":"想象力统治世界","n":"#29","a":"概念图谱","d":"第四域·网络/关系型运算","t":"结论：概念图谱共七层，但只有前三层有定义，后四层靠比喻连接。\n发现：1)作者明确三分：想象是自发的心理活动；思像是将用脑活动尽可能转变为图像画面来进行；心像是心灵图像，经常用为名词。2)第四层自我意象借自马尔茨，指人对自我形成的形象。3)第五层原型：被说成储存于心底的相片，与思想共振时浮现。4)第六层真像：模型越来越接近真理——原型，即为真像。5)第七层黄金位：借自格乌司草履虫生态位实验，指自己的最佳时间与空间位置。\n证据：原文——我们要善于将想象、思像和心像这三个概念区分开来。\n启示：图谱的真正断点是第三层与第四层之间，那里靠的是引用而非推导。"},{"b":"想象力统治世界","n":"#30","a":"影响涟漪","d":"第四域·网络/关系型运算","t":"结论：涟漪从个人心像扩散到人类命运共五圈，每扩一圈证据密度下降约一个数量级。\n发现：1)第一圈个人：减肥、戒烟、面试、晨跑都靠想象具体场景推动。2)第二圈咨询个案：经理马亮三个月内车被盗、员工辞职、利润下滑，用重新定义与拍照转怒为喜。3)第三圈组织：全位想象被用于城市建设决策，引周干峙「最大的浪费是决策失误造成的」。4)第四圈教育：岳晓东的创造力四因素、1994年索尼大赛、高考作文的公式化虚假构思。5)第五圈人类：如果整个人类被打败，则一定是被自己的想象力所打败的。\n证据：原文——一个人被打败，往往是因为个人的智慧和力量不足……而如果整个人类被打败，则一定是被自己所打败的。\n启示：涟漪最外两圈已不是论证，而是宣言。"},{"b":"想象力统治世界","n":"#31","a":"思想谱系","d":"第四域·网络/关系型运算","t":"结论：谱系有四条，其中与本书论证方式最像的一条是日本右脑教育——同靠断言与案例。\n发现：1)美国自我意象与暗示传统：马尔茨《你的潜能》、皮鲁克斯、布里斯托镜子技巧、库埃自我暗示、罗森塔尔效应。2)日本右脑教育：七田真、春山茂雄、田中孝显《经营大脑》、郑赞容。3)苏联东欧心理训练：为控制航天员紧张而起，奥林匹克运动员采用心理训练始于原苏联。4)中国古典：惠能顿悟、老子道法自然、诸葛亮静以修身、曾国藩屡败屡战。5)本土合法性来自扉页钱学森题词：形象思维应当是我们当前研究思维科学的一项最重要的任务。\n证据：原文——享誉世界的日本右脑教育专家七田真在他所有的作品中无不论述想象的威力。\n启示：四条谱系中，只有第三条给出了清楚的历史传播路径。"},{"b":"想象力统治世界","n":"#32","a":"引用网络","d":"第四域·网络/关系型运算","t":"结论：引用网络越往机构层越稀疏，说明它借的是机构的名，而不是机构的数据。\n发现：1)题词层：爱因斯坦、钱学森、拿破仑，构成全书的合法性三脚架。2)权威层：稻盛和夫、韦尔奇、岳晓东、七田真、马尔茨、罗森塔尔、布里斯托、库埃、巴贝丝。3)古人层：老子、诸葛亮、苏轼、朱熹、梁启超、曾国藩、惠能、笛卡尔。4)案例层：高斯、爱迪生、卡鲁索、纳斯美瑟、乔丹、原一平、韩升君、张欣、瓦伦达、弗兰克。5)机构层：世界卫生组织1995年脑的十年、美国国会脑研究十年、欧共体脑研究计划，以及斯坦福、慕尼黑、西北、哈佛、芝大商学院。\n证据：原文——世界卫生组织于1995年在全球开展了「脑的十年」运动……美国国会已将「脑研究十年」批准为法律执行。\n启示：机构名在书中只作背景板，从未附上一次数据。"},{"b":"想象力统治世界","n":"#33","a":"术语地图","d":"第四域·网络/关系型运算","t":"结论：术语分四类——自造、挪用、误用、空转；凡带数字的术语几乎都不可核查。\n发现：1)自造术语都有操作定义：思像、心放效应、黄金位、真像、心兵法训练、以及八种位。2)挪用术语来自真实现象却被放大：遗觉像确实存在于部分儿童，书中把它推广为普遍学习方式。3)误用术语承担科学外观：右脑储存人类五百万年信息、像的速度是语言的100万倍。4)空转术语集中在第十三章的排比标题：摄像、思像、遗觉像、顿悟、感应、共振、再现，彼此界限模糊。5)唯一配了自测的术语是视商：得分在16—20分之间表明视商非常出色。\n证据：原文——想象训练培养100万倍于左脑的右脑照相记忆。\n启示：术语地图上，自造术语可执行，误用术语不可核查，二者界限很清楚。"},{"b":"想象力统治世界","n":"#34","a":"逻辑依赖树","d":"第四域·网络/关系型运算","t":"结论：树根是断言不是论证；砍掉树根，树叶仍然能活。\n发现：1)树根：心像是心灵的真正主宰，全书从未证明，只反复陈述。2)唯一机制命题：我们的神经系统无法区分实际的经验和想象出来的经验。3)分枝三的证据来自运动演练、临床想象疗法与教师期望效应，三条领域不同、强度参差，却被并列使用。4)分枝四从个人训练跳到教育、管理、文明，中间无逻辑通道，靠想象力统治世界这句口号完成跳跃。5)树叶——否定句转换、预演、图像记忆、位置变换——反而不依赖树根成立。\n证据：原文——因为我们的神经系统无法区分实际的经验和想象出来的经验。\n启示：这是全书论证的奇特点：结论最不可靠，末端的技法最可靠。"},{"b":"想象力统治世界","n":"#35","a":"权力结构图","d":"第四域·网络/关系型运算","t":"结论：权力结构呈单向放射状，读者没有反馈通道——这是所有自助类读物的通病。\n发现：1)作者是立法者兼教练：我跟他谈了一个半小时，将想象操作方法讲给他听，渐渐地他转怒为喜。2)读者是被塑者：被要求每日执行，大声诵读成功语录卡、录自我养成磁带、早晚两次镜子技巧。3)名人是授权者，被单向引用，从不作为对话对象。4)批评者被人格化为套着思维紧箍咒的人，而非具体论敌。5)隐形甲方是策划方北京兴盛乐与32元的大众市场。\n证据：原文——请你把下面的成功语录卡复印几份，贴到记事本里，一日几次地大声朗读。\n启示：放射状结构使书无法被读者证伪，只能被执行或被放弃。"},{"b":"想象力统治世界","n":"#36","a":"逆向因果重写","d":"第五域·时间型运算","t":"结论：把因果倒过来重读，全书只有皮格马利翁效应经得起反转检验。\n发现：1)原叙事心像败相导致失败，倒过来是反复的失败塑造了负面心像——瓦伦达高龄仍在走高空钢索，风险本身足以解释事故。2)原叙事想象疗法延长生命，倒过来是愿意每天三次坚持的人本就是依从性高、预后较好的一群。3)原叙事罗森塔尔名单使学生进步，这一条因果方向反而成立：教师期待改变对待方式，进而改变学生表现。4)原叙事成功者靠清晰心像成功，倒过来是成功后的人倾向于把过程叙述为心像清晰。5)原叙事心不召唤灾难就不会来，倒过来读是把随机伤害归因于受害者。\n证据：原文——八个月过后，奇迹出现了，凡是上了名单的学生，成绩都有了较大进步。\n启示：唯一经得起反转的那条，恰好是全书唯一给了实验设计的那条。"},{"b":"想象力统治世界","n":"#37","a":"考古碎片重组","d":"第五域·时间型运算","t":"结论：拼合散落的自述碎片可见，这本书是作者为自己青年时代的记忆之苦找到的解法，然后推广给所有人。\n发现：1)碎片一：中学几乎总考全校第一，但也并未感到学习有多少乐趣。2)碎片二：自考汉语言文学专业那繁多的记忆，令我感到苦累、烦，咬牙坚持才毕业。3)碎片三：研究拿破仑、斯大林主要不是研究军事谋略，而是研究他们的心路历程，研究过成百上千的杰出人物。4)碎片四：像神农尝百草一样，边读书边摸索总结。5)碎片五：先在《心兵法》中论述思像，后在多个高层论坛交流并获奖。\n证据：原文——在自考中，汉语言文学专业那繁多的记忆，令我感到苦累、烦，但又不能不咬牙坚持，才好不容易毕了业。\n启示：最深的那块碎片解释了全书的核心技法为何恰是拍照与放电影。"},{"b":"想象力统治世界","n":"#38","a":"预言逆推","d":"第五域·时间型运算","t":"结论：预言命中率低，唯一方向正确的那一条恰好是它借来的，而不是自创的。\n发现：1)预言一：21世纪是右脑开发的世纪，依据只是美国、日本已取得一定的成绩。2)预言二：教育将发生21世纪人的革命，枢纽是思像。3)预言三：新能源拯救人类——此处的能源指人脑潜能而非能源技术，是书名与章节标题之间最大的语义落差。4)预言四：想象力将超越一切武力、思想力、文化力，成为建设和谐世界最强大的内在力量。5)被验证方向正确的是：形象化、项目式、问题意识导向的教育改革此后确被反复提倡。\n证据：原文——「新能源」拯救人类……21世纪是右脑开发的世纪。\n启示：预言里最像预言的那条是偷换概念造出来的。"},{"b":"想象力统治世界","n":"#39","a":"半衰期分类","d":"第五域·时间型运算","t":"结论：按半衰期排序，这本书的古代故事层比它的科学层更耐放。\n发现：1)极短约五年：磁带、MV、《帝企鹅日记》、GMAT分数焦虑、MBA文凭等于翻倍年薪。2)较短十到十五年：右脑神话、α波训练、白光心像、丹田呼吸的宇宙能量解释、1994年索尼大赛的比较。3)中等三到五十年：马尔茨自我意象、罗森塔尔效应、心理演练对熟练动作的作用、艾宾浩斯式的复习节奏。4)极长：拿破仑象棋藏图、瓦伦达心态、高斯不知题名而解之、达芬奇默画壁画、惠能顿悟、苏东坡以淤泥筑堤。5)负半衰期：右脑储存五百万年信息，越久越显其伪。\n证据：原文——（相关链接）想象训练培养100万倍于左脑的右脑照相记忆。\n启示：半衰期最短的，恰恰是当年最像科学的那一层。"},{"b":"想象力统治世界","n":"#40","a":"进化模拟","d":"第五域·时间型运算","t":"结论：让这本书自我复制与变异，结果是概念与技法存活，机制解释被淘汰。\n发现：1)第一代变异保留概念层，因为思像、心像、想象的三分是作者的产权。2)第二代变异替换脑科学层：右脑神话退场，换成心理意象与运动表象的研究语言。3)第三代变异更新案例层：乔丹换人，磁带换成手机录音与提醒推送。4)退化器官：丹田呼吸、白光心像、宇宙能量在选择压力下萎缩消失。5)强化器官：否定句转换规则、八种位置变换、预演技术会被吸收进创造力与沟通训练课程。\n证据：原文——变以往线性的理性的思维为主而成为直觉的图像的思维为主。\n启示：进化后存活下来的，是那些本来就不依赖右脑理论的部分。"},{"b":"想象力统治世界","n":"#41","a":"前传生成","d":"第五域·时间型运算","t":"结论：前传是《心兵法》，读了前传才知道本书的战争词汇不是修辞，而是它原始的世界观。\n发现：1)封面第一行即前传背书：畅销书《心兵法》作者再次揭示心灵的力量。2)作者自述思像在我撰写出版的《心兵法》一书里也专门论述过。3)前传母题在前言完整复现：以心克心、意念自杀、消灭其心、哀莫大于心死。4)前传的方法论是军事化比喻，本书把它软化为教育与管理的语言。5)前传余音在第十一章正式登场：心兵法训练被定义为运用心力和心能进行训练的方法。\n证据：原文——要理解和掌握心兵法，就要掌握心兵法训练……就是运用心力和心能进行训练的方法。\n启示：本书是前传的民用版：同一套心战词汇，换上了教育与管理的外衣。"},{"b":"想象力统治世界","n":"#42","a":"续集生成","d":"第五域·时间型运算","t":"结论：续集最难写的不是新内容，而是必须补上这一代缺失的失败一章。\n发现：1)第一章必须处理右脑神话破产，改称全脑协同并引入心理意象的研究语言。2)第二章把想象疗法改写为辅助放松手段，补上对照实验、效应量与随访数据。3)第三章把磁带与成功语录卡改成手机提醒与每日记录。4)第四章补上全书最大缺口：一份失败者报告，说明练了三个月无效的人断在哪一步。5)第五章把教育批判从1994年索尼大赛更新到新的项目式学习实践。末章仍会回到新能源拯救人类，但须改成可被证伪的命题。\n证据：原文——在思像理论及训练中，没有失败，失败在头脑中被思像删除了。\n启示：这一代把失败删掉了，所以续集只能从补写失败开始。"},{"b":"想象力统治世界","n":"#43","a":"种子句培育","d":"第六域·生成型运算","t":"结论：全书由五句种子长成，其中最肥的一句是一条就撑起了三个可操作技法。\n发现：1)种子A「想象力统治世界」（归于拿破仑）：长成书名与三大部分的主题句。2)种子B「我们的大脑是很傻很傻，很懒很懒的，你告诉它什么，它就照单接收什么」：长出否定句转换、成功语录卡、镜子技巧三条技法。3)种子C「想象就是思想成像」：长成思像概念与全部训练。4)种子D「人们过去作出的选择决定了他们现在的选择」：长出拿破仑的大炮与库图佐夫的焦土战略两节。5)种子E「想象力比知识更重要」：长成第三部分全部教育批判。\n证据：原文——我们的大脑是很傻很傻，很懒很懒的，你告诉它什么，它就照单接收什么。\n启示：五句种子里只有B可以脱离原书理论独立成活。"},{"b":"想象力统治世界","n":"#44","a":"逆工程工具箱","d":"第六域·生成型运算","t":"结论：从书里可拆出五件工具，前四件都能脱离原书理论单独使用。\n发现：1)工具一否定句转肯定句：不说不要把球打进水里，改想球落果岭的画面；不说不准打架，改说爱护同学。2)工具二20分钟放电影：把当天所学以20分钟为单位在脑中放映，一天三次到六次。3)工具三位置变换八法：全位统筹、合位把对立要素合一、组位组合、联位触类旁通、换位换位置、套位成链、跳位跨越、归位回原点。4)工具四预演：先做编剧与演员，把可能出现的情况一一在头脑中上演。5)工具五素材库：建相册式想象图片库、听莫扎特、逛书店看书名推想内容。\n证据：原文——所谓放电影，就是以20分钟为一个单位，将所学知识在头脑中放映一遍。\n启示：工具箱的真实价值在于：它不需要你相信右脑神话就能用。"},{"b":"想象力统治世界","n":"#45","a":"问题发生器","d":"第六域·生成型运算","t":"结论：这本书生成的好问题比它给出的答案多，问题集中在边界与归因两处。\n发现：1)如果神经系统无法区分实际与想象的经验，那么创伤闪回为何会持续造成伤害？2)如果在思像的字典里没有不字，危险情境下的规避判断由谁来做？3)如果心像是外在一切的根，那么结构性贫困与疾病的成因如何安置？4)如果右脑储存人类五百万年信息，为何考古与教育仍必须依赖外部记录？5)如果想象力人人天生充足，为何它在不同教育与经济条件下的分布差异如此之大？\n证据：原文——在思像的字典里没有「不」字！在思像的训练中没有NO！\n启示：这本书最大的贡献或许是它无意中暴露的这五个未解问题。"},{"b":"想象力统治世界","n":"#46","a":"隐喻引擎","d":"第六域·生成型运算","t":"结论：隐喻引擎的核心是摄影隐喻，它把不可观察的思维过程伪装成可观察的成像过程。\n发现：1)摄影隐喻族：思想拍照、冲洗成思想照片、放电影、倒放心灵电影、大脑摄像、照相记忆、过目不忘。2)军事隐喻族：头脑里的战争、消灭敌人、心兵法、万人敌、以心克心。3)雕塑隐喻族：我是我的雕塑师；人生像一块石头，你把它刻成神仙或是魔鬼悉听尊便。4)磁与波隐喻族：思想是思想的磁场、思念力如磁铁、波动、共振。5)容器隐喻族：把乱麻卷进包袱扔掉、把难题锁进心灵的抽屉。\n证据：原文——想象就是思想的磁场，一旦形成强大的磁场效应，你梦想的东西就会被吸引过来。\n启示：隐喻密度最高的地方，论证密度最低——两者在全书成反比。"},{"b":"想象力统治世界","n":"#47","a":"空白章节","d":"第六域·生成型运算","t":"结论：应该写而没有写的五章，恰好都是会让论点变复杂的章节。\n发现：1)第一章《想象失败报告》：练了三个月无效的人，断在哪一步。2)第二章《心像的伦理边界》：当心像是外在一切的根源被用于解释疾病与事故时，对受害者意味着什么。3)第三章《右脑神话的来源》：裂脑研究如何被流行读物放大成左右脑性格学。4)第四章《从图像到行动的接口》：动机、环境、资源各占多大权重。5)第五章《给教师的反面意见》：如果标准答案有害，考试与课程如何设计才不牺牲学科基础。\n证据：原文——我们之所以会遇到灾难而受伤害，是因为这灾难与我们自己内心的状态具有某种类似性。\n启示：空白章节的共同点是，它们都会让这本书不再是一本易读的书。"},{"b":"想象力统治世界","n":"#48","a":"实验设计","d":"第六域·生成型运算","t":"结论：书里其实已经给出了实验的雏形，它只差一个对照组和一份预先登记的方案。\n发现：1)命题：在熟练任务上，加入心理演练优于纯休息。2)原型设计是三组：实际练习组、无练习组、想象练习组，前后测，20天每天20分钟，投不中时在想象中纠正。3)关键改进一：补第四组想象不相关场景，以控制安慰剂与期望效应。4)关键改进二：指标用进球增加百分比、盲法评分与延迟一周的保持测试。5)对想象疗法的检验：随机分组、盲法评估、报告生存期中位数与分布而非只报平均延长月数，并预先登记方案。\n证据：原文——第一组每天实际练习20分钟，进球增加了24%。第二组因为没有练习，也就毫无进步。\n启示：把书中的轶事补上一个对照组，它就从故事变成了证据。"},{"b":"想象力统治世界","n":"#49","a":"操作系统提取","d":"第六域·生成型运算","t":"结论：底层操作系统是：图像优先的文件系统＋禁否定句的输入规则＋20分钟调度器＋覆盖式垃圾回收。\n发现：1)文件系统：所有经验以图像格式存储，可拍照、可放映、可倒放。2)输入规则：禁止否定式输入，因为否定句会先生成被禁止的画面。3)调度器：以20分钟为单位调度复习，一天三到六次。4)权限管理：思想需要管理，管不了思想就做不了主，要为思想设一个舵手。5)垃圾回收：用新的美好画面覆盖旧画面，书中称之为解铃还需系铃人，靠思像。内核版本：右脑优先、图像优先、重复补强。\n证据：原文——不加管理的思想会长草／管不了思想就做不了主／思想航行靠「舵手」。\n启示：这套系统最实用的模块是调度器与输入规则，内核是最该升级的部分。"},{"b":"想象力统治世界","n":"#50","a":"悖论收割","d":"第六域·生成型运算","t":"结论：全书收集到五个悖论，最结实的两条是真实现象，最虚的一条是作者自己造成的。\n发现：1)成功悖论：越是一心一定要成功，越容易失败，运动员、厨师、主持人都在此栽倒。2)遗忘悖论：越想忘记越记得牢，因为每一次告诫都是对那一画面的又一次描绘。3)放下悖论：要处处成像，又要连像也放下。4)意志悖论：明说毅力打不过想象，整个训练体系却靠贵在坚持与补强法则维持。5)自由悖论：弗兰克在集中营发现终极的自由，而这本书把这份自由又收回到一套每日必修的动作里。\n证据：原文——这里显然有一个悖论：我们一心要想做成的过于执著的事情，往往做不成。\n启示：悖论一与悖论二经得起检验，悖论三只是概念打架。"},{"b":"想象力统治世界","n":"#51","a":"最强反驳","d":"第七域·对抗型运算","t":"结论：最强的一击不是想象力无用，而是心像不是原因而是副现象——把指针当成了发动机。\n发现：1)心像往往是处境、训练与情绪的产物，把它当作原因，会遮蔽真正起作用的条件。2)书中唯一的机制命题「神经系统无法区分实际的经验和想象出来的经验」过强：若真无法区分，人就无法区分记忆与想象，而全书又要人主动分辨并替换图像。3)证据强度全线不足：159例无对照，凡戴尔投镖与篮球实验只被转述，右脑数字无来源。4)归因结构有伦理代价：自己心上没有一把刀的话我们决不会死于刀下，把受害者的处境转成内心责任。5)这一击不推翻技法：四条技法在弱解释下依然可用。\n证据：原文——心像比语言的力量大1000倍。\n启示：砍掉心像是主宰这根轴书会散架，砍掉右脑神话书只是变薄。"},{"b":"想象力统治世界","n":"#52","a":"死敌对话录","d":"第七域·对抗型运算","t":"结论：三轮之后对话必然卡在同一句上——那句尚未被人了解的渠道，正是全书的防弹玻璃。\n发现：1)对手说所有证据都可用期望效应与选择偏差解释；作者答想象疗法不是唯心的，大脑与免疫系统之间存在某种尚未被人了解的渠道，把举证责任转给未知。2)对手说右脑分工是流行神话；作者答钱学森说形象思维是思维科学最重要的任务，用权威换证据。3)对手说案例是事后挑选；作者答我研究了成千上万个案例，用数量回避质量。4)对手说你把失败归于个人心像；作者答本书强调发现真像、按客观规律办事，用一句限定句挡下全书倾向。5)对手说练了没效怎么办；作者答补强法则，坚持就会有效，不可证伪。\n证据：原文——想象疗法不是唯心的，心理学家认为，大脑与人体免疫系统之间存在着某种尚未被人了解的渠道。\n启示：这本书最擅长的不是回答质疑，而是把质疑转移到未知的领域。"},{"b":"想象力统治世界","n":"#53","a":"检察官摘要","d":"第七域·对抗型运算","t":"结论：起诉摘要共五项指控，量刑时会发现前四项是过失，第五项才是动机。\n发现：1)指控一以无出处的量化断言支撑核心主张：1000倍、10万倍、100万倍、五百万年信息、延长20多个月。2)指控二以不可证伪的条款处理失败：无效者一律判为补强不足、坚持不够。3)指控三把受害者处境归因于内心状态，且全书无任何伦理提示。4)指控四事实核查缺失：爱迪生13项专利、艾宾浩斯数据顺序倒置、相关系数写作0.8仍称不相关。5)指控五商业包装：以前作畅销背书、以读心放就放心为口号、把笔名做成心放效应。\n证据：原文——首部系统揭开想象力奥秘和想象训练神奇的力作。\n启示：前四项可以在再版中修订，第五项不可能修订，因为它是设计前提。"},{"b":"想象力统治世界","n":"#54","a":"误用档案","d":"第七域·对抗型运算","t":"结论：误用风险最高的不是技法，而是那条一切从内心追根溯源的因果法则。\n发现：1)误用一：用心像是外在一切的根源解释疾病与事故，导致患者自责与延误就医，而书中确实把想象疗法用于被宣布活不到一年的病人。2)误用二：把在思像的字典里没有不字用于风险管理与安全规程，压制必要的否定判断。3)误用三：要求孩子只许想正面结果，反而加重焦虑——书中瓦伦达案例本身就说明一定不能成功的念叨有害。4)误用四：只做头脑推演不做现场验证，恰与书中批评的纸上谈兵相悖。5)误用五：把丹田呼吸与白光心像包装成右脑开发课程收费，而它们本是放松练习。\n证据：原文——心像比语言的力量大1000倍。其最为突出的表现在于治疗疾病上。\n启示：技法本身风险低，风险来自那套把结果全部内化的解释框架。"},{"b":"想象力统治世界","n":"#55","a":"盲区报告","d":"第七域·对抗型运算","t":"结论：最大的盲区是它在同一页承认外部原因，又在下一页把原因收回到心像。\n发现：1)盲区一体差异：全书假设人人心像能力相同，只说要培养100万倍于左脑的照相记忆，未考虑无法形成视觉表象的人群。2)盲区二社会条件：把成败回收到心像，忽略了书中自己列出的决策失误与市场因素。3)盲区三负面想象的功能：焦虑预演在规划与风险规避中有用，书只把它当敌人。4)盲区四睡眠：讲记忆只讲放电影，不讲睡眠对记忆巩固的作用。5)盲区五教学内容：把创造力不足归于教学方法，未讨论知识基础与课程容量的约束。\n证据：原文——一个人被打败，往往是因为个人的智慧和力量不足；一个企业被打败，往往是因为决策失误或市场因素。\n启示：承认外部原因的那一句，是全书最清醒也最孤单的一句。"},{"b":"想象力统治世界","n":"#56","a":"时代偏见审计","d":"第七域·对抗型运算","t":"结论：审计结果显示，这本书的科学外衣与时代话语是同一年定做的。\n发现：1)偏见一：把左右脑性格学当作最新脑科学，书中称脑科学最新揭示右脑的心像就是意志力。2)偏见二：把日本右脑教育读物当作国际前沿，而七田真的流行期在1990年代。3)偏见三：对美国教育单向美化，引1979年访问团报告中「学生无论品德优劣、能力高低，无不趾高气扬」作为想象力教育的证据。4)偏见四：对MBA与GMAT的批判、对想象力指数的推崇，反映的是金融危机前后对商学院的质疑氛围。5)偏见五：把和谐社会、和谐世界的公共语汇直接写进想象力的功能描述。\n证据：原文——想象力将超越一切武力、思想力、文化力，超越一切边界，成为建设和谐人生、建设和谐社会、建设和谐世界的一种最为强大的内在的力量。\n启示：五年后失效的从不是论点，而是支撑论点的那批时代材料。"},{"b":"想象力统治世界","n":"#57","a":"拓扑分析","d":"第八域·形式/数学型运算","t":"结论：拓扑形状是一个以心像为中心的星形，章节之间几乎没有横向连接。\n发现：1)任意两章之间的最短路径都要经过中心节点心像，不存在章与章之间的推理边。2)第五章八种位之间是并列关系不是推导关系，可以任意调换顺序而不损失意义。3)第十三章的六个术语——摄像、思像、遗觉像、顿悟、感应、共振、再现——是同一个点的七重覆盖。4)唯一形成的环是放下到成像再到放下，由第一章与其余各章首尾相接。5)结构上的洞：没有一章讨论如果心像错了会怎样，这个洞使星形无法闭合。\n证据：原文——全位／合位／组位／联位／换位／套位／跳位／归位（八节并列，无先后依赖）。\n启示：星形拓扑决定了它便于随手翻阅，也决定了它经不起线性推敲。"},{"b":"想象力统治世界","n":"#58","a":"对称性分析","d":"第八域·形式/数学型运算","t":"结论：唯一被严格维持的对称是只找正面证据，而对称破缺恰恰就发生在那里。\n发现：1)对称一：前言以拿破仑败于心死开篇，末章以思像四大法则收尾，首尾同为抽象层。2)对称二：正面像与负面像严格对偶——用鲜花盛开的画面覆盖大粪的画面，成功像与败相对称。3)对称破缺一：正面例证数十则，反面例证几乎为零。4)破缺二：左右脑被写成完美对称的分工——语言逻辑对图像空间——而功能偏侧化不等于半球人格化。5)对称三：作者对东西方做对称处理，中国古代典故与欧美日本研究各占一半，互为背书。\n证据：原文——你干脆往自己的头脑中输入鲜花盛开的画面……将这个「大粪」的画面覆盖掉。\n启示：对偶做得越漂亮，那一处破缺就越刺眼。"},{"b":"想象力统治世界","n":"#59","a":"相变标记","d":"第八域·形式/数学型运算","t":"结论：全书经历五次相变，第三次最真实（换了一整套词汇），第五次最突然（换了一个数量级）。\n发现：1)第一次：前言从拿破仑被什么打败转到败相早已显露，叙事由历史转入心理。2)第二次：第四章人生可以打草稿，由解释世界转入改造个人。3)第三次：第六章引入自我意象，作者从技法教练变为身份重塑师，词汇整体更换。4)第四次：第十二章中国人不能不读的报告，由个人转入民族教育批判，语气由教练变为控诉者。5)第五次：第十四章新能源拯救人类，由教育转入人类命运，语气变为预言者。\n证据：原文——第六章 谁是你的统治者／自我意象是你生命的根。\n启示：相变处往往是借来的理论进场处：第三次借马尔茨，第四次借岳晓东。"},{"b":"想象力统治世界","n":"#60","a":"递归自检","d":"第八域·形式/数学型运算","t":"结论：用书自己的方法检验书本身，四条自检两通过两矛盾，比例恰好等于这本书的可靠度。\n发现：1)自检一从内心深处追根溯源：若用此规则读本书，会被引导去考察作者动机，结论指向概念产权与市场。2)自检二否定句会生成被禁止的画面：全书反复告诫不要失败、不要套上紧箍咒，按自身规则它恰恰在强化这些画面。3)自检三用新画面覆盖旧画面：这本书正是用成功像覆盖读者的败相，规则自洽。4)自检四放下：若真放下则不必日日放电影，规则与训练直接冲突。5)自检五位置变换：换到批评者的位置读本书，会得出第51卡的结论。\n证据：原文——千万不要以为想象训练如此简单，只要一练马上就有效……贵在坚持，重在体验，不断补强。\n启示：一本不敢用自身规则检验自己的书，读者就该替它做这件事。"},{"b":"想象力统治世界","n":"#61","a":"压缩极限","d":"第八域·形式/数学型运算","t":"结论：整本书的可压缩比很高，说明它的信息冗余大、论证密度低。\n发现：1)压到一句：心像是心灵的主宰，所以要主动把它拍成成功的画面并反复放映。2)压到一段：想象是自发的，心像是脑中的图像，思像是把思想主动转成图像的过程；转成之后要管理它、补强它、用新像覆盖旧像。3)压到一页：三类证据（运动心理演练、临床想象疗法、教师期望效应）加五类技法（否定句转换、放电影、位置变换、预演、素材库）加一条伦理告诫。4)压不动的是名人故事，压缩后只剩断言。5)最先消失的是右脑数字与宇宙波动，因为它们不承担任何操作功能。\n证据：原文——思像，思像，思之成像，是一个动态的过程。\n启示：能被压掉九成的书，说明它真正的内容只有一成。"},{"b":"想象力统治世界","n":"#62","a":"冗余定位","d":"第八域·形式/数学型运算","t":"结论：冗余全部集中在证据层而非技法层——它只有几条证据，所以必须反复使用。\n发现：1)冗余一：神经系统无法区分实际与想象的经验这一句在前言、第一章、第四章、第十一章重复出现四次以上。2)冗余二：爱因斯坦那句想象力比知识更重要在扉页题词、前言、第十二章各出现一次。3)冗余三：159位癌症患者的想象疗法段落与想象训练加快中风康复一节内容在书中重复出现。4)冗余四：八种位中有三种在操作中几乎相同——组位组合、联位触类旁通、套位想象之链。5)冗余五：第十三章六个术语标题彼此重叠，重复论证同一件事。\n证据：原文——想象疗法不是唯心的，心理学家认为，大脑与人体免疫系统之间存在着某种尚未被人了解的渠道。（该段在书中两次出现）\n启示：数一数重复次数，就能看出它手里究竟有几张牌。"},{"b":"想象力统治世界","n":"#63","a":"分形检测","d":"第八域·形式/数学型运算","t":"结论：分形结构让读者在任何一页翻开都看到同一张脸，这是它易读也是它空洞的原因。\n发现：1)宏观三段与中观章结构同形：断言—故事—原理—练习。2)章结构与段结构同形：一句结论、一个名人案例、一句想象力统治世界。3)案例内部也同形：困境—心像—反转—成功，马亮、原一平、59岁的沃尔特都是这个模板。4)最小分形单元是「像」：从心像到自画像到成功像到民族想象力，同一个字在不断放大。5)分形失效处：第三部分的教育批判没有配练习，打破了四拍节奏。\n证据：原文——马亮是一个公司的经理，三个月内遇到了一连串不好的事情，小车被盗，员工纷纷辞职，利润下滑。\n启示：分形结构意味着你读十页和读两百页获得的信息量差不多。"},{"b":"想象力统治世界","n":"#64","a":"博弈重构","d":"第八域·形式/数学型运算","t":"结论：博弈设计使得对它最有利的读者，恰恰是最不需要它的读者。\n发现：1)作者策略：先用恐惧建立损失感——败相、心死、想象缺失症——再提供唯一解法。2)读者最优策略：取用技法、丢弃解释。3)支付结构：全盘接受者需付每日执行成本并承担归因风险；只取技法者收益为正而成本极低。4)作者防御：把半途而废预先归因为补强不足，使读者的退出成本心理化。5)均衡：长期看读者分裂为技法使用者与信念接受者，书的市场依赖后者，而价值主要落在前者。\n证据：原文——在思像的字典里没有「不」字！因为人人都有终极的自由！\n启示：看清这场博弈后，读者可以选择做一个不买账的使用者。"},{"b":"想象力统治世界","n":"#65","a":"反领域嫁接","d":"第九域·迁移型运算","t":"结论：把思像法嫁接到软件工程，位置变换法能活下来，心像决定论活不下来。\n发现：1)全位对应架构评审与权衡分析：对事物中的各要素进行全方位想像，统筹兼顾，变换位置。2)合位（四不像）对应兼容层设计：既不单独这样也不单独那样，把对立要素全部派上用场。3)跳位对应跨层抽象，归位对应回到用户需求原点。4)预演对应故障演练与混沌工程：先在头脑里编剧、演剧，把可能出现的情况一一上演。5)失败点：代码不会因为你想得清楚就不出bug，书中神经系统无法区分实际与想象的机制在工程里没有对应物。\n证据：原文——所谓全位，就是对事物中的各要素进行全方位想像，统筹兼顾，变换位置。\n启示：迁移测试是检验这套方法的最好工具：能迁走的才是真方法。"},{"b":"想象力统治世界","n":"#66","a":"古今穿刺","d":"第九域·迁移型运算","t":"结论：古代案例里最高斯的那个，反而刺破了本书的核心命题。\n发现：1)苏东坡以湖泥筑长堤、丁渭修复汴梁皇宫把取土运输弃土三难一并解决，讲的其实是运筹与约束优化。2)楚襄王献东地五百里的四不像方案，是外交博弈中的多方案并用，属于谈判策略。3)惠能目不识丁而顿悟被用作顿悟式学习的证据，但禅宗的顿悟建立在长期修行之上，与速成叙事矛盾。4)诸葛亮非淡泊无以明志被用来为静思训练背书，而书中要求的是高强度的日常训练。5)高斯说如果有人告诉我这是一道有两千年历史的数学难题，我不可能一个晚上就解开它——恰恰是不知道而非清晰的成功像让他成功。\n证据：原文——如果有人告诉我，这是一道有两千年历史的数学难题，我不可能一个晚上就解开它。\n启示：古代故事被借来当证据时，往往证明的是别的东西。"},{"b":"想象力统治世界","n":"#67","a":"微观/宏观跃迁","d":"第九域·迁移型运算","t":"结论：跃迁链上每往上一级，证据密度下降约一个数量级，顶端为零。\n发现：1)链条是：右脑心像→意志力→行动力→个人成败→企业决策→民族创造力→人类命运。2)第一跳证据最弱：脑科学最新揭示，右脑的心像就是意志力，可以直接贯彻到行动上。3)第二跳用韦尔奇（通用市值20年间上涨近24倍，由120亿美元到2800亿美元）与稻盛和夫作桥，但两人成功与思像训练无直接关联。4)第三跳用岳晓东的创造力四因素与1994年索尼大赛，把民族创造力落在几项观察上。5)第四跳完全无证据，是纯粹断言。\n证据：原文——脑科学最新揭示，右脑的心像就是意志力，可以直接贯彻到行动上，这将会使人的行动力来一个大的飞跃。\n启示：这条链最上面两节是空心的，全靠一句口号吊着。"},{"b":"想象力统治世界","n":"#68","a":"物理学映射","d":"第九域·迁移型运算","t":"结论：书中物理词汇的密度与论证强度成反比——波动出现最多的地方，证据最少。\n发现：1)波动论：感情是波，思考是波，肉体是波，物质是波，用共振解释心像与原型相遇，无可测量量纲。2)熵：论证的信息熵很低，同一命题被反复陈述，冗余度极高。3)势能：恐惧（败相、心死）被预先建立为势能，训练是唯一的释放通道。4)阻力：书中把定式、杂念、标准答案都写成阻力项，却没有给出任何阻力系数。5)唯一有物理感的真实内容：以20分钟为单位的复习节奏，参照艾宾浩斯的遗忘速度，这是全书唯一带时间常数的设计。\n证据：原文——感情是波，思考是波，肉体是波，物质是波，而将它们一个个连接起来的还是波。\n启示：删掉所有物理词汇，这本书的论证强度不会有任何损失。"},{"b":"想象力统治世界","n":"#69","a":"生物学映射","d":"第九域·迁移型运算","t":"结论：唯一有对照组的生物材料被用来论证位置选择，而不是被用来示范什么叫证据。\n发现：1)格乌司实验：双小核草履虫与大草履虫同环境培养16天后大草履虫消失；换成袋状草履虫则共存——这是全书最像科学的一段，因为它有对照。2)这个实验被移植成黄金位论：最佳时间、最佳空间、最大优势。3)进化比喻：以第一个从树上走下来的类人猿比喻想象力推动心灵革命。4)免疫：想象疗法被解释为通过大脑与免疫系统的渠道改善免疫机能，书中承认渠道尚未被人了解。5)明显错误的一条：视觉是唯一与大脑直接联系的感觉器官。\n证据：原文——16天后，培养基中只有双小核草履虫自由地活着，而大草履虫却消失得无影无踪。\n启示：它手里握着唯一一个对照组，却把它用在了一个与原始含义无关的比喻上。"},{"b":"想象力统治世界","n":"#70","a":"失败案例嫁接","d":"第九域·迁移型运算","t":"结论：嫁接其他领域的失败案例后，书中全部证据会集体降级为轶事。\n发现：1)嫁接一金融风险模型：清晰的心像（模型）与现实的偏差说明想得清楚不等于结果可控。2)嫁接二苏联东德的心理训练体系本身并未在两德统一后保住其竞技优势，说明心理训练只是变量之一。3)嫁接三1990年代美国的右脑开发教具产业大量退场，与21世纪是右脑开发的世纪形成反例。4)嫁接四1994年索尼大赛北京1366名学生仅获一项纪念奖，反向读亦可：一次性竞赛结果不足以判定民族创造力。5)嫁接五历史上意念致效类畅销书多在十年内退场，为本书半衰期提供对照。\n证据：原文——北京8所高校和12所中小学校的1366名学生参加了这项大赛……仅仅只有一项勉强入围，名列少年组8个获奖者的最末（纪念奖）位次。\n启示：同一条材料既能当它的证据，也能当它的反例，说明这条材料本身证据力不足。"},{"b":"想象力统治世界","n":"#71","a":"技术协议翻写","d":"第九域·迁移型运算","t":"结论：写成标准作业程序后最刺眼的是最后一条异常处理：它把失败从记录中删除了。\n发现：1)步骤0状态准备：端坐、松肩垂肘、口眼轻闭，丹田呼吸8—8—8秒，目标20—20—20秒，诱导α波。2)步骤1确定目标：用现在时态肯定，不要说我将得到一个，要说已经得到的样子。3)步骤2成像：把目标拍成思想照片并检验清晰度，能想象出的场景不超过10个者先建图片库。4)步骤3放映：以20分钟为单位，一天至少三次、最好五六次。5)步骤4补强与记录：早晚两次镜子技巧、大声诵读成功语录卡、录自我养成磁带反复听；异常处理规定出现负面图像时立即用鲜花等画面覆盖，禁止用否定句自我告诫。\n证据：原文——始终要用现在时态而不是将来时态进行肯定。\n启示：一份不允许登记失败的SOP，无法被改进。"},{"b":"想象力统治世界","n":"#72","a":"写作动机考古","d":"第十域·考古/法医型运算","t":"结论：四层动机里最深的那层——记忆之苦——解释了为什么全书的核心技法恰是拍照与放电影。\n发现：1)表层动机写在封面：揭开想象力奥秘与想象训练的神奇，彻底解放每个人的心理潜能。2)中层动机：延续《心兵法》的个人品牌，并把思像做成自己的概念资产。3)深层动机：自考汉语言文学专业那繁多的记忆令他苦累、烦，他要找到把苦变乐的方法。4)制度性动机：其思像论文曾在中国发展与领导决策高层论坛、中国管理科学研究院、中国未来研究会等会议上交流并多次获奖，需要一本专著承接。5)市场动机：271页、32元、通俗读物分类，指向大众自助市场。\n证据：原文——学习怎样才能由苦变乐呢？这个问题一直困扰着我……终于尝出了门道儿，找到了思像这一宝藏。\n启示：一本书最深的动机，往往藏在作者抱怨过的那件小事里。"},{"b":"想象力统治世界","n":"#73","a":"读者考古","d":"第十域·考古/法医型运算","t":"结论：读者画像决定了写法——给不安的人确定感，而不是给好奇的人证据。\n发现：1)从32元、271页、通俗读物分类看，目标读者是大众自助读者而非专业读者。2)从案例选择看（经理马亮、日本推销员、备考学生、亚健康者、减肥者），瞄准城市职场与家长群体。3)从MBA不能扼杀想象力、想象力统治财富两节看，明确覆盖商学院与企业管理人群。4)从学习如何由苦变乐、韩日小学生不堪重负而自杀等表述看，同时瞄准焦虑的家长与教师。5)从封面读心放就放心看，读者被预设为需要被安抚、需要权威指导的人。\n证据：原文——管理大师邓肯说，严格说来，管理没有原理，管理不是科学，更像是一门艺术。\n启示：被预设为需要确定感的读者，就不会被提供不确定性——包括失败率。"},{"b":"想象力统治世界","n":"#74","a":"概念尸检","d":"第十域·考古/法医型运算","t":"结论：思像的死因不是错误而是冗余——它想区分的三样东西，正文从未真的区分。\n发现：1)出生：作者自述我们之所以不用心像，而用思像这一概念，就是为了区别开来。2)定义：将所有的用脑活动尽可能地转变为以图像、画面，包括声像、影像等来进行。3)与国际术语的关系：作者承认脑海中能够出现清晰的图像像看电影一样这叫做IMAGERY，由加拿大西安大略大学的教授希尔克命名。4)死亡时间：中间十章基本不使用该词，正文用的是想象与心像。5)尸检结论：它是一个为建立概念所有权而造的词，操作内容与既有的心理意象训练高度重合。\n证据：原文——这个词汇本身就是强调思想感情活动要像摄像、拍照一样，聚焦、成像、取像。\n启示：一个新术语若只在开头与结尾出现，它的功能就是署名而非解释。"},{"b":"想象力统治世界","n":"#75","a":"出版环境重建","d":"第十域·考古/法医型运算","t":"结论：出版信息本身就说明定位——它从一开始就不是要进入学术检验，而是要进入书店货架。\n发现：1)出版社新世界出版社，社址北京市西城区百万庄大街24号，2009年4月第1版第1次印刷，定价32.00元。2)策划北京兴盛乐书刊发行有限责任公司，责任编辑罗平峰，河北固安保利达印务印刷，新华书店经销。3)归类：CIP归入B842.4-49，即想象—能力培养—通俗读物，官方定位是科普与自助而非学术。4)生态：与《心兵法》构成作者系列，同期市场充斥成功学、右脑开发、潜能类读物。5)技术环境：磁带、MV、GMAT、世界卫生组织脑的十年等标记说明素材积累于2000年代中后期。\n证据：原文——想象力统治世界／心放著．—北京：新世界出版社……定价：32.00元。\n启示：分类编号是最诚实的自我介绍，它自己承认这是通俗读物。"},{"b":"想象力统治世界","n":"#76","a":"版本差异分析","d":"第十域·考古/法医型运算","t":"结论：唯一的版本就是第一版，因此所有内部矛盾都从未获得被修正的机会。\n发现：1)版本记录只有一条：2009年4月第1版第1次印刷，无修订版与再版。2)矛盾一：前言说要连像也放下，其余各章要求处处成像。3)矛盾二：第一章加限定以避免想象万能的误解，第十四章却说哪怕是幻象，一旦你真正相信了，就会变成真的。4)矛盾三：对失败的口径不一——第七章说在思像的字典里没有不字，第十一章却用补强法则承认需要长期坚持才有效。5)目录与正文的差异：牛刀小试与相关链接被标记为固定模块，实际分布并不均匀。\n证据：原文——哪怕是幻象，一旦你真正相信了，就会变成真的。\n启示：没有第二版，意味着这本书的读者永远只能读到未经校正的第一稿。"},{"b":"想象力统治世界","n":"#77","a":"引用链追踪","d":"第十域·考古/法医型运算","t":"结论：引用链的共同特征是给名人、给结论、不给坐标；唯一给了刊名的那条，也只给了一半。\n发现：1)想象力比知识更重要：引自爱因斯坦，但被从科学发现的语境移到了自我成功的语境。2)想象力统治世界：归于拿破仑，全书无出处，却是书名的全部合法性来源。3)钱学森题词形象思维应当是我们当前研究思维科学的一项最重要的任务：用来为形象思维正名，而原意是谈思维科学研究。4)159位癌症患者平均延长20多个月：转述自美国实验，无期刊、无作者、无年份。5)篮球实验写明出自《研究季刊》，是全书唯一带刊物名的证据，却仍缺卷期与作者。\n证据：原文——《研究季刊》报道过一个实验，证明心理练习对于改进投篮技巧确有效果。\n启示：追踪到最后会发现，撑起整本书的是一句没有出处的拿破仑语录。"},{"b":"想象力统治世界","n":"#78","a":"沉默目录","d":"第十一域·负空间型运算","t":"结论：沉默目录里最该补上的一条是如何评估进展——缺了它，全部练习都无法被检验。\n发现：1)没有想象力的代价：强迫性正面思维、对负面信号的压制、通宵成像的消耗都未被讨论。2)没有什么不是想象：全书从未界定边界，于是记忆、预期、计划、妄想被混为一谈。3)没有如何评估进展：除视商自测（得分16—20分为非常出色）外，无一套衡量训练效果的量表。4)没有给怀疑者的证据：全书无对照组、无效应量、无随访。5)没有何时停止：训练被描述为终身习惯，没有退出条件与停用标准。\n证据：原文——巧妙计算自己的视商／提高视商／拓展视商／五种拓展视商的策略（全书唯一带自测的模块）。\n启示：沉默目录暴露的不是疏忽，而是这套方法无法被度量的事实。"},{"b":"想象力统治世界","n":"#79","a":"影子书","d":"第十一域·负空间型运算","t":"结论：正文背后藏着五本影子书，其中质量最高的那本被硬塞进自助书里，是这本书最大的浪费。\n发现：1)影子书一《心兵法》：一部以心为战场的谋略书，其词汇（以心克心、消灭其心）在前言完整出现。2)影子书二气功与右脑开发手册：丹田呼吸、白光心像、百会进气、α波，占整节却与主线无逻辑连接。3)影子书三中国教育改革批判：岳晓东研究、1994年索尼大赛、1979年赴美报告、高考作文虚假构思，材料扎实到可独立成书。4)影子书四名人轶事集。5)影子书五个人奋斗自传：中学全校第一、自考、十几年数千本书。\n证据：原文——呼气的时候，我们要想象体内的恶气完全排出了体外；在吸气的时候想象宇宙的能量从头部顶端（百会）进入。\n启示：影子书三本该是主角，却只被当成论据使用。"},{"b":"想象力统治世界","n":"#80","a":"失踪章节","d":"第十一域·负空间型运算","t":"结论：失踪的章节有一个共同点——它们都是会让论点变复杂的部分。\n发现：1)失踪的一章：关于真像的系统论述，书中说要按客观规律办事、道法自然，却被压缩成第十四章里的几段。2)失踪的一节：第六章标题是对自我意象理论的突破，正文却只说马尔茨发现了自我意象、本书进一步区分三种像，未说明突破在哪。3)失踪的一段：想象运动的前提条件只写了一句话，本该是整章。4)失踪的一表：书中提到填一张关于十年梦想的表，却未给出表格与追踪方法。5)失踪的一名对手：全书批判标准答案，却从未与一位具体的教育学论敌正面交锋。\n证据：原文——对于自我意象理论的突破（章节标题，正文未展开突破的内容）。\n启示：凡会让书变厚的章节，都在编辑过程中被悄悄抽走了。"},{"b":"想象力统治世界","n":"#81","a":"边界守卫者","d":"第十一域·负空间型运算","t":"结论：最强的守卫者不是作者本人，而是法则这两个字。\n发现：1)守卫者一笔名：心放与心放效应把品牌与理论焊死，使批评容易被读作对个人的攻击。2)守卫者二扉页题词：爱因斯坦、钱学森、拿破仑三位置于卷首，任何质疑都要先越过这三位。3)守卫者三预设：批评者被写成套上了思维紧箍咒的人、自以为是的大人。4)守卫者四不可证伪条款：练了无效即补强不足。5)守卫者五命名策略：把抽象归纳直接命名为因果法则、真像法则、相印法则、吸引法则，用法则一词阻断追问。\n证据：原文——我们自己禁锢了自己的想法、无法自由思考，我们必须把这些令人讨厌的标准彻底删除。\n启示：识别守卫者的最好办法，是问一句：这条凭什么叫法则？"},{"b":"想象力统治世界","n":"#82","a":"恐怖事物的礼节","d":"第十一域·负空间型运算","t":"结论：这本书对痛苦的礼节是：给它一个画面，然后覆盖掉它。\n发现：1)对绝症：把治疗写成想象中的战斗，白细胞像冲锋的战士包围杀灭癌细胞，给了患者掌控感，却无自责风险的提示。2)对死亡恐惧：稻盛和夫12岁读《生命的真相》被引作自己心上没有一把刀的话我们决不会死于刀下。3)对集中营：弗兰克在纳粹集中营发现终极的自由，被用来论证心灵自由至上——这是全书最严肃的一次借用，也是被最快速消费的一次。4)对失败者：59岁的沃尔特、低谷中的马亮、被冷脸的日本推销员，都被快速翻转为成功前奏。5)对无法翻转的痛苦——159例中的大多数、瓦伦达的坠落——书选择不给位置。\n证据：原文——医生们认为，病人想象自己麻痹的手能够自如活动，有助于大脑恢复对于此病手的控制。\n启示：礼节的缺失不在它说了什么，而在它跳过了什么。"},{"b":"想象力统治世界","n":"#83","a":"未问的问题","d":"第十一域·负空间型运算","t":"结论：未问的问题里最小也最致命的那个是——整本书建立在一句没有出处的引文上。\n发现：1)如果心像是主宰，那么心像本身从何而来？书只说输入，不追问输入的来源与质量。2)为什么同样的训练对不同人的效果差异巨大？3)想象能力是否可以被图纸、模型、仿真等外部工具替代一部分？建筑工程师的例子其实暗示了这一点，却没有展开。4)如果教育确实压制想象力，压制机制是什么、如何测量？岳晓东给了四因素，书只引不全。5)想象力统治世界这句话，拿破仑究竟在何时何地说过？\n证据：原文——拿破仑说：「想象力统治世界。」这是战神的箴言。\n启示：一本书从不追问自己书名出处，说明它要的是口号的力度而非来源。"},{"b":"想象力统治世界","n":"#84","a":"对手缺席","d":"第十一域·负空间型运算","t":"结论：对手全部缺席，于是这本书的全部胜利都是不战而胜。\n发现：1)缺席一认知心理学与意象研究学界：书中大量使用心理学术语，却没有一位在世的意象研究者被作为对话对象。2)缺席二教育学界的另一种意见：默认标准答案有害，未与强调知识基础与刻意练习的一方交锋。3)缺席三医学界：想象疗法被写进书，却没有任何肿瘤科医生的审慎意见被引用。4)缺席四脑科学界对右脑神话的批评：书中把右脑分工当作最新揭示。5)缺席五其他自助流派：吸收了自我意象、自我暗示、积极思维、冥想，却未说明自己与它们的区别。\n证据：原文——马克斯威尔·马尔兹使很多人重新塑造了自己的容貌……真正的关键在于个人心理上和精神上的自我形象和观念。\n启示：没有对手的辩论，赢了也不算赢。"},{"b":"想象力统治世界","n":"#85","a":"三体碰撞","d":"第十二域·多体碰撞型运算","t":"结论：本书与认知心理学、中国应试教育现场三方碰撞后，剩下的稳定解比任何一方的单独主张都朴素。\n发现：1)碰撞点一：心理意象研究支持心理演练对熟练动作有效，与书的操作层一致，但不支持心像主宰命运。2)碰撞点二：应试现场的课时、班额与选拔约束，使学员永远没有错误的答案这条原则难以直接落地。3)碰撞点三：岳晓东的四因素（思维标准化、知识无活力化等）是三方都能接受的交集。4)碰撞产物：在既定课程内加入图像化、预演与问题意识训练，而不要求推翻考试。5)碰撞中损失最大的是想象力统治一切这句口号，碰撞后只剩想象力可被训练。\n证据：原文——所有的知识获取都应是「进行时态」的，而非是「完成时态」的。\n启示：三方都同意的部分很小，但那很小的部分才是可以立刻实施的。"},{"b":"想象力统治世界","n":"#86","a":"敌意合成","d":"第十二域·多体碰撞型运算","t":"结论：把最敌意的三种声音合成一段，被击碎的是解释层，被留下的是动作层。\n发现：1)科学家：你的机制是波动与共振，不可测量不可证伪，右脑数字来自通俗读物。2)教育者：你把创造力不足归为教学僵化，却给不出可落地的课程方案，只给口号与故事。3)患者权益视角：你告诉末期病人想象白细胞杀灭癌细胞，又说心不召唤灾难就不会来，这在失败时等于二次伤害。4)合声：三者指向同一结构缺陷——用不可证伪的机制解释一切，并把所有结果归因于个人内心。5)合成后仍保留的部分：否定句转换、图像记忆、预演，三者都通过了三方检验。\n证据：原文——想象疗法不是唯心的，心理学家认为，大脑与人体免疫系统之间存在着某种尚未被人了解的渠道。\n启示：敌意合成后可见，真正站得住的只有那三条不依赖理论的技术。"},{"b":"想象力统治世界","n":"#87","a":"学术会议模拟","d":"第十二域·多体碰撞型运算","t":"结论：会议上唯一能达成共识的，是书中那个被一笔带过的前提条件。\n发现：1)运动心理学者：心理演练有效但效应量中等，且依赖动作熟悉度——与书中唯一的前提条件一致。2)肿瘤心理学者：想象疗法可作为辅助放松手段，不能替代治疗；平均延长20多个月需提供中位数、置信区间与对照组。3)教育学者：同意对标准化答案的批评，但反对把创造力与知识基础对立。4)脑科学者：功能偏侧化不等于右脑储存五百万年信息，左右脑分工是流行神话。5)作者本人据其文本推测会强调思像不是万能、要按客观规律办事，并再次引用钱学森与爱因斯坦。\n证据：原文——爱因斯坦在研究问题时，其大脑第一阶段的主要思维活动是形象思维，思维的元素是表象。\n启示：会议开到最后，各方唯一共同接受的是作者最不经意的那句限定。"},{"b":"想象力统治世界","n":"#88","a":"法庭辩论模拟","d":"第十二域·多体碰撞型运算","t":"结论：法庭会判这本书的为什么证据不足，而判它的怎么做无罪。\n发现：1)控方证据一：无出处的量化断言——1000倍、10万倍、100万倍、20多个月。2)控方证据二：爱迪生13项专利等事实错误，说明无核查流程。3)控方证据三：补强法则不可证伪，使失败无法计入统计。4)辩方证据一：书中确实写了限定句——想象力并不直接带来健康，也不直接治愈疾病。5)辩方证据二：技法层有真实价值，否定句转换、放电影、预演、位置变换都可独立使用，成本低而风险小。判决：解释层证据不足，技法层可保留使用，商业包装与事实核查构成瑕疵。\n证据：原文——想象力并不直接带来健康，也不直接治愈疾病，但是它有助于生活习惯的改变。\n启示：判决的关键在于把解释层与操作层分开量刑。"},{"b":"想象力统治世界","n":"#89","a":"多元宇宙分支","d":"第十二域·多体碰撞型运算","t":"结论：在所有分支里，唯一不变的是作者要造一个属于自己的词。\n发现：1)分支A作者生在日本：会写成一部中文版右脑革命，丹田呼吸与白光心像成为主线。2)分支B作者身在学术体制内：思像会变成一篇有对照组与量表的论文，而不是271页通俗读物。3)分支C写于2024年：右脑神话被删，磁带换成手机提醒，证据层或许补上意象研究的元分析。4)分支D没有《心兵法》的成功：封面卖点消失，书会更依赖证据，可能因此写得更严谨。5)分支E读者只读目录：会以为这是一本系统的想象力教科书，而正文是案例与练习的堆叠。\n证据：原文——首部系统揭开想象力奥秘和想象训练神奇的力作。\n启示：分支D最可惜——没有前作背书，它本可能是一本更好的书。"},{"b":"想象力统治世界","n":"#90","a":"高频词汇解码","d":"第十三域·涌现型运算","t":"结论：词频显示，这本书真正的关键词族是像，而不是想。\n发现：1)右脑在全书出现172次，学习267次，潜能50次，命运44次，视商32次，脑科学28次。2)像字词族构成最大词群：心像、思像、图像、成功像、自画像、真像、遗觉像、照相记忆。3)一定是最具格式感的词：人一定要有偶像、一定要有成功像、一定要有自画像、一定要给他人以鲜明的画像，第七章连用六个。4)神奇、奇迹、威力构成情绪词族，密度在前言与第十四章最高。5)脑科学出现28次，但几乎总以脑科学认为、脑科学最新揭示的形式作为引证前缀，而非指向具体研究。\n证据：原文——人一定要有偶像／人一定要有「成功像」／人一定要有「自画像」。\n启示：词频里藏着真相：它谈的是想，靠的是像。"},{"b":"想象力统治世界","n":"#91","a":"断裂点定位","d":"第十三域·涌现型运算","t":"结论：五个断裂点里第二个最关键——全书后面的推论都建立在被抹掉的几乎两个字上。\n发现：1)断裂点一：从拿破仑没有发现象棋里的地图直接推出心像是心灵的真正主宰，中间无推理。2)断裂点二：从神经系统无法区分实际的经验和想象出来的经验，跳到想象自己以某种方式行事几乎也就是实际在这么干，此后几乎二字被删除。3)断裂点三：从个人训练有效跳到思像可以改变历史的轨迹。4)断裂点四：从右脑管图像跳到右脑储存人类五百万年信息。5)断裂点五：从岳晓东的思维标准化跳到想象力统治财富。\n证据：原文——如果我们想象自己以某种方式行事，几乎也就是实际在这么干。\n启示：找断裂点的最好办法，是盯住那些被丢掉的副词。"},{"b":"想象力统治世界","n":"#92","a":"主题共振","d":"第十三域·涌现型运算","t":"结论：共振最多的不是科学，而是焦虑——这本书是五种时代焦虑的共鸣箱。\n发现：1)共振一：与1990至2000年代引进的右脑开发读物共振，共享七田真、春山茂雄、田中孝显的词汇与案例。2)共振二：与美国自我意象与积极思维传统共振（马尔茨、皮鲁克斯、布里斯托）。3)共振三：与当时的创造力焦虑共振，书中直接引李约瑟疑问：为什么中国的科技在唐宋时代就已领先西方，却在明清时代落后下来。4)共振四：与应试教育批判、素质教育、批判性思维的教育话语共振。5)共振五：与成功学市场共振，韦尔奇、原一平、稻盛和夫、乔丹被反复调用。\n证据：原文——英国著名学者李约瑟就曾提出疑问：为什么中国的科技在唐宋时代就已领先西方，却在明清时代落后下来。\n启示：它与时代共振得越好，就越难在时代过后被读懂。"},{"b":"想象力统治世界","n":"#93","a":"情感曲线","d":"第十三域·涌现型运算","t":"结论：一条没有低谷的情感曲线，本身就是这本书从不自我怀疑的证据。\n发现：1)起点恐惧与悬念：这个世界上没有任何东西能够把你打败，只有它能够使你一败涂地。2)上升为愤怒与惋惜：拿破仑心死、瓦伦达坠落、雪化了是泥水、胡萝卜素盖过童趣。3)中段进入操作性的平缓：放电影、位置变换、视商自测，情绪转为可控感。4)后段温情与激励：经理马亮、59岁的沃尔特、日本推销员的青蛙形象、苹果之旅。5)结尾升华与预言：新能源拯救人类、思像可以改变历史的轨迹。整条曲线单调上升，中途没有一次真正的怀疑。\n证据：原文——思像一照，柳暗花明，天宽地阔，马亮感到前途一片光明。\n启示：没有低谷的曲线不是叙事技巧，而是论证态度的暴露。"},{"b":"想象力统治世界","n":"#94","a":"元叙事追踪","d":"第十三域·涌现型运算","t":"结论：元叙事的核心动作是——把个人经历升格为普遍法则，并把法则署上自己的名字。\n发现：1)自我定位为首创：首部系统揭开想象力奥秘和想象训练神奇的力作。2)把自己写成发现者：就像神农尝百草一样，终于尝出了门道儿，找到了思像这一宝藏。3)把概念与本人绑定：你为什么叫心放？心放训练的要害是什么？时常有人这样问我，其实我的书中就有答案。4)把学术承认作为背书：论文在多个高层论坛交流并多次获奖。5)把个人经历写成普遍规律：中学总考第一却不觉快乐、自考记忆之苦，被升格为普天之下大多数人都只是左脑人。\n证据：原文——你为什么叫心放？心放训练的要害是什么？时常有人这样问我。其实，我的书中就有答案。\n启示：元叙事做得越成功，读者越难分清哪部分是经历、哪部分是规律。"},{"b":"想象力统治世界","n":"#95","a":"书的墓志铭","d":"第十四域·特殊型运算","t":"结论：它的墓志铭该刻两行——一行是它借来的口号，一行是它自己的贡献。\n发现：1)第一行（借来的）：想象力统治世界，这句话不属于它，属于拿破仑的传说。2)第二行（自己的）：把思想变成图像，并反复放映，这才是它真正发明的东西。3)第三行（它想要的）：首部系统揭开想象力奥秘的力作。4)第四行（它应得的）：一部把心理演练、自我暗示、右脑神话与教育批判焊在一起的大众读物，32元，271页，一版一印。5)第五行（它的寿命）：技法层会长寿，解释层已入土。\n证据：原文——读心放就放心（封面语）。\n启示：墓志铭上最诚实的一行是——它教会读者的，比它自己知道的更多。"},{"b":"想象力统治世界","n":"#96","a":"书的自画像","d":"第十四域·特殊型运算","t":"结论：按它自己的方法画出来的自画像，会是一张比真人好看的照片。\n发现：1)它会先拍一张思想照片：一本封面烫着拿破仑名言的32元平装书，271页，2009年4月一版一印。2)它会给自己一个成功像：被摆在机场书店最显眼的位置，与《心兵法》并排，封面朝着读者。3)它会给自己一个自画像：一部严谨揭示脑科学的著作——这是它想要的像，不是它的实像。4)它会用新像覆盖旧像：用思像四大法则覆盖前言里那个充满败相与恐惧的叙事。5)它做不到的是放下——因为它处处都要成像，连营销口号都成像为读心放就放心。\n证据：原文——人一定要有「自画像」（第七章小节标题）。\n启示：一本教人拍照的书，最需要先给自己拍一张不加修饰的照片。"},{"b":"想象力统治世界","n":"#97","a":"解毒剂处方","d":"第十四域·特殊型运算","t":"结论：解毒剂不杀这本书，只把它的解释层与操作层分离——分离后它反而更好用。\n发现：1)第一味对照与效应量：读到延长20多个月时，先问中位数、对照组与随访时长。2)第二味把心像降格为副现象：心像常常是处境的结果而非原因，遇到归因于内心的句子就反转一次读。3)第三味为否定判断留位置：保留不字，危险规避与风险评估需要它。4)第四味把右脑换成分布式网络：凡出现左右脑分工处一律替换后再读。5)第五味只取技法丢弃宇宙论：否定句转换、20分钟放电影、位置变换、预演四件留下，波动、共振、宇宙能量、白光心像全部丢弃。\n证据：原文——在思像的字典里没有「不」字！在思像的训练中没有NO！\n启示：服药后的效果是：你仍然使用这本书，但不再被它解释。"},{"b":"想象力统治世界","n":"#98","a":"遗书撰写","d":"第十四域·特殊型运算","t":"结论：遗书里最有价值的一句，是它唯一承认前提条件的那句——那是全书严谨性的上限。\n发现：1)它承认的：想象运动必须具备一个前提条件，就是操作者本身必须熟悉所想象的动作。2)它承认的：想象力并不直接带来健康，也不直接治愈疾病，它只助于生活习惯的改变。3)它想留下却没写清的：什么是真像，什么是一个人的黄金位。4)它会嘱托的：别把我的数字当真，1000倍、10万倍、100万倍都只是为了让你记住方向。5)它不会承认的：拿破仑那句话，我从未找到出处。\n证据：原文——本书的要义之一就是要做到心放。也就是把一切统统放下，连「像」也放下。\n启示：遗书中最动人的一句，恰恰是它生前最不重视的那句放下的话。"},{"b":"想象力统治世界","n":"#99","a":"活的尸体测试","d":"第十四域·特殊型运算","t":"结论：尸体测试的结果是——活下来的是四条技法，死去的是一整套宇宙观。\n发现：1)活着的否定句转换：不要吵换成请安静，不要随地大小便换成大小便一定要进厕所，这条在沟通与训练中仍有效。2)活着的预演与思想实验：先在头脑里编剧、演剧，再执行。3)活着的图像化记忆与间隔复习：20分钟一次，一天三次到六次。4)活着的位置变换：全位统筹、换位换视角、跳位跨层、归位回原点。5)已死的：右脑神话、宇宙波动、自我养成磁带、GMAT焦虑、MBA红利，以及相信奇迹就会发生的强版本。\n证据：原文——「不要欺负弱小」可以用「爱护同学，帮助弱小」代替；两种说法的差距或许微不足道，但最后的结果却有天壤之别。\n启示：一本书能活多久，取决于它有多少内容不依赖自己的理论。"},{"b":"想象力统治世界","n":"#100","a":"黑箱审计","d":"第十四域·特殊型运算","t":"结论：这是一台输入不设校验、处理不做对照、输出不做兜底的机器，它的产品是可执行的希望。\n发现：1)输入端：素材来自四类——名人轶事、古代典故、转述的心理学实验、作者个人经历，四类均无原始出处。2)处理端：核心运算是类比加断言，不做变量控制、不做对照、不报告负面案例。3)黑箱内部最不透明的一步：从想象能影响熟练动作与情绪，跳到心像是外在一切的根。4)输出端：承诺是全能的，健康、财富、学习、管理、民族创造力、人类命运全包；责任条款是个体的，无效归因为补强不足。5)审计结论：通过审查的只有操作层四项技法，其余应标注为信念产品而非知识产品。\n证据：原文——在思像理论及训练中，没有失败，失败在头脑中被思像删除了。\n启示：审计的意义不是否定它，而是标明该从哪里取用、该在哪里设防。"},{"b":"持续的幸福","n":"#01","a":"骨骼提取","d":"第一域·解剖型运算","t":"结论：全书的骨架是一根从幸福1.0升级到幸福2.0的立柱，两端分别焊着治疗室与议会厅，中间五根肋骨是PERMA。\n发现：1)第一根骨是第1章的理论翻修：主题由幸福改写为幸福2.0，量度由生活满意度改写为蓬勃程度。2)五根肋骨按固定顺序出现：积极情绪、投入、意义、积极的人际关系、成就。3)骨架分两部分，第一部分一至四章解决个体，第二部分五至十章解决社会：学校、成就、军队、创伤、健康、政治经济。4)收口在51目标：到2051年全球51%的人口蓬勃。5)骨架不是演绎链而是装配图，每章都是同一组五元素换一个场景重装一遍。\n证据：原文——到2051年，全球51％的人将拥有蓬勃丰盈的人生。\n启示：拆这本书要先把PERMA当成一把尺，再用它去量学校、军队、医院和国库。"},{"b":"持续的幸福","n":"#02","a":"暗物质测绘","d":"第一域·解剖型运算","t":"结论：真正驱动全书的三块暗物质是：测量权、军方数据库、作者本人的职业转型创伤。\n发现：1)全书大量结论建立在可以测量之上，但如何测量的技术细节被放进附录与网页，正文只给结果。2)110万士兵的评估数据与29个大型数据库只以承诺形式出现，结论写得满，数据尚未回收。3)作者被基础心理学圈排斥的记忆（披着羊皮的狼）反复出现，是全书方法论情绪的真正来源。4)幸福1.0错了这一判断源自学生诘问，正文却没标出对手的名字。5)对伦理审查委员会束缚的反复抱怨，暗示若干关键实验已永远无法重做。\n证据：原文——这涉及合并29个大型数据库的艰巨工作，这将是惊人的。\n启示：读这类书要标记每一处尚未兑现的数据承诺，那才是最脆的接缝。"},{"b":"持续的幸福","n":"#03","a":"删节复原","d":"第一域·解剖型运算","t":"结论：被删掉的不是病例细节，而是三类接缝：失败案例、对照组的下落、消极情绪的独立价值。\n发现：1)基隆文法学校的积极教育只讲故事不做对照，因为旁边的墨尔本文法学校拒绝当对照组，空缺被一句话带过。2)士兵复原力培训中处境最差的那15%如何被识别，只给结论不给筛选过程。3)网络研究尝试了6种练习，只有三件好事与突出优势六个月仍有效，其余几种的名字与数据被略去。4)抗抑郁药对重度有效、对中轻度无效这一分层结论给出了，718名病人的分布细节却被压缩。5)作者对酷刑指控的辩解被压进注释语气，正文不愿展开。\n证据：原文——实施积极教育前后的变化是显而易见的。\n启示：复原删节的抓手是盯住显而易见、众所周知这类词，它们常盖着一个没做的对照实验。"},{"b":"持续的幸福","n":"#04","a":"恐惧扫描","d":"第一域·解剖型运算","t":"结论：全书最深的恐惧不是抑郁，而是心理学再次退回只研究基本过程，也就是1946年那场午餐会的重演。\n发现：1)作者借杰罗姆·布鲁纳的转述，把恐惧锚定在一个具体日期和三具人名上：1946年实验心理学家协会会议上三位系主任的午餐会晤。2)对伦理审查委员会的反复抱怨，恐惧的是埃宾式实验永不可能，科学因此失去救命能力。3)对军方只关注病态的批评，恐惧的是资源全投向减损而非增强。4)对幸福1.0的恐惧是道德性的：若以生活满意度为唯一准绳，人可以弃养父母。5)对一元论的恐惧是认识论的：用单一变量解释人类动机会重蹈泰勒斯、尼采、弗洛伊德的覆辙。\n证据：原文——这项决定是一个重大的错误。\n启示：找一本书的恐惧，先找它反复重提的那个历史场景，那里藏着作者的应激源。"},{"b":"持续的幸福","n":"#05","a":"动词骨架","d":"第一域·解剖型运算","t":"结论：全书的动词只有三类：测量、练习、制度化；说服几乎不出现，证明只留给随机分配。\n发现：1)高频动词是衡量与测量，它同时出现在理论定义、军队评估与国家账目三处，是贯穿全书的骨架动作。2)第二类动词是练习：写下三件好事、做感恩拜访、用新方式使用突出优势，全部落在个体身上。3)第三类动词是嵌入与推广：把幸福技能嵌入英语课、嵌入军士训练、嵌入GDP之外的国家账目。4)反驳与争论只出现在作者与他人的对话里（学生诘问、莫多斯基否决），用来立方法论，不用来推进论证。5)与山搏斗被当作反例动词：凡是越做越难的干预都不是好干预。\n证据：原文——这种技术不是与山搏斗，因此会越做越顺。\n启示：把一本书的动词抽干，剩下的骨架就是它真正要你去做的事。"},{"b":"持续的幸福","n":"#06","a":"矛盾晶体","d":"第一域·解剖型运算","t":"结论：全书最硬的矛盾晶体是：幸福既是建构出来的概念，又必须被精确测量。\n发现：1)幸福2.0被声明为建构出来的概念而非真实的东西，同时又要求五元素都能精确测量，建构物如何精确测量未被解释。2)作者批判一元论，自己却把五个元素收进一个首字母缩写PERMA，并转述他人判断说它比其他概念活得久。3)一方面说没有哪个元素能单独定义幸福2.0，另一方面又要求国家账目把五元素加总成一个可比数字。4)批判莱亚德的幸福最大化，自己却提出51%这一全球指标，同样是把多元压成一元。5)声称财富在安全网之上收益递减，又承认沃尔夫斯与斯蒂文森的挑战尚无定论。\n证据：原文——没有哪个元素可以单独定义幸福2.0理论，但每个元素都对幸福有贡献。\n启示：矛盾处不是缺陷，是理论承重的节点，标出来就知道它会在哪里断。"},{"b":"持续的幸福","n":"#07","a":"重力分析","d":"第一域·解剖型运算","t":"结论：全书的质量中心不在幸福这个概念，而在军队那一章，所有其他章节都被它拉弯。\n发现：1)110万士兵的评估是全书唯一能同时提供强制参与、纵向数据与结果测量的场景，学校与企业都做不到。2)健康章把因果研究的希望寄托在陆军数据库与健康保险利用率上。3)成就章的毅力数据来自西点军校1218名一年级学员，而非普通学校。4)创伤章的样本是伊拉克与阿富汗退伍军人，理论被人生中最糟的事检验。5)连政治章的新的繁荣也以战争与和平作为国家分期的分界线。6)结论是：全书最贵的赌注押在军方。\n证据：原文——大约有110万士兵会用全面评估工具来测量所有的积极因素与健康资产。\n启示：判断一本书的真实重心，看它把最贵的数据押在哪里。"},{"b":"持续的幸福","n":"#08","a":"免疫档案","d":"第一域·解剖型运算","t":"结论：这本书对四类攻击预先打了疫苗：忽悠指控、酷刑指控、批判性思维指控、幸福不可测量指控。\n发现：1)对积极心理学是忽悠的免疫靠黄金法则：随机分配、安慰组对照，作者反复申明自己的练习通过了它。2)对酷刑指控用一段自辩加我强烈反对、谴责酷刑完成，并说明讲课对象是联合援救士兵署。3)对应取代消极思维的不是积极思维而是批判性思维这一批评，作者直接认领：我们教的正是批判性思维。4)对幸福不可测量这一经济学家的旧论，用五亿用户平台上每天累计的积极情绪词频回应。5)对盲目乐观的指控，借卡尼曼的规划谬误主动设限。\n证据：原文——我们教的正是批判性思维。\n启示：一本书预先反驳了什么，就等于承认它最怕被说成什么。"},{"b":"持续的幸福","n":"#09","a":"沉积层切割","d":"第一域·解剖型运算","t":"结论：全书至少四层可切割的沉积：习得性无助层、应用转向层、理论翻修层、全球目标层。\n发现：1)最底层是1960至70年代的习得性无助实验，三组设计、可逃避与不可逃避电击，是作者全部方法论的岩基。2)第二层是1998年美国心理协会主席任上的碰壁，以实证为基础的心理治疗提议胎死腹中，积极心理学由这次失败催生。3)第三层是2009年7月圣托里尼岛，43℃高温下一周写完第1章，幸福2.0在此定稿。4)第四层是军队、基隆、facebook三批项目，把理论推向制度。5)最表层是中文版加入的PERMA与中国序，它把中国单独标为目标变量。\n证据：原文——积极心理学正是因为我的这次碰壁而诞生了。\n启示：切沉积层先找日期，日期最密的那几段就是理论改道的地方。"},{"b":"持续的幸福","n":"#10","a":"信噪分离","d":"第一域·解剖型运算","t":"结论：全书信号是五个可测量、可练习、可制度化的元素；噪声是作者的个人趣闻与名人推荐。\n发现：1)信号最纯的三处：五元素的定义表、65%障碍的统计、三项练习的六个月随访结果。2)最大的噪声源是桥牌：作者自称打过25万手、每天约三小时，它与论证无关却反复出现。3)课间活力运动、基本休息与活动周期的低谷、脑子里有辆法拉利这类比喻属于教学噪声，有感染力但不承重。4)七页名人推荐与十家媒体赞语构成出版噪声，与内容零耦合。5)致谢里为付学费卖掉奔驰的学生，是情感噪声。\n证据：原文——我打过的桥牌超过25万手。\n启示：信噪分离的操作法是删掉所有第一人称轶事，看论证是否还站得住。"},{"b":"持续的幸福","n":"#11","a":"建筑翻译","d":"第二域·翻译型运算","t":"结论：把这本书当建筑读，它是一栋先打地基（测量）后立柱（五元素）、最后加盖穹顶（51目标）的公共建筑。\n发现：1)地基是可以测量这一信念，全书所有上层结构都压在它上面。2)五根柱子等粗，作者拒绝给任何一根加重，明确说没有哪个元素能单独定义幸福2.0。3)楼板分两层：下层是个体（治疗与练习），上层是制度（学校、军队、企业、国家）。4)穹顶是51目标，它与地基之间是空的，靠愿景而非论证填充。5)这栋楼没有设防火墙：一旦可测量被质疑，上层全部塌陷。\n证据：原文——每个元素都可以通过学习来加强。\n启示：译成建筑后立刻能看出，承重全在地基，穹顶只是装饰。"},{"b":"持续的幸福","n":"#12","a":"生态系统翻译","d":"第二域·翻译型运算","t":"结论：把PERMA当生态系统读，五个元素不是并列物种，而是生产者、消费者与分解者构成的一条食物链。\n发现：1)积极情绪是生产者，它扩展并建构持久的心理资源，为其余四者供能。2)投入与成就是消费者，消耗注意力与时间，产出技能与作品。3)人际关系是分解者，把个体的积极事件转化为共享资源，作者对彼得森用两个字回答积极心理学是讲什么的引用即此意。4)意义是环境本身，决定哪些物种能存活：归属于超越自身的东西。5)系统最脆弱的一环是意义，作者承认facebook能构建四个元素，唯独意义缺位。\n证据：原文——用两个字来描述积极心理学是讲什么的，他回答说：他人。\n启示：生态视角能暴露系统的单点故障：意义是唯一无法被技术替代的物种。"},{"b":"持续的幸福","n":"#13","a":"乐谱翻译","d":"第二域·翻译型运算","t":"结论：把全书当乐谱，它是一个五声部赋格：主题（PERMA）在十个乐章里依次进入、变奏、齐奏。\n发现：1)第1章呈示主题，五个元素第一次齐鸣。2)第3章转入小调，主题在65%障碍上受阻，这是全曲最低的音区。3)第4章是慢板，主题在MAPP教室里以人声变奏。4)第5章转为教育调式，主题被嵌入英语课、体育课与宗教课。5)第9章是长号独奏，主题被压低到生理层面：乐观、纤维蛋白原、心率变异性。6)第10章全奏，主题被推上国家账目，并以我们可以对什么说是收尾。\n证据：原文——我们可以对更多的积极情绪说是。\n启示：把一本书译成乐谱，能听出哪一章是华彩、哪一章只是过门。"},{"b":"持续的幸福","n":"#14","a":"化学翻译","d":"第二域·翻译型运算","t":"结论：把这本书当化学反应式读，它主张减损反应与建构反应必须配对，只做前者产率恒为65%。\n发现：1)反应物是药物与心理疗法，产物是症状缓解，产率恒定，这是全书的实验事实。2)催化剂是安慰剂，效应范围45至55%，食品和药物管理局审批所依据的研究中有一半安慰剂效应与药物一样大。3)作者要加的第二种反应是积极干预，它不与第一种竞争底物，而是打开另一条通路。4)反应条件是越做越顺：与山搏斗的干预会衰减，三件好事与突出优势不衰减。5)副产物是幸存者的内疚感，创伤章专门为此开了一剂解药。\n证据：原文——65％这个数字都会一遍遍地突然跳出来。\n启示：化学翻译暴露了这本书的真意：心理学的反应釜里少了一半试剂。"},{"b":"持续的幸福","n":"#15","a":"地形翻译","d":"第二域·翻译型运算","t":"结论：把全书当地形图，它是一张从洼地翻越分水岭、登上高原的等高线图，65%就是那条分水岭线。\n发现：1)洼地是不存在疾病，世界卫生组织1946年宪章早已否定这个定义，医学却仍困在其中。2)分水岭是65%障碍：药物与疗法到这里就上不去了。3)高原是蓬勃，到达者是少数：丹麦33%、英国约18%、俄罗斯6%、东欧约7%。4)坡面陡度不均：从减损到缓解很缓，从缓解到治愈很陡。5)图上有一处断层叫安全网：在它之下财富与生活满意度同步上升，之上则急剧变缓，这就是伊斯特林悖论。\n证据：原文——在安全网之上，要拥有越来越多的财富才能增加一点点幸福感，这就是著名的伊斯特林悖论。\n启示：地形翻译让人一眼看到，这本书的多数读者站在分水岭下方，而书里写的多是高原风景。"},{"b":"持续的幸福","n":"#16","a":"电路翻译","d":"第二域·翻译型运算","t":"结论：把PERMA当电路读，它是五路并联、共用接地（测量）的系统，成就那一路还串着一个乘法器。\n发现：1)积极情绪与投入是两条纯主观支路，只能靠自我报告取电压。2)意义、人际关系、成就三条支路兼有主观与客观读数，因而可能自欺。3)成就支路上串着乘法器：成就等于技能乘以努力，努力不是加到天赋上而是乘进去。4)系统有阈值开关：积极与消极之比大于2.9比1时公司蓬勃发展，职场3比1、家庭5比1。5)接地端是可以测量，五条支路都要回到它才能闭合。\n证据：原文——这些时间不是加到你的天赋中，而是乘进去的。\n启示：电路翻译暴露的真正风险是：五条支路共用一根接地线，接地一松，全书断路。"},{"b":"持续的幸福","n":"#17","a":"法律翻译","d":"第二域·翻译型运算","t":"结论：把这本书当法律文本读，它是一部把幸福从主观偏好升格为可执行公共标准的立法草案。\n发现：1)总则第一条：积极心理学的主题由幸福改为幸福2.0，量度由生活满意度改为蓬勃程度。2)立法理由是双重的：幸福1.0既与事实冲突，又是糟糕的道德准则，会导致选择不育与弃养老人。3)证据规则：黄金法则是随机分配与安慰组对照，通不过的列为无效。4)执行机关：学校、军队、企业、教练行业，作者明确反对设立执照门槛。5)它给自己留了违宪审查的口子：幸福不是人类唯一要珍惜的事物。\n证据：原文——我绝不是在鼓吹幸福应该是对公共政策唯一有影响的。\n启示：法律翻译的价值是看出，这是一部作者自己写了但书的草案。"},{"b":"持续的幸福","n":"#18","a":"菜谱翻译","d":"第二域·翻译型运算","t":"结论：把这本书当菜谱读，它给出三道能复现的菜和三道只能围观的菜。\n发现：1)三件好事：连续一周每晚睡前10分钟写下三件好事及原因，有六个月随访数据支撑。2)突出优势：做VIA测试找出前五项，再在一周内用新方式使用它，同样有六个月数据。3)感恩拜访：写一封具体的信并亲自递送，一个月有效、三个月消失，是一道有保质期的菜。4)只能围观的菜：110万士兵的评估、基隆文法学校的整体改造、五亿用户的幸福测量，原料普通人拿不到。5)厨具限制：作者自承主客观标准各占多少比重仍无定论。\n证据：原文——在下个星期的每天晚上，都请你在睡觉之前花10分钟写下今天的三件好事。\n启示：菜谱翻译能立刻分出哪几道你今晚就能做，哪几道只能看别人做。"},{"b":"持续的幸福","n":"#19","a":"病理翻译","d":"第二域·翻译型运算","t":"结论：把这本书当病历读，它诊断的不是病人，而是心理学这门学科：它患了减损单侧肥大症。\n发现：1)主诉：自1946年起心理学只做基础研究，切断了与现实问题的回路。2)体征：国家健康研究所95%以上的经费用于减少疾病，几乎没有一个健康的学科。3)化验：药物与疗法缓解率停在65%，安慰剂45至55%，对中轻度抑郁症药物效应基本不存在。4)影像学：健康被定义为不存在疾病，而世界卫生组织1946年宪章早已写下没有疾病不等于健康。5)病理机制：一切只专注于补救的措施都只完成了一半工作。\n证据：原文——只完成了一半的工作——纠正负面问题，却没有加强正面力量。\n启示：病理翻译的价值在于：这本书真正的病人不是读者，是心理学。"},{"b":"持续的幸福","n":"#20","a":"战争翻译","d":"第二域·翻译型运算","t":"结论：把这本书当战地手册读，它打的是双线战争：对内争夺心理学的定义权，对外争夺国民账目的计量权。\n发现：1)第一条战线的转折点是1946年三系主任午餐会，心理学决定模仿物理化学、不再聘请应用心理学家。2)作者自陈在宾大心理学系是披着羊皮的狼，同僚视其为异类。3)第二条战线的盟友是军方：凯西将军要让军队的心理像身体一样健康，并称之为文化转型。4)战略判断来自斯克尔斯少将：第四次世界大战是有关人本身的战争，美军在这种战争中只能得零分。5)战果预期是反直觉的：军医总指挥承认预防若奏效，他的预算会被削减。\n证据：原文——如果复原力训练奏效，它就将成为民用医学的榜样。\n启示：战争翻译暴露了这本书的募兵对象：它要的不是读者，是制度。"},{"b":"持续的幸福","n":"#21","a":"极端读者攻击","d":"第三域·应力测试型运算","t":"结论：让一位最不合作的读者来读——重度抑郁、失业、且不信测量——全书有三处会当场崩塌。\n发现：1)开篇要求读者先承认幸福可以被测量，而这位读者的全部经验都抗拒量化。2)三件好事要求连续一周每晚10分钟，而重度抑郁者的执行力恰是受损最重的部分，作者本人也花了六年才让艾玛跃过习得性无助。3)65%障碍那一章告诉他药物对中轻度基本无效，等于可用选项更少。4)全书制度方案都以你仍属于某个组织为前提，失业者被整体排除。5)唯一留给他的入口是VIA优势测试与他人这一解药。\n证据：原文——他人是人生低潮最好和最可靠的解药。\n启示：极端读者测试的价值是测出一本书的读者门槛写在第几页。"},{"b":"持续的幸福","n":"#22","a":"基础假设反转","d":"第三域·应力测试型运算","t":"结论：把全书三块基石逐一反转，两块仍能站住，一块会带塌整本书。\n发现：1)反转一：假设幸福不可测量，则PERMA、全军评估、51%、平台词频测量全部失效，全书塌掉八成，这块是承重的。2)反转二：假设消极情绪有独立价值不应被比值压低，洛萨达比例、复原力训练、品味练习受损，但治疗与成就两章不受影响。3)反转三：假设成就是追求快乐与意义的副产品，则PERMA退回幸福1.0，全书核心创新消失，只剩应用部分。4)反转四：假设国家不应以幸福为任何指标，第10章崩塌，前九章完好。5)结论：作者真正的赌注押在可测量与成就独立两处。\n证据：原文——成就（或成绩）往往是一项终极追求，哪怕它不能带来任何积极情绪、意义、关系。\n启示：反转测试能精确标定一本书哪块基石是真的，哪块只是口号。"},{"b":"持续的幸福","n":"#23","a":"历史穿越测试","d":"第三域·应力测试型运算","t":"结论：把这本书送回1946年、1897年、1450年三个时点，它在第一处会被拒收，第二处会被判不道德，第三处会被完全听懂。\n发现：1)送回1946年实验心理学家协会会议：三位系主任刚决定只做基础研究，这本满篇应用的书会被视为异端。2)送回1897年：埃宾把梅毒疮物质接种到9个麻痹病人身上，作者敬佩其勇气却承认如今没有一个伦理审查委员会会批准，他的方法论在那个年代可执行、在今天不可执行。3)送回1450年佛罗伦萨：梅第奇的银行业使城市富足和平，科西莫一世主张把盈余投资于美，两百年后人称文艺复兴——这正是作者说的佛罗伦萨时刻。4)三处共同揭示：可行性取决于时代的制度。\n证据：原文——世界上的富庶之国目前正处在佛罗伦萨时刻。\n启示：历史穿越测试测出的不是书的对错，是它与哪个时代同频。"},{"b":"持续的幸福","n":"#24","a":"反向工程","d":"第三域·应力测试型运算","t":"结论：从全书倒推写作程序，这是一部先有八个项目、后有一本书的装配品，而非先有论点再找证据的演绎品。\n发现：1)作者自陈近10年做了8个与积极心理学有关的大型项目，它们汇聚成51目标，书才被写出来。2)第1章一周写完，是全书最后成形却排在最前的部件。3)目录显示8个主题彼此联系：幸福是什么、抑郁、预防、治疗、MAPP、积极教育、士兵项目、成就与智能、积极健康、51目标。4)致谢按章分列不同的外部合作者名单，说明各章是独立采购的模块。5)PERMA这个缩写由他人想出，是外挂而非内生部件。\n证据：原文——8个主题彼此联系，组成了书中的各章。\n启示：反向工程的结果是：这本书是项目集而非论证链，所以它可以跳读。"},{"b":"持续的幸福","n":"#25","a":"边界条件探测","d":"第三域·应力测试型运算","t":"结论：全书的适用边界由四条线划定：年龄、组织归属、收入安全网、语言。\n发现：1)年龄边界：复原力项目的数据主要来自青少年、儿童与年轻士兵，对老年群体只有乐观与免疫、心血管的观察研究。2)组织边界：MAPP、基隆、军队、企业四类场景都是强组织，自由职业者与失业者没有对应方案。3)收入边界：作者明说只有安全网之上财富的边际收益才递减，他的全部论证只对安全网之上的人群成立。4)语言边界：平台测量法依赖英语约80个积极情绪单词的词表，换一种语言要重做。5)文化边界：丹麦33%、俄罗斯6%、东欧约7%、中国不超15%，作者未解释这一巨大差异的成因。\n证据：原文——在安全网之下，财富的增加和生活满意度的增加是同步的。\n启示：边界探测的结论是：这本书写给安全网之上、仍属于某个组织、且说英语的人。"},{"b":"持续的幸福","n":"#26","a":"沉默者的声音","d":"第三域·应力测试型运算","t":"结论：全书发言的是将军、校长、CEO与作者本人；沉默的是士兵的配偶、对照学校的师生、以及被判定用药无效的那批人。\n发现：1)家庭健康模块由戈特曼夫妇设计，但士兵配偶的声音只以信任与背叛是争吵的普遍原因这类研究者总结出现。2)基隆文法学校被写成一个成功故事，不肯当对照组的墨尔本文法学校只留一句，其理由从未被问。3)抗抑郁药试验中绝大多数处方开给中度与轻度患者，而药对他们基本无效，这批人没有代言人。4)MAPP学生里为付学费卖掉奔驰的那位，只出现在致谢的一个括号里。5)政治章引用了加尔各答贫民窟居民与弗雷斯诺流浪汉的满意度数据，却没人问过他们想要什么。\n证据：原文——绝大多数的抗抑郁药处方都是开给这些人的——中度和轻度抑郁症患者。\n启示：让沉默者开口的方法是：列出书里所有只被统计、从未被引述的人群。"},{"b":"持续的幸福","n":"#27","a":"反事实推演","d":"第三域·应力测试型运算","t":"结论：三条反事实路径各能改写这本书的三分之一。\n发现：1)若1998年以实证为基础的心理治疗提议未在专业实践提高委员会胎死腹中，积极心理学可能不会诞生，作者自己承认这一因果。2)若莫多斯基问如果最终的研究结果对我们不利怎么办时作者选择退让，全书对应用者的敌意会消失，也就失去最强的叙事动力。3)若贝克没有在熟食店说出你在浪费生命，作者仍是实验心理学家，第9章的老鼠肿瘤三组设计会成为全书主干。4)若2009年7月圣托里尼没有热到43℃，第1章不会在一周内写完。5)若陆军选的是随机对照而非全军铺开，凯西将军那句我不要实验性研究会改写七八两章的证据等级。\n证据：原文——我当初受邀时，还以为是要讨论创伤后应激障碍以及老兵待遇的问题。\n启示：反事实推演显示，这本书的核心部件几乎全由偶发事件供货。"},{"b":"持续的幸福","n":"#28","a":"十年后审判","d":"第三域·应力测试型运算","t":"结论：站在成书十年后审判，全书的硬预测中两个仍悬空，一个已被时代改写，一个方向被验证。\n发现：1)悬空之一：作者预测10年内会出现关于如何提升毅力与自我控制的重大发现，写在成就章，书内无证据。2)悬空之二：全军评估数据与29个数据库合并后要回答的那些问题，包括哪些优势可以预防自杀、积极情绪多的士兵伤口是否愈合更快，书内标注为让我们拭目以待。3)被改写之一：那一章把五亿用户、日登录率与手机登录量当作测量幸福的基础设施，这一假设随平台形态变化而失效。4)被验证的方向：幸福测量进入公共政策议程，作者与迪纳三十年前提出用幸福补充GDP时经济学家不屑一顾。5)最耐用的部件反而最小：PERMA这个缩写。\n证据：原文——在这些问题上，我希望看到激烈的辩论和极大的改进。\n启示：十年后审判的规矩是：只审判作者自己标注为预测的句子。"},{"b":"持续的幸福","n":"#29","a":"概念图谱","d":"第四域·网络/关系型运算","t":"结论：全书概念图谱的中心节点不是幸福，而是蓬勃，它下挂五个可测量子节点，上挂一个国家账目父节点。\n发现：1)中心节点蓬勃由well-being译出，与happiness严格区分，译者权衡福祉、殷盛、康福等候选词后定为幸福2.0。2)五个子节点：积极情绪、投入、意义、积极的人际关系、成就；其中两个纯主观，三个兼有主客观。3)二级概念：投入下挂心流，心流下挂24项优势与美德；成就下挂技能乘努力，努力下挂自律与毅力。4)对立节点群：幸福1.0、生活满意度、一元论、不存在疾病、治标。5)父节点是新的繁荣，它把财富与幸福糅合为一个国家指标。\n证据：原文——积极心理学的主题是幸福2.0理论，衡量的黄金标准是人生的蓬勃程度。\n启示：画完图谱会发现，这本书其实只新增了一个子节点（成就）和一个父节点（新的繁荣）。"},{"b":"持续的幸福","n":"#30","a":"影响涟漪","d":"第四域·网络/关系型运算","t":"结论：这本书的涟漪分三圈：读者本人、读者所属的组织、国家的计量方式，半径越大验证越难。\n发现：1)第一圈最短也最实：一周练习能改变一个人，50人的网络研究显示平均抑郁程度从重度区间降到轻中度之间。2)第二圈靠制度传导：MAPP毕业生回去改造教练行业，美国有五万多名职业教练，约三分之二的MAPP学生是教练。3)第二圈另一支是学校：基隆的积极教育分教授、嵌入、活出三层，涟漪从课堂扩散到宿舍与教职工。4)第三圈最远也最虚：修正GDP，作者承认如何衡量绿地、志愿者工作、心流与欢乐的分量仍是棘手问题。5)涟漪有一个反常方向：预防若奏效，医疗预算反而会减少。\n证据：原文——心理学家一对一的辅导或者治疗会有所帮助，但帮助甚微。\n启示：涟漪图显示，作者把最大资源投在半径最大的那一圈，而那里效果最难验证。"},{"b":"持续的幸福","n":"#31","a":"思想谱系","d":"第四域·网络/关系型运算","t":"结论：这本书的谱系有两条：明线是心理学内部的应用传统，暗线是作者对一元论的哲学反抗。\n发现：1)明线上游是1959年罗伯特·怀特那篇离经叛道的论文，反抗驱力降低理论，把成就追认为独立动机，作者当时在普林斯顿拜伦·坎贝尔的老鼠实验室。2)明线中游是习得性无助与习得性乐观，三组设计与归因风格是作者全部方法的祖产。3)明线分支来自贝克与艾利斯：认知疗法与ABCDE模型被直接借用于军士复原力训练。4)暗线是作者对泰勒斯、亚里士多德、尼采、弗洛伊德四人的共同批判。5)暗线的正面资源是尼采的骆驼、狮子、婴儿三阶段，作者用它给全书收尾。\n证据：原文——这些伟人都犯了一元论的大错。\n启示：理清谱系就明白：这本书表面上讲幸福，骨子里在打一场反一元论的哲学仗。"},{"b":"持续的幸福","n":"#32","a":"引用网络","d":"第四域·网络/关系型运算","t":"结论：全书的引用有四个高密度簇：心血管流行病学、教育干预、军队心理学、经济学；四簇之间几乎互不引用。\n发现：1)心血管簇最大：1986年退伍军人研究、1996至2002年英国两万余人调查、1991年荷兰999名老人、1995年新斯科舍1739人、1994年9.7万名妇女，五项互相印证。2)教育簇以宾夕法尼亚复原力项目为核心，元分析显示其减少绝望并预防中度到重度抑郁。3)军队簇以泰代斯基与麦克纳利的创伤后成长、戈特曼夫妇的家庭模块为主，独立于前两簇。4)经济簇引用莱亚德、迪纳、卡尼曼、伊斯特林，与心血管簇零连接。5)唯一横跨多簇的节点是乐观：它同时出现在心血管、免疫、肿瘤、婚姻与金融市场五处。\n证据：原文——乐观是成长的主要因素。\n启示：引用网络的断层提醒：这本书是四个领域的研究报告合订，不是一套统一理论。"},{"b":"持续的幸福","n":"#33","a":"术语地图","d":"第四域·网络/关系型运算","t":"结论：全书的术语经历三次关键转义，每次都扩大了外延并稀释了精度。\n发现：1)第一次转义：happiness与well-being在英文中都是幸福，译者在福祉、殷盛、康福等候选词中反复权衡并在网上公开求助，最终意译为幸福1.0与幸福2.0。2)第二次转义：flourish译为蓬勃，又被推荐序译为殷盛，两个译名在同一本书里并存。3)第三次转义：投入在幸福1.0中由24项优势支撑，在幸福2.0中24项优势改为支撑全部五个元素，同一术语换了靠山。4)日语词ikigai被直引为生活价值，未做本土化。5)第二层术语是六个缩写：洛萨达比例、BRAC、GAT、CSF、VIA、MAPP，读者需另记一张表。\n证据：原文——我们把它们意译成幸福1.0和幸福2.0。\n启示：术语地图提示：这本书最难的不是概念本身，是同一个词在不同章节指的不是同一件事。"},{"b":"持续的幸福","n":"#34","a":"逻辑依赖树","d":"第四域·网络/关系型运算","t":"结论：全书的逻辑依赖树只有四层，但第三层的两条腿都只有半根是实的。\n发现：1)根命题：心理学应同时研究减损与建构，因为只做补救的措施只完成了一半工作。2)第二层两个分支：理论上须放弃一元论，方法上须坚持随机分配与安慰组对照。3)第三层左腿是五元素各自可测量且可练习，这条腿只有部分证据：积极情绪与乐观有数据，意义与成就的测量方法作者自承不成熟。4)第三层右腿是提升五元素会带来健康、生产力与和平等下游收益，这条腿几乎全靠观察研究，作者承认相关文献中只有一组随机分配实验。5)因此第四层结论是或然的：51%的目标立在两条半实半虚的腿上。\n证据：原文——没有哪个观察研究能够排除所有可能的外部变量。\n启示：把依赖树画出来，就知道该在哪一层要求补证据。"},{"b":"持续的幸福","n":"#35","a":"权力结构图","d":"第四域·网络/关系型运算","t":"结论：这本书的权力结构是四层金字塔：作者与宾大在顶，军方与基金会在中层，学校与企业在下层，被测量者在底。\n发现：1)顶层：作者执掌宾大积极心理学中心，MAPP学位由他创设，测试网站由他建立并免费开放，同时它是数据入口。2)中层出资方：美国陆军部、教育部、国家心理健康研究所、大西洋慈善基金会、安能伯格基金会、盖洛普基金会，致谢中逐一列名。3)中层还有准官方机构：苏格兰信任与幸福中心，由理查德·莱亚德推动。4)下层执行方：基隆文法学校、马斯特曼高中、西点军校、沃顿商学院与各类企业。5)底层是数据提供者：110万士兵与五亿用户，士兵的评估完全保密，上级看不到结果。\n证据：原文——它是完全保密的——只有士兵本人知道他的成绩。\n启示：权力结构图说明：这本书的说服力有一半来自它背后那张出资方名单。"},{"b":"持续的幸福","n":"#36","a":"逆向因果重写","d":"第五域·时间型运算","t":"结论：把全书三条主因果线倒过来写，两条能成立，一条会变成自我实现的预言。\n发现：1)正向：乐观降低心血管死亡率；逆向：身体健康者更乐观。作者用纤维蛋白原、心率变异性、免疫反应三条生理机制堵逆因果，但仍承认这些只是合理假设。2)正向：复原力训练减少抑郁焦虑；逆向：本来就少抑郁的人更愿意做完训练。军方项目部分处理，基隆项目因对照学校拒绝而完全没处理。3)正向：蓬勃带来健康与和平；逆向：健康富有和平的人才容易被统计为蓬勃，丹麦33%与俄罗斯6%的差距正指向它，作者未处理。4)正向：练习让人幸福；逆向：愿意做练习的人本来就更易幸福。\n证据：原文——大多数来到该网站的人就是想要变好的。\n启示：逆向书写一遍，就能看出这本书的因果箭头哪些是钉死的，哪些只是画的。"},{"b":"持续的幸福","n":"#37","a":"考古碎片重组","d":"第五域·时间型运算","t":"结论：把散落全书的自传碎片按时间重组，得到一部与正文平行的应用心理学诞生记。\n发现：1)1964年作者拒绝牛津大学分析哲学奖学金，转去宾大读心理学，理由是哲学是脑筋急转弯式的游戏，心理学可以切实帮助人类。2)1967年博士毕业，第一份工作是康奈尔大学副教授。3)1972年回宾大，在熟食店偶遇贝克，被告知你在浪费生命，遂转为应用心理学家。4)1995年参加招聘委员会，同事巴伦提议招一个研究工作、爱或玩的人，作者一夜没睡，扫描十位顶尖心理系终身教授，无一研究这些。5)1998年以最高票当选美国心理协会主席。6)2008年1月飞澳大利亚，同年8月进五角大楼。\n证据：原文——我作为一名基础学术科学家的日子屈指可数。\n启示：碎片重组后可见，全书的理论转向都能对上他履历上的某一次跳槽或某一次碰壁。"},{"b":"持续的幸福","n":"#38","a":"预言逆推","d":"第五域·时间型运算","t":"结论：从到2051年全球51%的人拥有蓬勃人生这一终点逆推，作者其实只算了一道除法，中间的乘法全是假设。\n发现：1)分子端：中国是关键变量，到2051年全世界将近20%的成年人是中国人，而初步研究发现中国成年人实现蓬勃人生的比例不超过15%。2)分母端：欧洲最高丹麦33%、英国约18%、俄罗斯6%、东欧约7%，起点差距极大。3)作者列出四根杠杆：从娃娃抓起的学校、更积极的父母、促进PERMA的企业职场、促进PERMA的电子游戏。4)四根杠杆中只有学校有干预数据，电子游戏只有游戏设计师的设想。5)最大的未量化项是反向力量：国家变富时抑郁症与其他精神疾病的比例随之飙升。\n证据：原文——要实现51的目标，不能没有中国的参与。\n启示：预言逆推的价值是把一句口号拆成一道尚未解完的应用题。"},{"b":"持续的幸福","n":"#39","a":"半衰期分类","d":"第五域·时间型运算","t":"结论：全书内容按半衰期可分四类：五十年以上的、约十年的、约三年的、出版即过期的。\n发现：1)五十年以上之一：反一元论的方法论警告，它对泰勒斯、亚里士多德、尼采、弗洛伊德同样有效，未来仍有效。2)五十年以上之二：没有疾病不等于健康这一世界卫生组织1946年宪章原则。3)约十年：国别蓬勃比例、五亿用户的测量设想、MAPP四万多美元的学费与招生规模，都会随时间漂移。4)约三年：药物与疗法的效果比较，作者引用的六项研究718名病人这一批数据本身在持续更新。5)出版即过期：对金融危机、英国前首相等时政人物的时评。\n证据：原文——它使用的时间可能会比积极心理学其他概念更长久。\n启示：半衰期分类是给一本书做库存管理：哪些该背下来，哪些该查最新版。"},{"b":"持续的幸福","n":"#40","a":"进化模拟","d":"第五域·时间型运算","t":"结论：让这本书在思想市场上进化三代，最可能被保留的不是PERMA，而是练习越做越顺这一判别式。\n发现：1)第一代被淘汰的将是具体数字：65%障碍、2.9比1的洛萨达比例、五个元素的排序，它们会被更精细的元分析替换。2)第二代被稀释的将是制度方案：把幸福嵌入学校与军队的做法会被保留，内容却会被换成当时流行的框架。3)存活下来的是判别式：凡是与山搏斗、越做越难的干预都不是好干预，凡是能自我维持的练习才值得推广。4)存活下来的还有外部效度这一警告：作者声称数百位心理学教授靠教内部效度为生，却没有一位教外部效度。5)变异最快的是测量载体：从问卷到平台到可穿戴。\n证据：原文——这门课程讲的都是内部效度，几乎不讲外部效度。\n启示：进化模拟的结论是：一本书能传下去的往往不是它说了什么，而是它用来筛掉什么。"},{"b":"持续的幸福","n":"#41","a":"前传生成","d":"第五域·时间型运算","t":"结论：这本书的前传是《真实的幸福》，两者的分界线精确到一句话：作者在硕士班开学第一课上宣布自己的旧理论不完善。\n发现：1)前传的核心主张：幸福分为积极情绪、投入和意义三个元素，在此元素上成功的人生被称为愉悦的人生。2)决裂时刻是2009年9月宾大应用积极心理学硕士的开学第一课，作者开场后直奔主题，说贯穿前作始末的三元素理论不完善。3)决裂的第一推动是学生的诘问，反对的急先锋是对成功学与关系学有逆反心理的中国学生。4)决裂的第二推动是打桥牌的经验：作者发现成就往往是终极追求，哪怕它不带来任何积极情绪、意义、关系。5)决裂的第三推动是一位未具名女性的质疑。\n证据：原文——我认为积极心理学的主题应该是幸福2.0，而非幸福1.0。\n启示：前传与正传的分界，往往就在作者被学生问住的那一分钟。"},{"b":"持续的幸福","n":"#42","a":"续集生成","d":"第五域·时间型运算","t":"结论：按书内未兑现的承诺写续集，最该写的是一本专讲这本书方法论债务的《外部效度》。\n发现：1)第一章该写：29个大型数据库合并后的答案，包括哪些优势可以预防自杀、积极情绪多的士兵伤口是否愈合更快。2)第二章该写：随机分配地教患者用乐观来防止心脏病的试验，作者明说没人做过，因此乐观与健康之间的因果只得一分。3)第三章该写：基隆文法学校真正的对照研究，以及邻校为什么拒绝。4)第四章该写：主客观标准的比重，如何衡量心流与欢乐在积极情绪中的分量，如何衡量绿地与志愿者工作。5)第五章该写：中国的数据，因为15%这一初步发现与51%的目标直接冲突。\n证据：原文——因为没人做过教患者用乐观来防止心脏病的随机分配研究。\n启示：续集生成法的妙处是：一本书欠的债，清单往往就写在它自己的正文里。"},{"b":"持续的幸福","n":"#43","a":"种子句培育","d":"第六域·生成型运算","t":"结论：全书最有繁殖力的种子句是那句被作者当作反例的话：与山搏斗。\n发现：1)原句是作者学滑雪五年的体会：滑雪从来都不容易，而每种心理疗法、每种练习都是在与山搏斗。2)培育出的第一条枝干是判别标准：好的积极干预越做越顺，坏的越做越难。3)第二条枝干是练习设计原则：三件好事与突出优势能维持六个月，正因为它们不需要持续对抗阻力。4)第三条枝干是对药业的批评：所有药物都是治标的，患者须终身服用，本质就是永远在与山搏斗。5)第四条枝干是治疗目标的重新定义：教患者即便非常难过时也要运转良好，而不是消灭难过。\n证据：原文——从我开始学滑雪的第一天起，直到5年后停止滑雪，我一直在与山搏斗。\n启示：找种子句的方法是找那个作者拿来当反例的比喻，它往往比正面主张更真诚。"},{"b":"持续的幸福","n":"#44","a":"逆工程工具箱","d":"第六域·生成型运算","t":"结论：从这本书能逆出五件工具，三件人人可用，两件需要组织授权，另有一件它压根没给。\n发现：1)工具一：ABCDE模型，A不好的事、B念头、C后果、D反驳、E激发，用于把情绪与想法拆开。2)工具二：三件好事并记录原因，每晚睡前10分钟，连续一周。3)工具三：VIA优势测试找出前五项，再在一周内用新方式使用其中一项。4)工具四：积极主动式回应，听到别人的好事时给出具体而热情的追问，需提前规划并每天使用。5)工具五：全军式全面评估，需问卷系统、保密机制与课程推荐，个人无法自建。6)缺失的一件：如何处理自己产生的消极情绪而无须把它转成积极情绪。\n证据：原文——用ABCDE模式去反驳悲观的想法。\n启示：逆工程工具箱时，除了清点有什么，更要记下缺什么。"},{"b":"持续的幸福","n":"#45","a":"问题发生器","d":"第六域·生成型运算","t":"结论：这本书是一台高产出的问题发生器，它自己提出的问题远多于它能回答的。\n发现：1)哪些优势可以预防自杀？书内自陈无人能回答。2)高度的意义感会使身体更健康吗？未答。3)积极情绪多的士兵，其伤口会愈合得更快吗？未答。4)仁爱善良的士兵是否会获得更多表彰勇气的奖章？未答。5)良好的婚姻能预防传染性疾病吗？未答。6)心理健康能否降低医疗保健的成本？未答。7)是否存在超级健康者？未答。8)唯一被明确列为需要激烈辩论的方法论问题是：主观标准与客观标准各自的比重是多少。\n证据：原文——这些问题在这之前是从来没有人能够回答的。\n启示：衡量一本书的价值，可以数它给你留下多少值得去做的问题。"},{"b":"持续的幸福","n":"#46","a":"隐喻引擎","d":"第六域·生成型运算","t":"结论：全书的隐喻由四台引擎驱动：体育、战争、医学、建筑，其中体育隐喻承担了最多的论证重量。\n发现：1)体育引擎：与山搏斗、脑子里有辆法拉利而我擅长用刹车、狙击手连续熬三天、课间活力运动、游戏化。2)战争引擎：披着羊皮的狼、第四次世界大战是有关人本身的战争、摇尾求怜、文化转型、足以改变游戏规则的圣战。3)医学引擎：像化妆术一样的障眼法、治标与治愈、健康资产、免疫神话、丘吉尔口中的黑狗。4)建筑引擎：基础研究与应用研究的相互作用、心理学模仿物理和化学、舞台与聚光灯。5)最反常的一处隐喻出现在为应用研究辩护的段落：埋头不问窗外应用的基础研究则无异于自慰。\n证据：原文——实际应用经常能引导基础研究。\n启示：拆隐喻引擎能看出作者的思维产地：他是运动员、军方顾问、治疗师，最后才是理论家。"},{"b":"持续的幸福","n":"#47","a":"空白章节","d":"第六域·生成型运算","t":"结论：全书最该有却没有的四章是：失败章、成本章、退出章、不幸福的权利章。\n发现：1)失败章：哪些练习无效？网络研究尝试了6种练习，只有两种六个月仍有效，其余四种的名字与数据被略去。2)成本章：硕士项目学费四万多美元另加酒店餐饮机票，军士需脱产十天受训，而军医总指挥承认预防奏效则预算削减。3)退出章：做完练习仍不幸福怎么办？艾玛被辅导了六年，中间还中断一年，这一时间成本未被折算。4)不幸福的权利章：作者虽声明幸福不是人类唯一要珍惜的事物，却没有给拒绝被测量留下位置。5)四章共同点：都要求作者交出对自己不利的数字。\n证据：原文——我辅导艾玛已经差不多6年了，中间中断了一年。\n启示：列空白章节是找一本书的防火墙：它不让读者看的地方，就是它自己最清楚的地方。"},{"b":"持续的幸福","n":"#48","a":"实验设计","d":"第六域·生成型运算","t":"结论：如果现在重做这本书的核心实验，最该做的是一项三臂随机对照：三件好事、突出优势、只记录不解释的对照组。\n发现：1)原研究漏洞之一：网站研究没有随机分配、没有安慰组，且样本自我选择，作者自己承认这不是对照研究。2)漏洞之二：安慰对照组被安排写童年回忆，这一任务本身可能有情绪效应，不能算中性。3)漏洞之三：随访只到六个月，而作者主张的是持续改善，两者时间尺度不匹配。4)改进设计：三臂、单盲、随访延长至两年与五年，并预注册主观与客观双终点。5)应增加的经济学终点：医疗利用率，因为陆军数据库已含健康保险利用率，这是唯一能做的地方。\n证据：原文——这绝不是一项对照研究：没有随机分配，没有安慰组。\n启示：给一本书设计实验，是检验它是否真相信自己主张的最快方法。"},{"b":"持续的幸福","n":"#49","a":"操作系统提取","d":"第六域·生成型运算","t":"结论：剥去心理学内容，这本书内置的操作系统只有三条指令：先测量，再练习，最后嵌入制度。\n发现：1)指令一：把任何模糊目标拆成可测量元素，作者用气象学类比——风寒效应由温度与风速共同定义，幸福2.0由五个元素共同定义。2)指令二：对可测量元素施加可重复练习，并要求练习具有自维持性，否则判定为与山搏斗。3)指令三：把练习交给制度去批量分发，个人辅导被明确判定为帮助甚微。4)系统有两条错误码：错误码一元论，凡用单一变量解释人类动机即报错；错误码治标，凡只减损不建构即报错。5)系统没有停止指令：它没有说什么时候不该测量、不该练习、不该推广。\n证据：原文——就像用温度和风速来定义风寒效应一样。\n启示：提取操作系统后再看，这本书的心理学内容其实是可替换的应用层。"},{"b":"持续的幸福","n":"#50","a":"悖论收割","d":"第六域·生成型运算","t":"结论：全书收割到的最大悖论是：越是把幸福变成可测量的公共目标，它就越不像幸福。\n发现：1)悖论一：作者批判一元论，却提出51%这一单一全球指标。2)悖论二：幸福2.0声称五元素不可通约，却又要求把它们加总成一个可与GDP并列的数。3)悖论三：为民主而扩大的测量，依赖的是最不民主的基础设施——五亿用户的平台数据库。4)悖论四：把心理健康去精神病学烙印，方法却是给110万士兵做心理测评。5)悖论五：反对把幸福当成福祉的唯一元素，同时又说蓬勃是积极心理学唯一的长期使命。6)悖论六：练习越做越顺才算好，但要有效又必须持续，自维持与需坚持相互抵消。\n证据：原文——幸福不是人类唯一要珍惜的事物。\n启示：收割悖论不是为了否定一本书，是为了看清它最紧的那几处张力。"},{"b":"持续的幸福","n":"#51","a":"最强反驳","d":"第七域·对抗型运算","t":"结论：对这本书最强的一击不是它错了，而是它把可以测量当成无需论证的起点。\n发现：1)全书所有上层结论——五元素、65%障碍、51%、修正GDP——都压在这一根支柱上，而支柱本身从未被论证，只被断言。2)作者自己曾当众说幸福大部分是主观感受、测量没有意义，第二天才改口说幸福应该被测量且可以被测量，这一反转记在译者序里，正文未提。3)他承认如何精确测量五元素、主客观各占多少比重，仍需要激烈的辩论和极大的改进。4)最锋利的一击：如果测量方法尚未确定，那么基于测量得出的国别排名（丹麦33%、俄罗斯6%）就不能作为政策依据。5)这一击不推翻练习本身，只推翻它的宏大叙事。\n证据：原文——我认为他是对的，幸福应该被测量，而且可以被测量。\n启示：最强的反驳从来不是说结论错，而是说它的第一块砖没砌。"},{"b":"持续的幸福","n":"#52","a":"死敌对话录","d":"第七域·对抗型运算","t":"结论：为这本书配三位死敌，各问一句它答不上来的话；第四位死敌已在书内，作者却早有准备。\n发现：1)一元论者问：你说我们做的一切都不是为了单一目的，那你凭什么要求国家把五个元素加总成一个指标？2)生物精神病学家问：你说生物精神病学放弃了治愈，那你的积极干预在哪一项随机对照中实现了治愈，而不只是六个月的症状改善？3)反测量者问：如果士兵的评估完全保密、上级看不到，它凭什么被称为文化转型的抓手？4)第四位来自书内：卡尼曼会问，你推崇的乐观主义正是我称为规划谬误的东西，你如何区分二者？5)作者对第四位已有准备，对前三位没有。\n证据：原文——人们之所以会做自己不擅长的事，是因为他们相信自己会成功。\n启示：一本书的死敌不是骂它的人，是它书架上那几本它引用得最客气的书。"},{"b":"持续的幸福","n":"#53","a":"检察官摘要","d":"第七域·对抗型运算","t":"结论：以最严厉的检方口径起诉这本书，罪名是以科学之名的未兑现承诺，四项指控两项成立。\n发现：1)指控一：把未回收的数据当既成事实。29个大型数据库合并、全军评估的纵向结果，在书中以承诺形式为现在的结论背书。成立。2)指控二：选择性报告练习效果。6种练习中只详述3种，其余略去。成立，但作者确实披露了这一略去。3)指控三：隐瞒样本偏差。网站研究的多数来访者本就想变好，基隆没有对照组，这两处作者均已自行声明，不构成隐瞒。不成立。4)指控四：利益冲突。出资方包括军方与多家基金会，致谢中列名但未声明其对结论的影响。部分成立。5)量刑建议：保留其方法，降级其宏大主张。\n证据：原文——在完成了基本调查问卷的577个参与者当中，有471个人完成了随后所有的5次后续评估。\n启示：检察官摘要的价值是分清：哪些是隐瞒，哪些只是作者自己也没解决的难题。"},{"b":"持续的幸福","n":"#54","a":"误用档案","d":"第七域·对抗型运算","t":"结论：这本书最可能被误用五处，其中两处作者预见了并写下防线，三处没有。\n发现：1)误用一：把洛萨达比例当成个人考核指标。原研究是对60家公司会议录音的统计，职场3比1、家庭5比1、临界值2.9比1，把它用于考核个人发言会立刻失真。2)误用二：把积极思维当成压制消极思维。作者明确回应：应取代消极思维的不是积极思维，而是批判性思维。3)误用三：把复原力训练当成免责工具，既然士兵可被训练得有复原力，造成创伤的制度责任被转移。无防线。4)误用四：把51%当成行政指标，倒逼基层填报。无防线。5)误用五：把优势测试当成测评产品，作者建立免费测试网站的另一面是数据入口。无防线。\n证据：原文——我们录下了60家公司开会时所有的对话。\n启示：一本方法书的误用史，往往比它的应用史更长。"},{"b":"持续的幸福","n":"#55","a":"盲区报告","d":"第七域·对抗型运算","t":"结论：全书的盲区有五块，三块是学科性的，两块是作者个人性的。\n发现：1)学科盲区一：对重性精神疾病几乎不提，积极干预的适用边界未被划定。2)学科盲区二：对贫困人群只有满意度数据，没有干预方案。3)学科盲区三：对文化差异只统计不解释，丹麦33%与俄罗斯6%的成因空白。4)个人盲区一：作者的样本高度依赖自己的机构——宾大、硕士班毕业生、他曾任主席的美国心理协会。5)个人盲区二：他的爱好被当作成就与心流的通用模型，而桥牌有明确胜负与即时反馈，与多数人的工作形态相差很远，他自称打过25万手、每天约三小时。\n证据：原文——我平均每天约有3小时在网上玩桥牌。\n启示：盲区报告要区分两类：学科暂时看不见的，和作者因为站的位置而看不见的。"},{"b":"持续的幸福","n":"#56","a":"时代偏见审计","d":"第七域·对抗型运算","t":"结论：这本书带着2010年前后的四重时代印记，其中两重已被时间打折。\n发现：1)印记一：对互联网平台的乐观。五亿用户、一半每天登录、一亿手机登录，被当作衡量全球幸福的天然基础设施，这一信任是2010年特有的。2)印记二：对军方的合作热情。八年的两场战争与军人轮转带来的压力，构成了军方愿意做文化转型的窗口期。3)印记三：金融危机的余震。作者写在从衰退中恢复的2010年上半年，并据此反思乐观主义与过度自信。4)印记四：英国工党执政期。莱亚德能在格拉斯哥推动把积极教育引入英国学校，依赖当时的政治意愿。5)未被打折的是反一元论与外部效度两处方法论警告。\n证据：原文——只要证据充分，又有政治意愿，科学就会融入公共政策。\n启示：时代偏见审计不是挑错，是标出这本书里哪些句子带着年份。"},{"b":"持续的幸福","n":"#57","a":"拓扑分析","d":"第八域·形式/数学型运算","t":"结论：把全书当拓扑对象，它是一个中间有洞的环面而非实心球：从个体到国家那条路没有连续映射。\n发现：1)环面主体是五元素，它在个体层、组织层、国家层反复出现，构成一个闭合曲面。2)第一个洞：从个体练习的效应量到51%的全球比例之间没有任何连续变换，作者用愿景跳了过去。3)第二个洞：从观察研究的相关到因果，只有乐观与健康一组随机分配实验填补，其余是空腔。4)全书有一处收缩：幸福1.0到幸福2.0不是扩张而是重参数化，元素从三个变五个，主题却从幸福换成蓬勃，拓扑类型未变。5)有一处撕裂：主观与客观两套量度并存而未被粘合。\n证据：原文——如何精确测量幸福的各项元素，如何结合财富和幸福的标准，主观标准和客观标准各自的比重是多少。\n启示：拓扑分析的用处是把说不清的地方说清：这本书有两处洞，都在尺度跃迁处。"},{"b":"持续的幸福","n":"#58","a":"对称性分析","d":"第八域·形式/数学型运算","t":"结论：全书刻意打破三处对称，又保留三处对称，破与留都指向同一个主张：单向的是不够的。\n发现：1)被打破的对称一：减损与建构。传统心理治疗只减损，作者要求两边对称，并说只做补救的措施只完成了一半工作。2)被打破的对称二：基础研究与应用研究，1946年之后心理学只做一边，作者要求双向。3)被打破的对称三：消极与积极不再一比一，而是2.9比1以上的不对称。4)被保留的对称一：五个元素严格平权，没有哪个能单独定义幸福2.0。5)被保留的对称二：主观与客观两套量度对称并存。6)被保留的对称三：作者对自己与对他人同样严苛，他承认自己不是很好的治疗师。\n证据：原文——良好的科学需要分析和综合的相互作用。\n启示：对称性分析能看出作者想翻的那张桌子：他不是要加变量，是要把单向改成双向。"},{"b":"持续的幸福","n":"#59","a":"相变标记","d":"第八域·形式/数学型运算","t":"结论：全书至少标记了六个相变点，它们才是这本书真正的章节骨架。\n发现：1)相变一：1946年三系主任午餐会，心理学从应用与基础并存突变为只做基础。2)相变二：1897年埃宾的接种实验之后，19世纪最流行的精神病被抗梅毒药消灭，医学从症状管理跃迁到病因治愈。3)相变三：心理健康定义的相变，从不存在疾病变为一种蓬勃的存在。4)相变四：65%障碍，药物与疗法在这里从缓解相变为无法再前进。5)相变五：安全网，财富与生活满意度在这一点上由同相变为解耦。6)相变六：佛罗伦萨时刻，国家从追求安全转为追求美。\n证据：原文——心理健康的状态并不只是没有身心失调紊乱的现象，而是一种蓬勃的存在。\n启示：标记相变点，一本书的论证密度立刻显形：没有相变的章节多是过渡。"},{"b":"持续的幸福","n":"#60","a":"递归自检","d":"第八域·形式/数学型运算","t":"结论：把这本书的标准反过来用在它自己身上，三条自检两条不及格。\n发现：1)自检一：它要求任何干预必须通过随机分配与安慰组对照。它自己的旗舰证据中，网站研究既无随机分配也无安慰组，基隆项目没有对照组，只有网络研究与复原力项目部分通过。及格与不及格各半。2)自检二：它要求好的干预越做越顺。它自己的制度方案——全军评估、全面士兵健康项目、把幸福嵌入学校——都需要持续投入与强制执行，属于与山搏斗型。不及格。3)自检三：它要求避免一元论。它在个人层做到了五元素，在国家层退回单一指标。不及格。4)唯一全程通过的是：它公开披露了对自己不利的证据。\n证据：原文——我得承认，我不是一个很好的治疗师。\n启示：递归自检的意义不是打脸，是找出这本书愿意被谁的标准审判。"},{"b":"持续的幸福","n":"#61","a":"压缩极限","d":"第八域·形式/数学型运算","t":"结论：把这本书压到极限，最短形式是五个字母PERMA；再压就只剩一个动词：测量。\n发现：1)第一层压缩：十章压成五个元素。2)第二层压缩：五个元素压成一个缩写PERMA，且它比幸福1.0的三个元素还多两个字母。3)第三层压缩：五个元素压成一条判别式——凡能被测量
