<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#231A55">
<title>星邮喵：把信送到宇宙尽头</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#231A55;
  --ink:#2B2350;
  --ink-soft:#655C8C;
  --paper:#F7F4FF;
  --paper-2:#ECE7FB;
  --air-blue:#4F6BFF;
  --air-coral:#FF5E7E;
  --butter:#FFE38A;
  --shade:rgba(16,9,44,.52);
  --sky-text:#FDFBFF;
  --font-k:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --font-n:"Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#F2EEFD; --paper-2:#E4DEF7; --shade:rgba(8,4,26,.6); }
}
:root[data-theme="dark"]{ --paper:#F2EEFD; --paper-2:#E4DEF7; --shade:rgba(8,4,26,.6); }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--plum)}
*,*::before,*::after{box-sizing:border-box}
body{
  font-family:var(--font-k);color:var(--sky-text);
  touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;touch-action:manipulation}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.num{font-family:var(--font-n);font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- pills & small controls ---------- */
.pill{
  display:inline-flex;align-items:baseline;gap:5px;
  padding:6px 12px 4px;border-radius:999px;
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.26);
  font-size:15px;white-space:nowrap;
}
.pill b{font-size:18px;line-height:1}
.pill .star{color:var(--butter)}
.pill.ink{background:var(--paper-2);border-color:transparent;color:var(--ink)}
.pill.ink .star{color:#E0A020}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.13);color:#fff;font-size:13px;letter-spacing:-1px;cursor:pointer;
  display:grid;place-items:center;
}
.icon-btn:focus-visible,.chip:focus-visible,.seg-btn:focus-visible,.link-btn:focus-visible{outline:2.5px solid var(--butter);outline-offset:3px}

/* ---------- stamp (perforated) buttons ---------- */
.stamp-wrap{display:inline-block;filter:drop-shadow(0 4px 0 rgba(22,10,58,.38))}
.stamp-btn{
  --r:4px;
  position:relative;display:block;border:0;cursor:pointer;
  font-size:25px;color:#fff;letter-spacing:.12em;
  padding:21px 44px 18px 50px;background:var(--air-coral);
  -webkit-mask:
    radial-gradient(var(--r),#0000 97%,#000) round calc(-1.5*var(--r)) calc(-1.5*var(--r)) / calc(3*var(--r)) calc(3*var(--r)),
    linear-gradient(#000 0 0) no-repeat 50% / calc(100% - 3*var(--r)) calc(100% - 3*var(--r));
          mask:
    radial-gradient(var(--r),#0000 97%,#000) round calc(-1.5*var(--r)) calc(-1.5*var(--r)) / calc(3*var(--r)) calc(3*var(--r)),
    linear-gradient(#000 0 0) no-repeat 50% / calc(100% - 3*var(--r)) calc(100% - 3*var(--r));
  transition:transform .12s ease;
}
.stamp-btn::after{content:"";position:absolute;inset:9px;border:1.5px dashed rgba(255,255,255,.62);pointer-events:none}
.stamp-btn:hover{transform:rotate(-1.5deg)}
.stamp-btn:active{transform:scale(.96) rotate(-2deg)}
.stamp-btn:focus-visible{outline:none}
.stamp-btn:focus-visible::after{border:2.5px solid #fff}
.stamp-btn.small{font-size:20px;padding:17px 30px 14px 34px;letter-spacing:.08em}
.stamp-btn.blue{background:var(--air-blue)}

.chip{
  border:0;border-radius:12px;cursor:pointer;
  font-size:16px;color:var(--ink);background:var(--paper);
  padding:10px 18px 8px;box-shadow:0 3px 0 rgba(22,10,58,.38);
}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(22,10,58,.38)}
.chip:disabled{opacity:.55;cursor:not-allowed;transform:none}
.link-btn{
  border:0;background:none;cursor:pointer;padding:6px 4px;
  font-size:15px;color:var(--air-blue);
  text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;
}

/* ---------- screens ---------- */
.screen{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 22px);
  opacity:0;pointer-events:none;transition:opacity .35s ease;
}
.screen.on{opacity:1;pointer-events:auto}

/* menu */
#menu{justify-content:space-between;pointer-events:none}
#menu.on > *{pointer-events:auto}
.menu-top{width:100%;max-width:560px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.menu-top .right{display:flex;gap:8px}
.brand{position:relative;text-align:center;margin-top:4vh}
.brand::before{content:"";position:absolute;inset:-18% -22%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(22,10,58,.5),rgba(22,10,58,0))}
.title{
  margin:0;font-weight:400;line-height:1;
  font-size:clamp(66px,19vw,132px);letter-spacing:.05em;
  color:var(--paper);
  text-shadow:.05em .05em 0 var(--air-coral), -.03em -.025em 0 var(--air-blue);
  animation:press 1s cubic-bezier(.2,1.35,.35,1) both;
}
@keyframes press{
  0%{transform:scale(1.7) rotate(-9deg);opacity:0;filter:blur(8px)}
  55%{opacity:1;filter:blur(0)}
  100%{transform:none}
}
.tagline{margin:.85em 0 0;font-size:clamp(14px,3.9vw,17px);line-height:1.7;color:rgba(255,255,255,.88);text-shadow:0 1px 0 rgba(20,10,50,.45)}
.menu-bottom{display:flex;flex-direction:column;align-items:center;gap:13px;width:100%;max-width:420px}
.seg{display:flex;padding:4px;border-radius:14px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.24)}
.seg-btn{border:0;background:transparent;color:#fff;font-size:16px;padding:8px 16px 6px;border-radius:10px;cursor:pointer}
.seg-btn.on{background:var(--paper);color:var(--ink)}
.mode-note{margin:-3px 0 0;font-size:13px;color:rgba(255,255,255,.8);text-align:center;min-height:1.3em;text-shadow:0 1px 0 rgba(20,10,50,.45)}
.menu-row{display:flex;gap:12px}

/* HUD */
#hud{
  position:fixed;top:0;left:0;right:0;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;opacity:0;transition:opacity .3s;
}
#hud.on{opacity:1}
#hud.on .hud-right{pointer-events:auto}
.dist{display:flex;align-items:baseline;gap:6px;text-shadow:0 2px 0 rgba(20,10,50,.4)}
.dist b{font-size:42px;line-height:1}
.dist span{font-size:15px;opacity:.9}
.hud-right{display:flex;gap:8px;align-items:center}
#combo{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  padding-top:calc(env(safe-area-inset-top,0px) + 66px);
  display:flex;flex-direction:column;align-items:center;pointer-events:none;
  opacity:0;transition:opacity .25s;
}
#combo.on{opacity:1}
#combo .num{font-size:34px;line-height:1;color:var(--butter);text-shadow:0 3px 0 rgba(255,94,126,.85)}
#combo small{font-size:13px;opacity:.9;margin-top:2px}
#combo.pop .num{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1.7)}100%{transform:scale(1)}}

#biome{position:fixed;left:0;right:0;top:23%;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0}
#biome.show{animation:biome 3.4s ease both}
#biome small{font-size:14px;opacity:.85}
#biome strong{font-weight:400;font-size:clamp(32px,9vw,50px);letter-spacing:.2em;text-shadow:0 3px 0 rgba(20,10,50,.4)}
@keyframes biome{0%{opacity:0;transform:translateY(14px)}18%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}

#hint{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 104px);display:flex;justify-content:center;pointer-events:none}
#hint span{
  max-width:360px;text-align:center;font-size:16px;line-height:1.5;color:var(--ink);
  background:var(--paper);padding:9px 16px 7px;border-radius:14px;box-shadow:0 4px 0 rgba(22,10,58,.35);
  opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;
}
#hint.show span{opacity:1;transform:none}

#letter{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;justify-content:center;pointer-events:none}
.slip{
  display:flex;align-items:center;gap:12px;max-width:430px;
  color:var(--ink);background:var(--paper);border-radius:10px;padding:10px 16px 8px 12px;
  border-left:10px solid transparent;
  background:linear-gradient(var(--paper),var(--paper)) padding-box,
    repeating-linear-gradient(135deg,var(--air-coral) 0 8px,var(--paper) 8px 12px,var(--air-blue) 12px 20px,var(--paper) 20px 24px) border-box;
  box-shadow:0 8px 22px rgba(10,5,30,.4);
  opacity:0;transform:translateY(calc(100% + 90px));transition:transform .45s cubic-bezier(.2,1.2,.4,1),opacity .3s;
}
#letter.show .slip{transform:none;opacity:1}
.slip .env{font-size:22px;color:var(--air-coral)}
.slip p{margin:0;font-size:15px;line-height:1.55}

#toast{position:fixed;bottom:0;left:0;right:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 160px);display:flex;justify-content:center;pointer-events:none;z-index:20}
#toast span{background:var(--ink);color:#fff;font-size:15px;padding:8px 16px 6px;border-radius:12px;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;box-shadow:0 6px 18px rgba(10,5,30,.35)}
#toast.show span{opacity:1;transform:none}

/* game over postcard */
#over{justify-content:center;background:var(--shade);overflow-y:auto}
.postcard{
  position:relative;width:min(100%,430px);margin:auto 0;color:var(--ink);
  border:10px solid transparent;border-radius:16px;
  background:linear-gradient(var(--paper),var(--paper)) padding-box,
    repeating-linear-gradient(135deg,var(--air-coral) 0 12px,var(--paper) 12px 18px,var(--air-blue) 18px 30px,var(--paper) 30px 36px) border-box;
  padding:20px 20px 14px;box-shadow:0 20px 44px rgba(10,5,30,.5);
}
#over.on .postcard{animation:drop .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes drop{from{transform:translateY(46px) rotate(3deg);opacity:0}to{transform:none;opacity:1}}
.postcard h2{margin:0;padding-right:96px;font-weight:400;font-size:27px;line-height:1.2}
.cause{margin:5px 0 0;padding-right:96px;font-size:15px;color:var(--ink-soft)}
.big{display:flex;align-items:baseline;gap:8px;margin-top:14px;flex-wrap:wrap}
.big b{font-size:66px;line-height:.9;color:var(--air-blue)}
.big span{font-size:18px}
.badge{
  display:none;font-style:normal;font-size:14px;color:#fff;background:var(--air-coral);
  padding:4px 9px 2px;border-radius:6px;transform:rotate(-6deg);
}
.badge.show{display:inline-block;animation:pop .5s .45s both}
.best-line{margin:6px 0 0;font-size:14px;color:var(--ink-soft)}
.stats{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:2px dashed #D6CEF0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:27px;line-height:1.1}
.stats span{font-size:13px;color:var(--ink-soft)}
.postcard blockquote{margin:14px 0 0;padding:11px 13px 9px;background:var(--paper-2);border-radius:8px;font-size:15px;line-height:1.6}
.over-actions{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
.over-row{display:flex;justify-content:center;gap:18px;margin-top:10px}
.postmark{
  position:absolute;top:8px;right:10px;width:90px;height:90px;border-radius:50%;
  border:2.5px solid rgba(255,94,126,.78);
  box-shadow:inset 0 0 0 4px var(--paper), inset 0 0 0 5.5px rgba(255,94,126,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:rgba(255,94,126,.92);transform:rotate(-14deg);font-size:12px;line-height:1.25;
}
.postmark b{font-size:20px;line-height:1.1}

/* pause */
#pause{justify-content:center;background:var(--shade)}
.pause-card{display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--paper);color:var(--ink);border-radius:18px;padding:24px 28px 16px;box-shadow:0 16px 36px rgba(10,5,30,.45)}
.pause-card h2{margin:0;font-weight:400;font-size:26px}

/* closet / stamp album */
#closet{justify-content:center;background:var(--shade)}
.album{
  width:min(100%,580px);max-height:100%;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);border-radius:18px;padding:18px 16px 16px;
  box-shadow:0 20px 44px rgba(10,5,30,.5);
}
.album header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 4px 12px}
.album h2{margin:0;font-weight:400;font-size:27px}
.album header p{margin:2px 0 0;font-size:14px;color:var(--ink-soft)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;overflow-y:auto;padding:6px 4px 10px;flex:1;min-height:0}
.card-wrap{display:block;filter:drop-shadow(0 2px 3px rgba(22,10,58,.16))}
.stamp-card{
  --r:5px;position:relative;width:100%;border:0;cursor:pointer;color:var(--ink);background:var(--bg);
  padding:16px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:3px;
  -webkit-mask:
    radial-gradient(var(--r),#0000 97%,#000) round calc(-1.5*var(--r)) calc(-1.5*var(--r)) / calc(3*var(--r)) calc(3*var(--r)),
    linear-gradient(#000 0 0) no-repeat 50% / calc(100% - 3*var(--r)) calc(100% - 3*var(--r));
          mask:
    radial-gradient(var(--r),#0000 97%,#000) round calc(-1.5*var(--r)) calc(-1.5*var(--r)) / calc(3*var(--r)) calc(3*var(--r)),
    linear-gradient(#000 0 0) no-repeat 50% / calc(100% - 3*var(--r)) calc(100% - 3*var(--r));
}
.stamp-card::before{content:"";position:absolute;inset:11px;border:1.5px solid rgba(43,35,80,.14);pointer-events:none}
.stamp-card:focus-visible{outline:none}
.stamp-card:focus-visible::before{border:2.5px solid var(--ink)}
.stamp-card canvas{width:96px;height:96px}
.stamp-card strong{font-weight:400;font-size:18px}
.stamp-card small{font-size:12px;line-height:1.45;color:#5A5280;text-align:center;min-height:2.9em}
.stamp-card .denom{position:absolute;top:13px;right:15px;font-size:15px}
.stamp-card.locked canvas{filter:grayscale(.8) brightness(1.05);opacity:.6}
.stamp-card .mark{
  position:absolute;top:44px;left:50%;transform:translateX(-50%) rotate(-12deg);
  border:2px solid rgba(79,107,255,.85);color:rgba(79,107,255,.95);border-radius:8px;
  padding:3px 9px 1px;font-size:14px;display:none;background:rgba(255,255,255,.45);white-space:nowrap;
}
.stamp-card.equipped .mark{display:block}
.card-wrap.shake{animation:shake .42s}
.card-wrap.bought{animation:pop .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.album > .stamp-wrap{align-self:center;margin-top:4px}

@media (max-width:380px){
  .stamps{grid-template-columns:repeat(2,1fr);gap:10px}
  .stamp-card canvas{width:80px;height:80px}
  .big b{font-size:56px}
}
@media (max-height:640px){
  .brand{margin-top:0}
  .title{font-size:clamp(54px,14vh,100px)}
}
@media (prefers-reduced-motion: reduce){
  .title,#over.on .postcard,#biome.show{animation-duration:.01ms}
  *{transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="game" aria-label="游戏画面：点一下屏幕，小猫会离开当前轨道"></canvas>

<div id="hud">
  <div class="dist"><b class="num" id="hudDist">0</b><span>光年</span></div>
  <div class="hud-right">
    <div class="pill"><span class="star">✦</span><b class="num" id="hudStars">0</b></div>
    <button class="icon-btn" id="btnPause" aria-label="暂停">❚❚</button>
  </div>
</div>
<div id="combo"><span class="num" id="comboNum">×2</span><small>连续完美</small></div>
<div id="biome"><small id="biomeStop">第 2 站</small><strong id="biomeName">午夜信箱</strong></div>
<div id="hint"><span id="hintText"></span></div>
<div id="letter" role="status"><div class="slip"><span class="env">✉</span><p id="letterText"></p></div></div>
<div id="toast" role="status"><span id="toastText"></span></div>

<section id="menu" class="screen on" aria-label="首页">
  <header class="menu-top">
    <div class="pill"><span>最远</span><b class="num" id="menuBest">0</b><span>光年</span></div>
    <div class="right">
      <div class="pill" title="收集到的信"><span>✉</span><b class="num" id="menuLetters">0/30</b></div>
      <div class="pill"><span class="star">✦</span><b class="num" id="menuStars">0</b></div>
    </div>
  </header>
  <div class="brand">
    <h1 class="title">星邮喵</h1>
    <p class="tagline">点一下，离开轨道。<br>把宇宙里的每一封信，送到它想去的星星。</p>
  </div>
  <div class="menu-bottom">
    <span class="stamp-wrap"><button class="stamp-btn" id="btnStart">开始投递</button></span>
    <div class="seg" role="group" aria-label="选择星图">
      <button class="seg-btn on" data-mode="endless" aria-pressed="true">无尽星海</button>
      <button class="seg-btn" data-mode="daily" aria-pressed="false">今日星图</button>
    </div>
    <p class="mode-note" id="modeNote">每一局的星图都不一样</p>
    <div class="menu-row">
      <button class="chip" id="btnCloset">换角色</button>
      <button class="chip" id="btnSound" aria-pressed="true">声音开</button>
    </div>
  </div>
</section>

<section id="over" class="screen" aria-label="本局结果">
  <div class="postcard" role="dialog" aria-labelledby="overTitle">
    <div class="postmark" aria-hidden="true"><span>星邮局</span><b class="num" id="pmDate">09.23</b><span id="pmMode">无尽星海</span></div>
    <h2 id="overTitle">这趟投递结束啦</h2>
    <p class="cause" id="overCause">飘出了星图边缘</p>
    <div class="big"><b class="num" id="overDist">0</b><span>光年</span><em class="badge" id="overBest">新纪录</em></div>
    <p class="best-line" id="overBestLine">历史最远 0 光年</p>
    <ul class="stats">
      <li><b class="num" id="overStars">0</b><span>星屑</span></li>
      <li><b class="num" id="overLetters">0</b><span>封信送达</span></li>
      <li><b class="num" id="overCombo">0</b><span>最高连击</span></li>
    </ul>
    <blockquote id="overQuote"></blockquote>
    <div class="over-actions">
      <span class="stamp-wrap"><button class="stamp-btn small" id="btnRetry">再飞一次</button></span>
      <button class="chip" id="btnRevive">花 50 ✦ 原地续飞</button>
    </div>
    <div class="over-row">
      <button class="link-btn" id="btnShare">分享战绩</button>
      <button class="link-btn" id="btnCloset2">换角色</button>
      <button class="link-btn" id="btnHome">回首页</button>
    </div>
  </div>
</section>

<section id="pause" class="screen" aria-label="暂停">
  <div class="pause-card">
    <h2>暂停中</h2>
    <span class="stamp-wrap"><button class="stamp-btn small blue" id="btnResume">继续飞</button></span>
    <button class="link-btn" id="btnQuit">回首页</button>
  </div>
</section>

<section id="closet" class="screen" aria-label="换角色">
  <div class="album">
    <header>
      <div><h2>邮票册</h2><p>用星屑换新的信差</p></div>

/* ---------- glow sprites ---------- */
const glowCache = new Map();
function glowSprite(color) {
  let c = glowCache.get(color);

  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, rgba(color, 1)); gr.addColorStop(0.22, rgba(color, 0.5)); gr.addColorStop(1, rgba(color, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  glowCache.set(color, c);
  return c;
}
function drawGlow(g, color, x, y, rad, alpha) {
  g.globalAlpha = alpha;
  g.drawImage(glowSprite(color), x - rad, y - rad, rad * 2, rad * 2);
  g.globalAlpha = 1;
}

      g.fillStyle = '#FFFFFF'; circ(g, s * x1 + rx * 0.35, y - ry * 0.42, rx * 0.4); g.fill();
    }
  }
}

  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offsetX * scale + sx), dpr * (-cam.y * scale + sy));
  const top = cam.y - 120, bot = cam.y + viewH + 120;
  drawHome(ctx);
  for (const p of planets) if (!p.dead && p.y > top && p.y < bot) drawOrbitRing(ctx, p);
  for (const h of holes) if (h.y > top && h.y < bot) drawHole(ctx, h);
  for (const k of pickups) if (!k.taken && k.y > top && k.y < bot) drawPickup(ctx, k);
  for (const p of planets) if (!p.dead && p.y > top && p.y < bot) drawPlanet(ctx, p);
  drawAim(ctx);
  drawTrail(ctx);
  drawPlayer(ctx);
  for (const m of meteors) drawMeteor(ctx, m);
  drawParticles(ctx);
  drawTexts(ctx);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (vignette) ctx.drawImage(vignette, 0, 0, cw, ch);
}

/* ---------- UI ---------- */
const screens = { menu: $('#menu'), over: $('#over'), pause: $('#pause'), closet: $('#closet') };
function show(name) {
  for (const k in screens) { const on = k === name; screens[k].classList.toggle('on', on); screens[k].inert = !on; }
  $('#hud').classList.toggle('on', state === 'play' || state === 'pause');
}
let toastTimer = 0, hintTimer = 0, letterTimer = 0;
function toast(text) {
  $('#toastText').textContent = text; const el = $('#toast');
  el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function showHint(text, dur) {
  $('#hintText').textContent = text; $('#hint').classList.add('show');
  clearTimeout(hintTimer); if (dur) hintTimer = setTimeout(hideHint, dur * 1000);
}
function hideHint() { $('#hint').classList.remove('show'); }
function tip(key, text, dur = 3.6) {
  if (save.tips[key] || state !== 'play') return;
  save.tips[key] = 1; persist(); showHint(text, dur);
}
function showLetter(text) {
  run.delivered.push(text);
  $('#letterText').textContent = text;
  const el = $('#letter'); el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(letterTimer); letterTimer = setTimeout(() => el.classList.remove('show'), 3600);
}
function showBiome(bi, name) {
  $('#biomeStop').textContent = `第 ${bi + 1} 站`; $('#biomeName').textContent = name;
  const el = $('#biome'); el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function comboUI(pop) {
  const el = $('#combo');
  if (run.combo >= 2) {
    $('#comboNum').textContent = '×' + run.combo; el.classList.add('on');
    if (pop) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  } else el.classList.remove('on');
}
let hudLast = { d: -1, s: -1 };
function updateHUD(dt) {
  run.display += (run.score - run.display) * Math.min(1, dt * 8);
  const d = Math.round(run.display);
  if (d !== hudLast.d) { $('#hudDist').textContent = d; hudLast.d = d; }
  if (run.stars !== hudLast.s) { $('#hudStars').textContent = run.stars; hudLast.s = run.stars; }
}
function refreshMenu() {
  $('#menuBest').textContent = save.best;
  $('#menuStars').textContent = save.stars;
  $('#menuLetters').textContent = `${save.seen.length}/${LETTERS.length}`;
  const db = save.daily.date === todayKey() ? save.daily.best : 0;
  $('#modeNote').textContent = mode === 'daily' ? `今天所有人的星图都一样，你今天最远 ${db} 光年` : '每一局的星图都不一样';
  document.querySelectorAll('.seg-btn').forEach(b => { const on = b.dataset.mode === mode; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  const sb = $('#btnSound'); sb.textContent = save.muted ? '声音关' : '声音开'; sb.setAttribute('aria-pressed', !save.muted);
}
function blurActive() { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
function startGame() {
  if (state !== 'menu') return;
  Sound.init(); Sound.setPad(BIOMES[0].chord); Sound.click();
  resetRun(); state = 'play'; show(null); blurActive();
  hudLast = { d: -1, s: -1 };
  if (!save.tips.start) { save.tips.start = 1; persist(); showHint('点一下屏幕，小猫会沿着虚线方向飞出去', 0); }
}
function retry() {
  if (state !== 'over') return;
  Sound.click();
  newWorld(seedFor(mode)); resetRun(); state = 'play'; show(null); blurActive();
  hudLast = { d: -1, s: -1 }; Sound.setPad(BIOMES[0].chord);
}
function goHome() {
  state = 'menu'; newWorld(seedFor(mode)); resetRun(); comboUI(false); hideHint(); refreshMenu(); show('menu');
}
function pauseGame() { if (state !== 'play') return; state = 'pause'; show('pause'); $('#btnResume').focus(); }
function resumeGame() { if (state !== 'pause') return; state = 'play'; show(null); blurActive(); lastT = performance.now(); }
function gameOver() {
  state = 'over';
  const earned = run.stars - run.banked; save.stars += earned; run.banked = run.stars;
  save.runs++;
  let isBest = false, best;
  if (mode === 'daily') {
    const key = todayKey();
    if (save.daily.date !== key) save.daily = { date: key, best: 0 };
    if (run.score > save.daily.best) { save.daily.best = run.score; isBest = true; }
    best = save.daily.best;
  } else {
    if (run.score > save.best) { save.best = run.score; isBest = true; }
    best = save.best;
  }
  persist();
  const d = new Date();
  $('#pmDate').textContent = `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  $('#pmMode').textContent = mode === 'daily' ? '今日星图' : '无尽星海';
  $('#overTitle').textContent = pick(OVER_TITLES);
  $('#overCause').textContent = pick(CAUSES[run.cause] || CAUSES.lost);
  $('#overDist').textContent = run.score.toLocaleString('zh-CN');
  $('#overBest').classList.toggle('show', isBest && run.score > 0);
  $('#overBestLine').textContent = `${mode === 'daily' ? '今日最远' : '历史最远'} ${best} 光年`;
  $('#overStars').textContent = '+' + run.stars;
  $('#overLetters').textContent = run.letters;
  $('#overCombo').textContent = run.maxCombo;
  $('#overQuote').textContent = run.delivered.length ? '✉ ' + run.delivered[run.delivered.length - 1] : pick(LOST_LINES);
  const rb = $('#btnRevive');
  rb.hidden = run.revived;
  rb.disabled = save.stars < 50;
  rb.textContent = save.stars < 50 ? `续飞需要 50 ✦（还差 ${50 - save.stars}）` : '花 50 ✦ 原地续飞';
  hideHint(); comboUI(false);
  show('over');
  setTimeout(() => { if (state === 'over') $('#btnRetry').focus({ preventScroll: true }); }, 400);
}
function revive() {
  if (state !== 'over' || run.revived || save.stars < 50) return;
  save.stars -= 50; persist(); run.revived = true;
  let pl = player.lastLanded && !player.lastLanded.dead ? player.lastLanded : null;
  if (!pl) {
    let bestD = 1e9; const ref = player.lastLanded || player;
    for (const p of planets) { if (p.dead) continue; const dd = dist(p.x, p.y, ref.x, ref.y); if (dd < bestD) { bestD = dd; pl = p; } }
  }
  if (!pl) return goHome();
  if (pl.crumbling) { pl.crumbling = false; pl.cracks = null; pl.type = 'normal'; }
  Object.assign(player, { state: 'orbit', planet: pl, ang: -Math.PI / 2, dir: 1, rad: pl.orbit - 5, radT: pl.orbit - 5, inv: 2.2, deathHole: null, trail: [], vx: 0, vy: 0, deadT: 0 });
  player.x = pl.x; player.y = pl.y - pl.orbit + 5;
  pl.current = true;
  meteors = []; deadTimer = 0;
  cam.force = Math.min(cam.y + viewH, pl.y - viewH * ANCHOR);
  state = 'play'; show(null); blurActive();
  Sound.buy(); ringFx(pl.x, pl.y, pl.r, pl.orbit + 30, '#FFE38A', 0.8, 3);
  floatText(pl.x, pl.y - pl.orbit - 12, '继续送信！', '#FFE38A', 16);
}
async function share() {
  const txt = mode === 'daily'
    ? `《星邮喵》今日星图：我飞了 ${run.score} 光年，送出 ${run.letters} 封信 ✉ 同一张星图，来比比？`
    : `我在《星邮喵》里飞了 ${run.score} 光年，送出 ${run.letters} 封信 ✉ 最高 ${run.maxCombo} 连击，你能飞得比我远吗？`;
  try { if (navigator.share) { await navigator.share({ text: txt }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (e2) { ok = false; }
  }
  toast(ok ? '战绩已复制，贴给朋友吧' : '复制没成功，截个图分享也行');
}

/* closet */
const cards = [];
let closetFrom = 'menu', closetOpen = false;
SKINS.forEach(s => {
  const wrap = document.createElement('div'); wrap.className = 'stamp-wrap card-wrap';
  const b = document.createElement('button'); b.className = 'stamp-card'; b.style.setProperty('--bg', s.bg);
  const denom = document.createElement('span'); denom.className = 'denom num';
  const cv = document.createElement('canvas');
  const nm = document.createElement('strong'); nm.textContent = s.name;
  const tg = document.createElement('small'); tg.textContent = s.tag;
  const mk = document.createElement('span'); mk.className = 'mark'; mk.textContent = '使用中';
  b.append(denom, cv, nm, tg, mk); wrap.appendChild(b); $('#stamps').appendChild(wrap);
  b.addEventListener('click', () => onCard(s, wrap));
  cards.push({ s, b, wrap, cv, denom, g: cv.getContext('2d') });
});
function refreshCloset() {
  $('#closetStars').textContent = save.stars;
  for (const c of cards) {
    const owned = save.owned.includes(c.s.id), eq = save.skin === c.s.id;
    c.b.classList.toggle('locked', !owned); c.b.classList.toggle('equipped', eq);
    c.denom.textContent = owned ? (eq ? '' : '已拥有') : `${c.s.price}✦`;
    c.b.setAttribute('aria-label', `${c.s.name}，${owned ? (eq ? '使用中' : '已拥有，点一下换上') : `需要 ${c.s.price} 星屑`}`);
  }
}
function onCard(s, wrap) {
  Sound.init();
  if (save.skin === s.id) { toast(`${s.name}正在值班`); return; }
  if (save.owned.includes(s.id)) { save.skin = s.id; persist(); refreshCloset(); Sound.click(); toast(`换上了${s.name}`); return; }
  if (save.stars >= s.price) {
    save.stars -= s.price; save.owned.push(s.id); save.skin = s.id; persist(); refreshCloset();
    Sound.buy(); toast(`${s.name}加入了星邮局！`);
    wrap.classList.remove('bought'); void wrap.offsetWidth; wrap.classList.add('bought');
  } else {
    Sound.deny(); toast(`还差 ${s.price - save.stars} ✦，多送几趟信吧`);
    wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
  }
}
function openCloset(from) {
  closetFrom = from; closetOpen = true;
  for (const c of cards) { const sz = Math.round(96 * dpr); c.cv.width = sz; c.cv.height = sz; }
  refreshCloset(); show('closet'); Sound.click();
  setTimeout(() => { const eq = cards.find(c => c.s.id === save.skin); if (eq) eq.b.focus({ preventScroll: true }); }, 60);
}
function closeCloset() {
  closetOpen = false; Sound.click();
  if (closetFrom === 'over') {
    const rb = $('#btnRevive'); rb.disabled = save.stars < 50;
    rb.textContent = save.stars < 50 ? `续飞需要 50 ✦（还差 ${50 - save.stars}）` : '花 50 ✦ 原地续飞';
    show('over');
  } else { refreshMenu(); show('menu'); }
}
function drawPreviews(t) {
  for (const c of cards) {
    const g = c.g, k = c.cv.width / 96;
    g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, 96, 96);
    g.globalCompositeOperation = 'lighter'; drawGlow(g, c.s.trail[1], 48, 50, 44, 0.25); g.globalCompositeOperation = 'source-over';
    g.translate(48, 52 + Math.sin(t * 2 + c.s.price) * 3);
    drawSkin(g, c.s.id, 23, t, { blink: (t * 0.7 + c.s.price * 0.013) % 3 < 0.1, vx: 1, angle: -0.35 });
  }
}

/* ---------- input ---------- */
canvas.addEventListener('pointerdown', e => { e.preventDefault(); Sound.init(); if (state === 'play') jump(); });
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.code;
  if (k === 'Space' || k === 'ArrowUp' || (k === 'Enter' && state === 'play')) {
    if (state === 'play') { e.preventDefault(); Sound.init(); jump(); }
    else if (state === 'menu' && k === 'Space' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); startGame(); }
    else if (state === 'over' && k === 'Space' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); retry(); }
  } else if (k === 'KeyP' || k === 'Escape') {
    if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame();
    else if (closetOpen && k === 'Escape') closeCloset();
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('resize', resize);
$('#btnStart').addEventListener('click', startGame);
$('#btnRetry').addEventListener('click', retry);
$('#btnRevive').addEventListener('click', revive);
$('#btnHome').addEventListener('click', () => { Sound.click(); goHome(); });
$('#btnShare').addEventListener('click', share);
$('#btnCloset').addEventListener('click', () => openCloset('menu'));
$('#btnCloset2').addEventListener('click', () => openCloset('over'));
$('#btnCloseCloset').addEventListener('click', closeCloset);
$('#btnPause').addEventListener('click', pauseGame);
$('#btnResume').addEventListener('click', resumeGame);
$('#btnQuit').addEventListener('click', () => { Sound.click(); goHome(); });
$('#btnSound').addEventListener('click', () => {
  save.muted = !save.muted; persist(); Sound.init(); Sound.setMuted(save.muted); if (!save.muted) Sound.click(); refreshMenu();
});
document.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => {
  if (mode === b.dataset.mode) return;
  mode = b.dataset.mode; Sound.init(); Sound.click(); newWorld(seedFor(mode)); refreshMenu();
}));

/* ---------- loop ---------- */
let lastT = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  if (state !== 'pause') {
    let ts = 1; if (slowT > 0) { slowT -= rdt; ts = 0.3; }
    update(rdt * ts);
    if (state === 'play' && player.state === 'dead') { deadTimer += rdt; if (deadTimer > 1.15) gameOver(); }
  }
  shake *= Math.exp(-rdt * 9); if (shake < 0.05) shake = 0;
  render();
  if (state === 'play' || state === 'pause') updateHUD(rdt);
  if (closetOpen) drawPreviews(now / 1000);
  requestAnimationFrame(frame);
}
resize();
newWorld(seedFor(mode));
refreshMenu(); show('menu');
requestAnimationFrame(frame);

})();
</script>
</body>
