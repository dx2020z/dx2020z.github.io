<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04040c">
<title>星核 · ASTRA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    overflow:hidden;
    background:radial-gradient(circle at 50% 45%, #0b0b1e 0%, #04040a 60%, #010104 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
  body{display:grid;place-items:center;}
  #wrap{
    position:relative;
    width:min(100vw, calc(100vh * 480 / 820));
    aspect-ratio:480/820;
    border-radius:20px;
    overflow:hidden;
    box-shadow:
      0 0 60px rgba(90,130,255,.14),
      0 0 180px rgba(130,80,255,.10),
      0 30px 80px rgba(0,0,0,.6);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
"use strict";

/* ============================================================
   常量与配置
   ============================================================ */
const W = 480, H = 820;

const LEFT   = 24;
const RIGHT  = 456;
const TOP    = 160;
const BOTTOM = 800;

const DEATH_LINE = TOP + 130;
const HOLD_Y     = 130;

const GRAVITY = 2400;
const REST    = 0.20;
const MAX_LEVEL = 9;

/* 元素等级 —— 从尘埃到奇点 */
const LEVELS = [
  { r: 10, h: 199, s: 89, l: 62, name: "尘埃"   },
  { r: 14, h: 239, s: 84, l: 67, name: "陨石"   },
  { r: 18, h: 271, s: 91, l: 68, name: "卫星"   },
  { r: 24, h: 330, s: 81, l: 63, name: "行星"   },
  { r: 30, h: 350, s: 89, l: 63, name: "巨行星" },
  { r: 38, h: 25,  s: 95, l: 60, name: "恒星"   },
  { r: 47, h: 43,  s: 96, l: 58, name: "巨星"   },
  { r: 57, h: 82,  s: 78, l: 58, name: "星云"   },
  { r: 69, h: 172, s: 66, l: 52, name: "星系"   },
  { r: 82, h: 45,  s: 100,l: 88, name: "奇点"   },
];

/* ============================================================
   工具函数
   ============================================================ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);

function hsla(h, s, l, a) {
  return `hsla(${h},${s}%,${l}%,${a})`;
}
function hsl(h, s, l) {
  return `hsl(${h},${s}%,${l}%)`;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================================
   画布初始化
   ============================================================ */
const wrap   = document.getElementById("wrap");
const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d", { alpha: false });

function resizeCanvas() {
  const dpr  = Math.min(window.devicePixelRatio || 1, 2);
  const rect = wrap.getBoundingClientRect();
  canvas.width  = Math.max(1, Math.round(rect.width  * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* ============================================================
   音频引擎（纯程序化合成）
   ============================================================ */
let actx = null;
let audioReady = false;

function initAudio() {
  if (actx) {
    if (actx.state === "suspended") actx.resume();
    return;
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    audioReady = true;
  } catch (e) { audioReady = false; }
}

/* 小调五声音阶 —— 让每一次合成都成为一段旋律 */
const SCALE_SEMI = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24, 27];
const BASE_FREQ  = 261.63; // C4

function semiToFreq(semi) {
  return BASE_FREQ * Math.pow(2, semi / 12);
}

function playMerge(level) {
  if (!audioReady || !actx) return;
  const t = actx.currentTime;
  const semi = SCALE_SEMI[Math.min(level, SCALE_SEMI.length - 1)];
  const f = semiToFreq(semi);

  /* 主音 */
  const osc = actx.createOscillator();
  const g1  = actx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(f, t);

  /* 泛音 */
  const osc2 = actx.createOscillator();
  const g2   = actx.createGain();
  osc2.type = "triangle";
  osc2.frequency.setValueAtTime(f * 2, t);

  /* 低频小音块 —— 增加"重量感" */
  const osc3 = actx.createOscillator();
  const g3   = actx.createGain();
  osc3.type = "sine";
  osc3.frequency.setValueAtTime(f * 0.5, t);

  const vol = 0.18 + level * 0.015;

  g1.gain.setValueAtTime(0.0001, t);
  g1.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.55 + level * 0.03);

  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(vol * 0.30, t + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);

  g3.gain.setValueAtTime(0.0001, t);
  g3.gain.exponentialRampToValueAtTime(vol * 0.45, t + 0.02);
  g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);

  osc.connect(g1);  g1.connect(actx.destination);
  osc2.connect(g2); g2.connect(actx.destination);
  osc3.connect(g3); g3.connect(actx.destination);

  const end = t + 0.75;
  osc.start(t);  osc.stop(end);
  osc2.start(t); osc2.stop(end);
  osc3.start(t); osc3.stop(end);
}

function playDrop(level) {
  if (!audioReady || !actx) return;
  const t = actx.currentTime;
  const osc = actx.createOscillator();
  const g   = actx.createGain();
  osc.type = "sine";
  const f = semiToFreq(SCALE_SEMI[Math.min(level, SCALE_SEMI.length - 1)]) * 1.5;
  osc.frequency.setValueAtTime(f, t);
  osc.frequency.exponentialRampToValueAtTime(f * 0.65, t + 0.09);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.06, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t); osc.stop(t + 0.15);
}

/* ============================================================
   精灵预渲染
   ============================================================ */
const sprites = [];

function makeSprite(lv) {
  const L = LEVELS[lv];
  const r = L.r;
  const pad = Math.max(r * 0.95, 15);
  const size = Math.ceil((r + pad) * 2);

  const cv = document.createElement("canvas");
  cv.width = cv.height = size;
  const g = cv.getContext("2d");
  const c = size / 2;
  const { h, s, l } = L;

  /* 外发光 */
  const glow = g.createRadialGradient(c, c, r * 0.55, c, c, r + pad);
  glow.addColorStop(0,    hsla(h, s, l, 0.50));
  glow.addColorStop(0.28, hsla(h, s, l, 0.20));
  glow.addColorStop(0.62, hsla(h, s, l, 0.06));
  glow.addColorStop(1,    hsla(h, s, l, 0));
  g.fillStyle = glow;
  g.fillRect(0, 0, size, size);

  /* 球体本体 */
  const body = g.createRadialGradient(
    c - r * 0.34, c - r * 0.40, r * 0.04,
    c, c, r * 1.06
  );
  body.addColorStop(0,    hsl(h, Math.min(s + 6, 100), Math.min(l + 32, 97)));
  body.addColorStop(0.42, hsl(h, s, l));
  body.addColorStop(1,    hsl(h, Math.min(s + 8, 100), Math.max(l - 34, 10)));
  g.beginPath();
  g.arc(c, c, r, 0, Math.PI * 2);
  g.fillStyle = body;
  g.fill();

  /* 内描边 */
  g.beginPath();
  g.arc(c, c, r * 0.965, 0, Math.PI * 2);
  g.strokeStyle = hsla(h, 100, 92, 0.32);
  g.lineWidth = Math.max(1, r * 0.055);
  g.stroke();

  /* 高光 */
  g.save();
  g.beginPath();
  g.arc(c, c, r, 0, Math.PI * 2);
  g.clip();
  const hl = g.createRadialGradient(
    c - r * 0.30, c - r * 0.44, 0,
    c - r * 0.30, c - r * 0.44, r * 0.92
  );
  hl.addColorStop(0,   "rgba(255,255,255,0.58)");
  hl.addColorStop(0.35,"rgba(255,255,255,0.14)");
  hl.addColorStop(1,   "rgba(255,255,255,0)");
  g.fillStyle = hl;
  g.fillRect(0, 0, size, size);
  g.restore();

  /* 奇点额外光环 */
  if (lv === MAX_LEVEL) {
    g.beginPath();
    g.arc(c, c, r * 1.13, 0, Math.PI * 2);
    g.strokeStyle = hsla(h, s, l, 0.55);
    g.lineWidth = Math.max(1.5, r * 0.045);
    g.stroke();
    g.beginPath();
    g.arc(c, c, r * 1.28, 0, Math.PI * 2);
    g.strokeStyle = hsla(h, s, l, 0.18);
    g.lineWidth = Math.max(1, r * 0.03);
    g.stroke();
  }

  return { cv, size, r };
}

for (let i = 0; i < LEVELS.length; i++) sprites.push(makeSprite(i));

/* ============================================================
   背景星空
   ============================================================ */
const bgStars = [];
for (let i = 0; i < 130; i++) {
  bgStars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: rand(0.3, 1.5),
    a: rand(0.08, 0.55),
    ph: Math.random() * Math.PI * 2,
    sp: rand(0.4, 1.6),
  });
}

/* ============================================================
   游戏状态
   ============================================================ */
let bodies    = [];
let particles = [];
let ripples   = [];
let floaters  = [];   // 飘浮的得分文字

let score        = 0;
let displayScore = 0;
let best         = 0;
try { best = parseInt(localStorage.getItem("astra_best_v1") || "0", 10) || 0; } catch (e) { best = 0; }

let combo     = 0;
let comboTimer = 0;
let comboSave  = 0;

let gameOver = false;
let started  = false;
let time     = 0;
let shake    = 0;
let dropCooldown = 0;

let held = null;
let nextLevel = 0;

/* ============================================================
   初始化 / 重置
   ============================================================ */
function randomLevel() {
  const r = Math.random();
  if (r < 0.35) return 0;
  if (r < 0.64) return 1;
  if (r < 0.84) return 2;
  if (r < 0.95) return 3;
  return 4;
}

function makeHeld(level, x) {
  const r = LEVELS[level].r;
  return {
    level,
    x: clamp(x !== undefined ? x : W / 2, LEFT + r, RIGHT - r),
    y: HOLD_Y,
  };
}

function reset() {
  bodies = [];
  particles = [];
  ripples = [];
  floaters = [];
  score = 0;
  displayScore = 0;
  combo = 0;
  comboTimer = 0;
  comboSave = 0;
  gameOver = false;
  shake = 0;
  dropCooldown = 0;

  nextLevel = randomLevel();
  held = makeHeld(randomLevel(), W / 2);
}

/* ============================================================
   输入
   ============================================================ */
let pointerDown = false;

function toLogic(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) / rect.width * W;
}

function updateHeldX(clientX) {
  if (!held || gameOver) return;
  const r = LEVELS[held.level].r;
  held.x = clamp(toLogic(clientX), LEFT + r, RIGHT - r);
}

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  initAudio();

  if (gameOver) {
    /* 检查是否点击了重开按钮 */
    const rect = canvas.getBoundingClientRect();
    const lx = (e.clientX - rect.left) / rect.width * W;
    const ly = (e.clientY - rect.top) / rect.height * H;
    if (lx > W / 2 - 100 && lx < W / 2 + 100 && ly > 520 && ly < 584) {
      reset();
      started = true;
    }
    return;
  }

  if (!started) {
    started = true;
    reset();
  }

  pointerDown = true;
  updateHeldX(e.clientX);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse" || pointerDown) {
    updateHeldX(e.clientX);
  }
});

canvas.addEventListener("pointerup", (e) => {
  e.preventDefault();
  if (!pointerDown) return;
  pointerDown = false;

  if (!gameOver && started) dropHeld();
});

canvas.addEventListener("pointercancel", () => {
  pointerDown = false;
});

/* 键盘支持 */
window.addEventListener("keydown", (e) => {
  if (!started || gameOver) return;
  if (e.key === "ArrowLeft") {
    if (held) held.x = clamp(held.x - 24, LEFT + LEVELS[held.level].r, RIGHT - LEVELS[held.level].r);
  } else if (e.key === "ArrowRight") {
    if (held) held.x = clamp(held.x + 24, LEFT + LEVELS[held.level].r, RIGHT - LEVELS[held.level].r);
  } else if (e.key === " " || e.key === "ArrowDown" || e.key === "Enter") {
    e.preventDefault();
    dropHeld();
  }
});

/* ============================================================
   投放
   ============================================================ */
function dropHeld() {
  if (!held || gameOver || dropCooldown > 0) return;

  const lv = held.level;
  const r = LEVELS[lv].r;

  bodies.push({
    x: held.x,
    y: held.y,
    vx: 0,
    vy: 80,
    r,
    level: lv,
    mass: r * r,
    overTimer: 0,
    pop: 0,
  });

  playDrop(lv);

  nextLevel = randomLevel();
  held = makeHeld(nextLevel, held.x);
  nextLevel = randomLevel();

  dropCooldown = 0.13;
}

/* ============================================================
   粒子 / 波纹 / 飘字
   ============================================================ */
function burst(x, y, L, level) {
  const n = 10 + level * 5;
  for (let i = 0; i < n; i++) {
    const a  = Math.random() * Math.PI * 2;
    const sp = 70 + Math.random() * 300 * (0.6 + level * 0.10);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 50,
      life: rand(0.45, 1.0),
      r: rand(1.4, 4.2),
      h: L.h + rand(-28, 28),
      s: L.s,
      l: 62 + Math.random() * 30,
    });
  }
}

function addRipple(x, y, L, scale) {
  ripples.push({
    x, y,
    t: 0,
    dur: 0.55,
    maxR: L.r * (4 + scale * 0.6) + 40,
    h: L.h, s: L.s, l: L.l,
  });
}

function addFloater(x, y, text, h, s, l) {
  floaters.push({ x, y, text, life: 1, h, s, l });
}

/* ============================================================
   物理
   ============================================================ */
function integrate(dt) {
  for (const b of bodies) {
    if (b.dead) continue;
    b.vy += GRAVITY * dt;
    b.x  += b.vx * dt;
    b.y  += b.vy * dt;
    b.vx *= 0.9988;
    b.vy *= 0.9988;

    if (b.pop > 0) b.pop = Math.max(0, b.pop - dt / 0.22);
  }
}

function solveCollisions() {
  const n = bodies.length;

  /* 边界 */
  for (let i = 0; i < n; i++) {
    const b = bodies[i];
    if (b.dead) continue;

    if (b.x - b.r < LEFT) {
      b.x = LEFT + b.r;
      if (b.vx < 0) b.vx = -b.vx * REST;
    }
    if (b.x + b.r > RIGHT) {
      b.x = RIGHT - b.r;
      if (b.vx > 0) b.vx = -b.vx * REST;
    }
    if (b.y + b.r > BOTTOM) {
      b.y = BOTTOM - b.r;
      if (b.vy > 0) b.vy = -b.vy * REST;
      b.vx *= 0.90;
    }
  }

  /* 两两碰撞 */
  const merged = new Set();
  const toAdd  = [];

  for (let i = 0; i < n; i++) {
    const a = bodies[i];
    if (!a || a.dead || merged.has(a)) continue;

    for (let j = i + 1; j < n; j++) {
      const b = bodies[j];
      if (!b || b.dead || merged.has(b)) continue;

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const rsum = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 > rsum * rsum) continue;

      /* --- 同级合成 --- */
      if (a.level === b.level && a.level < MAX_LEVEL) {
        merged.add(a);
        merged.add(b);
        a.dead = true;
        b.dead = true;

        const newLevel = a.level + 1;
        const mx = (a.x + b.x) * 0.5;
        const my = (a.y + b.y) * 0.5;
        const nr = LEVELS[newLevel].r;

        toAdd.push({
          x: mx, y: my,
          vx: (a.vx + b.vx) * 0.5,
          vy: (a.vy + b.vy) * 0.5 - 90,
          r: nr,
          level: newLevel,
          mass: nr * nr,
          overTimer: 0,
          pop: 1,
        });

        /* 分数 */
        const basePts = newLevel * (newLevel + 1) * 5;
        combo++;
        comboTimer = 2.2;
        const mult = 1 + Math.min(combo - 1, 10) * 0.1;
        const pts = Math.round(basePts * mult);
        score += pts;

        /* 特效 */
        const srcL = LEVELS[a.level];
        burst(mx, my, srcL, newLevel);
        addRipple(mx, my, srcL, newLevel);
        addFloater(mx, my - nr - 6, "+" + pts, srcL.h, srcL.s, Math.min(srcL.l + 22, 90));

        shake = Math.min(shake + 1.6 + a.level * 0.7, 11);

        playMerge(newLevel);
        continue;
      }

      /* --- 普通碰撞 --- */
      const d = Math.sqrt(d2) || 0.0001;
      const nx = dx / d;
      const ny = dy / d;
      const overlap = rsum - d;

      if (overlap > 0.3) {
        const ma = a.mass, mb = b.mass;
        const total = ma + mb;
        const corr = overlap * 0.85;

        a.x -= nx * corr * (mb / total);
        a.y -= ny * corr * (mb / total);
        b.x += nx * corr * (ma / total);
        b.y += ny * corr * (ma / total);

        const rvx = b.vx - a.vx;
        const rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;

        if (vn < 0) {
          const jimp = -(1 + REST) * vn / (1 / ma + 1 / mb);
          a.vx -= jimp * nx / ma;
          a.vy -= jimp * ny / ma;
          b.vx += jimp * nx / mb;
          b.vy += jimp * ny / mb;
        }
      }
    }
  }

  for (const nb of toAdd) bodies.push(nb);
}

function physics(dt) {
  const steps = 4;
  const h = dt / steps;
  for (let s = 0; s < steps; s++) {
    integrate(h);
    solveCollisions();
  }
}

/* ============================================================
   更新
   ============================================================ */
function update(dt) {
  if (dropCooldown > 0) dropCooldown -= dt;

  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) combo = 0;
  }

  if (!gameOver) {
    physics(dt);

    /* 清理 */
    for (let i = bodies.length - 1; i >= 0; i--) {
      if (bodies[i].dead) bodies.splice(i, 1);
    }

    /* 结束判定 */
    for (const b of bodies) {
      if (b.y - b.r < DEATH_LINE) {
        b.overTimer += dt;
        if (b.overTimer > 1.6) { endGame(); break; }
      } else {
        b.overTimer = 0;
      }
    }
  }

  /* 粒子 */
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += 620 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.972;
    p.vy *= 0.972;
  }

  /* 波纹 */
  for (let i = ripples.length - 1; i >= 0; i--) {
    const w = ripples[i];
    w.t += dt;
    if (w.t >= w.dur) { ripples.splice(i, 1); }
  }

  /* 飘字 */
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt * 0.9;
    f.y -= dt * 44;
    if (f.life <= 0) floaters.splice(i, 1);
  }

  /* 震动衰减 */
  if (shake > 0) shake = Math.max(0, shake - dt * 34);

  /* 分数滚动 */
  displayScore += (score - displayScore) * Math.min(1, dt * 11);
  if (Math.abs(score - displayScore) < 0.6) displayScore = score;

  time += dt;
}

function endGame() {
  if (gameOver) return;
  gameOver = true;
  if (score > best) {
    best = score;
    try { localStorage.setItem("astra_best_v1", String(best)); } catch (e) {}
  }
}

/* ============================================================
   渲染
   ============================================================ */
function drawBackground() {
  /* 深空渐变 */
  const g = ctx.createRadialGradient(W / 2, H * 0.42, 40, W / 2, H * 0.5, H * 0.86);
  g.addColorStop(0,   "#0d0d22");
  g.addColorStop(0.45,"#070712");
  g.addColorStop(1,   "#020207");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* 星尘 */
  for (const s of bgStars) {
    const tw = 0.55 + 0.45 * Math.sin(time * s.sp + s.ph);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(190,210,255,${s.a * tw})`;
    ctx.fill();
  }

  /* 顶部柔光 */
  const tg = ctx.createLinearGradient(0, 0, 0, 240);
  tg.addColorStop(0, "rgba(90,120,255,0.055)");
  tg.addColorStop(1, "rgba(90,120,255,0)");
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, 240);
}

function drawField() {
  /* 场地内部 */
  roundRect(ctx, LEFT, TOP, RIGHT - LEFT, BOTTOM - TOP, 26);
  const ig = ctx.createLinearGradient(0, TOP, 0, BOTTOM);
  ig.addColorStop(0, "rgba(120,150,255,0.030)");
  ig.addColorStop(1, "rgba(120,150,255,0.008)");
  ctx.fillStyle = ig;
  ctx.fill();

  /* 边框 */
  ctx.strokeStyle = "rgba(120,160,255,0.16)";
  ctx.lineWidth = 2;
  ctx.stroke();

  /* 死亡线 */
  let danger = 0;
  for (const b of bodies) {
    if (b.y - b.r < DEATH_LINE + 60) {
      danger = Math.max(danger, 1 - (b.y - b.r - DEATH_LINE) / 60);
    }
  }
  danger = clamp(danger, 0, 1);

  ctx.save();
  ctx.setLineDash([6, 11]);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = danger > 0.02
    ? `rgba(255,90,110,${0.16 + danger * 0.55})`
    : "rgba(150,170,220,0.10)";
  ctx.beginPath();
  ctx.moveTo(LEFT + 14, DEATH_LINE);
  ctx.lineTo(RIGHT - 14, DEATH_LINE);
  ctx.stroke();
  ctx.restore();
}

function drawBodies() {
  for (const b of bodies) {
    const sp = sprites[b.level];
    let scale = 1;
    if (b.pop > 0) scale = 1 + b.pop * 0.30;

    const sz = sp.size * scale;
    ctx.drawImage(sp.cv, b.x - sz / 2, b.y - sz / 2, sz, sz);
  }
}

function drawParticles() {
  if (!particles.length) return;
  ctx.globalCompositeOperation = "lighter";
  for (const p of particles) {
    const a = clamp(p.life * 1.7, 0, 1);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.5), 0, Math.PI * 2);
    ctx.fillStyle = hsla(p.h, p.s, p.l, a * 0.9);
    ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
}

function drawRipples() {
  if (!ripples.length) return;
  ctx.globalCompositeOperation = "lighter";
  for (const w of ripples) {
    const t = w.t / w.dur;
    const e = 1 - Math.pow(1 - t, 3);
    const r = w.maxR * e;
    const a = (1 - t) * 0.55;

    ctx.beginPath();
    ctx.arc(w.x, w.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = hsla(w.h, w.s, w.l + 12, a);
    ctx.lineWidth = Math.max(1, 5 * (1 - t));
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(w.x, w.y, r * 0.62, 0, Math.PI * 2);
    ctx.strokeStyle = hsla(w.h, w.s, w.l + 30, a * 0.45);
    ctx.lineWidth = Math.max(0.8, 2.6 * (1 - t));
    ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
}

function drawFloaters() {
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const f of floaters) {
    const a = clamp(f.life, 0, 1);
    ctx.font = "700 20px ui-sans-serif, system-ui, -apple-system, sans-serif";
    ctx.fillStyle = hsla(f.h, f.s, f.l, a);
    ctx.shadowColor = hsla(f.h, f.s, f.l, a * 0.9);
    ctx.shadowBlur = 14;
    ctx.fillText(f.text, f.x, f.y);
    ctx.shadowBlur = 0;
  }
}

function drawHeld() {
  if (!held || gameOver) return;

  const L = LEVELS[held.level];
  const sp = sprites[held.level];
  const sz = sp.size;

  /* 引导线 */
  ctx.save();
  ctx.setLineDash([4, 10]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = hsla(L.h, L.s, L.l, 0.13);
  ctx.beginPath();
  ctx.moveTo(held.x, held.y + L.r + 4);
  ctx.lineTo(held.x, BOTTOM - 6);
  ctx.stroke();
  ctx.restore();

  /* 漂浮 */
  const bob = Math.sin(time * 3.2) * 3;

  /* 落点光晕 */
  const gg = ctx.createRadialGradient(held.x, held.y + bob, 2, held.x, held.y + bob, L.r * 2.2);
  gg.addColorStop(0, hsla(L.h, L.s, L.l, 0.22));
  gg.addColorStop(1, hsla(L.h, L.s, L.l, 0));
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(held.x, held.y + bob, L.r * 2.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.drawImage(sp.cv, held.x - sz / 2, held.y + bob - sz / 2, sz, sz);
}

function drawUI() {
  ctx.textBaseline = "top";

  /* 分数 */
  ctx.textAlign = "left";
  ctx.font = "600 12px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "rgba(150,175,225,0.55)";
  ctx.fillText("分数 SCORE", 30, 26);

  ctx.font = "700 36px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "#e9efff";
  ctx.shadowColor = "rgba(120,170,255,0.45)";
  ctx.shadowBlur = 18;
  ctx.fillText(String(Math.round(displayScore)), 30, 44);
  ctx.shadowBlur = 0;

  /* 最高分 */
  ctx.font = "600 12px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "rgba(150,175,225,0.45)";
  ctx.fillText("最高 BEST", 30, 90);

  ctx.font = "700 16px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "rgba(190,210,255,0.72)";
  ctx.fillText(String(best), 92, 87);

  /* 连击 */
  if (combo > 1 && comboTimer > 0) {
    const a = clamp(comboTimer / 2.2, 0, 1);
    const pop = 1 + Math.sin((1 - a) * Math.PI) * 0.15;
    ctx.save();
    ctx.translate(W / 2, 60);
    ctx.scale(pop, pop);
    ctx.textAlign = "center";
    ctx.font = "800 26px ui-sans-serif, system-ui, -apple-system, sans-serif";
    ctx.fillStyle = `rgba(255,215,120,${a})`;
    ctx.shadowColor = `rgba(255,190,80,${a * 0.9})`;
    ctx.shadowBlur = 20;
    ctx.fillText("×" + combo, 0, -12);
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  /* NEXT 预览 */
  const lv = nextLevel;
  const sp = sprites[lv];
  const targetR = 17;
  const sc = targetR / sp.r;
  const sz = sp.size * sc;
  const cx = RIGHT - 44;
  const cy = 54;

  ctx.textAlign = "center";
  ctx.font = "600 11px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "rgba(150,175,225,0.45)";
  ctx.fillText("下一个", cx, cy - 40);

  /* 预览底环 */
  ctx.beginPath();
  ctx.arc(cx, cy, 30, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(120,150,255,0.05)";
  ctx.fill();
  ctx.strokeStyle = "rgba(120,160,255,0.15)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.drawImage(sp.cv, cx - sz / 2, cy - sz / 2, sz, sz);

  /* 等级名 */
  ctx.font = "600 11px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = hsla(LEVELS[lv].h, LEVELS[lv].s, LEVELS[lv].l + 12, 0.75);
  ctx.fillText(LEVELS[lv].name, cx, cy + 36);
}

function drawStartScreen() {
  ctx.fillStyle = "rgba(4,6,16,0.78)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  /* 标题 */
  const pulse = 0.5 + 0.5 * Math.sin(time * 1.6);

  ctx.save();
  ctx.shadowColor = `rgba(120,170,255,${0.35 + pulse * 0.35})`;
  ctx.shadowBlur = 40;
  ctx.font = "800 56px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "#eef3ff";
  ctx.fillText("星 核", W / 2, 250);
  ctx.restore();

  ctx.font = "600 15px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "rgba(140,170,230,0.65)";
  ctx.letterSpacing = "6px";
  ctx.fillText("A S T R A", W / 2, 300);
  ctx.letterSpacing = "0px";

  /* 说明 */
  const tips = [
    "放置星体 · 同阶相撞即融合",
    "从尘埃到奇点 · 十阶进化",
    "堆得太高 · 星核便会坍缩",
  ];
  ctx.font = "500 14px ui-sans-serif, system-ui, -apple-system, sans-serif";
  for (let i = 0; i < tips.length; i++) {
    ctx.fillStyle = `rgba(160,185,235,${0.42 + i * 0.06})`;
    ctx.fillText(tips[i], W / 2, 372 + i * 30);
  }

  /* 开始按钮 */
  const by = 520;
  const bw = 210, bh = 58;
  const bx = W / 2 - bw / 2;
  const glow = 0.5 + pulse * 0.5;

  ctx.save();
  ctx.shadowColor = `rgba(110,160,255,${0.35 + glow * 0.4})`;
  ctx.shadowBlur = 30 + glow * 20;

  const bg = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
  bg.addColorStop(0, "rgba(90,140,255,0.95)");
  bg.addColorStop(1, "rgba(150,100,255,0.95)");
  roundRect(ctx, bx, by, bw, bh, 29);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.restore();

  roundRect(ctx, bx, by, bw, bh, 29);
  ctx.strokeStyle = "rgba(200,220,255,0.35)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.font = "700 18px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("点击开始", W / 2, by + bh / 2 + 1);

  /* 最高分 */
  if (best > 0) {
    ctx.font = "600 14px ui-sans-serif, system-ui, -apple-system, sans-serif";
    ctx.fillStyle = "rgba(170,195,240,0.5)";
    ctx.fillText("历史最高  " + best, W / 2, 630);
  }
}

function drawGameOver() {
  ctx.fillStyle = "rgba(4,6,16,0.86)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const isNewBest = score >= best && score > 0;

  ctx.save();
  ctx.shadowColor = "rgba(255,90,120,0.45)";
  ctx.shadowBlur = 34;
  ctx.font = "800 42px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "#ffdde4";
  ctx.fillText("星核坍缩", W / 2, 258);
  ctx.restore();

  ctx.font = "600 13px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "rgba(200,150,170,0.6)";
  ctx.letterSpacing = "5px";
  ctx.fillText("COLLAPSE", W / 2, 300);
  ctx.letterSpacing = "0px";

  /* 分数 */
  ctx.font = "600 13px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "rgba(150,175,225,0.55)";
  ctx.fillText("本局得分", W / 2, 380);

  ctx.save();
  ctx.shadowColor = "rgba(140,180,255,0.5)";
  ctx.shadowBlur = 24;
  ctx.font = "800 54px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "#eef3ff";
  ctx.fillText(String(score), W / 2, 424);
  ctx.restore();

  if (isNewBest) {
    ctx.save();
    const pulse = 0.6 + 0.4 * Math.sin(time * 4);
    ctx.shadowColor = `rgba(255,210,90,${pulse * 0.9})`;
    ctx.shadowBlur = 24;
    ctx.font = "800 16px ui-sans-serif, system-ui, -apple-system, sans-serif";
    ctx.fillStyle = `rgba(255,220,110,${0.75 + pulse * 0.25})`;
    ctx.fillText("★  新纪录  ★", W / 2, 472);
    ctx.restore();
  } else {
    ctx.font = "600 15px ui-sans-serif, system-ui, -apple-system, sans-serif";
    ctx.fillStyle = "rgba(170,195,240,0.5)";
    ctx.fillText("历史最高  " + best, W / 2, 472);
  }

  /* 重开按钮 */
  const bw = 200, bh = 58;
  const bx = W / 2 - bw / 2;
  const by = 520;
  const pulse = 0.5 + 0.5 * Math.sin(time * 2.4);

  ctx.save();
  ctx.shadowColor = `rgba(110,160,255,${0.3 + pulse * 0.35})`;
  ctx.shadowBlur = 28 + pulse * 16;
  const bg = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
  bg.addColorStop(0, "rgba(90,140,255,0.95)");
  bg.addColorStop(1, "rgba(150,100,255,0.95)");
  roundRect(ctx, bx, by, bw, bh, 29);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.restore();

  roundRect(ctx, bx, by, bw, bh, 29);
  ctx.strokeStyle = "rgba(200,220,255,0.35)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.font = "700 18px ui-sans-serif, system-ui, -apple-system, sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("再来一局", W / 2, by + bh / 2 + 1);
}

function render() {
  /* 背景不参与震动 */
  drawBackground();

  ctx.save();
  if (shake > 0.15) {
    ctx.translate(
      (Math.random() - 0.5) * shake,
      (Math.random() - 0.5) * shake
    );
  }

  drawField();
  drawBodies();
  drawRipples();
  drawParticles();
  drawFloaters();
  drawHeld();

  ctx.restore();

  drawUI();

  if (!started) {
    drawStartScreen();
  } else if (gameOver) {
    drawGameOver();
  }
}

/* ============================================================
   主循环
   ============================================================ */
let lastT = 0;

function loop(now) {
  requestAnimationFrame(loop);

  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;

  if (dt > 1 / 30) dt = 1 / 30;
  if (dt < 0) dt = 0;

  if (started && !gameOver) {
    update(dt);
  } else {
    time += dt;
    /* 未开始时也让粒子等动起来 */
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += 620 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.972;
      p.vy *= 0.972;
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const w = ripples[i];
      w.t += dt;
      if (w.t >= w.dur) ripples.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt * 0.9;
      f.y -= dt * 44;
      if (f.life <= 0) floaters.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 34);
    displayScore += (score - displayScore) * Math.min(1, dt * 11);
  }

  render();
}

/* ============================================================
   启动
   ============================================================ */
reset();
requestAnimationFrame(loop);

})();
</script>
